es the socio-cultural and logistical complexities of the border region. The project needed to:</p>\n<ul><li>Understand and integrate the needs and aspirations of the community.</li><li>Ensure the center's design and activities are relevant and engaging.</li><li>Align with existing urban and regional development plans.</li><li>Foster cross-border collaboration and integration.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>What We Did</h2>\n<p>We conducted a comprehensive master planning process for the EUREKA Science Center, involving a strategic thinking workshop with local leaders and community members, detailed surveys, and in-depth user interviews to gather insights on community expectations and needs. We analyzed over 24 existing documents to extract relevant data, conducted more than 25 stakeholder interviews to identify opportunities, and produced key strategic deliverables, including a Diagnosis, and a final Definition Report. Additionally, we performed a contextual and spatial analysis to ensure the center's design aligns with regional frameworks and community needs.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>The Results</h2>\n<p>The project defined architectural and design strategies to create an inviting, functional, and educational space. It also outlined the ASCTI program for operational models, emphasizing sustainability and autonomous management. The center aims to promote cultural diversity, social inclusion, and community engagement. Conceptually, EUREKA embraces the idea of a \"diffuse frontier\" as a zone of transition, a \"context expanded\" to connect local and global perspectives, an \"environmental identity\" recognizing humans as part of the ecosystem, and \"open knowledge\" merging traditional sciences with art and culture. Thematically, it covers intelligent life, culture, ecology, environment, science, and technology. Spatially, EUREKA is designed to be permeable, adaptable, expanded, progressive, and affective, integrating with the environment and fostering community involvement.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Intended Impact</h2>\n<ul><li><strong>Educational and Cultural Enrichment:</strong> Stimulate scientific curiosity, enhance educational outcomes, and promote cultural enrichment to foster a scientifically literate and culturally aware community.</li><li><strong>Community Development:</strong> Contribute to the social and economic development of the border region by creating opportunities for social interaction, community building, and economic growth through educational and cultural activities.</li><li><strong>Cross-Border Integration:</strong> Foster collaboration and integration between Colombia and Venezuela to strengthen cross-border relationships, promote mutual understanding, and create a shared sense of regional identity.</li><li><strong>Environmental Awareness:</strong> Promote environmental consciousness and sustainability by encouraging sustainable practices, raising awareness about environmental issues, and integrating ecological education into the community.</li><li><strong>Strategic Vision and Stakeholder Engagement:</strong> Develop a clear and shared vision for the EUREKA Science Center that aligns with regional development plans and community aspirations, ensuring that the center meets the needs and expectations of the community.</li><li><strong>Community-Centric Design:</strong> Ensure the design and planning of the center are grounded in the needs and expectations of the community, creating a welcoming, engaging, and relevant space that enhances the overall user experience and fosters long-term engagement.</li></ul>","status":"published","cover":"","es":{"title":"Centro de Ciencia EUREKA","sub":"Tender puentes entre fronteras a través del conocimiento, la cultura y la innovación","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>El Centro de Ciencia EUREKA es un proyecto propuesto que busca establecer un centro de cultura, ciencia, tecnología e innovación en Cúcuta, Colombia, y en la región fronteriza colombo-venezolana. El proyecto busca fortalecer la alfabetización científica, el enriquecimiento cultural y el desarrollo comunitario, transformando así el panorama socioeconómico local.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El principal desafío era diseñar un plan maestro que respondiera a las complejidades socioculturales y logísticas de la región fronteriza. El proyecto debía:</p>\n<ul><li>Comprender e integrar las necesidades y aspiraciones de la comunidad.</li><li>Asegurar que el diseño y las actividades del centro sean relevantes y atractivos.</li><li>Alinearse con los planes de desarrollo urbano y regional existentes.</li><li>Fomentar la colaboración y la integración transfronterizas.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Qué hicimos</h2>\n<p>Realizamos un proceso integral de planificación maestra para el Centro de Ciencia EUREKA, que incluyó un taller de pensamiento estratégico con líderes locales y miembros de la comunidad, encuestas detalladas y entrevistas a profundidad con usuarios para recoger insights sobre las expectativas y necesidades de la comunidad. Analizamos más de 24 documentos existentes para extraer datos relevantes, realizamos más de 25 entrevistas con stakeholders para identificar oportunidades y produjimos entregables estratégicos clave, entre ellos un Diagnóstico y un Informe final de Definición. Además, realizamos un análisis contextual y espacial para asegurar que el diseño del centro se alinee con los marcos regionales y las necesidades de la comunidad.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Los resultados</h2>\n<p>El proyecto definió estrategias arquitectónicas y de diseño para crear un espacio atractivo, funcional y educativo. También delineó el programa ASCTI de modelos operativos, con énfasis en la sostenibilidad y la gestión autónoma. El centro busca promover la diversidad cultural, la inclusión social y la participación de la comunidad. Conceptualmente, EUREKA abraza la idea de una \"frontera difusa\" como zona de transición, un \"contexto ampliado\" para conectar perspectivas locales y globales, una \"identidad ambiental\" que reconoce a los seres humanos como parte del ecosistema y un \"conocimiento abierto\" que fusiona las ciencias tradicionales con el arte y la cultura. Temáticamente, abarca la vida inteligente, la cultura, la ecología, el medio ambiente, la ciencia y la tecnología. Espacialmente, EUREKA está diseñado para ser permeable, adaptable, ampliado, progresivo y afectivo, integrándose con el entorno y fomentando la participación de la comunidad.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Impacto esperado</h2>\n<ul><li><strong>Enriquecimiento educativo y cultural:</strong> Estimular la curiosidad científica, mejorar los resultados educativos y promover el enriquecimiento cultural para fomentar una comunidad científicamente alfabetizada y culturalmente consciente.</li><li><strong>Desarrollo comunitario:</strong> Contribuir al desarrollo social y económico de la región fronteriza creando oportunidades de interacción social, construcción de comunidad y crecimiento económico mediante actividades educativas y culturales.</li><li><strong>Integración transfronteriza:</strong> Fomentar la colaboración y la integración entre Colombia y Venezuela para fortalecer las relaciones transfronterizas, promover el entendimiento mutuo y crear un sentido compartido de identidad regional.</li><li><strong>Conciencia ambiental:</strong> Promover la conciencia ambiental y la sostenibilidad impulsando prácticas sostenibles, generando conciencia sobre los problemas ambientales e integrando la educación ecológica en la comunidad.</li><li><strong>Visión estratégica y participación de stakeholders:</strong> Desarrollar una visión clara y compartida del Centro de Ciencia EUREKA, alineada con los planes de desarrollo regional y las aspiraciones de la comunidad, asegurando que el centro responda a las necesidades y expectativas de esta.</li><li><strong>Diseño centrado en la comunidad:</strong> Asegurar que el diseño y la planeación del centro se fundamenten en las necesidades y expectativas de la comunidad, creando un espacio acogedor, atractivo y relevante que mejore la experiencia general del usuario y fomente una participación de largo plazo.</li></ul>"}},{"id":"e482cca10d044d89838ae47cdf676595","slug":"strategic-transformation-of-parque-explora-amidst-covid-crisis","title":"Strategic Transformation of Parque Explora Amidst Covid Crisis","sub":"","year":2021,"client":["Parque Explora"],"industry":["Culture & Museums"],"type":["Strategy","Purpose-driven strategy"],"role":["Project leader"],"country":[],"highlight":false,"link":"","texture":"particles","excerpt":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>The Context</h2>\n<p>In response to the unprecedented challenges posed by the COVID-19 pandemic, Parque Explora initiated a strategic transformation process called \"Compás Estratégico\" in 2020. This initiative aimed to <strong>reimagine the organization’s role and operations during a time of crisis, with a focus on addressing societal challenges, adapting to new realities, and ensuring long-term sustainability.</strong> Through collaborative sessions, the organization sought to redefine its purpose, identify critical priorities, and prepare for various future scenarios while maintaining its mission of fostering education, culture, and science.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The pandemic brought significant disruptions, including reduced cultural tourism, financial instability, and heightened social inequalities. Parque Explora faced declining revenues from ticket sales and partnerships, limited physical engagement with audiences, and the need to adapt quickly to digital platforms. Additionally, the organization had to address internal challenges such as breaking down silos, fostering collaboration, and building resilience to navigate an uncertain future effectively.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Process</h2>\n<p>The transformation process was structured into three strategic thinking sessions: defining a narrative of purpose, envisioning a reimagined future, and identifying actionable strategies. Using iterative cycles of learning and adaptation, the team explored potential scenarios—ranging from prolonged economic contraction to rapid recovery—and their implications for the organization. Key activities included mapping organizational capabilities, aligning resources to emerging opportunities, and developing a roadmap for agility and resilience. The sessions emphasized collaboration, creativity, and systemic thinking to ensure alignment with Parque Explora’s mission and adaptability to evolving conditions.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>The Impact</h2>\n<p>The \"Compás Estratégico\" initiative resulted in a clear framework of five strategic priorities: enhancing community impact, consolidating a transmedia ecosystem, strengthening alliances for sustainability, identifying critical resources and capacities, and becoming a more agile and resilient organization. These priorities were supported by actionable goals, such as expanding digital offerings, fostering inclusivity, and improving operational flexibility. The process also highlighted the importance of leveraging technology, forming new partnerships, and addressing barriers like resistance to change. By preparing for multiple scenarios, Parque Explora positioned itself to navigate uncertainty while reinforcing its role as a leader in education, culture, and science.</p>","status":"published","cover":"","es":{"title":"Transformación estratégica de Parque Explora en medio de la crisis del Covid","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>El contexto</h2>\n<p>Ante los desafíos sin precedentes que planteó la pandemia de COVID-19, Parque Explora inició en 2020 un proceso de transformación estratégica llamado \"Compás Estratégico\". Esta iniciativa buscaba <strong>reimaginar el rol y las operaciones de la organización en un momento de crisis, con foco en abordar los desafíos de la sociedad, adaptarse a nuevas realidades y asegurar la sostenibilidad a largo plazo.</strong> A través de sesiones colaborativas, la organización buscó redefinir su propósito, identificar prioridades críticas y prepararse para distintos escenarios futuros, sin perder su misión de promover la educación, la cultura y la ciencia.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>La pandemia trajo consigo disrupciones significativas, entre ellas la reducción del turismo cultural, la inestabilidad financiera y el aumento de las desigualdades sociales. Parque Explora enfrentó la caída de los ingresos por venta de entradas y alianzas, un contacto físico limitado con sus audiencias y la necesidad de adaptarse rápidamente a las plataformas digitales. Además, la organización tuvo que atender desafíos internos como derribar los silos, fomentar la colaboración y construir resiliencia para navegar con eficacia un futuro incierto.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El proceso</h2>\n<p>El proceso de transformación se estructuró en tres sesiones de pensamiento estratégico: definir una narrativa de propósito, imaginar un futuro reimaginado e identificar estrategias accionables. Mediante ciclos iterativos de aprendizaje y adaptación, el equipo exploró escenarios posibles —desde una contracción económica prolongada hasta una recuperación rápida— y sus implicaciones para la organización. Entre las actividades clave estuvieron el mapeo de las capacidades organizacionales, la alineación de los recursos con las oportunidades emergentes y el desarrollo de una hoja de ruta para la agilidad y la resiliencia. Las sesiones hicieron énfasis en la colaboración, la creatividad y el pensamiento sistémico para asegurar la alineación con la misión de Parque Explora y su adaptabilidad a condiciones cambiantes.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>El impacto</h2>\n<p>La iniciativa \"Compás Estratégico\" dio como resultado un marco claro de cinco prioridades estratégicas: potenciar el impacto en la comunidad, consolidar un ecosistema transmedia, fortalecer las alianzas para la sostenibilidad, identificar los recursos y capacidades críticos, y convertirse en una organización más ágil y resiliente. Estas prioridades se respaldaron con metas accionables, como ampliar la oferta digital, fomentar la inclusión y mejorar la flexibilidad operativa. El proceso también puso de relieve la importancia de aprovechar la tecnología, formar nuevas alianzas y abordar barreras como la resistencia al cambio. Al prepararse para múltiples escenarios, Parque Explora se posicionó para navegar la incertidumbre y, a la vez, reafirmar su rol como líder en educación, cultura y ciencia.</p>"}},{"id":"15b56dd46f8a42ce8fa1dbbd1a6ddcfc","slug":"museum-reopening-model-during-covid-19","title":"Museum reopening model during Covid-19","sub":"","year":2020,"client":["Parque Explora"],"industry":["Culture & Museums"],"type":["Transformation"],"role":["Project leader"],"country":[],"highlight":false,"link":"","texture":"flow","excerpt":"Establishing a Crisis Response Structure. Formed a multidisciplinary team to ensure agile, flexible, and creative responses to the crisis, incorporating leadership and organizational capacities to anticipate events and…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>The Context</h2>\n<p>The COVID-19 pandemic has presented unprecedented challenges for museums worldwide, including Parque Explora. Traditionally dependent on visitor admissions, state project funding, and private sector support, museums faced immediate financial strain as schedules were canceled, state grants froze, and the risk of closure loomed large.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The primary challenge was to adapt to a rapidly changing environment with high levels of uncertainty, ensuring the safety and confidence of visitors while maintaining the museum’s operational and financial viability. This required a complete rethinking of how to engage with the public, manage spaces, and sustain museum activities during and beyond the pandemic.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Process</h2>\n<p>To address these challenges, Parque Explora implemented a multi-faceted strategy:</p>\n<p><strong>Establishing a Crisis Response Structure.</strong> Formed a multidisciplinary team to ensure agile, flexible, and creative responses to the crisis, incorporating leadership and organizational capacities to anticipate events and build shared visions.</p>\n<p><strong>Creating a Flexible Operational Model.</strong> Designed an adaptive model that could expand and contract based on local and national dynamics, including protocols, communications, commercial strategies, and infrastructure adjustments.</p>\n<p><strong>Implementing Safety Protocols.</strong> Developed comprehensive safety protocols for visitors and staff, including hygiene measures, social distancing, and operational guidelines to ensure a secure environment.</p>\n<p><strong>Phased Reopening Plan.</strong> Structured a phased reopening strategy, prioritizing areas and activities with lower risk of contagion, and gradually increasing operational capacity while adapting spaces to new health and safety requirements.</p>\n<p><strong>Pilot Testing.</strong> Conducted pilot tests with internal staff and specific public groups to evaluate and refine the operational model before full-scale implementation.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Intended Impact</h2>\n<ul><li><strong>Visitor Safety and Confidence:</strong> By ensuring strict adherence to health and safety protocols, the museum aims to rebuild visitor trust and confidence, creating a safe environment for public engagement.</li><li><strong>Operational Resilience:</strong> The flexible operational model is designed to withstand future disruptions, allowing the museum to adapt quickly to changing circumstances and maintain continuity.</li><li><strong>Sustainable Engagement:</strong> Enhanced digital content and phased reopening plans aim to sustain public interest and engagement, ensuring the museum remains relevant and accessible.</li><li><strong>Community Support and Inclusion:</strong> Active involvement of local communities and stakeholders in the planning and execution process fosters a sense of ownership and support for the museum's initiatives.</li><li><strong>Long-term Viability:</strong> The comprehensive strategy, including financial planning and the creation of new revenue streams, aims to secure the museum's financial health and long-term sustainability.</li></ul>","status":"published","cover":"","es":{"title":"Modelo de reapertura de museos durante el Covid-19","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>El contexto</h2>\n<p>La pandemia de COVID-19 ha planteado desafíos sin precedentes para los museos de todo el mundo, incluido Parque Explora. Dependientes tradicionalmente de la venta de entradas, de la financiación estatal de proyectos y del apoyo del sector privado, los museos enfrentaron una presión financiera inmediata al cancelarse las agendas, congelarse los recursos del Estado y sobrevolar el riesgo de cierre.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El principal desafío era adaptarse a un entorno que cambiaba rápidamente y con altos niveles de incertidumbre, garantizando la seguridad y la confianza de los visitantes y manteniendo al mismo tiempo la viabilidad operativa y financiera del museo. Esto exigió replantear por completo cómo relacionarse con el público, gestionar los espacios y sostener las actividades del museo durante la pandemia y después de ella.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El proceso</h2>\n<p>Para abordar estos desafíos, Parque Explora implementó una estrategia multifacética:</p>\n<p><strong>Establecer una estructura de respuesta a la crisis.</strong> Conformó un equipo multidisciplinario para asegurar respuestas ágiles, flexibles y creativas ante la crisis, incorporando liderazgo y capacidades organizacionales para anticipar eventos y construir visiones compartidas.</p>\n<p><strong>Crear un modelo operativo flexible.</strong> Diseñó un modelo adaptativo que podía expandirse y contraerse según las dinámicas locales y nacionales, con protocolos, comunicaciones, estrategias comerciales y ajustes de infraestructura.</p>\n<p><strong>Implementar protocolos de seguridad.</strong> Desarrolló protocolos de seguridad integrales para visitantes y personal, que incluían medidas de higiene, distanciamiento social y lineamientos operativos para garantizar un entorno seguro.</p>\n<p><strong>Plan de reapertura por fases.</strong> Estructuró una estrategia de reapertura por fases, priorizando las áreas y actividades con menor riesgo de contagio y aumentando gradualmente la capacidad operativa, a la vez que adaptaba los espacios a los nuevos requisitos de salud y seguridad.</p>\n<p><strong>Pruebas piloto.</strong> Realizó pruebas piloto con el personal interno y con grupos específicos de público para evaluar y refinar el modelo operativo antes de su implementación a gran escala.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Impacto esperado</h2>\n<ul><li><strong>Seguridad y confianza de los visitantes:</strong> Al garantizar el estricto cumplimiento de los protocolos de salud y seguridad, el museo busca reconstruir la confianza de los visitantes y crear un entorno seguro para la participación del público.</li><li><strong>Resiliencia operativa:</strong> El modelo operativo flexible está diseñado para resistir futuras disrupciones, permitiendo que el museo se adapte rápidamente a circunstancias cambiantes y mantenga su continuidad.</li><li><strong>Participación sostenible:</strong> Los contenidos digitales mejorados y los planes de reapertura por fases buscan sostener el interés y la participación del público, asegurando que el museo siga siendo relevante y accesible.</li><li><strong>Apoyo e inclusión de la comunidad:</strong> La participación activa de las comunidades locales y los stakeholders en la planeación y ejecución fomenta un sentido de apropiación y respaldo a las iniciativas del museo.</li><li><strong>Viabilidad a largo plazo:</strong> La estrategia integral, que incluye la planeación financiera y la creación de nuevas fuentes de ingresos, busca asegurar la salud financiera y la sostenibilidad del museo a largo plazo.</li></ul>"}},{"id":"7f21283ad1ff4165885c6707557a3603","slug":"creating-a-national-strategy-for-stem-education-in-colombia","title":"Creating a National strategy for STEM education in Colombia","sub":"","year":2020,"client":["Ministry of Education"],"industry":["Education"],"type":["Strategy","Policy making","Purpose-driven strategy","Education"],"role":["Author"],"country":[],"highlight":true,"link":"https://eduteka.icesi.edu.co/pdfdir/eduteka-explora-oei-men-vision-stem-2020.pdf","texture":"moire","excerpt":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>The Context</h2>\n<p>The Ministry of National Education (MEN), the Organization of Ibero-American States (OEI), and Parque Explora in Medellín collaborated on a strategic initiative aimed at creating a comprehensive STEM+ education framework for Colombia. This initiative was designed to foster innovation and equip students with 21st-century skills necessary for thriving in a rapidly changing world. The project, titled \"Supernova, Expanded Learning,\" was conceived to address the educational challenges posed by the COVID-19 pandemic and the Fourth Industrial Revolution, ensuring that Colombian students are well-prepared for the future.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>Colombia faced several challenges in integrating STEM education across its diverse educational landscape. These included:</p>\n<ol><li><strong>Disparities in Access:</strong> Ensuring that students from various socio-economic backgrounds have equal access to STEM education and resources.</li><li><strong>Curriculum Integration:</strong> Developing a cohesive and flexible curriculum that integrates STEM disciplines with other subjects.</li><li><strong>Teacher Training:</strong> Providing ongoing professional development for teachers to effectively deliver STEM education.</li><li><strong>Community Engagement:</strong> Involving families and local communities in the educational process to support and enhance learning.</li><li><strong>Gender Inclusivity:</strong> Promoting gender equity in STEM fields by encouraging the participation of girls and young women.</li></ol>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Intended Impact</h2>\n<ol><li><strong>Enhanced Strategic Clarity:</strong> Establishing a unified vision and mission, leading to more coherent and impactful actions. Improving alignment of projects with organizational goals.</li><li><strong>Gender Inclusivity:</strong> Promoting gender equity in STEM fields through targeted programs for girls and young women. Encouraging female participation and leadership in STEM disciplines.</li><li><strong>Community Involvement:</strong> Involving families and local communities in the educational process to create a supportive learning environment. Strengthening the social fabric by fostering collaboration and shared goals.</li><li><strong>Lifelong Learning:</strong> Encouraging lifelong learning and continuous professional development among educators and students.</li></ol>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Conclusion</h2>\n<p>This strategic initiative, spearheaded by MEN, OEI, and Parque Explora, represents a significant step towards transforming STEM education in Colombia. By addressing the challenges and leveraging the strengths of various stakeholders, the project aims to create a robust and inclusive STEM+ framework that prepares students for the future, fosters innovation, and promotes sustainable development. This collaborative effort not only enhances the quality of education but also contributes to the overall socio-economic growth of the country.</p>","status":"published","cover":"","es":{"title":"Crear una estrategia nacional de educación STEM en Colombia","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>El contexto</h2>\n<p>El Ministerio de Educación Nacional (MEN), la Organización de Estados Iberoamericanos (OEI) y Parque Explora de Medellín colaboraron en una iniciativa estratégica orientada a crear un marco integral de educación STEM+ para Colombia. Esta iniciativa se diseñó para fomentar la innovación y dotar a los estudiantes de las habilidades del siglo XXI necesarias para prosperar en un mundo que cambia con rapidez. El proyecto, titulado \"Supernova, Aprendizaje Expandido\", se concibió para atender los desafíos educativos que plantearon la pandemia de COVID-19 y la Cuarta Revolución Industrial, asegurando que los estudiantes colombianos estén bien preparados para el futuro.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>Colombia enfrentaba varios desafíos para integrar la educación STEM en su diverso panorama educativo. Entre ellos:</p>\n<ol><li><strong>Disparidades en el acceso:</strong> Garantizar que estudiantes de distintos contextos socioeconómicos tengan igual acceso a la educación STEM y a sus recursos.</li><li><strong>Integración curricular:</strong> Desarrollar un currículo cohesivo y flexible que integre las disciplinas STEM con otras asignaturas.</li><li><strong>Formación docente:</strong> Ofrecer desarrollo profesional continuo a los docentes para que impartan la educación STEM de manera efectiva.</li><li><strong>Participación de la comunidad:</strong> Involucrar a las familias y a las comunidades locales en el proceso educativo para apoyar y potenciar el aprendizaje.</li><li><strong>Inclusión de género:</strong> Promover la equidad de género en los campos STEM fomentando la participación de niñas y mujeres jóvenes.</li></ol>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Impacto esperado</h2>\n<ol><li><strong>Mayor claridad estratégica:</strong> Establecer una visión y una misión unificadas que lleven a acciones más coherentes e impactantes. Mejorar la alineación de los proyectos con los objetivos organizacionales.</li><li><strong>Inclusión de género:</strong> Promover la equidad de género en los campos STEM mediante programas dirigidos a niñas y mujeres jóvenes. Fomentar la participación y el liderazgo femeninos en las disciplinas STEM.</li><li><strong>Participación de la comunidad:</strong> Involucrar a las familias y a las comunidades locales en el proceso educativo para crear un entorno de aprendizaje de apoyo. Fortalecer el tejido social fomentando la colaboración y las metas compartidas.</li><li><strong>Aprendizaje a lo largo de la vida:</strong> Fomentar el aprendizaje permanente y el desarrollo profesional continuo entre educadores y estudiantes.</li></ol>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Conclusión</h2>\n<p>Esta iniciativa estratégica, liderada por el MEN, la OEI y Parque Explora, representa un paso significativo hacia la transformación de la educación STEM en Colombia. Al abordar los desafíos y aprovechar las fortalezas de diversos actores, el proyecto busca crear un marco STEM+ robusto e inclusivo que prepare a los estudiantes para el futuro, fomente la innovación y promueva el desarrollo sostenible. Este esfuerzo colaborativo no solo mejora la calidad de la educación, sino que también contribuye al crecimiento socioeconómico general del país.</p>"}},{"id":"014bb2f1678241e193515e885c3dcff6","slug":"malva","title":"MALVA","sub":"Integrated Science Center Experience","year":2018,"client":["INCIVA","Biblioteca Departamental"],"industry":["Goverment / Public","Culture & Museums"],"type":["Science center","Creative space","Exhibition"],"role":["Project leader"],"country":[],"highlight":false,"link":"","texture":"halftone","excerpt":"Unified Experience & Strategic Alignment. Through workshops and co-creation sessions, we aligned both institutions around the idea of a single, integrated science center experience—later named MALVA. This required…","html":"<blockquote class=\"c-quote\">Strengthening Public Science Infrastructure in Valle del Cauca, Colombia</blockquote>\n<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation — The Challenge</h2>\n<p>After more than a decade of operation, two major science centers in Valle del Cauca—the Museo de Historia Natural y Cultural del Valle del Cauca (operated by INCIVA) and the Museo Interactivo Abracadabra (operated by the Departmental Library)—were facing declining relevance. Their museography had become outdated, technical infrastructure was obsolete, and educational content no longer reflected contemporary scientific narratives. Although both institutions shared the same public complex, <em>La Manzana del Saber</em>, their experiences were fragmented architecturally, operationally, and organizationally. This fragmentation weakened collaboration, governance, and the overall visitor experience at a time when Colciencias (now MinCiencias) was prioritizing the strengthening of science centers nationwide.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Task — My Role</h2>\n<p>I served as one of the project’s strategic design leads, helping articulate a shared vision across both institutions and aligning diverse stakeholders around a unified experience model. I worked closely with institutional directors, curatorial teams, educators, architects, and public-sector partners to frame the challenge holistically. My responsibility spanned strategic framing, experience visioning, and methodological leadership across education, infrastructure, governance, and content. I also played a key role in orchestrating large-scale, parallel workstreams to ensure coherence across disciplines.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Action — The Process</h2>\n<p><strong>Diagnostic &amp; Baseline Definition.</strong> We began with a comprehensive 360° diagnostic phase to establish a shared understanding of the current state. This included assessing museography, educational models, physical and technical infrastructure, organizational collaboration, and governance structures. This evidence-based baseline became the foundation for all subsequent decisions.</p>\n<p><strong>Unified Experience &amp; Strategic Alignment.</strong> Through workshops and co-creation sessions, we aligned both institutions around the idea of a single, integrated science center experience—later named <strong>MALVA</strong>. This required reframing the project beyond exhibition design to include learning models, operational collaboration, and long-term governance.</p>\n<p><strong>Concurrent Design &amp; Content Development.</strong> With a multidisciplinary team of over 30 professionals working in parallel, we developed museographic formats, architectural concepts, mediation strategies, and scientific narratives. New content areas included Earth and space sciences, biodiversity, experimentation zones, and public creative laboratories, all designed to foster participation and intergenerational learning.</p>\n<p><strong>Governance &amp; Sustainability Model.</strong> In parallel, we defined a new collaboration and governance model to enable sustained coordination between institutions. This ensured that the unified experience was supported not only by design, but by organizational and strategic structures capable of maintaining it over time.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Result — The Impact</h2>\n<p>MALVA became a fully designed and largely implemented integrated science center, successfully unifying two previously fragmented institutions into a coherent public experience. The project refreshed scientific narratives, modernized infrastructure, and introduced more participatory, family-oriented, and inclusive ways of engaging with science. Beyond physical transformation, MALVA enabled stronger institutional collaboration and positioned <em>La Manzana del Saber</em> as a contemporary, future-facing science and learning ecosystem—demonstrating how strategic design can drive long-term public value.</p>","status":"published","cover":"","es":{"title":"MALVA","sub":"Experiencia integrada de centro de ciencia","html":"<blockquote class=\"c-quote\">Fortalecimiento de la infraestructura pública de ciencia en el Valle del Cauca, Colombia</blockquote>\n<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación — El desafío</h2>\n<p>Después de más de una década de operación, dos grandes centros de ciencia del Valle del Cauca —el Museo de Historia Natural y Cultural del Valle del Cauca (operado por el INCIVA) y el Museo Interactivo Abracadabra (operado por la Biblioteca Departamental)— enfrentaban una relevancia en declive. Su museografía se había quedado obsoleta, la infraestructura técnica estaba desactualizada y los contenidos educativos ya no reflejaban las narrativas científicas contemporáneas. Aunque ambas instituciones compartían el mismo complejo público, <em>La Manzana del Saber</em>, sus experiencias estaban fragmentadas a nivel arquitectónico, operativo y organizacional. Esta fragmentación debilitaba la colaboración, la gobernanza y la experiencia general del visitante, en un momento en que Colciencias (hoy MinCiencias) priorizaba el fortalecimiento de los centros de ciencia en todo el país.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Tarea — Mi rol</h2>\n<p>Formé parte del liderazgo de diseño estratégico del proyecto, y ayudé a articular una visión compartida entre ambas instituciones y a alinear a diversos stakeholders en torno a un modelo de experiencia unificado. Trabajé de cerca con directores institucionales, equipos curatoriales, educadores, arquitectos y aliados del sector público para enmarcar el desafío de manera integral. Mi responsabilidad abarcó el encuadre estratégico, la visualización de la experiencia y el liderazgo metodológico en educación, infraestructura, gobernanza y contenidos. También tuve un papel clave en la orquestación de líneas de trabajo paralelas de gran escala para asegurar la coherencia entre disciplinas.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acción — El proceso</h2>\n<p><strong>Diagnóstico y definición de la línea base.</strong> Comenzamos con una fase integral de diagnóstico de 360° para establecer un entendimiento compartido del estado actual. Esto incluyó la evaluación de la museografía, los modelos educativos, la infraestructura física y técnica, la colaboración organizacional y las estructuras de gobernanza. Esta línea base, sustentada en evidencia, se convirtió en el fundamento de todas las decisiones posteriores.</p>\n<p><strong>Experiencia unificada y alineación estratégica.</strong> A través de talleres y sesiones de cocreación, alineamos a ambas instituciones en torno a la idea de una única experiencia integrada de centro de ciencia, que más adelante se llamó <strong>MALVA</strong>. Esto exigió replantear el proyecto más allá del diseño de exposiciones, para incluir modelos de aprendizaje, colaboración operativa y gobernanza de largo plazo.</p>\n<p><strong>Diseño concurrente y desarrollo de contenidos.</strong> Con un equipo multidisciplinario de más de 30 profesionales trabajando en paralelo, desarrollamos formatos museográficos, conceptos arquitectónicos, estrategias de mediación y narrativas científicas. Las nuevas áreas de contenido incluyeron las ciencias de la Tierra y del espacio, la biodiversidad, zonas de experimentación y laboratorios creativos públicos, todas diseñadas para fomentar la participación y el aprendizaje intergeneracional.</p>\n<p><strong>Modelo de gobernanza y sostenibilidad.</strong> En paralelo, definimos un nuevo modelo de colaboración y gobernanza que permitiera una coordinación sostenida entre las instituciones. Esto aseguró que la experiencia unificada estuviera respaldada no solo por el diseño, sino por estructuras organizacionales y estratégicas capaces de mantenerla en el tiempo.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultado — El impacto</h2>\n<p>MALVA se convirtió en un centro de ciencia integrado, completamente diseñado y en buena parte implementado, que unificó con éxito dos instituciones antes fragmentadas en una experiencia pública coherente. El proyecto renovó las narrativas científicas, modernizó la infraestructura e introdujo formas más participativas, familiares e inclusivas de relacionarse con la ciencia. Más allá de la transformación física, MALVA propició una colaboración institucional más sólida y posicionó a <em>La Manzana del Saber</em> como un ecosistema contemporáneo de ciencia y aprendizaje, orientado al futuro, lo que demuestra cómo el diseño estratégico puede generar valor público de largo plazo.</p>"}},{"id":"37ed4714668f449eb3fa180071e35296","slug":"designing-a-canal-for-everyone","title":"Designing a Canal for Everyone","sub":"An Interactive Center in the Heart of Panama","year":2018,"client":["Panama Canal Authority"],"industry":["Goverment / Public"],"type":["Exhibition"],"role":["Senior designer"],"country":[],"highlight":false,"link":"","texture":"halftone","excerpt":"Visitors could explore the geological origins of the isthmus, the biodiversity of its ecosystems, and the engineering milestones of the Canal’s construction and expansion. To develop locally grounded content, we…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation</h2>\n<p>The Panama Canal Authority sought to deepen national understanding of the Canal’s historic, ecological, and geopolitical significance—particularly among inland communities historically disconnected from it. To achieve this, they launched a competition to conceptualize a new interactive visitor center in Santiago de Veraguas, a region strategically selected for its location at the country’s center. The challenge: make the Canal’s global relevance and local impact tangible, participatory, and meaningful for all Panamanians.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Task</h2>\n<p>As Senior Exhibit Designer within the Parque Explora team, I played a key role in shaping the conceptual vision and interactive storytelling strategy for the proposal. I focused on aligning spatial narratives with community engagement goals, ensuring that design decisions resonated with diverse audiences and communicated the Canal’s value beyond its economic function. My contributions spanned from early ideation to concept development, integrating participatory research and interpretive planning throughout.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Action</h2>\n<p>We approached the project as both a spatial and cultural bridge, creating a visitor journey that invites people to feel like they are inside the Canal. The concept featured six themed galleries and 18 interactive experiences, combining analog, digital, and hybrid media.</p>\n<p>Visitors could explore the geological origins of the isthmus, the biodiversity of its ecosystems, and the engineering milestones of the Canal’s construction and expansion. To develop locally grounded content, we conducted participatory field research in the region and used co-creation methodologies to surface community perspectives.</p>\n<p>This informed the center’s tone, media formats, and modes of interaction. Through immersive storytelling, we translated complex themes—like geopolitics, water management, and global trade—into engaging, accessible formats for all ages.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Result</h2>\n<p>Our proposal won the national competition, initiating the detailed design phase for the Panama Canal Experience Center. The project succeeded in reframing the Canal not just as infrastructure, but as a living symbol of national identity and shared responsibility. This case reaffirmed the power of inclusive design practices to foster public engagement and instill a sense of ownership over large-scale heritage narratives.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>From Design to Reality</h2>\n<figure class=\"c-img\"><img src=\"https://portafolio.parqueexplora.org/_next/image?url=https%3A%2F%2Fimgix.cosmicjs.com%2Fdf9138f0-87de-11ee-a141-bf415eaf0a74-img-test-2.webp%3Ffit%3Dcrop%26h%3D683%26w%3D1105%26upscale%3Dtrue%26auto%3Dformat%2Ccompress&w=3840&q=75\" alt=\"Panama Canal Experience Center\" loading=\"lazy\" onerror=\"this.parentNode.remove()\"></figure>\n<p><em>Usamos diversos formatos digitales, análogos y mixtos. Asimismo, nuestra metodología de investigación en campo nos permitió abordar el conocimiento de manera participativa. En este lugar, los visitantes reconocen esta gran obra de la humanidad.</em></p>\n<figure class=\"c-img\"><img src=\"https://portafolio.parqueexplora.org/_next/image?url=https%3A%2F%2Fimgix.cosmicjs.com%2F89adfbb0-87c2-11ee-a141-bf415eaf0a74-img-test-1.webp%3Ffit%3Dcrop%26h%3D683%26w%3D1105%26upscale%3Dtrue%26auto%3Dformat%2Ccompress&w=3840&q=75\" alt=\"Panama Canal Experience Center\" loading=\"lazy\" onerror=\"this.parentNode.remove()\"></figure>","status":"published","cover":"","es":{"title":"Diseñar un canal para todos","sub":"Un centro interactivo en el corazón de Panamá","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación</h2>\n<p>La Autoridad del Canal de Panamá buscaba profundizar el entendimiento nacional sobre la importancia histórica, ecológica y geopolítica del Canal, en particular entre las comunidades del interior del país, históricamente desconectadas de él. Para lograrlo, lanzó un concurso para conceptualizar un nuevo centro de visitantes interactivo en Santiago de Veraguas, una región elegida estratégicamente por su ubicación en el centro del país. El desafío: hacer tangibles, participativas y significativas para todos los panameños la relevancia global del Canal y su impacto local.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Tarea</h2>\n<p>Como Senior Exhibit Designer dentro del equipo de Parque Explora, tuve un papel clave en dar forma a la visión conceptual y a la estrategia de narración interactiva de la propuesta. Me enfoqué en alinear las narrativas espaciales con los objetivos de participación de la comunidad, asegurando que las decisiones de diseño resonaran con audiencias diversas y comunicaran el valor del Canal más allá de su función económica. Mis aportes abarcaron desde la ideación temprana hasta el desarrollo del concepto, integrando en todo momento la investigación participativa y la planeación interpretativa.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acción</h2>\n<p>Abordamos el proyecto como un puente tanto espacial como cultural, creando un recorrido para el visitante que invita a las personas a sentirse dentro del Canal. El concepto incluía seis galerías temáticas y 18 experiencias interactivas, que combinaban medios análogos, digitales e híbridos.</p>\n<p>Los visitantes podían explorar los orígenes geológicos del istmo, la biodiversidad de sus ecosistemas y los hitos de ingeniería de la construcción y ampliación del Canal. Para desarrollar contenidos con arraigo local, realizamos investigación de campo participativa en la región y usamos metodologías de cocreación para sacar a la luz las perspectivas de la comunidad.</p>\n<p>Esto orientó el tono del centro, los formatos de medios y los modos de interacción. A través de una narración inmersiva, tradujimos temas complejos —como la geopolítica, la gestión del agua y el comercio global— en formatos atractivos y accesibles para todas las edades.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultado</h2>\n<p>Nuestra propuesta ganó el concurso nacional, dando inicio a la fase de diseño detallado del Centro de Experiencia del Canal de Panamá. El proyecto logró replantear el Canal no solo como infraestructura, sino como un símbolo vivo de la identidad nacional y de la responsabilidad compartida. Este caso reafirmó el poder de las prácticas de diseño inclusivo para fomentar la participación pública y generar un sentido de apropiación sobre narrativas patrimoniales de gran escala.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Del diseño a la realidad</h2>\n<figure class=\"c-img\"><img src=\"https://portafolio.parqueexplora.org/_next/image?url=https%3A%2F%2Fimgix.cosmicjs.com%2Fdf9138f0-87de-11ee-a141-bf415eaf0a74-img-test-2.webp%3Ffit%3Dcrop%26h%3D683%26w%3D1105%26upscale%3Dtrue%26auto%3Dformat%2Ccompress&w=3840&q=75\" alt=\"Panama Canal Experience Center\" loading=\"lazy\" onerror=\"this.parentNode.remove()\"></figure>\n<p><em>Usamos diversos formatos digitales, análogos y mixtos. Asimismo, nuestra metodología de investigación en campo nos permitió abordar el conocimiento de manera participativa. En este lugar, los visitantes reconocen esta gran obra de la humanidad.</em></p>\n<figure class=\"c-img\"><img src=\"https://portafolio.parqueexplora.org/_next/image?url=https%3A%2F%2Fimgix.cosmicjs.com%2F89adfbb0-87c2-11ee-a141-bf415eaf0a74-img-test-1.webp%3Ffit%3Dcrop%26h%3D683%26w%3D1105%26upscale%3Dtrue%26auto%3Dformat%2Ccompress&w=3840&q=75\" alt=\"Panama Canal Experience Center\" loading=\"lazy\" onerror=\"this.parentNode.remove()\"></figure>"}},{"id":"1f49a9f0000e800194f2cf8ac9faa034","slug":"from-insight-to-impact","title":"From Insight to Impact","sub":"A Research Framework for Designing Interactive Museum Exhibits","year":2017,"client":["Parque Explora"],"industry":["Culture & Museums"],"type":["Transformation"],"role":["Researcher","Senior Exhibition Designer"],"country":[],"highlight":false,"link":"","texture":"flow","excerpt":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>As part of my Master's in Engineering at EAFIT University, I led a research project focused on enhancing the design capabilities of interactive experiences in science museums and centers. Motivated by my professional experience at Parque Explora, the initiative sought to address the theoretical and practical fragmentation in exhibit design by developing an integrated framework that could guide museum professionals in creating meaningful visitor experiences.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>Interactive exhibit design in science centers is often hindered by a lack of shared language, reliance on intuition, and minimal evaluation frameworks. This leads to high-cost implementations with limited impact. The challenge was to bridge the gap between theoretical knowledge and practical application, offering museum teams a structured way to conceptualize, design, and evaluate experiences based on user engagement and learning outcomes.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Process</h2>\n<ul><li>Developed the DEX framework as a methodological tool for designing and evaluating interactive exhibitions.</li><li>Conducted empirical research involving thematic analysis and card sorting to identify experiential qualities critical to visitor engagement.</li><li>Facilitated co-creation workshops with multidisciplinary teams to apply the DEX tool in real-world design scenarios.</li><li>Partnered with national and international experts to validate and refine the tool.</li><li>Implemented pilot projects in collaboration with technology partners.</li><li>Delivered training sessions and presentations in global conferences such as ASTC and ECSITE.</li><li>Published and disseminated findings to contribute to the broader museum and design communities.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Impact and Achievements</h2>\n<ul><li>Introduced a validated framework that supports the strategic and creative decision-making process in exhibit design.</li><li>Strengthened the internal design culture at Parque Explora and among partner institutions.</li><li>Enhanced the visitor experience by making exhibitions more immersive, accessible, and emotionally resonant.</li><li>Recognized internationally through conferences and publications, increasing visibility and credibility.</li><li>Inspired a new wave of exhibit development grounded in user experience and participatory design.</li><li>Contributed to the professional development of museum staff through hands-on training and practical tools.</li><li>Positioned Parque Explora as a leader in experience-centered design for science communication.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>DEX Publications and Presentations</h2>\n<ul><li>Ocampo-Agudelo J., Maya J. (2021) Core Concepts Linking Exhibit Design and the Visitor Experience in Science Centers: An Early Framework. In: Rauterberg M. (eds) Culture and Computing. Design Thinking and Cultural Computing. HCII 2021. Lecture Notes in Computer Science, vol 12795. Springer, Cham. <a href=\"https://doi.org/10.1007/978-3-030-77431-8_7\" target=\"_blank\" rel=\"noopener\">doi.org/10.1007/978-3-030-77431-8_7</a></li><li><a href=\"https://www.researchgate.net/publication/328223899_The_Design_of_Experience-centered_Exhibits_in_Science_Museums\" target=\"_blank\" rel=\"noopener\">The Design of Experience-centered Exhibits in Science Centers</a> (2018). ASTC Conference. Hartford, United States.</li><li>Ocampo-Agudelo, Jose; Maya, Jorge; Roldán, Andrés (2017). <a href=\"https://www.researchgate.net/publication/321135314_A_Tool_for_the_Design_of_Experience-Centered_Exhibits_in_Science_Centers\" target=\"_blank\" rel=\"noopener\">“A Tool for the Design of Experience-Centered Exhibits in Science Centers”</a>. Poster presentation at Science Centre World Summit. Tokyo, Japan.</li><li>Ocampo-Agudelo, J., &amp; Maya, J. (2017). <a href=\"https://www.researchgate.net/publication/319402257_Experiential_qualities_of_science_museum_exhibits_a_thematic_analysis\" target=\"_blank\" rel=\"noopener\">Experiential qualities of science museum exhibits: a thematic analysis.</a> In DS 87-8 Proceedings of the 21st International Conference on Engineering Design (ICED 17) Vol 8: Human Behaviour in Design, Vancouver, Canada (pp. 439-448).</li></ul>","status":"published","cover":"","es":{"title":"Del insight al impacto","sub":"Un marco de investigación para diseñar exhibiciones interactivas de museo","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>Como parte de mi maestría en Ingeniería en la Universidad EAFIT, lideré un proyecto de investigación enfocado en fortalecer las capacidades de diseño de experiencias interactivas en museos y centros de ciencia. A partir de mi experiencia profesional en Parque Explora, la iniciativa buscaba abordar la fragmentación teórica y práctica en el diseño de exhibiciones mediante el desarrollo de un marco integrado que pudiera guiar a los profesionales de museos en la creación de experiencias significativas para los visitantes.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El diseño de exhibiciones interactivas en los centros de ciencia suele verse obstaculizado por la falta de un lenguaje compartido, la dependencia de la intuición y la escasez de marcos de evaluación. Esto lleva a implementaciones costosas con un impacto limitado. El desafío era cerrar la brecha entre el conocimiento teórico y la aplicación práctica, ofreciendo a los equipos de museos una forma estructurada de conceptualizar, diseñar y evaluar experiencias con base en la participación de los usuarios y en los resultados de aprendizaje.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El proceso</h2>\n<ul><li>Desarrollé el marco DEX como una herramienta metodológica para diseñar y evaluar exposiciones interactivas.</li><li>Realicé investigación empírica con análisis temático y card sorting para identificar las cualidades experienciales críticas para la participación de los visitantes.</li><li>Facilité talleres de cocreación con equipos multidisciplinarios para aplicar la herramienta DEX en escenarios reales de diseño.</li><li>Me asocié con expertos nacionales e internacionales para validar y refinar la herramienta.</li><li>Implementé proyectos piloto en colaboración con aliados tecnológicos.</li><li>Impartí sesiones de formación y presentaciones en conferencias globales como ASTC y ECSITE.</li><li>Publiqué y difundí los hallazgos para contribuir a las comunidades más amplias de museos y diseño.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Impacto y logros</h2>\n<ul><li>Introduje un marco validado que apoya el proceso de toma de decisiones estratégicas y creativas en el diseño de exhibiciones.</li><li>Fortalecí la cultura interna de diseño en Parque Explora y en las instituciones aliadas.</li><li>Mejoré la experiencia del visitante al hacer las exposiciones más inmersivas, accesibles y emocionalmente resonantes.</li><li>Obtuve reconocimiento internacional a través de conferencias y publicaciones, lo que aumentó la visibilidad y la credibilidad.</li><li>Inspiré una nueva ola de desarrollo de exhibiciones basada en la experiencia de usuario y el diseño participativo.</li><li>Contribuí al desarrollo profesional del personal de museos mediante formación práctica y herramientas aplicables.</li><li>Posicioné a Parque Explora como líder en diseño centrado en la experiencia para la comunicación de la ciencia.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Publicaciones y presentaciones de DEX</h2>\n<ul><li>Ocampo-Agudelo J., Maya J. (2021) Core Concepts Linking Exhibit Design and the Visitor Experience in Science Centers: An Early Framework. En: Rauterberg M. (eds) Culture and Computing. Design Thinking and Cultural Computing. HCII 2021. Lecture Notes in Computer Science, vol 12795. Springer, Cham. <a href=\"https://doi.org/10.1007/978-3-030-77431-8_7\" target=\"_blank\" rel=\"noopener\">doi.org/10.1007/978-3-030-77431-8_7</a></li><li><a href=\"https://www.researchgate.net/publication/328223899_The_Design_of_Experience-centered_Exhibits_in_Science_Museums\" target=\"_blank\" rel=\"noopener\">The Design of Experience-centered Exhibits in Science Centers</a> (2018). Conferencia ASTC. Hartford, Estados Unidos.</li><li>Ocampo-Agudelo, Jose; Maya, Jorge; Roldán, Andrés (2017). <a href=\"https://www.researchgate.net/publication/321135314_A_Tool_for_the_Design_of_Experience-Centered_Exhibits_in_Science_Centers\" target=\"_blank\" rel=\"noopener\">“A Tool for the Design of Experience-Centered Exhibits in Science Centers”</a>. Presentación de póster en Science Centre World Summit. Tokio, Japón.</li><li>Ocampo-Agudelo, J., &amp; Maya, J. (2017). <a href=\"https://www.researchgate.net/publication/319402257_Experiential_qualities_of_science_museum_exhibits_a_thematic_analysis\" target=\"_blank\" rel=\"noopener\">Experiential qualities of science museum exhibits: a thematic analysis.</a> En DS 87-8 Proceedings of the 21st International Conference on Engineering Design (ICED 17) Vol 8: Human Behaviour in Design, Vancouver, Canadá (pp. 439-448).</li></ul>"}},{"id":"3a90e5cb8a3c42fc9d3af7c0b400221f","slug":"reimagining-public-libraries","title":"Reimagining Public Libraries","sub":"Designing Creative Hubs for Collective Innovation in Bogotá","year":2017,"client":["Secretaría Distrital de Cultura Recreación y Deporte (Bogotá)"],"industry":["Goverment / Public","Culture & Museums"],"type":["Creative space","Strategy","Learning environment","Master Planning"],"role":["Project leader"],"country":[],"highlight":false,"link":"https://coleccionesdigitales.biblored.gov.co/items/show/186","texture":"moire","excerpt":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>The Context</h2>\n<p>In 2017, as part of a strategic initiative led by the Secretaría Distrital de Cultura, Recreación y Deporte in Bogotá, the Parque Explora team, including myself as an experience strategist, was commissioned to design a conceptual and strategic guide to implement “Creative Spaces” in five public libraries of the BibloRed network. This initiative sought to reposition libraries as hubs of community innovation, creativity, and social appropriation of knowledge, shifting their traditional role towards more dynamic, inclusive, and participatory spaces.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The primary challenge was to redefine the role of public libraries in contemporary urban contexts, making them not just repositories of information but engines of social transformation. The libraries lacked frameworks to systematically integrate science, art, technology, and community knowledge in accessible and engaging ways. It was essential to design a model that could be scaled, adapted to local conditions, and be embraced by diverse user communities.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Process</h2>\n<ul><li>Conducted extensive documentary research and international benchmarking on creative and maker spaces.</li><li>Facilitated workshops with local communities, library staff, and stakeholders to understand needs, barriers, and aspirations.</li><li>Structured the project using the Double Diamond design process: Discover, Define, Design, and Develop.</li><li>Created a conceptual guide that included typologies of creative spaces, key activities, and spatial recommendations.</li><li>Proposed flexible design principles that promote experimentation, collaboration, and local knowledge production.</li><li>Integrated educational guidelines from the ASCTI (Appropriation of Science, Technology, and Innovation) framework.</li><li>Developed implementation strategies tailored to five pilot libraries in Bogotá.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>The Impact</h2>\n<ul><li>Developed the “General Script for Creative Spaces,” now a reference document for library innovation in Colombia.</li><li>Helped position libraries as active centers of creativity and community development.</li><li>Enabled the implementation of physical and programmatic transformations in five major libraries, creating adaptable and inclusive environments.</li><li>Fostered a new culture of learning and participation through creative technologies and open knowledge.</li><li>Informed future policies and strategies in cultural infrastructure with a strong user-centered and systemic approach.</li><li>Received positive feedback from cultural and educational institutions, validating the relevance and applicability of the framework.</li><li>Inspired other institutions in Latin America to explore similar transformations in public and cultural spaces.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Results</h2>\n<p>After the strategic design process Biblored decided to implement a pilot in one of the major public libraries in Bogotá.</p>","status":"published","cover":"","es":{"title":"Reimaginar las bibliotecas públicas","sub":"Diseñar centros creativos para la innovación colectiva en Bogotá","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>El contexto</h2>\n<p>En 2017, como parte de una iniciativa estratégica liderada por la Secretaría Distrital de Cultura, Recreación y Deporte de Bogotá, al equipo de Parque Explora, en el que participé como estratega de experiencia, se le encargó diseñar una guía conceptual y estratégica para implementar \"Espacios Creativos\" en cinco bibliotecas públicas de la red BibloRed. Esta iniciativa buscaba reposicionar las bibliotecas como centros de innovación comunitaria, creatividad y apropiación social del conocimiento, desplazando su rol tradicional hacia espacios más dinámicos, inclusivos y participativos.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El principal desafío era redefinir el rol de las bibliotecas públicas en los contextos urbanos contemporáneos, haciendo de ellas no solo repositorios de información, sino motores de transformación social. Las bibliotecas carecían de marcos para integrar de manera sistemática la ciencia, el arte, la tecnología y el conocimiento comunitario de formas accesibles y atractivas. Era esencial diseñar un modelo que pudiera escalarse, adaptarse a las condiciones locales y ser acogido por comunidades de usuarios diversas.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El proceso</h2>\n<ul><li>Realizamos una extensa investigación documental y un benchmarking internacional sobre espacios creativos y maker.</li><li>Facilitamos talleres con comunidades locales, personal de las bibliotecas y stakeholders para comprender necesidades, barreras y aspiraciones.</li><li>Estructuramos el proyecto con el proceso de diseño Doble Diamante: Descubrir, Definir, Diseñar y Desarrollar.</li><li>Creamos una guía conceptual que incluía tipologías de espacios creativos, actividades clave y recomendaciones espaciales.</li><li>Propusimos principios de diseño flexibles que promueven la experimentación, la colaboración y la producción de conocimiento local.</li><li>Integramos los lineamientos educativos del marco ASCTI (Apropiación Social de la Ciencia, la Tecnología y la Innovación).</li><li>Desarrollamos estrategias de implementación a la medida de cinco bibliotecas piloto en Bogotá.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>El impacto</h2>\n<ul><li>Desarrollamos el \"Guion General de Espacios Creativos\", hoy un documento de referencia para la innovación en bibliotecas en Colombia.</li><li>Ayudamos a posicionar las bibliotecas como centros activos de creatividad y desarrollo comunitario.</li><li>Hicimos posible la implementación de transformaciones físicas y programáticas en cinco grandes bibliotecas, creando entornos adaptables e inclusivos.</li><li>Fomentamos una nueva cultura de aprendizaje y participación mediante tecnologías creativas y conocimiento abierto.</li><li>Aportamos insumos para futuras políticas y estrategias en infraestructura cultural, con un fuerte enfoque centrado en el usuario y sistémico.</li><li>Recibimos comentarios positivos de instituciones culturales y educativas, que validaron la relevancia y la aplicabilidad del marco.</li><li>Inspiramos a otras instituciones de América Latina a explorar transformaciones similares en espacios públicos y culturales.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Resultados</h2>\n<p>Tras el proceso de diseño estratégico, Biblored decidió implementar un piloto en una de las principales bibliotecas públicas de Bogotá.</p>"}},{"id":"6bf74854a26e48f082bdd1116e69245c","slug":"el-nino-and-la-nina-overlapped-stories","title":"El Niño and La Niña, Overlapped Stories","sub":"","year":2017,"client":["Embajada de Francia en Colombia"],"industry":["Culture & Museums"],"type":["Temporary exhibition"],"role":["Project leader","Exhibition Designer"],"country":[],"highlight":false,"link":"","texture":"halftone","excerpt":"Co-Design & Content Curation. In collaboration with scientists, educators, and community representatives, we gathered stories and materials that reflected diverse sociocultural impacts of the phenomena. This included…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation</h2>\n<p>The El Niño and La Niña climate phenomena are often explained through scientific or technical lenses, focusing on meteorological complexity and global impact. However, this project sought to surface the sociocultural dimensions that are often overlooked: how communities experience, narrate, and make sense of these shifts. In collaboration with Parque Explora (Colombia), the Cité de l’espace, and the Toulouse Museum (France), we co-created an exhibition that reframes these phenomena through the lived experiences of people. The goal was to provoke reflection, empathy, and dialogue by bringing art and science into a shared, sensorial space.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Task</h2>\n<p>I led the conceptualization and experience design of the exhibition, guiding the curatorial direction alongside scientific and cultural institutions in Colombia and France. I collaborated closely with content experts, museographers, and exhibition producers to shape a compelling, participatory narrative. My role spanned from early framing and narrative design to the creative supervision of the final visitor experience across multiple geographies. This project allowed me to push boundaries in how climate phenomena can be communicated through sociocultural storytelling.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Action</h2>\n<p><strong>Concept Development.</strong> We began by defining a unifying metaphor for the exhibition: overlapping stories. Inspired by the duality of El Niño and La Niña, we explored the tensions between dry and wet seasons, abundance and scarcity, personal and collective memory. These polarities informed the thematic and spatial structure of the exhibition. We developed a multi-sensory narrative strategy using <em>color filters</em> as an interpretive device, enabling visitors to shift perspectives physically and metaphorically.</p>\n<p><strong>Co-Design &amp; Content Curation.</strong> In collaboration with scientists, educators, and community representatives, we gathered stories and materials that reflected diverse sociocultural impacts of the phenomena. This included testimonies, local artifacts, soundscapes, and visual media. Working with international partners enriched the scope of narratives and helped validate content across contexts.</p>\n<p><strong>Exhibition Design &amp; Production.</strong> We designed three thematic spaces that could evoke emotional and intellectual engagement. Each space invited visitors to navigate overlapping timelines, geographies, and personal experiences. The exhibition blurred the line between art and science through immersive visuals, interactive components, and contrasting atmospheres. Despite limited resources, we prototyped several installation formats to test audience response before full-scale production.</p>\n<p><strong>International Launch &amp; Adaptation.</strong> Following its initial run in Medellín, the exhibition was adapted and installed in France and Mexico. Each iteration maintained the core concept but was locally contextualized to reflect relevant stories and cultural references. The traveling nature of the exhibition enabled cross-cultural exchange and increased its reach and resonance.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Result</h2>\n<p>The exhibition successfully shifted public understanding of El Niño and La Niña from abstract climate events to deeply human, context-rich experiences. It sparked meaningful engagement across age groups and cultural backgrounds, increasing awareness of environmental vulnerability and resilience.</p>\n<p>A key learning was the power of metaphor and multisensory design to create emotional and cognitive access to complex phenomena. Though modest in scale, the project positioned us as experimental leaders in international museographic storytelling and strengthened institutional ties across Latin America and Europe.</p>\n<p><strong>Allies:</strong> Cité de l'espace, Embajada de Francia en Colombia, Instituto Francés.</p>","status":"published","cover":"","es":{"title":"El Niño y La Niña, historias superpuestas","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación</h2>\n<p>Los fenómenos climáticos de El Niño y La Niña suelen explicarse desde lentes científicos o técnicos, con foco en la complejidad meteorológica y el impacto global. Sin embargo, este proyecto buscó sacar a la luz las dimensiones socioculturales que a menudo se pasan por alto: cómo las comunidades viven, narran y dan sentido a estos cambios. En colaboración con Parque Explora (Colombia), la Cité de l’espace y el Museo de Toulouse (Francia), cocreamos una exposición que replantea estos fenómenos a través de las experiencias vividas de las personas. El objetivo era provocar reflexión, empatía y diálogo al llevar el arte y la ciencia a un espacio sensorial compartido.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Tarea</h2>\n<p>Lideré la conceptualización y el diseño de la experiencia de la exposición, guiando la dirección curatorial junto con instituciones científicas y culturales de Colombia y Francia. Colaboré de cerca con expertos en contenidos, museógrafos y productores de exposiciones para dar forma a una narrativa convincente y participativa. Mi rol abarcó desde el encuadre inicial y el diseño narrativo hasta la supervisión creativa de la experiencia final del visitante en múltiples geografías. Este proyecto me permitió ampliar los límites de cómo pueden comunicarse los fenómenos climáticos a través de la narración sociocultural.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acción</h2>\n<p><strong>Desarrollo del concepto.</strong> Comenzamos definiendo una metáfora unificadora para la exposición: historias superpuestas. Inspirados en la dualidad de El Niño y La Niña, exploramos las tensiones entre las épocas seca y húmeda, la abundancia y la escasez, la memoria personal y la colectiva. Estas polaridades dieron forma a la estructura temática y espacial de la exposición. Desarrollamos una estrategia narrativa multisensorial que usó <em>filtros de color</em> como dispositivo interpretativo, permitiendo a los visitantes cambiar de perspectiva de forma física y metafórica.</p>\n<p><strong>Codiseño y curaduría de contenidos.</strong> En colaboración con científicos, educadores y representantes de la comunidad, reunimos historias y materiales que reflejaban los diversos impactos socioculturales de los fenómenos. Esto incluyó testimonios, artefactos locales, paisajes sonoros y medios visuales. Trabajar con aliados internacionales enriqueció el alcance de las narrativas y ayudó a validar los contenidos en distintos contextos.</p>\n<p><strong>Diseño y producción de la exposición.</strong> Diseñamos tres espacios temáticos capaces de evocar una conexión emocional e intelectual. Cada espacio invitaba a los visitantes a recorrer líneas de tiempo, geografías y experiencias personales superpuestas. La exposición difuminó la frontera entre el arte y la ciencia mediante visuales inmersivos, componentes interactivos y atmósferas contrastantes. A pesar de los recursos limitados, prototipamos varios formatos de instalación para probar la respuesta de la audiencia antes de la producción a gran escala.</p>\n<p><strong>Lanzamiento internacional y adaptación.</strong> Tras su primera temporada en Medellín, la exposición se adaptó y se instaló en Francia y México. Cada iteración mantuvo el concepto central, pero se contextualizó localmente para reflejar historias y referentes culturales relevantes. El carácter itinerante de la exposición permitió el intercambio intercultural y aumentó su alcance y resonancia.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultado</h2>\n<p>La exposición logró cambiar la comprensión del público sobre El Niño y La Niña: de eventos climáticos abstractos a experiencias profundamente humanas y ricas en contexto. Despertó una participación significativa entre distintos grupos de edad y trasfondos culturales, aumentando la conciencia sobre la vulnerabilidad y la resiliencia ambientales.</p>\n<p>Un aprendizaje clave fue el poder de la metáfora y del diseño multisensorial para crear un acceso emocional y cognitivo a fenómenos complejos. Aunque modesto en escala, el proyecto nos posicionó como líderes experimentales en la narración museográfica internacional y fortaleció los vínculos institucionales entre América Latina y Europa.</p>\n<p><strong>Aliados:</strong> Cité de l'espace, Embajada de Francia en Colombia, Instituto Francés.</p>"}},{"id":"1c6e239cc5564dd9baa33c459b93bf33","slug":"strategic-design-for-a-music-exhibition","title":"Strategic Design for a Music Exhibition","sub":"","year":2016,"client":["Parque Explora"],"industry":["Culture & Museums"],"type":["Exhibition","Strategy"],"role":["Senior designer"],"country":[],"highlight":false,"link":"","texture":"halftone","excerpt":"parqueexplora.org/sala-m-sica","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>Parque Explora, an interactive center for the appropriation and dissemination of science and technology, was established in 2007 as a symbol of social transformation through education. Its mission is to \"Inspire, communicate, and transform through interactive scenarios that contribute to the public appropriation of scientific, technological, and social knowledge necessary for the construction of a better society.\" One of the key exhibits, the \"Living Physics\" hall, opened to the public in December 2007 and has been successful in attracting diverse audiences, especially children and young people.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The main challenge was to develop a new exhibit that could replace the highly successful \"Living Physics\" hall. The goal was to create a new scenario that would continue to provide memorable learning experiences (EMA) for visitors, incorporating modern museographic trends and addressing the needs and expectations of contemporary audiences. This required a careful balance between preserving the educational and interactive nature of the exhibits while introducing new, innovative elements.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>What We Did</h2>\n<ul><li><strong>Strategic Design Phase:</strong> We started with an open, exploratory phase to gather ideas and define the thematic and strategic direction of the new exhibit. This involved analyzing trends, audience interests, and potential partners.</li><li><strong>Participatory Workshops:</strong> Conducted workshops with various stakeholders, including community members, educators, and experts, to gather input and ensure the new exhibit would be relevant and engaging.</li><li><strong>Iterative Design Process:</strong> Employed a highly iterative methodology with continuous creation and evaluation stages. This ensured that the design remained flexible and responsive to feedback throughout the project.</li><li><strong>Prototyping and Testing:</strong> Developed prototypes of the new exhibit components and tested them with target audiences to refine and optimize the visitor experience.</li><li><strong>Interdisciplinary Collaboration:</strong> Engaged a multidisciplinary team from different areas of Parque Explora, ensuring that all aspects of the project, from educational content to technical implementation, were aligned.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Intended Impact</h2>\n<ul><li><strong>Enhanced Visitor Engagement:</strong> By incorporating modern interactive elements and diverse sensory experiences, the new exhibit aims to captivate and educate visitors more effectively.</li><li><strong>Sustainable Learning Environment:</strong> Designed to be a dynamic and evolving space, the new exhibit will offer fresh and relevant content over time, encouraging repeat visits and sustained interest.</li><li><strong>Community Involvement:</strong> The participatory approach ensures that the exhibit resonates with the local community, fostering a sense of ownership and pride.</li><li><strong>Broadened Educational Reach:</strong> Through interdisciplinary and transmedia elements, the exhibit will connect with a wider audience, including schools, families, and special interest groups, promoting lifelong learning and curiosity.</li><li><strong>Innovative Use of Space:</strong> The exhibit will feature flexible and multifunctional spaces that can adapt to different activities and events, maximizing the utility and impact of the museum environment.</li></ul>\n<p><a href=\"https://www.parqueexplora.org/sala-m-sica\" target=\"_blank\" rel=\"noopener\">parqueexplora.org/sala-m-sica</a></p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Awards</h2>\n<ul><li>\"MUSIC: You are the Orchestra\" was the bronze winner in the Onsite Digital Experience category at the 2019 Muse Awards, American Alliance of Museums.</li><li>“Musical Landscapes,” an experience in the music hall, was the silver winner in the Video, Film, Animation, and Live Media or Digital Performances category at the 2019 Muse Awards, American Alliance of Museums.</li></ul>","status":"published","cover":"","es":{"title":"Diseño estratégico para una exposición de música","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>Parque Explora, un centro interactivo para la apropiación y divulgación de la ciencia y la tecnología, se creó en 2007 como símbolo de transformación social a través de la educación. Su misión es \"Inspirar, comunicar y transformar mediante escenarios interactivos que contribuyan a la apropiación pública del conocimiento científico, tecnológico y social necesario para la construcción de una mejor sociedad\". Una de las exhibiciones clave, la sala \"Física Viva\", abrió al público en diciembre de 2007 y ha sido exitosa en atraer públicos diversos, especialmente niños y jóvenes.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El principal desafío era desarrollar una nueva exhibición que pudiera reemplazar la exitosísima sala \"Física Viva\". El objetivo era crear un nuevo escenario que siguiera brindando experiencias memorables de aprendizaje (EMA) a los visitantes, incorporando las tendencias museográficas modernas y atendiendo las necesidades y expectativas de las audiencias contemporáneas. Esto exigía un cuidadoso equilibrio entre preservar el carácter educativo e interactivo de las exhibiciones y, a la vez, introducir elementos nue
