i><strong>Planeación y preparación:</strong> Definimos el desafío y los objetivos del sprint. Seleccionamos un equipo central multidisciplinario y planeamos las actividades de la semana del sprint. Recopilamos información relevante y realizamos entrevistas con stakeholders para comprender el contexto.</li><li><strong>Comprensión y definición:</strong> Realizamos conversaciones estructuradas para crear una base de conocimiento compartida entre los participantes. Mapeamos el desafío y definimos las metas de largo plazo y las preguntas clave por resolver.</li><li><strong>Ideación y bocetos:</strong> Facilitamos ejercicios para generar y refinar una amplia variedad de ideas. Desarrollamos bocetos detallados de posibles soluciones.</li><li><strong>Toma de decisiones:</strong> Evaluamos y seleccionamos las ideas más prometedoras por consenso del equipo. Creamos un flujo de prototipo de alto nivel y diseños detallados de pantallas.</li><li><strong>Prototipado:</strong> Desarrollamos un prototipo realista de la solución elegida. Diseñamos y definimos un guion para presentar el concepto y las funcionalidades.</li><li><strong>Validación:</strong> Probamos el prototipo con cinco stakeholders clave. Recopilamos comentarios para identificar fortalezas y oportunidades de mejora.</li></ol>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Impacto</h2>\n<p>El Design Sprint produjo avances significativos en el enfoque de gestión de activos de Ecopetrol:</p>\n<ul><li><strong>Desarrollo del prototipo:</strong> Creamos un prototipo funcional que facilitó la visualización en tiempo real de los datos financieros, permitiendo a los gerentes tomar decisiones informadas con base en métricas de desempeño actuales y proyectadas.</li><li><strong>Soluciones centradas en el usuario:</strong> Validamos el prototipo con stakeholders, asegurando que la solución respondiera a las necesidades de los usuarios y a los principales puntos de dolor, como reducir los procesos manuales y fortalecer la toma de decisiones basada en datos.</li><li><strong>Alineación estratégica:</strong> Alineamos la nueva herramienta con la estrategia de largo plazo de Ecopetrol, habilitando un enfoque más proactivo y predictivo de la gestión de activos.</li><li><strong>Colaboración fortalecida:</strong> Fomentamos una cultura colaborativa entre los miembros del equipo, combinando diversas perspectivas para innovar y resolver problemas complejos.</li></ul>\n<p>Este Design Sprint no solo transformó los procesos de gestión de activos financieros en Ecopetrol, sino que también sentó un precedente para futuros proyectos de innovación, destacando el valor de las metodologías ágiles y del diseño centrado en el usuario para impulsar el cambio organizacional.</p>"}},{"id":"2e39a9f0000e8040a13cfb8fc900a79a","slug":"hackear-el-aula","title":"Hackear el Aula","sub":"Exploring creative micro-interventions to transform classroom learning","year":2022,"client":[],"industry":["Education","Culture & Museums"],"type":["Education"],"role":[],"country":[],"highlight":false,"link":"","texture":"moire","excerpt":"Empathy & Immersion. Next, we invited educators to step into the shoes of their students. Through a guided imagination exercise, they mapped classroom experiences from a learner’s perspective—observing behaviors,…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation — The Challenge</h2>\n<p>As part of the <em>Juntos Aprendemos</em> program, and in collaboration with Parque Explora, we set out to support teachers and school leaders in Antioquia navigating post-pandemic challenges. Many classrooms had remained static despite mounting technological, social, and educational shifts. Educators were looking for ways to re-engage students and reinvent learning experiences. Our workshop aimed to spark this transformation through small but powerful interventions—“hacks”—to reimagine the classroom as a dynamic, participatory space for learning in the 21st century.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Task — My Role</h2>\n<p>I led the initiative as Head of Innovation, co-designing and facilitating the virtual workshop in partnership with the Parque Explora team. I developed the workshop structure, infused it with creative methodologies, and hosted the session with over 300 educators. My focus was on guiding participants through a process of reflection, ideation, and prototyping, creating a space for connection, creativity, and shared learning across regions.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Action — The Process</h2>\n<p><strong>Discovery &amp; Intention Setting.</strong> We opened the session by surfacing shared intentions: What makes a learning experience memorable? Using collaborative tools like Mentimeter, participants defined their own “EMA” (experiencia memorable de aprendizaje), forming the foundation for their design challenges.</p>\n<p><strong>Empathy &amp; Immersion.</strong> Next, we invited educators to step into the shoes of their students. Through a guided imagination exercise, they mapped classroom experiences from a learner’s perspective—observing behaviors, emotions, and interactions to surface unmet needs and opportunities.</p>\n<p><strong>Hack Ideation &amp; Design.</strong> Inspired by prompts (e.g., “How might we reconfigure the classroom for different learning styles?”), participants proposed tangible hacks—from project-based learning to spatial reorganization and intercultural exchange. Using Padlet, they shared, commented on, and iterated ideas in real time, building a collective repository of prototypes and inspiration.</p>\n<p><strong>Storytelling &amp; Reflection.</strong> To close, participants authored short narrative pieces—“love letters” to their future classrooms—connecting their intentions to their proposed interventions. The session ended with a shared reflection on how small actions can generate systemic change in education.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Result — The Impact</h2>\n<p>The workshop reached over 300 educators across Antioquia, fostering creative dialogue and new connections within a community still recovering from the pandemic. While designed as a sensitization exercise, it activated a mindset of experimentation and empowered teachers to see themselves as agents of transformation. A key takeaway: systemic change can begin with small, intentional hacks—especially when grounded in empathy and shared purpose.</p>","status":"published","cover":"","es":{"title":"Hackear el Aula","sub":"Explorando microintervenciones creativas para transformar el aprendizaje en el aula","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación — El desafío</h2>\n<p>Como parte del programa <em>Juntos Aprendemos</em>, y en colaboración con Parque Explora, nos propusimos apoyar a docentes y directivos escolares de Antioquia a afrontar los desafíos posteriores a la pandemia. Muchas aulas habían permanecido estáticas pese a los crecientes cambios tecnológicos, sociales y educativos. Los educadores buscaban maneras de reconectar a los estudiantes y reinventar las experiencias de aprendizaje. Nuestro taller buscaba encender esta transformación mediante intervenciones pequeñas pero poderosas —\"hacks\"— para reimaginar el aula como un espacio dinámico y participativo de aprendizaje para el siglo XXI.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Tarea — Mi rol</h2>\n<p>Lideré la iniciativa como Head of Innovation, codiseñando y facilitando el taller virtual en alianza con el equipo de Parque Explora. Desarrollé la estructura del taller, la nutrí con metodologías creativas y conduje la sesión con más de 300 educadores. Mi enfoque fue guiar a los participantes a través de un proceso de reflexión, ideación y prototipado, creando un espacio de conexión, creatividad y aprendizaje compartido entre regiones.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acción — El proceso</h2>\n<p><strong>Descubrimiento y definición de intenciones.</strong> Abrimos la sesión sacando a la luz intenciones compartidas: ¿qué hace memorable una experiencia de aprendizaje? Con herramientas colaborativas como Mentimeter, los participantes definieron su propia \"EMA\" (experiencia memorable de aprendizaje), que sentó la base de sus retos de diseño.</p>\n<p><strong>Empatía e inmersión.</strong> Luego, invitamos a los educadores a ponerse en los zapatos de sus estudiantes. A través de un ejercicio de imaginación guiada, mapearon las experiencias del aula desde la perspectiva del aprendiz, observando comportamientos, emociones e interacciones para identificar necesidades insatisfechas y oportunidades.</p>\n<p><strong>Ideación y diseño de hacks.</strong> Inspirados por preguntas detonantes (por ejemplo, \"¿Cómo podríamos reconfigurar el aula para distintos estilos de aprendizaje?\"), los participantes propusieron hacks tangibles, desde el aprendizaje basado en proyectos hasta la reorganización del espacio y el intercambio intercultural. Usando Padlet, compartieron, comentaron e iteraron ideas en tiempo real, construyendo un repositorio colectivo de prototipos e inspiración.</p>\n<p><strong>Narración y reflexión.</strong> Para cerrar, los participantes escribieron breves piezas narrativas —\"cartas de amor\" a sus futuras aulas— que conectaban sus intenciones con las intervenciones propuestas. La sesión terminó con una reflexión compartida sobre cómo las pequeñas acciones pueden generar un cambio sistémico en la educación.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultado — El impacto</h2>\n<p>El taller llegó a más de 300 educadores de Antioquia, fomentando un diálogo creativo y nuevas conexiones dentro de una comunidad que aún se estaba recuperando de la pandemia. Aunque se diseñó como un ejercicio de sensibilización, activó una mentalidad de experimentación y empoderó a los docentes para verse a sí mismos como agentes de transformación. Un aprendizaje clave: el cambio sistémico puede comenzar con pequeños hacks intencionales, especialmente cuando se fundamentan en la empatía y en un propósito compartido.</p>"}},{"id":"2f79a9f0000e805ba2bbff4b4cd05a5b","slug":"planetario-de-medellin","title":"Planetario de Medellín","sub":"Renewal Strategy","year":2022,"client":["Parque Explora"],"industry":["Culture & Museums","Third Sector / NGOs"],"type":["Exhibition","Master Planning"],"role":["Project leader"],"country":[],"highlight":false,"link":"","texture":"halftone","excerpt":"Concept Development. Based on the research, we developed the core narrative: “Our Place in the Universe”—not just as a scientific inquiry, but as a human and existential one. We defined two guiding horizons: Origins…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation</h2>\n<p>After a decade of operations, the Planetario de Medellín needed a major renewal to stay relevant in a changing cultural and educational landscape. Its original museographic offer, focused mainly on astronomy, no longer resonated with increasingly diverse and critical audiences. The challenge was not only to modernize infrastructure and content, but to reframe the planetarium as a space for existential reflection, interdisciplinary dialogue, and inclusive public engagement—positioning science as both a tool for wonder and a catalyst for planetary responsibility.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Task</h2>\n<p>I served as Head of Innovation and led the museography team throughout the conceptualization and experience design process. My role included guiding the creative and strategic vision, facilitating interdisciplinary workshops, and ensuring coherence between the scientific, cultural, and spatial dimensions of the visitor experience. I worked closely with educators, scientists, designers, and community stakeholders to craft an exhibition that invites critical thinking and emotional connection.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Action</h2>\n<p><strong>Discovery &amp; Strategic Framing.</strong> We began with an extensive participatory research phase: surveys with over 200 visitors and non-visitors, stakeholder interviews, focus groups with educators and community leaders, and internal ideation sessions. This helped us surface deep user insights—especially the need to move beyond hard science into more human, emotional, and philosophical territory.</p>\n<p><strong>Concept Development.</strong> Based on the research, we developed the core narrative: <em>“Our Place in the Universe”</em>—not just as a scientific inquiry, but as a human and existential one. We defined two guiding horizons: <strong>Origins</strong> (where we come from) and <strong>Edges</strong> (what lies beyond), to anchor content and spatial storytelling. This narrative was built to provoke wonder, decentralize Western perspectives, and reintroduce visitors to themselves as cosmic citizens.</p>\n<p><strong>Experience Co-Design.</strong> We led multiple co-creation workshops with Explora staff, astronomers, artists, accessibility advocates, and teachers to define multi-sensory, inclusive experiences. This process emphasized interaction beyond the visual—through sound, tactility, posture, and narrative—to make science accessible and meaningful for all audiences, including children, older adults, and people with disabilities.</p>\n<p><strong>Spatial and Narrative Integration.</strong> My team worked on translating abstract concepts into immersive spatial experiences. We developed a sequence across three floors—from Earth’s biodiversity to cosmic scale—using design tools like interactive constellations, planetary distance markers, and a large-scale mural of cosmic history. Each zone balanced scientific depth with artistic storytelling and emotional resonance.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Result</h2>\n<p>The resulting proposal redefined the Planetarium not just as a science venue, but as a cultural space for critical reflection and collective imagination. It introduced new forms of accessibility, multisensory engagement, and narrative depth that were previously missing. A key takeaway: when designing for science, grounding complexity in human emotion and local context can create deeper, more transformative public experiences.</p>","status":"published","cover":"","es":{"title":"Planetario de Medellín","sub":"Estrategia de renovación","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación</h2>\n<p>Después de una década de operación, el Planetario de Medellín necesitaba una renovación profunda para mantenerse vigente en un panorama cultural y educativo cambiante. Su oferta museográfica original, centrada principalmente en la astronomía, ya no resonaba con audiencias cada vez más diversas y críticas. El desafío no era solo modernizar la infraestructura y los contenidos, sino replantear el planetario como un espacio para la reflexión existencial, el diálogo interdisciplinario y la participación pública inclusiva, posicionando la ciencia como herramienta de asombro y, a la vez, como catalizador de la responsabilidad planetaria.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Tarea</h2>\n<p>Me desempeñé como Head of Innovation y lideré al equipo de museografía a lo largo del proceso de conceptualización y diseño de la experiencia. Mi rol incluyó guiar la visión creativa y estratégica, facilitar talleres interdisciplinarios y asegurar la coherencia entre las dimensiones científica, cultural y espacial de la experiencia del visitante. Trabajé de cerca con educadores, científicos, diseñadores y actores de la comunidad para crear una exposición que invita al pensamiento crítico y a la conexión emocional.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acción</h2>\n<p><strong>Descubrimiento y encuadre estratégico.</strong> Comenzamos con una extensa fase de investigación participativa: encuestas a más de 200 visitantes y no visitantes, entrevistas con stakeholders, grupos focales con educadores y líderes comunitarios, y sesiones internas de ideación. Esto nos ayudó a sacar a la luz insights profundos de los usuarios, en especial la necesidad de ir más allá de la ciencia dura hacia un territorio más humano, emocional y filosófico.</p>\n<p><strong>Desarrollo del concepto.</strong> A partir de la investigación, desarrollamos la narrativa central: <em>“Nuestro lugar en el universo”</em>, no solo como una pregunta científica, sino también humana y existencial. Definimos dos horizontes guía: <strong>Orígenes</strong> (de dónde venimos) y <strong>Bordes</strong> (qué hay más allá), para anclar el contenido y la narración espacial. Esta narrativa se construyó para provocar asombro, descentralizar las perspectivas occidentales y reintroducir a los visitantes ante sí mismos como ciudadanos cósmicos.</p>\n<p><strong>Codiseño de la experiencia.</strong> Lideramos múltiples talleres de cocreación con el equipo de Explora, astrónomos, artistas, defensores de la accesibilidad y docentes para definir experiencias multisensoriales e inclusivas. Este proceso puso el énfasis en una interacción que va más allá de lo visual —a través del sonido, la tactilidad, la postura y la narrativa— para que la ciencia sea accesible y significativa para todos los públicos, incluidos niños, adultos mayores y personas con discapacidad.</p>\n<p><strong>Integración espacial y narrativa.</strong> Mi equipo trabajó en traducir conceptos abstractos en experiencias espaciales inmersivas. Desarrollamos una secuencia a lo largo de tres pisos —desde la biodiversidad de la Tierra hasta la escala cósmica— usando herramientas de diseño como constelaciones interactivas, marcadores de distancias planetarias y un mural de gran formato sobre la historia cósmica. Cada zona equilibraba la profundidad científica con la narración artística y la resonancia emocional.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultado</h2>\n<p>La propuesta resultante redefinió el Planetario no solo como un recinto de ciencia, sino como un espacio cultural para la reflexión crítica y la imaginación colectiva. Introdujo nuevas formas de accesibilidad, de participación multisensorial y de profundidad narrativa que antes no existían. Un aprendizaje clave: al diseñar para la ciencia, anclar la complejidad en la emoción humana y en el contexto local puede crear experiencias públicas más profundas y transformadoras.</p>"}},{"id":"5ebe20f484a046f49d50d77b84be1c7d","slug":"master-planning-for-a-historical-site-in-puerto-colombia","title":"Master planning for a historical site in Puerto Colombia","sub":"","year":2022,"client":["Fundación Puerto Colombia"],"industry":["Third Sector / NGOs"],"type":["Strategy","Master Planning"],"role":["Creative director"],"country":["Colombia"],"highlight":false,"link":"","texture":"particles","excerpt":"In 2022 Parque Explora was selected to design the museum’s next chapter through a comprehensive Master Planning effort aiming to consolidate a museum for the public engagement of the history of the port —its migrants…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>The project focuses on the renovation and revitalization of the Memory Station Museum in Puerto Colombia, a place with a rich history of migration and cultural development. Puerto Colombia, known for its historic pier and railway station, has been a crucial entry point to the country and a hub of cultural and economic exchanges since the 19th century.</p>\n<p>In 2022 Parque Explora was selected to design the museum’s next chapter through a comprehensive Master Planning effort aiming to consolidate a museum for the public engagement of the history of the port —its migrants and settlers, the dock and its daily life, the station and the railway—, and the mark that this milestone left on the culture of Puerto Colombia and the transformation of Colombia.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The main challenge was to understand and document the needs and perceptions of the local community and visitors regarding the museum's revitalization. The goal was to identify the most relevant historical and cultural elements, as well as opportunities to improve the museum's infrastructure and cultural offerings, ensuring its sustainability and relevance in the current context.</p>\n<blockquote class=\"c-quote\">Through stories and living memories, embedded in objects, archive documents, family albums, remains of infrastructure, and current elements of the mix of cultures, visitors will immerse themselves in the past and present of a place that was the gateway to the transformation of the country and that today is projected as a symbol of conscious development, sustainable and human.</blockquote>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>What We Did</h2>\n<ul><li><strong>Document Review:</strong> An extensive analysis of Puerto Colombia's history and heritage, as well as local and national development plans.</li><li><strong>Site Visits:</strong> Visits to the site to better understand its current state and potential.</li><li><strong>Interviews and Workshops:</strong> Organized interviews with key stakeholders and co-creation workshops with community members and experts to gather diverse perspectives and build a shared vision for the project.</li><li><strong>Contextual Analysis:</strong> Diagnoses were developed on the normative state and needs of the local population, considering social, economic, and cultural factors.</li></ul>\n<p>The results of this diagnostic phase enabled:</p>\n<ul><li><strong>Identification of Challenges and Opportunities:</strong> Key aspects were highlighted, such as the importance of including diverse communities and enhancing the living heritage of Puerto Colombia.</li><li><strong>Foundation for Project Design:</strong> Ideas and proposals for museographic and urban intervention were consolidated, aligned with the community's needs and expectations.</li><li><strong>Community Engagement:</strong> Active participation from Puerto Colombia residents generated a sense of ownership and support for the project, crucial for its future success and sustainability.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>The Proposal</h2>\n<ul><li><strong>Design of Interactive Experiences:</strong> Proposed new narratives and interactive formats, integrating digital and physical media to enrich the visitor experience.</li><li><strong>Architectural Intervention:</strong> Planned the renovation of the station and the construction of new spaces, such as a multipurpose pavilion and a connecting pergola, to unify the different elements of the site.</li><li><strong>Expanded Museography:</strong> Proposed extending the museum experience beyond its walls with installations and signage in the plaza and pier, creating an accessible and attractive cultural route.</li><li><strong>Sustainability and Management:</strong> Designed strategies to ensure the long-term economic and operational viability of the museum, including seeking partnerships and funding.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Intended Impact</h2>\n<ul><li><strong>Heritage Revitalization:</strong> The proposed intervention aims to value and preserve Puerto Colombia's cultural heritage, turning the museum into a reference for local history and identity.</li><li><strong>Inclusion and Community Participation:</strong> Involving various voices in the project's design and planning strengthens the sense of ownership and collaboration between the community and the museum.</li><li><strong>Tourism and Cultural Attraction:</strong> The museum's renovation and expansion position Puerto Colombia as a prominent tourist and cultural destination, boosting the local economy and fostering sustainable development.</li><li><strong>Educational Innovation:</strong> Creating educational and participatory experiences enriches the museum's cultural and educational offerings, benefiting students and visitors of all ages.</li></ul>","status":"published","cover":"","es":{"title":"Plan maestro para un sitio histórico en Puerto Colombia","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>El proyecto se centra en la renovación y revitalización del Museo Estación de la Memoria en Puerto Colombia, un lugar con una rica historia de migración y desarrollo cultural. Puerto Colombia, conocido por su histórico muelle y su estación de ferrocarril, ha sido desde el siglo XIX una puerta de entrada fundamental al país y un centro de intercambios culturales y económicos.</p>\n<p>En 2022, Parque Explora fue seleccionado para diseñar el próximo capítulo del museo mediante un esfuerzo integral de Plan Maestro, con el fin de consolidar un museo para la apropiación pública de la historia del puerto —sus migrantes y colonos, el muelle y su vida cotidiana, la estación y el ferrocarril— y de la huella que este hito dejó en la cultura de Puerto Colombia y en la transformación de Colombia.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El principal desafío era comprender y documentar las necesidades y percepciones de la comunidad local y de los visitantes frente a la revitalización del museo. El objetivo era identificar los elementos históricos y culturales más relevantes, así como las oportunidades para mejorar la infraestructura y la oferta cultural del museo, asegurando su sostenibilidad y pertinencia en el contexto actual.</p>\n<blockquote class=\"c-quote\">A través de historias y memorias vivas, presentes en objetos, documentos de archivo, álbumes familiares, restos de infraestructura y elementos actuales de la mezcla de culturas, los visitantes se sumergirán en el pasado y el presente de un lugar que fue la puerta de entrada a la transformación del país y que hoy se proyecta como símbolo de un desarrollo consciente, sostenible y humano.</blockquote>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Qué hicimos</h2>\n<ul><li><strong>Revisión documental:</strong> Un análisis extenso de la historia y el patrimonio de Puerto Colombia, así como de los planes de desarrollo locales y nacionales.</li><li><strong>Visitas al sitio:</strong> Visitas al lugar para comprender mejor su estado actual y su potencial.</li><li><strong>Entrevistas y talleres:</strong> Organizamos entrevistas con stakeholders clave y talleres de cocreación con miembros de la comunidad y expertos para recoger perspectivas diversas y construir una visión compartida del proyecto.</li><li><strong>Análisis contextual:</strong> Se desarrollaron diagnósticos sobre el estado normativo y las necesidades de la población local, considerando factores sociales, económicos y culturales.</li></ul>\n<p>Los resultados de esta fase de diagnóstico permitieron:</p>\n<ul><li><strong>Identificación de desafíos y oportunidades:</strong> Se destacaron aspectos clave, como la importancia de incluir a comunidades diversas y de potenciar el patrimonio vivo de Puerto Colombia.</li><li><strong>Base para el diseño del proyecto:</strong> Se consolidaron ideas y propuestas de intervención museográfica y urbana, alineadas con las necesidades y expectativas de la comunidad.</li><li><strong>Participación de la comunidad:</strong> La participación activa de los habitantes de Puerto Colombia generó un sentido de apropiación y respaldo al proyecto, fundamental para su éxito y sostenibilidad futuros.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>La propuesta</h2>\n<ul><li><strong>Diseño de experiencias interactivas:</strong> Propusimos nuevas narrativas y formatos interactivos que integran medios digitales y físicos para enriquecer la experiencia del visitante.</li><li><strong>Intervención arquitectónica:</strong> Planeamos la renovación de la estación y la construcción de nuevos espacios, como un pabellón multipropósito y una pérgola de conexión, para unificar los distintos elementos del sitio.</li><li><strong>Museografía ampliada:</strong> Propusimos extender la experiencia del museo más allá de sus muros con instalaciones y señalización en la plaza y el muelle, creando una ruta cultural accesible y atractiva.</li><li><strong>Sostenibilidad y gestión:</strong> Diseñamos estrategias para asegurar la viabilidad económica y operativa del museo a largo plazo, incluida la búsqueda de alianzas y financiación.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Impacto esperado</h2>\n<ul><li><strong>Revitalización del patrimonio:</strong> La intervención propuesta busca valorar y preservar el patrimonio cultural de Puerto Colombia, convirtiendo el museo en un referente de la historia y la identidad locales.</li><li><strong>Inclusión y participación comunitaria:</strong> Involucrar voces diversas en el diseño y la planeación del proyecto fortalece el sentido de apropiación y la colaboración entre la comunidad y el museo.</li><li><strong>Turismo y atractivo cultural:</strong> La renovación y ampliación del museo posicionan a Puerto Colombia como un destino turístico y cultural destacado, impulsando la economía local y fomentando el desarrollo sostenible.</li><li><strong>Innovación educativa:</strong> Crear experiencias educativas y participativas enriquece la oferta cultural y educativa del museo, en beneficio de estudiantes y visitantes de todas las edades.</li></ul>"}},{"id":"96728a7652824b1cabb16ff41ff7cb3d","slug":"the-future-of-gas-stations-in-the-context-of-energy-transition","title":"The Future of Gas Stations in the Context of Energy Transition","sub":"","year":2022,"client":[],"industry":["Energy"],"type":["Sustainable Futures"],"role":["Strategic Design Consultant"],"country":["Colombia"],"highlight":false,"link":"","texture":"grain","excerpt":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>The rapid advancements in sustainable mobility and energy transition are reshaping the landscape of the fuel service station (EDS) industry globally, including in Colombia. This case study focuses on the current state and future prospects of gas stations in Colombia as they navigate through this significant transition. The initial context includes a network of approximately 6,000 gas stations, primarily operated by small and medium distributors, with major players like Terpel, Primax, Biomax, and Chevron dominating the market. The objective is to explore how these stations can evolve to meet the demands of a greener future.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The primary challenge faced by the EDS industry in Colombia is the shift towards sustainable mobility amidst an environment still heavily reliant on fossil fuels. With a mere 0.2% of stations offering rapid charging for electric vehicles, the industry lags in infrastructure necessary for the adoption of electric vehicles (EVs). Key obstacles include convincing numerous small-scale station owners to invest in new technologies, developing a robust charging network, and addressing the low current demand for EVs. Additionally, the industry must align with global trends toward decarbonization and prepare for a market where electric and hybrid vehicles are expected to dominate.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Methodology</h2>\n<p>I followed a structured process consisting of four key stages:</p>\n<ol><li><strong>Plan — Setup and Organization:</strong> This initial stage involves setting up the framework for the project, organizing the work schedule, and establishing objectives for the week. It ensures a clear roadmap and efficient time management for the exploration ahead.</li><li><strong>Explore — Desk Research, Trend Analysis and Expert Interviews:</strong> Conduct an extensive review of relevant documents and explore current trends. Interview two experts to gain insights and gather diverse perspectives.</li><li><strong>Define — Strategy Development:</strong> Based on the information gathered, define a strategic approach and identify key opportunity areas. This stage focuses on setting clear goals and outlining the potential impact of the proposed solutions.</li><li><strong>Imagine — Design Concept Projection:</strong> Develop and project various design concepts that address the identified opportunities. This creative stage involves brainstorming, sketching, and refining ideas to propose innovative and practical solutions.</li></ol>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Results: Reimagining Service Stations</h2>\n<p>Various design concepts were developed to transform traditional gas stations into multifunctional centers adapted to sustainable mobility. These concepts include vehicular charging towers that optimize space, last-mile delivery hubs for urban areas, energy and experience centers that turn stations into recreational destinations, and home charging services for greater convenience. Additionally, charging station modules were proposed for high-traffic locations, multi-energy complexes on highways, workspaces known as \"third places,\" and stations on green tourist routes. These designs aim to diversify services and energy offerings, enhance user experience, and support the transition to a more sustainable future.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Intended Impact</h2>\n<p>Reimagining service stations results in significant benefits across multiple dimensions:</p>\n<ul><li><strong>Environmental Impact:</strong> Shift to electric and renewable energy reduces carbon footprint; integration of solar panels and wind turbines supports sustainability.</li><li><strong>Customer Experience:</strong> Introduction of EV charging, rental services, and experience centers; interactive and entertaining elements improve customer visits.</li><li><strong>Economic Benefits:</strong> Services like EV rentals and home charging generate additional income; new services and technologies create employment opportunities.</li><li><strong>Sustainable Mobility:</strong> Expanded network of EV chargers supports electric vehicle adoption; home charging services and public infrastructure alleviate EV range concerns.</li><li><strong>Technological Advancements:</strong> Mobile apps for services and customer interaction enhance tech integration; efficient use of renewable energy sources.</li><li><strong>Strategic Partnerships:</strong> Public-private partnerships foster sustainable mobility solutions; collaboration with startups and tech companies drives innovation.</li><li><strong>Consumer Preferences:</strong> Data analytics provide customized services, enhancing satisfaction; green energy options meet environmentally conscious consumer expectations.</li><li><strong>Business Viability:</strong> Diversification ensures long-term business viability; multiple energy and service options make stations more resilient to market changes.</li></ul>","status":"published","cover":"","es":{"title":"El futuro de las estaciones de servicio en el contexto de la transición energética","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>Los rápidos avances en movilidad sostenible y transición energética están transformando el panorama de la industria de estaciones de servicio de combustible (EDS) a nivel global, incluida Colombia. Este estudio de caso se centra en el estado actual y las perspectivas futuras de las estaciones de servicio en Colombia mientras atraviesan esta transición significativa. El contexto inicial incluye una red de aproximadamente 6.000 estaciones de servicio, operadas principalmente por distribuidores pequeños y medianos, con grandes jugadores como Terpel, Primax, Biomax y Chevron dominando el mercado. El objetivo es explorar cómo pueden evolucionar estas estaciones para responder a las demandas de un futuro más verde.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El principal desafío de la industria de EDS en Colombia es el giro hacia la movilidad sostenible en un entorno que aún depende en gran medida de los combustibles fósiles. Con apenas un 0,2 % de las estaciones ofreciendo carga rápida para vehículos eléctricos, la industria está rezagada en la infraestructura necesaria para la adopción de vehículos eléctricos (VE). Entre los obstáculos clave están convencer a numerosos propietarios de estaciones pequeñas de invertir en nuevas tecnologías, desarrollar una red de carga robusta y atender la baja demanda actual de VE. Además, la industria debe alinearse con las tendencias globales de descarbonización y prepararse para un mercado en el que se espera que predominen los vehículos eléctricos e híbridos.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Metodología</h2>\n<p>Seguí un proceso estructurado compuesto por cuatro etapas clave:</p>\n<ol><li><strong>Plan — Configuración y organización:</strong> Esta etapa inicial consiste en establecer el marco del proyecto, organizar el cronograma de trabajo y fijar los objetivos de la semana. Asegura una hoja de ruta clara y una gestión eficiente del tiempo para la exploración que sigue.</li><li><strong>Explore — Investigación documental, análisis de tendencias y entrevistas con expertos:</strong> Se realiza una revisión extensa de documentos relevantes y se exploran las tendencias actuales. Se entrevista a dos expertos para obtener insights y reunir perspectivas diversas.</li><li><strong>Define — Desarrollo de la estrategia:</strong> Con base en la información reunida, se define un enfoque estratégico y se identifican las áreas clave de oportunidad. Esta etapa se centra en fijar metas claras y delinear el impacto potencial de las soluciones propuestas.</li><li><strong>Imagine — Proyección de conceptos de diseño:</strong> Se desarrollan y proyectan diversos conceptos de diseño que responden a las oportunidades identificadas. Esta etapa creativa incluye lluvia de ideas, bocetos y refinamiento de ideas para proponer soluciones innovadoras y prácticas.</li></ol>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultados: reimaginar las estaciones de servicio</h2>\n<p>Se desarrollaron diversos conceptos de diseño para transformar las estaciones de servicio tradicionales en centros multifuncionales adaptados a la movilidad sostenible. Estos conceptos incluyen torres de carga vehicular que optimizan el espacio, centros de entrega de última milla para zonas urbanas, centros de energía y experiencia que convierten las estaciones en destinos recreativos, y servicios de carga a domicilio para mayor comodidad. Además, se propusieron módulos de estaciones de carga para lugares de alto tráfico, complejos multienergía en carreteras, espacios de trabajo conocidos como \"terceros lugares\" y estaciones en rutas turísticas verdes. Estos diseños buscan diversificar la oferta de servicios y de energía, mejorar la experiencia del usuario y apoyar la transición hacia un futuro más sostenible.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Impacto esperado</h2>\n<p>Reimaginar las estaciones de servicio genera beneficios significativos en múltiples dimensiones:</p>\n<ul><li><strong>Impacto ambiental:</strong> El giro hacia la energía eléctrica y renovable reduce la huella de carbono; la integración de paneles solares y turbinas eólicas apoya la sostenibilidad.</li><li><strong>Experiencia del cliente:</strong> Introducción de carga para VE, servicios de alquiler y centros de experiencia; los elementos interactivos y de entretenimiento mejoran las visitas de los clientes.</li><li><strong>Beneficios económicos:</strong> Servicios como el alquiler de VE y la carga a domicilio generan ingresos adicionales; los nuevos servicios y tecnologías crean oportunidades de empleo.</li><li><strong>Movilidad sostenible:</strong> Una red ampliada de cargadores para VE apoya la adopción de vehículos eléctricos; los servicios de carga a domicilio y la infraestructura pública alivian las preocupaciones sobre la autonomía de los VE.</li><li><strong>Avances tecnológicos:</strong> Las apps móviles para servicios e interacción con el cliente mejoran la integración tecnológica; uso eficiente de fuentes de energía renovable.</li><li><strong>Alianzas estratégicas:</strong> Las alianzas público-privadas fomentan soluciones de movilidad sostenible; la colaboración con startups y empresas de tecnología impulsa la innovación.</li><li><strong>Preferencias del consumidor:</strong> La analítica de datos permite ofrecer servicios personalizados y mejora la satisfacción; las opciones de energía verde responden a las expectativas de los consumidores conscientes del medio ambiente.</li><li><strong>Viabilidad del negocio:</strong> La diversificación asegura la viabilidad del negocio a largo plazo; las múltiples opciones de energía y servicios hacen que las estaciones sean más resilientes a los cambios del mercado.</li></ul>"}},{"id":"a09913591fdc42f5b8fb7637b7225a53","slug":"future-seeds","title":"Future Seeds","sub":"Transforming a Research Facility into a Public Gateway to Biodiversity","year":2022,"client":["CIAT"],"industry":["Science - Research"],"type":["Exhibition"],"role":["Creative director","Exhibition Designer"],"country":[],"highlight":false,"link":"","texture":"halftone","excerpt":"With these narratives in place, we developed a design strategy rooted in the idea of “welcoming science.” This meant rethinking the way visitors move through the building and experience information. We identified…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>The Context</h2>\n<p>The <em>Future Seeds</em> building, part of the International Center for Tropical Agriculture (CIAT) in Palmira, Colombia, is a globally significant site for the conservation of agricultural biodiversity. Traditionally a space dedicated exclusively to scientific research, it held untapped potential to become a bridge between science and society. In partnership with Parque Explora, CIAT envisioned turning this emblematic space into a vibrant place where the public could understand and connect with the value of biodiversity and germplasm conservation.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The main challenge was to transform underutilized areas of the <em>Seeds of the Future</em> building into engaging, educational spaces without interrupting its core scientific functions. The goal was to open the facility to diverse audiences while preserving its integrity as a research center—turning it into a dual-purpose environment that supports both rigorous science and compelling science communication.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Process</h2>\n<p>To initiate the transformation, we first established a close collaboration with CIAT’s scientific team to identify the core narratives that would resonate with both specialists and general visitors. These included the significance of preserving agricultural biodiversity, the role of germplasm in food security, and the global relevance of the <em>Future Seeds</em> facility. This dialogue allowed us to ground the design process in scientific accuracy while translating complex topics into accessible, meaningful stories.</p>\n<p>With these narratives in place, we developed a design strategy rooted in the idea of “welcoming science.” This meant rethinking the way visitors move through the building and experience information. We identified underutilized zones within the facility that could be repurposed as interactive spaces without disrupting its operational flow. These zones became points of encounter—areas where the public could engage with content through immersive, sensory experiences.</p>\n<p>We designed and installed three interactive exhibits that combined analog and digital elements. These exhibits invited visitors to explore seed diversity, conservation techniques, and the global exchange of agricultural knowledge. Each installation was carefully crafted to be intuitive, engaging, and visually compelling, using graphics, textures, and participatory components that would captivate both lay audiences and academic visitors.</p>\n<p>The graphic and spatial interventions were designed to harmonize with the architectural and scientific context of the building. Rather than imposing a traditional museographic layer, we worked with the existing materiality and circulation of the space, embedding interpretive elements that felt natural and respectful of the building’s research identity.</p>\n<p>Finally, we supported the integration of these new public functions by training CIAT scientists as science communicators and space mediators. Their presence and active participation enriched the visitor experience, allowing for real-time interpretation, dialogue, and connection. This human-centered approach helped bridge the gap between rigorous research and societal understanding, making the science come alive for everyone.</p>","status":"published","cover":"","es":{"title":"Semillas del futuro","sub":"Transformar un centro de investigación en una puerta pública a la biodiversidad","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>El contexto</h2>\n<p>El edificio <em>Future Seeds</em> (Semillas del Futuro), parte del Centro Internacional de Agricultura Tropical (CIAT) en Palmira, Colombia, es un sitio de importancia mundial para la conservación de la biodiversidad agrícola. Tradicionalmente un espacio dedicado exclusivamente a la investigación científica, tenía un potencial sin explotar para convertirse en un puente entre la ciencia y la sociedad. En alianza con Parque Explora, el CIAT imaginó transformar este espacio emblemático en un lugar vibrante donde el público pudiera comprender y conectar con el valor de la biodiversidad y la conservación del germoplasma.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El principal desafío era transformar las áreas subutilizadas del edificio <em>Semillas del Futuro</em> en espacios educativos y atractivos sin interrumpir sus funciones científicas centrales. El objetivo era abrir las instalaciones a públicos diversos preservando su integridad como centro de investigación, convirtiéndolo en un entorno de doble propósito que apoyara tanto la ciencia rigurosa como una comunicación científica cautivadora.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El proceso</h2>\n<p>Para iniciar la transformación, primero establecimos una colaboración cercana con el equipo científico del CIAT para identificar las narrativas centrales que resonarían tanto con especialistas como con visitantes generales. Entre ellas estaban la importancia de preservar la biodiversidad agrícola, el papel del germoplasma en la seguridad alimentaria y la relevancia global de las instalaciones <em>Future Seeds</em>. Este diálogo nos permitió fundamentar el proceso de diseño en la precisión científica y, a la vez, traducir temas complejos en historias accesibles y significativas.</p>\n<p>Con estas narrativas definidas, desarrollamos una estrategia de diseño basada en la idea de una \"ciencia que da la bienvenida\". Esto significó repensar la manera en que los visitantes se mueven por el edificio y experimentan la información. Identificamos zonas subutilizadas dentro de las instalaciones que podían reconvertirse en espacios interactivos sin interrumpir su flujo operativo. Estas zonas se convirtieron en puntos de encuentro: áreas donde el público podía interactuar con los contenidos a través de experiencias inmersivas y sensoriales.</p>\n<p>Diseñamos e instalamos tres exhibiciones interactivas que combinaban elementos análogos y digitales. Estas exhibiciones invitaban a los visitantes a explorar la diversidad de las semillas, las técnicas de conservación y el intercambio global de conocimiento agrícola. Cada instalación se elaboró con cuidado para ser intuitiva, atractiva y visualmente convincente, con gráficos, texturas y componentes participativos que cautivaran tanto a públicos no especializados como a visitantes académicos.</p>\n<p>Las intervenciones gráficas y espaciales se diseñaron para armonizar con el contexto arquitectónico y científico del edificio. En lugar de imponer una capa museográfica tradicional, trabajamos con la materialidad y la circulación existentes del espacio, incorporando elementos interpretativos que se sintieran naturales y respetuosos de la identidad investigativa del edificio.</p>\n<p>Finalmente, apoyamos la integración de estas nuevas funciones públicas capacitando a los científicos del CIAT como comunicadores de ciencia y mediadores del espacio. Su presencia y participación activa enriquecieron la experiencia del visitante, permitiendo la interpretación, el diálogo y la conexión en tiempo real. Este enfoque centrado en las personas ayudó a tender un puente entre la investigación rigurosa y la comprensión de la sociedad, haciendo que la ciencia cobrara vida para todos.</p>"}},{"id":"b063f91426d547c6a8ba3d29f6192f3d","slug":"creating-a-nationwide-network-of-branches-for-the-museum-of-natural-and","title":"Creating a Nationwide Network of Branches for the Museum of Natural and Cultural History of Colombia","sub":"","year":2022,"client":["Ministry of Culture"],"industry":["Culture & Museums","Goverment / Public"],"type":["Science center","Strategy","Master Planning"],"role":["Creative director"],"country":[],"highlight":true,"link":"","texture":"halftone","excerpt":"Purpose. The project seeks to inspire a collective shift toward life-centered thinking, encouraging Colombians to explore the biodiversity of their territory and engage in its care. Through science, storytelling, and…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>The Context</h2>\n<p>In 2022, the Colombian Ministry of Culture launched a national initiative to create a network of spaces for the Museum of Natural and Cultural History of Colombia. The goal was to enhance public engagement with science and technology and spark a nationwide conversation centered on life, regeneration, and biodiversity. Through a public call, cultural, scientific, and educational institutions were invited to submit viable project proposals within just four weeks. Parque Explora, in collaboration with various partners, accepted the challenge to design and conceptualize the nationwide network.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The main challenge was to develop a comprehensive and feasible proposal for 12 physical and 6 virtual museum spaces across Colombia in only four weeks. This demanded the coordination of multiple stakeholders, the crafting of a unified narrative that resonated nationwide, and the creation of adaptive content and formats that respected the diverse physical and social contexts of each location.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Idea</h2>\n<p>At its heart, the Network of spaces of the Museum of Natural and Cultural History of Colombia (MHNCC) is a call to recognize and celebrate the interconnections between life forms, ecosystems, and cultures across Colombia. The network was conceived not merely as a series of museum exhibitions, but as a national platform to regenerate our understanding and relationship with nature through knowledge, emotion, and action.</p>\n<p><strong>Purpose.</strong> The project seeks to inspire a collective shift toward life-centered thinking, encouraging Colombians to explore the biodiversity of their territory and engage in its care. Through science, storytelling, and design, <em>Biofilia</em> aims to spark ecological awareness and regenerative practices, rooted in local realities and ancestral knowledge.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Content Approach</h2>\n<ul><li><strong>Anchor ourselves to a common history:</strong> Origin stories. Geological and cultural milestones that have created a changing and biodiverse territory.</li><li><strong>Regenerate relationships and life:</strong> From a call for urgent action, it proposes the regeneration of soil, forests, and socio-ecological relationships.</li><li><strong>Our present landscape:</strong> Who and how we live today in this shared territory. Stories about a present full of natural and cultural stories, around biodiversity and the challenges of resilience.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Museography</h2>\n<p>We understood the spaces of the network as a large system made up of a set of <strong>interrelated museographic elements</strong> that take place in a specific physical and social context. Those elements can be grouped thematically, based on a single principle, a great idea, or a number of connections that make them coherent from an informative perspective.</p>\n<p>Each exhibition is made up of a mixture of museographic formats, the result of both the resources available for the project, as well as the communicative and educational purposes of the MHNCC.</p>\n<h3 class=\"c-h3\">The modularity of formats</h3>\n<p>Each space in the network will have a mix of formats and their proportions adapted to the conceptual opportunities, institutional strengths, operational restrictions and experiences of the public. Thus, one space may have a more contemplative vocation, with a quick and self-managed visit, while another space may favor citizen participation and the collective construction of knowledge.</p>\n<h3 class=\"c-h3\">Space typologies</h3>\n<p>In order to achieve a flexible museum system that can be adapted to the different conditions of the network spaces, we considered two fundamental variables: the size of the space and its permanence over time. The crossing of the variables has allowed us to establish three types of spaces:</p>\n<ul><li>Space S (between 20 and 50 sqm)</li><li>Space M (between 50 and 100 sqm)</li><li>Space L (between 100 and 250 sqm)</li></ul>\n<h3 class=\"c-h3\">Virtual spaces</h3>\n<p>A digital platform will be developed that will serve as a portal to disseminate content. It will also be the place where the public will be able to find resources of the e-Learning strategy.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">06 —</span>From Strategy to Impact</h2>\n<ul><li>The network of spaces is now a reality known as <em>Alianza Biofilia</em>.</li><li>Successfully implemented a flexible museographic system that celebrates Colombia’s biological and cultural diversity.</li><li>Strengthened strategic partnerships and local capacities in science communication.</li><li>Enabled meaningful public engagement with science in historically underserved regions.</li><li>Achieved seamless integration between physical and digital museum formats.</li><li>Established the project as a benchmark for museum innovation and strategic design in Latin America.</li><li>Demonstrated the power of collaborative design in addressing complex challenges with national impact.</li></ul>","status":"published","cover":"","es":{"title":"Crear una red nacional de sedes para el Museo de Historia Natural y Cultural de Colombia","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>El contexto</h2>\n<p>En 2022, el Ministerio de Cultura de Colombia lanzó una iniciativa nacional para crear una red de espacios del Museo de Historia Natural y Cultural de Colombia. El objetivo era fortalecer la apropiación pública de la ciencia y la tecnología y encender una conversación nacional centrada en la vida, la regeneración y la biodiversidad. Mediante una convocatoria pública, se invitó a instituciones culturales, científicas y educativas a presentar propuestas de proyecto viables en solo cuatro semanas. Parque Explora, en colaboración con diversos aliados, aceptó el reto de diseñar y conceptualizar la red nacional.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El principal desafío era desarrollar, en solo cuatro semanas, una propuesta integral y factible para 12 espacios museales físicos y 6 virtuales en toda Colombia. Esto exigió coordinar a múltiples actores, elaborar una narrativa unificada que resonara en todo el país y crear contenidos y formatos adaptables que respetaran los diversos contextos físicos y sociales de cada lugar.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>La idea</h2>\n<p>En su esencia, la Red de espacios del Museo de Historia Natural y Cultural de Colombia (MHNCC) es un llamado a reconocer y celebrar las interconexiones entre las formas de vida, los ecosistemas y las culturas de Colombia. La red se concibió no solo como una serie de exposiciones de museo, sino como una plataforma nacional para regenerar nuestra comprensión y nuestra relación con la naturaleza a través del conocimiento, la emoción y la acción.</p>\n<p><strong>Propósito.</strong> El proyecto busca inspirar un giro colectivo hacia un pensamiento centrado en la vida, animando a los colombianos a explorar la biodiversidad de su territorio y a participar en su cuidado. A través de la ciencia, la narración y el diseño, <em>Biofilia</em> aspira a despertar la conciencia ecológica y las prácticas regenerativas, arraigadas en las realidades locales y los saberes ancestrales.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Enfoque de contenidos</h2>\n<ul><li><strong>Anclarnos a una historia común:</strong> Historias de origen. Hitos geológicos y culturales que han creado un territorio cambiante y biodiverso.</li><li><strong>Regenerar las relaciones y la vida:</strong> A partir de un llamado a la acción urgente, propone la regeneración del suelo, los bosques y las relaciones socioecológicas.</li><li><strong>Nuestro paisaje presente:</strong> Quiénes somos y cómo vivimos hoy en este territorio compartido. Historias de un presente lleno de relatos naturales y culturales, en torno a la biodiversidad y los desafíos de la resiliencia.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Museografía</h2>\n<p>Entendimos los espacios de la red como un gran sistema compuesto por un conjunto de <strong>elementos museográficos interrelacionados</strong> que ocurren en un contexto físico y social específico. Esos elementos pueden agruparse temáticamente, con base en un único principio, una gran idea o una serie de conexiones que los hacen coherentes desde una perspectiva informativa.</p>\n<p>Cada exposición está compuesta por una mezcla de formatos museográficos, resultado tanto de los recursos disponibles para el proyecto como de los propósitos comunicativos y educativos del MHNCC.</p>\n<h3 class=\"c-h3\">La modularidad de los formatos</h3>\n<p>Cada espacio de la red tendrá una mezcla de formatos, con proporciones adaptadas a las oportunidades conceptuales, las fortalezas institucionales, las restricciones operativas y las experiencias del público. Así, un espacio podrá tener una vocación más contemplativa, con una visita rápida y autogestionada, mientras que otro podrá favorecer la participación ciudadana y la construcción colectiva del conocimiento.</p>\n<h3 class=\"c-h3\">Tipologías de espacio</h3>\n<p>Para lograr un sistema museal flexible que pueda adaptarse a las distintas condiciones de los espacios de la red, consideramos dos variables fundamentales: el tamaño del espacio y su permanencia en el tiempo. El cruce de las variables nos permitió establecer tres tipos de espacios:</p>\n<ul><li>Espacio S (entre 20 y 50 m²)</li><li>Espacio M (entre 50 y 100 m²)</li><li>Espacio L (entre 100 y 250 m²)</li></ul>\n<h3 class=\"c-h3\">Espacios virtuales</h3>\n<p>Se desarrollará una plataforma digital que servirá como portal para difundir contenidos. También será el lugar donde el público podrá encontrar recursos de la estrategia de e-Learning.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">06 —</span>De la estrategia al impacto</h2>\n<ul><li>La red de espacios es hoy una realidad conocida como <em>Alianza Biofilia</em>.</li><li>Se implementó con éxito un sistema museográfico flexible que celebra la diversidad biológica y cultural de Colombia.</li><li>Se fortalecieron las alianzas estratégicas y las capacidades locales en comunicación de la ciencia.</li><li>Se logró una participación pública significativa con la ciencia en regiones históricamente desatendidas.</li><li>Se alcanzó una integración fluida entre los formatos museales físicos y digitales.</li><li>Se estableció el proyecto como un referente de innovación museal y diseño estratégico en América Latina.</li><li>Se demostró el poder del diseño colaborativo para abordar desafíos complejos con impacto nacional.</li></ul>"}},{"id":"fa1673df688346df947759b8fd278e33","slug":"regenerative-horizons","title":"Regenerative Horizons","sub":"Co-creating a Birds and Agriculture Park in Colombia","year":2022,"client":["Audubon"],"industry":["Third Sector / NGOs"],"type":["Strategy","Master Planning"],"role":["Project leader"],"country":["Colombia"],"highlight":false,"link":"","texture":"particles","excerpt":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>The Birds Park and Regenerative Agriculture project is located at Hacienda Piedechinche in El Cerrito, Valle del Cauca. This park aims to merge biodiversity conservation, particularly of birds, with regenerative agricultural practices, creating a space for sustainable learning and tourism. The initiative is a collaboration between Ingenio Providencia and Audubon Americas, with the goal of promoting environmental sustainability, education, and community integration.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The main challenge of the project was to harmonize traditional agricultural production with biodiversity conservation, especially birds. The project needed to adapt regenerative agricultural practices while ensuring the protection and promotion of local bird species. There were specific difficulties in securing funding, ensuring public safety, and creating engaging experiences for diverse audiences. Moreover, integrating these practices within the existing cultural and historical context of the Hacienda added another layer of complexity.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>What We Did</h2>\n<ul><li>Conducted site visits and strategic workshops.</li><li>Held interviews with key stakeholders including community leaders, environmental groups, and tourism experts.</li><li>Developed a co-creation and strategic thinking workshop to understand and project the vision of the park.</li><li>Mapped the territory to identify opportunities and challenges.</li><li>Collaborated with local universities and organizations to design and implement regenerative agricultural plots.</li><li>Integrated existing infrastructure with new sustainable architectural interventions.</li><li>Developed interactive and immersive experiences for visitors.</li><li>Designed digital strategies to maintain engagement with diverse audiences.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>The Master Plan</h2>\n<p>The master plan for the Birds Park and Regenerative Agriculture project successfully integrated various strategic components, creating a comprehensive framework that emphasizes environmental sustainability, education, and community engagement. It outlined the development of multiple thematic areas including contemplative spaces, regenerative scenarios, museographic settings, and experimental environments. The plan also incorporated existing infrastructure, ensuring ecological connectivity and modular, systemic design principles. Key results include the establishment of interactive and immersive visitor experiences, the creation of demonstration plots for regenerative agriculture, and the construction of innovative architectural spaces like elevated walkways, hides, and multi-purpose pavilions. The plan aims to make the park a regional leader in conservation, research, education, and nature tourism, while fostering sustainable practices and community inclusion.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Intended Impact</h2>\n<h3 class=\"c-h3\">Environmental</h3>\n<ul><li><strong>Biodiversity Conservation:</strong> Protect and enhance the habitats of resident and migratory bird species through sustainable agricultural practices.</li><li><strong>Ecological Restoration:</strong> Implement regenerative agriculture to restore ecosystems, improve soil health, and promote ecological balance.</li><li><strong>Sustainable Practices:</strong> Showcase the viability of combining agriculture with conservation, serving as a model for similar initiatives.</li></ul>\n<h3 class=\"c-h3\">Educational</h3>\n<ul><li><strong>Learning Opportunities:</strong> Provide educational programs and interactive experiences for visitors, schools, and universities, promoting awareness of biodiversity and sustainable agriculture.</li><li><strong>Community Engagement:</strong> Foster a deeper understanding and appreciation of local and global environmental issues through workshops and participatory science activities.</li><li><strong>Research and Innovation:</strong> Create a living laboratory for research on regenerative agriculture and biodiversity conservation, encouraging academic partnerships and innovation.</li></ul>\n<h3 class=\"c-h3\">Economic</h3>\n<ul><li><strong>Tourism Development:</strong> Position the park as a premier destination for eco-tourism and avitourism, attracting national and international visitors.</li><li><strong>Job Creation:</strong> Generate employment opportunities in conservation, agriculture, tourism, and education sectors, supporting local economic growth.</li><li><strong>Value Addition:</strong> Enhance the economic value of agricultural products through sustainable practices and eco-certifications.</li></ul>\n<h3 class=\"c-h3\">Social</h3>\n<ul><li><strong>Community Empowerment:</strong> Empower local communities by involving them in the management and activities of the park, promoting social cohesion and a sense of ownership.</li><li><strong>Cultural Preservation:</strong> Integrate the rich cultural and historical heritage of the region into the park's narrative, preserving and celebrating local traditions and knowledge.</li><li><strong>Health and Well-being:</strong> Provide a serene and educational environment for visitors, contributing to mental and physical well-being through nature-based activities.</li></ul>","status":"published","cover":"","es":{"title":"Horizontes regenerativos","sub":"Cocreación de un parque de aves y agricultura en Colombia","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>El proyecto Parque de Aves y Agricultura Regenerativa se ubica en la Hacienda Piedechinche, en El Cerrito, Valle del Cauca. Este parque busca fusionar la conservación de la biodiversidad, en particular de las aves, con prácticas agrícolas regenerativas, creando un espacio para el aprendizaje y el turismo sostenibles. La iniciativa es una colaboración entre el Ingenio Providencia y Audubon Américas, con el objetivo de promover la sostenibilidad ambiental, la educación y la integración comunitaria.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El principal desafío del proyecto era armonizar la producción agrícola tradicional con la conservación de la biodiversidad, especialmente de las aves. El proyecto debía adaptar prácticas agrícolas regenerativas asegurando al mismo tiempo la protección y promoción de las especies de aves locales. Hubo dificultades específicas para conseguir financiación, garantizar la seguridad del público y crear experiencias atractivas para audiencias diversas. Además, integrar estas prácticas dentro del contexto cultural e histórico existente de la Hacienda añadió otra capa de complejidad.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Qué hicimos</h2>\n<ul><li>Realizamos visitas al sitio y talleres estratégicos.</li><li>Sostuvimos entrevistas con stakeholders clave, entre ellos líderes comunitarios, grupos ambientalistas y expertos en turismo.</li><li>Desarrollamos un taller de cocreación y pensamiento estratégico para comprender y proyectar la visión del parque.</li><li>Mapeamos el territorio para identificar oportunidades y desafíos.</li><li>Colaboramos con universidades y organizaciones locales para diseñar e implementar parcelas agrícolas regenerativas.</li><li>Integramos la infraestructura existente con nuevas intervenciones arquitectónicas sostenibles.</li><li>Desarrollamos experiencias interactivas e inmersivas para los visitantes.</li><li>Diseñamos estrategias digitales para mantener la conexión con audiencias diversas.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>El plan maestro</h2>\n<p>El plan maestro del proyecto Parque de Aves y Agricultura Regenerativa integró con éxito diversos componentes estratégicos y creó un marco integral que hace énfasis en la sostenibilidad ambiental, la educación y la participación comunitaria. Delineó el desarrollo de múltiples áreas temáticas, entre ellas espacios contemplativos, escenarios regenerativos, ambientaciones museográficas y entornos experimentales. El plan también incorporó la infraestructura existente, asegurando la conectividad ecológica y principios de diseño modulares y sistémicos. Entre los resultados clave están el establecimiento de experiencias inmersivas e interactivas para los visitantes, la creación de parcelas demostrativas de agricultura regenerativa y la construcción de espacios arquitectónicos innovadores como pasarelas elevadas, observatorios de aves y pabellones multipropósito. El plan busca que el parque sea un líder regional en conservación, investigación, educación y turismo de naturaleza, fomentando al mismo tiempo las prácticas sostenibles y la inclusión de la comunidad.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Impacto esperado</h2>\n<h3 class=\"c-h3\">Ambiental</h3>\n<ul><li><strong>Conservación de la biodiversidad:</strong> Proteger y mejorar los hábitats de especies de aves residentes y migratorias mediante prácticas agrícolas sostenibles.</li><li><strong>Restauración ecológica:</strong> Implementar agricultura regenerativa para restaurar ecosistemas, mejorar la salud del suelo y promover el equilibrio ecológico.</li><li><strong>Prácticas sostenibles:</strong> Demostrar la viabilidad de combinar la agricultura con la conservación, sirviendo como modelo para iniciativas similares.</li></ul>\n<h3 class=\"c-h3\">Educativo</h3>\n<ul><li><strong>Oportunidades de aprendizaje:</strong> Ofrecer programas educativos y experiencias interactivas para visitantes, colegios y universidades, promoviendo la conciencia sobre la biodiversidad y la agricultura sostenible.</li><li><strong>Participación de la comunidad:</strong> Fomentar una comprensión y valoración más profundas de los problemas ambientales locales y globales mediante talleres y actividades de ciencia participativa.</li><li><strong>Investigación e innovación:</strong> Crear un laboratorio vivo para la investigación en agricultura regenerativa y conservación de la biodiversidad, impulsando alianzas académicas e innovación.</li></ul>\n<h3 class=\"c-h3\">Económico</h3>\n<ul><li><strong>Desarrollo turístico:</strong> Posicionar el parque como un destino de primer nivel para el ecoturismo y el avistamiento de aves, atrayendo visitantes nacionales e internacionales.</li><li><strong>Generación de empleo:</strong> Generar oportunidades de empleo en los sectores de conservación, agricultura, turismo y educación, apoyando el crecimiento económico local.</li><li><strong>Valor agregado:</strong> Aumentar el valor económico de los productos agrícolas mediante prácticas sostenibles y ecocertificaciones.</li></ul>\n<h3 class=\"c-h3\">Social</h3>\n<ul><li><strong>Empoderamiento comunitario:</strong> Empoderar a las comunidades locales involucrándolas en la gestión y las actividades del parque, promoviendo la cohesión social y el sentido de apropiación.</li><li><strong>Preservación cultural:</strong> Integrar el rico patrimonio cultural e histórico de la región en la narrativa del parque, preservando y celebrando las tradiciones y saberes locales.</li><li><strong>Salud y bienestar:</strong> Ofrecer un entorno sereno y educativo para los visitantes, que contribuya al bienestar mental y físico mediante actividades basadas en la naturaleza.</li></ul>"}},{"id":"321248690f5542d7811cda5b03a0873c","slug":"compositions","title":"Compositions","sub":"adapting a museum exhibit to a digital experience","year":2021,"client":["Biblioteca Pública Piloto"],"industry":["Goverment / Public","Culture & Museums"],"type":["Interactives","Digital experience","Ux"],"role":["Project leader"],"country":[],"highlight":false,"link":"https://camarademaravillas.bibliotecapiloto.gov.co/artista-de-archivo/","texture":"dither","excerpt":"We developed a functional prototype using Elementor within WordPress and conducted a System Usability Scale (SUS) test with 17 participants. Insights from these sessions led to key interface refinements and…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>The Situation</h2>\n<p>Artista de Archivo was originally an interactive installation housed at the Museo Cámara de Maravillas, part of the Biblioteca Pública Piloto in Medellín. Designed to engage visitors with archival content through creative composition tools, the exhibit invited users to remix visual fragments from Colombia’s cultural memory. With the onset of the COVID-19 pandemic, the project faced a critical challenge: how to translate this hands-on museum experience into a meaningful and accessible digital interaction, at a time when cultural institutions were urgently seeking new strategies to stay connected with their audiences.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Task</h2>\n<p>I led the strategic and design adaptation of the experience, guiding its transition from a physical museum interface to an intuitive and engaging web platform. My responsibilities included experience mapping, UX/UI definition, usability validation, and the articulation of a communication strategy to ensure audience engagement in the digital space.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Process</h2>\n<p>The transformation process began with a co-creation workshop to identify what aspects of the original experience needed to be reinterpreted for digital environments. We established three pillars for adaptation: content simplification, interface redesign for responsive use, and usability optimization based on web heuristics. All graphic assets were reengineered for digital performance, and the user flow was redesigned as a step-by-step guided experience optimized for mobile.</p>\n<p>We developed a functional prototype using Elementor within WordPress and conducted a System Usability Scale (SUS) test with 17 participants. Insights from these sessions led to key interface refinements and accessibility improvements.</p>\n<h3 class=\"c-h3\">Usability testing and iteration</h3>\n<p>The final experience allowed users to create custom compositions—letters, book covers, ex libris stamps—while integrating playful animations and social sharing features. Alongside, we developed a communications roadmap with campaigns and digital events to promote public engagement and creative participation.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>The Result</h2>\n<p>Artista de Archivo’s digital relaunch successfully extended the museum’s reach during a time of physical closure, while preserving its interactive and educational essence. The project strengthened the institution’s digital presence and set a precedent for hybrid cultural experiences. For me, it was a clear demonstration of how design can mobilize memory, creativity, and civic participation—even in times of disruption.</p>","status":"published","cover":"","es":{"title":"Composiciones","sub":"adaptar una exhibición de museo a una experiencia digital","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>La situación</h2>\n<p>Artista de Archivo fue originalmente una instalación interactiva alojada en el Museo Cámara de Maravillas, parte de la Biblioteca Pública Piloto de Medellín. Diseñada para acercar a los visitantes a contenidos de archivo mediante herramientas de composición creativa, la exposición invitaba a los usuarios a remezclar fragmentos visuales de la memoria cultural de Colombia. Con la llegada de la pandemia de COVID-19, el proyecto enfrentó un desafío crítico: cómo traducir esta experiencia de museo, basada en el hacer, en una interacción digital significativa y accesible, en un momento en que las instituciones culturales buscaban con urgencia nuevas estrategias para seguir conectadas con sus audiencias.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>La tarea</h2>\n<p>Lideré la adaptación estratégica y de diseño de la experiencia, guiando su transición de una interfaz de museo físico a una plataforma web intuitiva y atractiva. Mis responsabilidades incluyeron el mapeo de la experiencia, la definición de UX/UI, la validación de usabilidad y la articulación de una estrategia de comunicación para asegurar la participación de la audiencia en el espacio digital.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El proceso</h2>\n<p>El proceso de transformación comenzó con un taller de cocreación para identificar qué aspectos de la experiencia original debían reinterpretarse para los entornos digitales. Establecimos tres pilares de adaptación: simplificación de los contenidos, rediseño de la interfaz para un uso responsivo y optimización de la usabilidad con base en heurísticas web. Todos los recursos gráficos se reconstruyeron para un buen desempeño digital, y el flujo del usuario se rediseñó como una experiencia guiada paso a paso, optimizada para móvil.</p>\n<p>Desarrollamos un prototipo funcional con Elementor dentro de WordPress y realizamos una prueba de Escala de Usabilidad del Sistema (SUS) con 17 participantes. Los insights de estas sesiones llevaron a refinamientos clave de la interfaz y a mejoras de accesibilidad.</p>\n<h3 class=\"c-h3\">Pruebas de usabilidad e iteración</h3>\n<p>La experiencia final permitía a los usuarios crear composiciones personalizadas —cartas, portadas de libros, sellos ex libris— e integraba animaciones lúdicas y funciones para compartir en redes sociales. Paralelamente, desarrollamos una hoja de ruta de comunicaciones con campañas y eventos digitales para promover la participación del público y la participación creativa.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>El resultado</h2>\n<p>El relanzamiento digital de Artista de Archivo amplió con éxito el alcance del museo durante un periodo de cierre físico, preservando al mismo tiempo su esencia interactiva y educativa. El proyecto fortaleció la presencia digital de la institución y sentó un precedente para las experiencias culturales híbridas. Para mí, fue una clara demostración de cómo el diseño puede movilizar la memoria, la creatividad y la participación ciudadana, incluso en tiempos de disrupción.</p>"}},{"id":"39355730b4e741108e17f9ec416bf5a0","slug":"eureka-science-center","title":"EUREKA Science Center","sub":"Bridging Borders through Knowledge, Culture, and Innovation","year":2021,"client":["Alcaldía de Cúcuta"],"industry":["Third Sector / NGOs"],"type":["Strategy","Master Planning"],"role":["Project leader"],"country":["Colombia"],"highlight":false,"link":"","texture":"particles","excerpt":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>EUREKA Science Center is a proposed project aiming to establish a hub for culture, science, technology, and innovation in Cúcuta, Colombia, and the colombo-venezuelan border region. The project seeks to enhance scientific literacy, cultural enrichment, and community development, thereby transforming the local socio-economic landscape.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The primary challenge was to design a master plan that address
