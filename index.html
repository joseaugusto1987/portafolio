:root{
  /* Core palette */
  --hn-yellow:#FDEE3D;--hn-deep-space:#222222;--hn-cosmic-mist:#F4F4EE;--hn-nebula-gray:#D7D7D7;--hn-white:#FFFFFF;
  --hn-yellow-60:rgba(253,238,61,.6);--hn-yellow-20:rgba(253,238,61,.2);--hn-ink-60:rgba(34,34,34,.6);--hn-ink-12:rgba(34,34,34,.12);
  --hn-yellow-deep:#E8D400; /* only for yellow-on-yellow line work (moiré, interference) */

  /* States */
  --bg-energy:var(--hn-yellow);--fg-on-energy:var(--hn-deep-space);
  --bg-matter:var(--hn-deep-space);--fg-on-matter:var(--hn-cosmic-mist);
  --bg-space:var(--hn-cosmic-mist);--fg-on-space:var(--hn-deep-space);

  /* Semantic */
  --fg-1:var(--hn-deep-space);--fg-2:var(--hn-ink-60);--fg-inverse:var(--hn-cosmic-mist);
  --bg-1:var(--hn-cosmic-mist);--bg-2:var(--hn-nebula-gray);--bg-inverse:var(--hn-deep-space);
  --accent:var(--hn-yellow);--line:var(--hn-deep-space);--line-soft:var(--hn-nebula-gray);
  --grad-density:linear-gradient(90deg,#222 0%,#FDEE3D 55%,#D7D7D7 100%);

  /* Type */
  --font-display:"Space Grotesk",system-ui,sans-serif;--font-body:"Inter",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --fs-mega:clamp(96px,16vw,280px);--fs-h1:96px;--fs-h2:64px;--fs-h3:40px;--fs-h4:24px;--fs-body-lg:20px;--fs-body:16px;--fs-small:14px;--fs-meta:11px;
  --lh-tight:.92;--lh-head:1;--lh-body:1.5;
  --tracking-display:-.03em;--tracking-meta:.14em;
  --fw-regular:400;--fw-medium:500;--fw-semibold:600;--fw-bold:700;

  /* Space & grid */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;--sp-8:64px;--sp-9:96px;--sp-10:160px;
  --margin-page:48px;--cols-h:12;--cols-v:6;--gutter:24px;
  --radius-none:0;--radius-pill:999px;--radius-circle:50%;
  --border-hair:1px solid var(--line);--border-bold:2px solid var(--line);

  /* Motion */
  --ease-field:cubic-bezier(.22,.8,.26,1);--dur-fast:160ms;--dur-base:320ms;--dur-slow:900ms;--dur-pulse:4800ms;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg-1);color:var(--fg-1);font:var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:underline;text-underline-offset:3px}
a:hover{background:var(--hn-yellow);color:var(--hn-deep-space);text-decoration:none}
::selection{background:var(--hn-yellow);color:var(--hn-deep-space)}
img{max-width:100%;display:block}

/* Type classes */
.t-mega{font:var(--fw-bold) var(--fs-mega)/var(--lh-tight) var(--font-display);letter-spacing:var(--tracking-display);text-transform:uppercase}
.t-h1{font:var(--fw-bold) var(--fs-h1)/var(--lh-head) var(--font-display);letter-spacing:var(--tracking-display)}
.t-h2{font:var(--fw-bold) var(--fs-h2)/var(--lh-head) var(--font-display);letter-spacing:-.025em}
.t-h3{font:var(--fw-semibold) var(--fs-h3)/1.05 var(--font-display);letter-spacing:-.02em}
.t-h4{font:var(--fw-medium) var(--fs-h4)/1.15 var(--font-display)}
.t-body{font:var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font-body)}
.t-lead{font:var(--fw-regular) var(--fs-body-lg)/1.45 var(--font-body)}
.t-meta{font:var(--fw-regular) var(--fs-meta)/1.4 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase}
.t-data{font:var(--fw-regular) 14px/1.7 var(--font-mono)}

/* States */
.s-energy{background:var(--bg-energy);color:var(--fg-on-energy)}
.s-matter{background:var(--bg-matter);color:var(--fg-on-matter)}
.s-space{background:var(--bg-space);color:var(--fg-on-space)}
.s-matter .hl,.hl-y{color:var(--hn-yellow)}
.mark{background:var(--hn-yellow);color:var(--hn-deep-space);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* Grid */
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gutter)}
.rule{border-top:var(--border-bold)}
.rule-hair{border-top:var(--border-hair)}

/* Components (vanilla mirrors of the React kit) */
.hn-btn{font:500 14px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:14px 24px;border:2px solid var(--hn-deep-space);border-radius:0;background:var(--hn-deep-space);color:var(--hn-cosmic-mist);display:inline-flex;gap:12px;align-items:center;cursor:pointer;text-decoration:none;transition:all var(--dur-fast) var(--ease-field)}
.hn-btn::after{content:"+"}
.hn-btn:hover{background:var(--hn-yellow);color:var(--hn-deep-space);transform:translate(3px,-3px)}
.hn-btn.accent{background:var(--hn-yellow);color:var(--hn-deep-space)}
.hn-btn.accent:hover{background:var(--hn-deep-space);color:var(--hn-yellow)}
.hn-btn.outline{background:transparent;color:inherit;border-color:currentColor}
.hn-btn.outline:hover{background:var(--hn-deep-space);color:var(--hn-cosmic-mist)}
.s-matter .hn-btn{border-color:var(--hn-cosmic-mist)}
.hn-btn.sm{padding:8px 14px;font-size:12px}.hn-btn.lg{padding:20px 36px;font-size:18px}
.hn-btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}

.hn-tag{justify-self:start;align-self:start;width:max-content;font:400 11px/1 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:6px 10px;display:inline-flex;gap:8px;border:1px solid currentColor;background:transparent;color:inherit}
.hn-tag b{font-weight:500}
.hn-tag.yellow{background:var(--hn-yellow);color:var(--hn-deep-space);border-color:var(--hn-deep-space)}
.hn-tag.ink{background:var(--hn-deep-space);color:var(--hn-cosmic-mist);border-color:var(--hn-deep-space)}

.hn-input{display:grid;gap:8px}
.hn-input span{font:400 11px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase}
.hn-input input,.hn-input textarea{font:400 18px var(--font-body);color:inherit;background:transparent;border:0;border-bottom:2px solid currentColor;border-radius:0;padding:10px 0;outline:none}
.hn-input input:focus,.hn-input textarea:focus{border-bottom-color:var(--hn-yellow)}

.hn-label{font:400 11px/1.4 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase}
.hn-index{font:500 11px/1 var(--font-mono);letter-spacing:var(--tracking-meta)}

/* Fixed-size frames (social posts, slides, posters) — build.py screenshots each .hn-frame */
.hn-frame{position:relative;overflow:hidden}
.hn-stage{display:flex;flex-direction:column;gap:40px;align-items:center;padding:40px;background:#9a9a94}
@media (max-width:760px){.hn-stage{padding:16px}}

@keyframes hn-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes hn-orbit{to{transform:rotate(360deg)}}
@keyframes hn-spin{to{transform:rotate(360deg)}}
@keyframes hn-star{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.82) rotate(45deg)}}
@keyframes hn-ring{0%{r:4;opacity:1}100%{r:46;opacity:0}}
@keyframes hn-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<style>
:root{--wrap:1240px}

body{overflow-x:hidden}
a{text-decoration:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--margin-page)}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:16px;z-index:99;background:var(--hn-yellow);padding:8px 12px}
:focus-visible{outline:2px solid var(--hn-deep-space);outline-offset:3px}
.s-matter :focus-visible{outline-color:var(--hn-yellow)}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:40;border-bottom:2px solid var(--hn-deep-space)}
.hdr-in{display:flex;justify-content:space-between;align-items:center;gap:24px;height:72px}
.brand{display:flex;align-items:center;gap:16px;color:inherit}
.brand:hover{background:none}
.brand img{height:26px;width:auto}
.brand .t-meta{padding-left:16px;border-left:1px solid var(--hn-deep-space)}
.nav{display:flex;gap:4px}
.nav a{font:500 12px/1 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:10px 12px;color:inherit;transition:background var(--dur-fast) var(--ease-field),color var(--dur-fast) var(--ease-field)}
.nav a:hover{background:var(--hn-deep-space);color:var(--hn-yellow)}
.nav a.on{background:var(--hn-deep-space);color:var(--hn-yellow)}
.nav a .n{opacity:.55;margin-right:6px}
.menu{display:none;font:500 12px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;background:var(--hn-deep-space);color:var(--hn-yellow);border:0;padding:10px 14px;cursor:pointer}

/* ---------- sections ---------- */
.sec{padding:96px 0;border-top:var(--border-bold);display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:var(--gutter)}
.sec:first-child{border-top:0}
.sec-label{position:sticky;top:104px;align-self:start}
.sec h2,.h2{margin:0 0 32px;font:700 clamp(36px,4.6vw,56px)/.98 var(--font-display);letter-spacing:-.03em;text-transform:uppercase}
.s-matter .sec{border-top-color:var(--hn-cosmic-mist)}
.lead-max{max-width:640px}

/* ---------- hero (home) ---------- */
.hero{position:relative;padding:112px 0 128px;overflow:visible}
.hero-text{position:relative;z-index:2;width:60%}
.hero-mega{font:700 clamp(54px,7.4vw,118px)/.9 var(--font-display);letter-spacing:-.045em;text-transform:uppercase;margin:28px 0 32px}
.hero .t-lead{max-width:560px;margin:0;font-size:22px}
.btns{display:flex;gap:16px;flex-wrap:wrap;margin-top:40px}
.hero-field{position:absolute;right:0;top:64px;width:34%;height:calc(100% + 110px);z-index:1}
.hero-field::after{content:"FIELD 01 · PARTICLES · DENSITY 0.82";position:absolute;left:16px;bottom:14px;font:400 11px var(--font-mono);letter-spacing:var(--tracking-meta);color:var(--hn-cosmic-mist);opacity:.75}

/* ---------- signal strip ---------- */
.signal{padding:40px 0;position:relative;z-index:0}
.signal-in{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gutter);font:400 13px/1.8 var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.signal-in>div:nth-child(1){grid-column:1 / span 3}
.signal-in>div:nth-child(2){grid-column:4 / span 5;display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font:700 40px/1 var(--font-display);letter-spacing:-.03em;color:var(--hn-yellow)}
.stat span{opacity:.75}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-soft);border-left:1px solid var(--line-soft)}
.card{display:flex;flex-direction:column;gap:14px;padding:20px 20px 28px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);color:inherit;transition:background var(--dur-base) var(--ease-field)}
.card:hover{background:var(--hn-yellow)}
.card .viz{position:relative;aspect-ratio:4/3;background:var(--hn-deep-space);overflow:hidden}
.card .viz canvas{width:100%;height:100%;display:block}
.card .viz .num{position:absolute;left:12px;top:10px;font:500 11px var(--font-mono);letter-spacing:var(--tracking-meta);color:var(--hn-cosmic-mist)}
.card .viz .tex{position:absolute;right:12px;bottom:10px;font:400 10px var(--font-mono);letter-spacing:var(--tracking-meta);color:var(--hn-cosmic-mist);opacity:.6;text-transform:uppercase}
.card h3{margin:4px 0 0;font:700 21px/1.08 var(--font-display);letter-spacing:-.02em;text-transform:uppercase}
.card p{margin:0;font:400 14px/1.5 var(--font-body);color:var(--fg-2)}
.card:hover p{color:var(--hn-deep-space)}
.card .meta{margin-top:auto;padding-top:8px}

/* ---------- stats / clients ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:var(--border-bold);margin-top:48px}
.stats div{padding:24px 16px 0 0}
.stats b{display:block;font:700 clamp(44px,5.6vw,80px)/1 var(--font-display);letter-spacing:-.04em}
.clients{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-soft)}
.clients span{font:400 13px/1.4 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:14px 12px 14px 0;border-bottom:1px solid var(--line-soft)}
.clients span b{font-weight:500;margin-right:10px;opacity:.5}

/* ---------- principles ---------- */
.princ{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid currentColor;border-left:1px solid currentColor}
.princ article{padding:28px 24px 36px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;display:grid;gap:16px;align-content:start;transition:background var(--dur-base) var(--ease-field),color var(--dur-base) var(--ease-field)}
.princ svg{width:72px;height:72px}
.princ h3{margin:0;font:700 22px/1.05 var(--font-display);letter-spacing:-.02em;text-transform:uppercase}
.princ p{margin:0;font:400 15px/1.55 var(--font-body)}
.s-matter .princ{border-color:rgba(244,244,238,.35)}
.s-matter .princ article{border-color:rgba(244,244,238,.35)}
.s-matter .princ article:hover{background:var(--hn-yellow);color:var(--hn-deep-space)}
.s-space .princ{border-color:var(--line-soft)}.s-space .princ article{border-color:var(--line-soft)}
.s-space .princ article:hover{background:var(--hn-yellow)}

/* ---------- CTA ---------- */
.cta{padding:120px 0 128px;position:relative;overflow:hidden}
.cta h2{font:700 clamp(48px,8vw,128px)/.9 var(--font-display);letter-spacing:-.045em;text-transform:uppercase;margin:24px 0 40px;max-width:11ch}
.cta .sym{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:min(44vw,520px);height:min(44vw,520px);color:var(--hn-deep-space)}

/* ---------- page heads ---------- */
.phead{padding:88px 0 72px}
.phead h1{font:700 clamp(56px,11vw,176px)/.88 var(--font-display);letter-spacing:-.05em;text-transform:uppercase;margin:24px 0 28px}
.phead .t-lead{max-width:640px;margin:0}
.phead.s-energy{position:relative;overflow:hidden}
.phead .corner{position:absolute;right:0;top:0;bottom:0;width:34%}

/* ---------- work controls ---------- */
.ctrl{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-start;padding:24px 0;border-top:var(--border-bold);border-bottom:1px solid var(--line-soft);margin-bottom:32px}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.chip{font:400 11px/1 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:8px 10px;border:1px solid var(--hn-deep-space);background:transparent;color:inherit;cursor:pointer;display:inline-flex;gap:8px;transition:background var(--dur-fast) var(--ease-field)}
.chip b{font-weight:500;opacity:.5}
.chip:hover{background:var(--hn-nebula-gray)}
.chip.on{background:var(--hn-yellow)}
.chip.on b{opacity:1}
.seg{display:inline-flex;border:1px solid var(--hn-deep-space)}
.seg button{font:500 11px/1 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:9px 12px;border:0;background:transparent;color:inherit;cursor:pointer}
.seg button.on{background:var(--hn-deep-space);color:var(--hn-yellow)}
.ctrl-l{display:grid;gap:14px;flex:1;min-width:280px}
.ctrl-r{display:flex;gap:12px;align-items:center}
.count{font:400 11px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase}

/* index list */
.idx-list{border-top:var(--border-bold)}
.row{display:grid;grid-template-columns:64px minmax(0,6fr) minmax(0,3fr) minmax(0,3fr);gap:var(--gutter);padding:20px 8px;border-bottom:1px solid var(--line-soft);color:inherit;align-items:baseline;transition:background var(--dur-fast) var(--ease-field)}
.row:hover{background:var(--hn-yellow)}
.row .y{font:500 13px var(--font-mono)}
.row h3{margin:0;font:700 20px/1.1 var(--font-display);letter-spacing:-.015em;text-transform:uppercase}
.row small{display:block;margin-top:6px;font:400 14px/1.4 var(--font-body);color:var(--fg-2)}
.row .c{font:400 12px/1.5 var(--font-mono);letter-spacing:.06em;text-transform:uppercase}

/* ---------- case ---------- */
.case-head{padding-top:56px;padding-bottom:64px}
.back{display:inline-flex;gap:10px;color:inherit}
.back:hover{background:var(--hn-yellow)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:40px 0 24px}
.case-title{font:700 clamp(38px,5.6vw,84px)/.95 var(--font-display);letter-spacing:-.035em;text-transform:uppercase;margin:0;max-width:18ch}
.case-head .t-lead{max-width:720px;margin:24px 0 0;font-size:22px}
.band{position:relative;height:380px}
.band canvas{position:absolute;inset:0}
.band-box{position:absolute;left:var(--margin-page);bottom:-56px;padding:20px 28px 24px;display:grid;gap:4px;z-index:2;min-width:220px}
.band-box b{font:700 120px/.85 var(--font-display);letter-spacing:-.05em}
.case-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:var(--gutter);padding-top:120px;padding-bottom:96px}
.case-meta{position:sticky;top:104px;align-self:start;display:grid;gap:0;border-top:var(--border-bold)}
.case-meta div{padding:14px 0;border-bottom:1px solid var(--line-soft)}
.case-meta dt{font:400 11px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;opacity:.6;margin-bottom:6px}
.case-meta dd{margin:0;font:500 15px/1.4 var(--font-body)}
.case-meta .hn-btn{margin-top:20px;justify-content:center}
.prose{max-width:720px;font:400 18px/1.68 var(--font-body)}
.prose p{margin:0 0 1.15em}
.prose strong{font-weight:600}
.prose a{text-decoration:underline;text-underline-offset:3px}
.prose .c-h2{display:grid;gap:10px;margin:64px 0 20px;padding-top:24px;border-top:var(--border-bold);font:700 30px/1.02 var(--font-display);letter-spacing:-.025em;text-transform:uppercase}
.prose .c-h2:first-child{margin-top:0}
.prose .c-h2 .idx{font:500 11px var(--font-mono);letter-spacing:var(--tracking-meta)}
.prose .c-h3{margin:36px 0 12px;font:700 20px/1.15 var(--font-display);text-transform:uppercase;letter-spacing:-.01em}
.prose ul,.prose ol{margin:0 0 1.3em;padding:0;list-style:none;counter-reset:li}
.prose li{position:relative;padding:12px 0 12px 44px;border-top:1px solid var(--line-soft)}
.prose li:last-child{border-bottom:1px solid var(--line-soft)}
.prose ul li::before{content:"";position:absolute;left:8px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--hn-deep-space)}
.prose ol li{counter-increment:li}
.prose ol li::before{content:counter(li,decimal-leading-zero);position:absolute;left:0;top:15px;font:500 12px var(--font-mono);letter-spacing:.1em}
.prose .c-quote{margin:40px 0;padding:28px 32px;background:var(--hn-deep-space);color:var(--hn-cosmic-mist);font:600 clamp(22px,2.4vw,28px)/1.25 var(--font-display);letter-spacing:-.015em}
.prose .c-quote:first-child{margin-top:0}
.prose figure{margin:32px 0}
.prose .c-img img{width:100%;height:auto;border:1px solid var(--line-soft)}
.prose .c-video{position:relative;aspect-ratio:16/9;background:var(--hn-deep-space)}
.prose .c-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.next{display:block;padding:56px 0 64px;color:inherit;transition:background var(--dur-base) var(--ease-field),color var(--dur-base) var(--ease-field)}
.next .nx{display:grid;grid-template-columns:1fr auto;align-items:end;gap:16px 40px}
.next:hover{background:var(--hn-deep-space);color:var(--hn-yellow)}
.next .t{font:700 clamp(30px,4.4vw,64px)/.95 var(--font-display);letter-spacing:-.035em;text-transform:uppercase;max-width:20ch}
.next .arr{font:700 clamp(48px,6vw,96px)/1 var(--font-display)}

/* ---------- about ---------- */
.quote-band{padding:96px 0}
.quote-band p{font:700 clamp(30px,4vw,56px)/1.02 var(--font-display);letter-spacing:-.03em;text-transform:uppercase;margin:24px 0 0;max-width:22ch}
.quote-band .rest{font:400 19px/1.55 var(--font-body);text-transform:none;letter-spacing:0;max-width:640px;margin-top:28px;opacity:.85}
.exp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}
.exp h3{margin:0 0 12px;font:700 22px/1.1 var(--font-display);text-transform:uppercase}
.exp p{margin:0;font:400 16px/1.6 var(--font-body)}
.lines{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-soft)}
.lines li{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft);font:400 16px/1.5 var(--font-body)}
.lines li b{font:500 12px/1.9 var(--font-mono);letter-spacing:.1em}
.lines a{text-decoration:underline;text-underline-offset:3px}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- footer ---------- */
.ftr{padding:72px 0 40px;border-top:1px solid rgba(244,244,238,.18)}
.ftr-in{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--gutter);align-items:end}
.ftr .t-h3{font-size:clamp(36px,4.4vw,56px);line-height:.95;text-transform:uppercase;font-weight:700;letter-spacing:-.03em}
.ftr nav{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.ftr nav a{font:500 12px/1 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:10px 12px;color:inherit}
.ftr nav a:hover{background:var(--hn-yellow);color:var(--hn-deep-space)}
.ftr-sig{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-top:56px;padding-top:24px;border-top:1px solid rgba(244,244,238,.25)}
.ftr-sig img{height:56px;width:auto;animation:hn-breathe 5s var(--ease-field) infinite}

/* route transition */
#app{animation:enter .5s var(--ease-field)}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .cards,.princ{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-text{width:100%}
  .hero{padding:72px 0 0}
  .hero-field{position:relative;top:auto;right:auto;width:100%;height:280px;margin-top:56px}
  .clients{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:800px){
  :root{--margin-page:16px}
  .sec{grid-template-columns:1fr;padding:64px 0;gap:16px}
  .sec-label{position:static}
  .cards,.princ,.exp{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .signal-in>div{grid-column:1/-1!important;justify-content:flex-start!important}
  .brand .t-meta{display:none}
  .menu{display:block}
  .nav{display:none;position:absolute;left:0;right:0;top:72px;flex-direction:column;padding:8px 16px 16px;background:var(--hn-yellow);border-bottom:2px solid var(--hn-deep-space)}
  .nav.open{display:flex}
  .nav a{padding:16px 8px;font-size:14px;border-bottom:1px solid rgba(34,34,34,.2)}
  .row{grid-template-columns:52px 1fr;gap:12px}
  .row .c{grid-column:2}
  .case-grid{grid-template-columns:1fr;padding-top:96px;padding-bottom:64px;gap:40px}
  .case-meta{position:static}
  .band{height:240px}
  .band-box b{font-size:84px}
  .prose{font-size:17px}
  .ftr-in{grid-template-columns:1fr}
  .ftr nav{justify-content:flex-start}
  .cta .sym{opacity:.25;right:-120px}
  .phead .corner{display:none}
}
@media print{.hdr,.ctrl,.next,.ftr nav{display:none}}

/* ===== HIPERNOVA i18n (EN / ES) — inlined into the site script before the data bindings =====
   · Content   : d.es (site texts) and project.es {title, sub, excerpt, html}; empty → falls back to English.

   · setData() builds the localized view; the DOM pass translates fixed UI text after every render. */

<script>
/* =====================================================================
   HIPERNOVA — data layer + hidden admin (CMS)
   · Public site reads  : GET  API_URL?action=read            (Google Apps Script → Google Sheet)
   · Admin writes       : POST API_URL {action:'save', token}  (password checked server-side)
   · No API_URL         : DEMO mode — data lives in this browser's localStorage
   Uses globals from the site script: DATA, setData(), route(), esc(), pad(), $
   ===================================================================== */
(function(){
"use strict";
const CFG = Object.assign({API_URL: "", DEMO_PASSWORD: "hipernova", CLICKS: 5}, window.HN_CONFIG || {});
const DEMO = !CFG.API_URL;
const store = (s) => ({
  get(k){ try { return s.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { s.setItem(k, v); } catch(e){} },
  del(k){ try { s.removeItem(k); } catch(e){} }
});
const LS = store(window.localStorage), SS = store(window.sessionStorage);
const clone = o => JSON.parse(JSON.stringify(o));
/* an old bug could leave the literal text "undefined" in empty Spanish cells: treat it as empty */
function scrub(o){
  if (typeof o === "string") return o === "undefined" ? "" : o;
  if (Array.isArray(o)){ const a = o.map(scrub); return a.length && a.every(x => x === "") && o.every(x => typeof x === "string") ? [] : a; }
  if (o && typeof o === "object"){ for (const k of Object.keys(o)) o[k] = scrub(o[k]); }
  return o;
}
const TEXTURES = ["halftone","flow","topo","dither","moire","grain","particles"];
const SYMBOLS = ["nucleo","expansion","orbita","campo","transicion","halftone","onda","topografia","particulas","superposicion","vector"];
const LISTS = ["client","industry","type","role","country"];
const q = (s, r = document) => r.querySelector(s);
const qa = (s, r = document) => [...r.querySelectorAll(s)];
const ea = s => String(s ?? "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const et = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const API_REQUIRED = "2026-10-19.1";   // Code.gs VERSION this site expects
const ADM = {apiWarn:"", lang:"en", open:false, tab:"cases", editing:null, data:null, dirty:false, token:SS.get("hn_tok") || null, busy:false};

/* ---------------------------------------------------------------- API */
async function api(payload){
  const r = await fetch(CFG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
  if (!r.ok) throw new Error("Server error " + r.status);
  return r.json();
}
function normalize(d){
  d.projects = (d.projects || []).map(p => {
    LISTS.forEach(k => p[k] = Array.isArray(p[k]) ? p[k] : []);
    p.industry = p.industry.map(x => x.replace(/^Goverment/, "Government"));
    p.status = p.status === "draft" ? "draft" : "published";
    p.highlight = !!p.highlight; p.link = p.link || "";
    p.sub = p.sub || ""; p.excerpt = p.excerpt || ""; p.html = p.html || "";
    p.texture = TEXTURES.includes(p.texture) ? p.texture : "halftone"; p.cover = p.cover || "";
    return p;
  });
  d.es = d.es || {}; d.es.config = d.es.config || {}; d.es.pages = d.es.pages || {};
  ["home","approach","about","thinking"].forEach(k => d.es.pages[k] = d.es.pages[k] || {});
  d.projects.forEach(p => p.es = p.es || {});
  d.i18n = d.i18n || {}; d.i18n.es = d.i18n.es || {};
  d.config = d.config || {}; d.config.clients = d.config.clients || []; d.pages = d.pages || {};
  ["home","approach","about","thinking"].forEach(k => d.pages[k] = d.pages[k] || {});
  d.pages.home.phrases = d.pages.home.phrases || []; d.pages.home.hero = d.pages.home.hero || "";
  const A = d.pages.approach, B = d.pages.about, T = d.pages.thinking;
  A.principles = A.principles || []; B.experience = B.experience || [];
  ["education","certifications","disciplines"].forEach(k => B[k] = B[k] || []);
  T.publications = T.publications || []; d.config.disciplines = d.config.disciplines || [];
  return d;
}
async function login(pw){
  if (DEMO){ if (pw !== CFG.DEMO_PASSWORD) throw new Error("Wrong password"); ADM.token = "demo"; }
  else { const r = await api({action:"login", password:pw}); if (!r.ok) throw new Error(r.error || "Wrong password"); ADM.token = r.token; }
  SS.set("hn_tok", ADM.token);
}
async function loadAdminData(){
  if (DEMO){ const s = LS.get("hn_demo_data"); return normalize(s ? JSON.parse(s) : await (await fetch("database/seed.json?_=" + Date.now())).json()); }
  const r = await api({action:"readAdmin", token:ADM.token});
  if (r.error){ const e = new Error(r.error); e.auth = r.error === "unauthorized"; throw e; }
  return normalize(scrub(r.data));
}
const stamp = () => { const d = new Date(); return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear(); };
const strip = (k, v) => k[0] === "_" ? undefined : v;

/* public data (what visitors see) — always from the Sheet; demo mode reads database/seed.json */
async function fetchPublic(){
  if (DEMO){ const s = LS.get("hn_demo_data"); if (s) return JSON.parse(s); return (await fetch("database/seed.json?_=" + Date.now())).json(); }
  const r = await fetch(CFG.API_URL + (CFG.API_URL.includes("?") ? "&" : "?") + "action=read&_=" + Date.now());
  const d = await r.json(); if (!d || d.error || !d.projects) throw new Error((d && d.error) || "bad response");
  scrub(d); LS.set("hn_cache", JSON.stringify(d)); return d;
}
async function loadPublic(){
  try {
    const d = await fetchPublic(); d.projects.forEach(p => p.status = p.status || "published");
    if (window.ADMIN_ON) return;
    if (!window.HN_READY || JSON.stringify(d) !== JSON.stringify(DATA)){ window.HN_READY = true; setData(d); route(); }
  } catch(e){
    console.warn("[HN] could not load the content:", e);
    if (!window.HN_READY){
      q("#app").innerHTML = `<section class="phead s-energy"><div class="wrap"><span class="t-meta" data-nt>Connection</span><h1>Content unavailable.</h1><p class="t-lead">The portfolio couldn't load its content. Check your connection and try again.</p><div class="btns"><button class="hn-btn" id="hn-retry">Retry</button></div></div></section>`;
      q("#hn-retry").onclick = () => { q("#app").innerHTML = loadingView(); loadPublic(); };
    }
  }
}

/* ---------------------------------------------------------------- helpers */
function toast(msg, bad){
  qa(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast" + (bad ? " err" : ""); t.textContent = msg; document.body.append(t);
  setTimeout(() => t.remove(), bad ? 6000 : 2600);
}
const slugify = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80) || "case";
function uniqueSlug(base, except){
  let s = slugify(base), n = 2; const taken = x => ADM.data.projects.some(p => p !== except && p.slug === x);
  const root = s; while (taken(s)) s = root + "-" + n++;
  return s;
}
const getPath = (o, path) => path.split(".").reduce((a, k) => a == null ? a : a[k], o);
function setPath(o, path, v){
  const ks = path.split("."), last = ks.pop(); let t = o;
  ks.forEach((k, i) => { const nxt = (ks[i + 1] !== undefined ? ks[i + 1] : last); if (t[k] == null) t[k] = /^\d+$/.test(nxt) ? [] : {}; t = t[k]; });
  t[last] = v;
}
function markDirty(on = true){
  ADM.dirty = on;
  const s = q("#adm-status"); if (s){ s.textContent = on ? "● Unsaved changes" : "All changes saved"; s.classList.toggle("dirty", on); }
  q("#adm-pill").classList.toggle("dirty", on);
}
function syncSite(){ setData(ADM.data); }

/* generic modal: fields → values (or null when cancelled). onSubmit may throw to show an inline error. */
function ask({title, note, fields, ok = "OK", onSubmit}){
  return new Promise(resolve => {
    const bg = document.createElement("div"); bg.className = "mdl-bg";
    bg.innerHTML = `<form class="mdl" autocomplete="off"><h3>${et(title)}</h3>${note ? `<p class="mdl-note">${note}</p>` : ""}
      ${fields.map(f => `<div class="fld"><label>${et(f.label)}</label><input name="${f.name}" type="${f.type || "text"}" value="${ea(f.value || "")}" placeholder="${ea(f.placeholder || "")}"></div>`).join("")}
      <div class="err"></div><div class="btns"><button class="hn-btn sm accent" type="submit">${et(ok)}</button><button class="hn-btn sm outline" type="button" data-x>Cancel</button></div></form>`;
    document.body.append(bg);
    const form = q("form", bg), err = q(".err", bg);
    const close = v => { bg.remove(); document.removeEventListener("keydown", esc2, true); resolve(v); };
    const esc2 = e => { if (e.key === "Escape"){ e.stopPropagation(); close(null); } };
    document.addEventListener("keydown", esc2, true);
    q("[data-x]", bg).onclick = () => close(null);
    bg.addEventListener("mousedown", e => { if (e.target === bg) close(null); });
    form.onsubmit = async e => {
      e.preventDefault();
      const vals = Object.fromEntries(new FormData(form).entries());
      try { const res = onSubmit ? await onSubmit(vals) : vals; close(res === undefined ? vals : res); }
      catch(x){ err.textContent = x.message || String(x); }
    };
    setTimeout(() => q("input", bg).focus(), 30);
  });
}

/* ---------------------------------------------------------------- URL helpers */
const driveId = u => { const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=|thumbnail\?(?:[^#]*&)?id=)([\w-]{15,})/) || u.match(/docs\.google\.com\/[^?#]*\/d\/([\w-]{15,})/); return m && m[1]; };
function imageUrl(u){
  u = u.trim(); const id = driveId(u);
  if (id) return `https://lh3.googleusercontent.com/d/${id}=w1600`;
  if (/drive\.google\.com\/drive\/(u\/\d+\/)?folders|drive\.google\.com\/(drive|folderview)/i.test(u)) throw new Error("That is a folder link. Open the image in Drive → Share → Copy link.");
  if (/(drive|docs)\.google\.com/i.test(u)) throw new Error("Couldn't find the file id in that link. Use Drive → Share → Copy link on the image itself.");
  if (!/^https?:\/\//i.test(u)) throw new Error("Paste a link that starts with https://");
  return u;
}
function videoUrl(u){
  u = u.trim(); let m;
  if ((m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/|youtube-nocookie\.com\/embed\/)([\w-]{6,})/))) return "https://www.youtube-nocookie.com/embed/" + m[1];
  if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return "https://player.vimeo.com/video/" + m[1];
  const id = driveId(u); if (id) return `https://drive.google.com/file/d/${id}/preview`;
  throw new Error("Use a YouTube, Vimeo or Google Drive video link");
}
const safeHref = h => { h = (h || "").trim(); return /^(https?:|mailto:|#)/i.test(h) ? h : (/^[\w.-]+\.[a-z]{2,}/i.test(h) ? "https://" + h : ""); };

/* ---------------------------------------------------------------- HTML sanitizer / serializer */
function inline(n){
  let o = "";
  n.childNodes.forEach(c => {
    if (c.nodeType === 3){ o += et(c.nodeValue.replace(/ /g, " ")); return; }
    if (c.nodeType !== 1) return;
    const t = c.tagName;
    if (t === "BR") o += "<br>";
    else if (t === "B" || t === "STRONG" || /font-weight:\s*(bold|[6-9]00)/.test(c.getAttribute("style") || "")) o += "<strong>" + inline(c) + "</strong>";
    else if (t === "I" || t === "EM" || /font-style:\s*italic/.test(c.getAttribute("style") || "")) o += "<em>" + inline(c) + "</em>";
    else if (t === "A"){ const h = safeHref(c.getAttribute("href")); o += h ? `<a href="${ea(h)}" target="_blank" rel="noopener">${inline(c)}</a>` : inline(c); }
    else if (c.classList.contains("fig-x") || t === "SCRIPT" || t === "STYLE" || t === "IMG" || t === "IFRAME") { /* skip */ }
    else o += inline(c);
  });
  return o;
}
const clean = s => s.replace(/(<br>)+$/, "").replace(/^(<br>)+/, "").trim();
function blocks(root, numbered, ctx = {n:0}){
  let out = "";
  root.childNodes.forEach(c => {
    if (c.nodeType === 3){ const t = c.nodeValue.trim(); if (t) out += `<p>${et(t)}</p>\n`; return; }
    if (c.nodeType !== 1) return;
    const t = c.tagName;
    if (t === "H1" || t === "H2"){ const x = clean(inline(c)); if (x){ ctx.n++; out += `<h2 class="c-h2">${numbered ? `<span class="idx">${pad(ctx.n)} —</span>` : ""}${x}</h2>\n`; } }
    else if (/^H[3-6]$/.test(t)){ const x = clean(inline(c)); if (x) out += `<h3 class="c-h3">${x}</h3>\n`; }
    else if (t === "BLOCKQUOTE"){ const x = clean(inline(c)); if (x) out += `<blockquote class="c-quote">${x}</blockquote>\n`; }
    else if (t === "UL" || t === "OL"){
      const lis = [...c.children].filter(li => li.tagName === "LI").map(li => clean(inline(li))).filter(Boolean);
      const tag = t.toLowerCase(); if (lis.length) out += `<${tag}>${lis.map(x => `<li>${x}</li>`).join("")}</${tag}>\n`;
    }
    else if (t === "FIGURE"){
      const img = q("img", c), ifr = q("iframe", c);
      if (img && img.getAttribute("src")) out += `<figure class="c-img"><img src="${ea(img.getAttribute("src"))}" alt="${ea(img.getAttribute("alt") || "")}" loading="lazy"></figure>\n`;
      else if (ifr && ifr.getAttribute("src")) out += `<figure class="c-video"><iframe src="${ea(ifr.getAttribute("src"))}" title="Video" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen></iframe></figure>\n`;
    }
    else if ((t === "P" || t === "DIV" || t === "SECTION" || t === "ARTICLE") && c.querySelector("p,h1,h2,h3,h4,ul,ol,blockquote,figure,div")) out += blocks(c, numbered, ctx);
    else if (t === "SCRIPT" || t === "STYLE" || t === "IMG" || t === "IFRAME") { /* skip */ }
    else { const x = clean(inline(c)); if (x) out += `<p>${x}</p>\n`; }
  });
  return out.trim();
}

/* ---------------------------------------------------------------- editor */
const ED = {el:null, range:null, project:null};
function figureEl(kind, src, alt){
  const f = document.createElement("figure"); f.className = kind; f.contentEditable = "false";
  f.innerHTML = kind === "c-img" ? `<img referrerpolicy="no-referrer" src="${ea(src)}" alt="${ea(alt || "")}">` : `<iframe src="${ea(src)}" title="Video" allowfullscreen></iframe>`;
  const x = document.createElement("button"); x.type = "button"; x.className = "fig-x"; x.textContent = "Remove"; x.contentEditable = "false"; f.append(x);
  const im = q("img", f); if (im) im.onerror = () => { if (!q(".fig-bad", f)) f.insertAdjacentHTML("beforeend", `<div class="fig-bad">Image could not load. If it's from Drive, share the file as “Anyone with the link”.</div>`); };
  return f;
}
function loadIntoEditor(html){
  const tmp = document.createElement("div"); tmp.innerHTML = html;
  qa(".idx", tmp).forEach(e => e.remove());
  qa("figure", tmp).forEach(f => {
    const im = q("img", f), fr = q("iframe", f);
    f.replaceWith(im ? figureEl("c-img", im.getAttribute("src"), im.getAttribute("alt")) : fr ? figureEl("c-video", fr.getAttribute("src")) : document.createComment(""));
  });
  ED.el.innerHTML = tmp.innerHTML;
  if (!ED.el.children.length) ED.el.innerHTML = "<p><br></p>";
  fixBlocks(); flagEmpty();
}
function fixBlocks(){
  [...ED.el.children].forEach(c => {
    const t = c.tagName, want = t === "H2" ? "c-h2" : t === "H3" ? "c-h3" : t === "BLOCKQUOTE" ? "c-quote" : null;
    if (t === "FIGURE") return;
    if (want){ if (c.className !== want) c.className = want; } else if (c.className) c.removeAttribute("class");
    if (c.hasAttribute("style")) c.removeAttribute("style");
  });
}
function flagEmpty(){
  const e = ED.el; e.classList.toggle("empty", e.children.length <= 1 && !e.textContent.trim() && !q("figure", e));
}
function edHTML(){
  const c = ED.el.cloneNode(true);
  return blocks(c, true);
}
let saveT;
function changed(){
  ED.touched = true; fixBlocks(); flagEmpty(); positionPlus();
  clearTimeout(saveT); saveT = setTimeout(commitBody, 250);
  markDirty();
}

function currentBlock(){
  const s = getSelection(); if (!s.rangeCount) return null;
  let n = s.anchorNode; if (!n || !ED.el.contains(n)) return null;

  return n && n.nodeType === 1 ? n : null;
}
function saveRange(){ const s = getSelection(); if (s.rangeCount && ED.el.contains(s.anchorNode)) ED.range = s.getRangeAt(0).cloneRange(); }
function restoreRange(){
  ED.el.focus();
  if (ED.range){ const s = getSelection(); s.removeAllRanges(); s.addRange(ED.range); }
}
function placeCaret(el){ const r = document.createRange(); r.selectNodeContents(el); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r); ED.range = r.cloneRange(); }
function setBlock(tag){
  ED.el.focus(); const b = currentBlock();
  if (b && tag !== "p" && b.tagName.toLowerCase() === tag) tag = "p";
  document.execCommand("formatBlock", false, tag); changed();
}
function insertFigure(fig){

  let nx = fig.nextElementSibling;
  if (!nx || nx.tagName !== "P"){ nx = document.createElement("p"); nx.innerHTML = "<br>"; fig.after(nx); }
  placeCaret(nx); changed();
}

function positionPlus(){
  const plus = q("#adm-plus"); if (!plus) return;
  const b = currentBlock(), s = getSelection();

    const r = b.getBoundingClientRect(), h = ED.el.getBoundingClientRect();
    plus.style.display = "block"; plus.style.top = (r.top - h.top + Math.max(0, (r.height - 28) / 2)) + "px";
  } else { plus.style.display = "none"; q("#adm-plusmenu").classList.remove("open"); }
}
function positionBubble(){
  const bub = q("#adm-bub"); if (!bub) return;
  const s = getSelection();
  if (!ED.el || !s.rangeCount || s.isCollapsed || !ED.el.contains(s.anchorNode) || !ED.el.contains(s.focusNode)) { bub.classList.remove("open"); return; }
  const r = s.getRangeAt(0).getBoundingClientRect(); if (!r.width && !r.height) { bub.classList.remove("open"); return; }
  bub.classList.add("open");
  const w = bub.offsetWidth; bub.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px"; bub.style.top = Math.max(8, r.top - 46) + "px";

function bindEditor(){
  const e = ED.el;
  document.execCommand("defaultParagraphSeparator", false, "p");
  e.addEventListener("input", changed);
  e.addEventListener("keyup", () => { saveRange(); positionPlus(); });
  e.addEventListener("mouseup", () => { saveRange(); });
  e.addEventListener("blur", commitBody);
  e.addEventListener("keydown", ev => {
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k"){ ev.preventDefault(); addLink(); return; }
    if (ev.key === " " && !ev.metaKey && !ev.ctrlKey){
      const b = currentBlock(), s = getSelection();
      if (b && b.tagName === "P" && s.isCollapsed){
        const t = b.textContent, map = {"##":"h2", "###":"h3", ">":"blockquote"};
        if (map[t]){ ev.preventDefault(); b.innerHTML = "<br>"; setBlock(map[t]); return; }
        if (t === "-" || t === "*"){ ev.preventDefault(); b.innerHTML = "<br>"; document.execCommand("insertUnorderedList"); changed(); return; }
        if (t === "1."){ ev.preventDefault(); b.innerHTML = "<br>"; document.execCommand("insertOrderedList"); changed(); return; }
      }
    }
  });
  e.addEventListener("paste", ev => {
    ev.preventDefault();
    const html = ev.clipboardData.getData("text/html"), txt = ev.clipboardData.getData("text/plain");
    let out;
    if (html){ const t = document.createElement("div"); t.innerHTML = html; out = blocks(t, false); }
    if (!out) out = txt.split(/\n+/).filter(Boolean).map(l => `<p>${et(l)}</p>`).join("");
    document.execCommand("insertHTML", false, out); changed();
  });
  e.addEventListener("click", ev => {
    const x = ev.target.closest(".fig-x"); if (x){ x.closest("figure").remove(); if (!e.children.length) e.innerHTML = "<p><br></p>"; changed(); return; }
    qa("figure.sel", e).forEach(f => f.classList.remove("sel"));
    const f = ev.target.closest("figure"); if (f) f.classList.add("sel");
  });
  e.addEventListener("keydown", ev => {
    if ((ev.key === "Backspace" || ev.key === "Delete")){

    }
  });
}

const isEmpty = v => v == null || v === "" || v === "undefined" || (Array.isArray(v) && v.length === 0);
function fillEmpty(parent, key, src){
  const cur = parent[key];
  if (isEmpty(cur)){ parent[key] = clone(src); return isEmpty(src) ? 0 : 1; }
  if (Array.isArray(src) && Array.isArray(cur) && src.length && Array.isArray(src[0])){
    let n = 0; src.forEach((row, i) => { if (!cur[i]){ cur[i] = clone(row); n++; return; } row.forEach((v, j) => { if (isEmpty(cur[i][j]) && !isEmpty(v)){ cur[i][j] = v; n++; } }); }); return n;
  }
  if (src && typeof src === "object" && !Array.isArray(src)){ let n = 0; for (const k in src) n += fillEmpty(cur, k, src[k]); return n; }
  return 0;
}
const hasSpanish = d => d.projects.some(p => p.es && (p.es.title || p.es.html)) && Object.keys((d.i18n && d.i18n.es) || {}).length > 0;
async function importSeed(){
  let seed; try { seed = await (await fetch("database/seed.json?_=" + Date.now())).json(); } catch(e){ return toast("Could not read database/seed.json", true); }
  const D = ADM.data; let n = 0;
  for (const p of D.projects){
    const s = seed.projects.find(x => x.slug === p.slug); if (!s || !s.es) continue;
    p.es = p.es || {}; ["title", "sub", "excerpt", "html"].forEach(k => { n += fillEmpty(p.es, k, s.es[k] || ""); });
  }
  n += fillEmpty(D, "es", seed.es || {});
  (seed.es_fixes || []).forEach(f => { const p = D.projects.find(x => x.slug === f.slug); if (p && p.es && p.es[f.field] === f.old){ p.es[f.field] = f.new; n++; } });
  D.i18n.es = D.i18n.es || {}; Object.keys((seed.i18n && seed.i18n.es) || {}).forEach(k => { if (!D.i18n.es[k]){ D.i18n.es[k] = seed.i18n.es[k]; n++; } });
  n += fillEmpty(D.pages.home, "hero", seed.pages.home.hero); n += fillEmpty(D.pages.home, "phrases", seed.pages.home.phrases);
  n += fillEmpty(D.config, "clients", seed.config.clients);
  if (!n) return toast("Nothing to import: the database already has this content");
  markDirty(); syncSite(); render(); toast(`Imported ${n} missing fields. Press “Save to Sheets” to store them.`);
}

/* HIPERNOVA — duotone + halftone for cover photos.
   <img class="duo"> already shows a smooth yellow/black duotone (CSS filter).
   This upgrades it to a canvas render with halftone dots when the image server allows pixel access (CORS);
   otherwise the smooth duotone simply stays.
   HN_CONFIG.COVER_STYLE: "mix" (smooth duotone + dot screen) | "halftone" (yellow paper + black dots) | "smooth" */
(function(){
"use strict";
/* Broken cover → try Drive's other image host once, then fall back to the generative texture. */
document.addEventListener("error", e => {
  const t = e.target; if (!t || t.tagName !== "IMG" || !t.classList.contains("duo") || !t.closest("#app")) return;
  const id = (t.src.match(/[?&]id=([\w-]{15,})/) || [])[1];
  if (id && !t.dataset.alt){ t.dataset.alt = "1"; t.src = `https://lh3.googleusercontent.com/d/${id}=w1600`; return; }
  const cv = document.createElement("canvas");
  if (t.dataset.k === "card"){ cv.className = "ht"; cv.dataset.m = MOTIF[t.dataset.t] || "dots"; cv.dataset.seed = t.dataset.s; t.replaceWith(cv); halftone(cv); }
  else { cv.dataset.hnTexture = t.dataset.t; cv.dataset.tone = "ink"; cv.dataset.seed = t.dataset.s; t.replaceWith(cv); window.HN && HN.refresh(); }
}, true);

const STYLE = (window.HN_CONFIG && HN_CONFIG.COVER_STYLE) || "mix";
if (STYLE === "smooth") return;
const done = new WeakSet(), cache = new Map();
const YEL = [253, 238, 61], INK = [34, 34, 34];

function load(src){
  if (!cache.has(src)) cache.set(src, new Promise((res, rej) => { const im = new Image(); im.crossOrigin = "anonymous"; im.referrerPolicy = "no-referrer"; im.onload = () => res(im); im.onerror = rej; im.src = src; }));
  return cache.get(src);
}
function paint(cv, im){
  const par = cv.parentElement, dpr = Math.min(2, devicePixelRatio || 1);
  const W = Math.round(par.clientWidth * dpr), H = Math.round(par.clientHeight * dpr); if (!W || !H) return;
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d", {willReadFrequently: true}); x.imageSmoothingQuality = "high";
  const s = Math.max(W / im.naturalWidth, H / im.naturalHeight), dw = im.naturalWidth * s, dh = im.naturalHeight * s;
  x.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);

  for (let i = 0, j = 0; i < d.length; i += 4, j++){ const l = (.299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2]); lum[j] = l / 255; hist[l | 0]++; }

  for (let k = 0; k < 256; k++){ acc += hist[k]; if (acc > n * .02){ lo = k; break; } }
  acc = 0; for (let k = 255; k >= 0; k--){ acc += hist[k]; if (acc > n * .02){ hi = k; break; } }
  const span = Math.max(40, hi - lo), norm = l => Math.min(1, Math.max(0, (l * 255 - lo) / span));
  const bg = STYLE === "halftone";
  for (let i = 0, j = 0; i < d.length; i += 4, j++){
    const l = bg ? 1 : norm(lum[j]) * .85 + .1;           // mix: smooth duotone base; halftone: flat yellow paper
    d[i] = INK[0] + (YEL[0] - INK[0]) * l; d[i + 1] = INK[1] + (YEL[1] - INK[1]) * l; d[i + 2] = INK[2] + (YEL[2] - INK[2]) * l;

    for (let cx = (row % 2) * cell / 2; cx < W + cell; cx += cell){
      let sum = 0, c = 0;
      for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++){
        const px = Math.min(W - 1, Math.max(0, (cx + ox * cell / 3) | 0)), py = Math.min(H - 1, Math.max(0, (cy + oy * cell / 3) | 0));
        sum += lum[py * W + px]; c++;
      }
      const dark = 1 - norm(sum / c);                      // 0 = highlight, 1 = deepest shadow
      const r = bg ? cell * .62 * Math.pow(dark, .9) : cell * .4 * Math.pow(Math.max(0, dark - .2) / .8, .9);
      if (r > .6){ x.beginPath(); x.arc(cx, cy, r, 0, a); x.fill(); }
    }

}
function enhance(img){
  if (done.has(img)) return; done.add(img);
  load(img.currentSrc || img.src).then(im => {
    const cv = document.createElement("canvas"); cv.className = "duo duo-ht";
    img.after(cv);
    try { paint(cv, im); } catch(e){ cv.remove(); return; }
    img.style.display = "none";
    let t; new ResizeObserver(() => { clearTimeout(t); t = setTimeout(() => { try { paint(cv, im); } catch(e){} }, 120); }).observe(cv.parentElement);
  }).catch(() => {});
}
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); enhance(e.target); } }), {rootMargin: "300px"});
const scan = root => (root.querySelectorAll ? root.querySelectorAll("#app img.duo, img.duo") : []).forEach(i => { if (i.closest("#app") && !done.has(i)) io.observe(i); });
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1){ if (n.matches && n.matches("img.duo")) { if (n.closest("#app")) io.observe(n); } else scan(n); } }))).observe(document.body, {childList: true, subtree: true});
scan(document);
})();

/* HIPERNOVA — home hero: particle field + rotating phrase with "signal noise" transition.
   Adapted from the HIPERNOVA studio page. Headline and phrases come from the Sheet
   (Pages: home.hero, home.phrases). */
(function(){
"use strict";
const GLYPHS = "abcdeghknopqrsuvxyz0123456789#/+*:";
const HOLD = 3200;
let stopAll = null;

function initHero(){
  if (stopAll){ stopAll(); stopAll = null; }
  const sec = document.querySelector("#app .hero-d"); if (!sec) return;
  const cv = sec.querySelector("canvas"), box = sec.querySelector("[data-phrase]");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const home = (typeof PG !== "undefined" && PG.home) || {};
  const phrases = (home.phrases || []).filter(Boolean);
  const stops = [];

  /* ---------- rotating phrase ---------- */
  if (box && phrases.length){
    box.innerHTML = "";
    const sr = document.createElement("span"); sr.setAttribute("aria-live", "polite");
    sr.style.cssText = "position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)";
    box.append(sr);
    phrases.forEach(p => { const s = document.createElement("span"); s.setAttribute("aria-hidden", "true"); s.style.cssText = "grid-area:1/1;visibility:hidden"; s.textContent = p; box.append(s); }); // reserves the tallest phrase
    const live = document.createElement("span"); live.setAttribute("aria-hidden", "true");
    live.style.cssText = "position:absolute;top:0;left:0;right:0;white-space:pre-wrap"; box.append(live);
    let idx = 0, t0 = performance.now(), raf, lastDraw = 0, lastIdx = -1;
    sr.textContent = phrases[0];
    const rnd = () => GLYPHS[(Math.random() * GLYPHS.length) | 0];
    const tick = now => {
      if (!live.isConnected) return;
      if (now - t0 >= HOLD){ idx = (idx + 1) % phrases.length; t0 = now; sr.textContent = phrases[idx]; }
      const txt = phrases[idx], tt = now - t0;
      const inP = Math.min(1, tt / 760), outP = Math.max(0, (tt - (HOLD - 520)) / 440);
      let out = "";
      for (let k = 0; k < txt.length; k++){
        const c = txt[k], f = k / txt.length;
        if (c === " "){ out += " "; continue; }
        out += (inP > f * .85 + Math.random() * .15 && outP < (1 - f) * .7 + Math.random() * .3) ? c : rnd();
      }
      if (now - lastDraw > 45 || (inP >= 1 && outP === 0 && lastIdx !== idx + "s")){ live.textContent = out; lastDraw = now; }
      const noisy = inP < 1 || outP > 0;
      live.style.opacity = noisy ? (.55 + Math.random() * .45).toFixed(2) : 1;
      live.style.transform = noisy && Math.random() < .25 ? `translateX(${(Math.random() * 6 - 3).toFixed(1)}px)` : "none";
      raf = requestAnimationFrame(tick);
    };
    if (reduced) live.textContent = phrases[0]; else raf = requestAnimationFrame(tick);
    stops.push(() => cancelAnimationFrame(raf));
  }

  if (cv){
    const ctx = cv.getContext("2d"); let w = 0, h = 0, raf, visible = true, prog = 0, mouse = null, P = [];
    const resize = () => {
      const b = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
      w = b.width; h = b.height; cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(1400 * Math.min(1, Math.max(.45, w / 1280)));
      while (P.length < n) P.push({a: Math.random() * 6.283, r0: Math.random(), s: .0008 + Math.random() * .003, z: Math.random() * 1.5 + .6, sx: Math.random(), sy: Math.random()});
      P.length = n; if (reduced) frame();
    };
    const frame = () => {
      if (!cv.isConnected) return;
      ctx.fillStyle = "#222"; ctx.fillRect(0, 0, w, h);

  const api = window.HN_CONFIG && HN_CONFIG.API_URL, base = ((typeof C !== "undefined" && C.substack) || DEFAULT_SUBSTACK).replace(/\/+$/, "");
  if (api){

      const r = await fetch(api + (api.includes("?") ? "&" : "?") + "action=posts&_=" + Math.floor(Date.now() / 600000));

  box.innerHTML = (home ? "" : `<p class="t-meta posts-n">${String(posts.length).padStart(2, "0")} articles</p>`) + `<div class="cards">` + posts.map((p, i) => {
