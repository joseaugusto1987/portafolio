vos e innovadores.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Qué hicimos</h2>\n<ul><li><strong>Fase de diseño estratégico:</strong> Empezamos con una fase abierta y exploratoria para reunir ideas y definir la dirección temática y estratégica de la nueva exhibición. Esto implicó analizar tendencias, intereses de las audiencias y posibles aliados.</li><li><strong>Talleres participativos:</strong> Realizamos talleres con diversos stakeholders, entre ellos miembros de la comunidad, educadores y expertos, para recoger aportes y asegurar que la nueva exhibición fuera relevante y atractiva.</li><li><strong>Proceso de diseño iterativo:</strong> Empleamos una metodología altamente iterativa, con etapas continuas de creación y evaluación. Esto aseguró que el diseño se mantuviera flexible y receptivo a los comentarios a lo largo de todo el proyecto.</li><li><strong>Prototipado y pruebas:</strong> Desarrollamos prototipos de los componentes de la nueva exhibición y los probamos con los públicos objetivo para refinar y optimizar la experiencia del visitante.</li><li><strong>Colaboración interdisciplinaria:</strong> Involucramos a un equipo multidisciplinario de distintas áreas de Parque Explora, asegurando que todos los aspectos del proyecto, desde el contenido educativo hasta la implementación técnica, estuvieran alineados.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Impacto esperado</h2>\n<ul><li><strong>Mayor participación de los visitantes:</strong> Al incorporar elementos interactivos modernos y experiencias sensoriales diversas, la nueva exhibición busca cautivar y educar a los visitantes de manera más eficaz.</li><li><strong>Entorno de aprendizaje sostenible:</strong> Concebida como un espacio dinámico y en evolución, la nueva exhibición ofrecerá contenidos frescos y relevantes con el tiempo, incentivando las visitas repetidas y el interés sostenido.</li><li><strong>Participación de la comunidad:</strong> El enfoque participativo asegura que la exhibición resuene con la comunidad local, fomentando un sentido de apropiación y orgullo.</li><li><strong>Mayor alcance educativo:</strong> A través de elementos interdisciplinarios y transmedia, la exhibición conectará con una audiencia más amplia, que incluye colegios, familias y grupos de interés especial, promoviendo el aprendizaje a lo largo de la vida y la curiosidad.</li><li><strong>Uso innovador del espacio:</strong> La exhibición contará con espacios flexibles y multifuncionales que pueden adaptarse a distintas actividades y eventos, maximizando la utilidad y el impacto del entorno museal.</li></ul>\n<p><a href=\"https://www.parqueexplora.org/sala-m-sica\" target=\"_blank\" rel=\"noopener\">parqueexplora.org/sala-m-sica</a></p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Premios</h2>\n<ul><li>\"MÚSICA: Tú eres la orquesta\" (MUSIC: You are the Orchestra) fue ganadora de bronce en la categoría Onsite Digital Experience de los Muse Awards 2019 de la American Alliance of Museums.</li><li>“Paisajes Musicales” (Musical Landscapes), una experiencia de la sala de música, fue ganadora de plata en la categoría Video, Film, Animation, and Live Media or Digital Performances de los Muse Awards 2019 de la American Alliance of Museums.</li></ul>"}},{"id":"346b8de5c7714e7fb1e83cc60c1334ed","slug":"claustro-san-ignacio","title":"Claustro San Ignacio","sub":"Strategic Master Plan for Cultural Transformation","year":2016,"client":["Comfama"],"industry":["Culture & Museums"],"type":["Learning environment","Creative space","Exhibition","Strategy","Master Planning"],"role":["Senior designer"],"country":[],"highlight":true,"link":"","texture":"halftone","excerpt":"Strategic Framing & Intention Setting. Applying Parque Explora’s VEA (Visión de la Experiencia de Aprendizaje) methodology, we co-created a Manifiesto de Intención articulating a shared vision: to convert the Claustro…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation</h2>\n<p>Since 2003, Comfama, a Colombian social enterprise, has operated the historic Claustro San Ignacio in Medellín primarily as a service center and educational facility. Recognizing its underutilization and immense cultural potential, Comfama partnered with Parque Explora to reimagine the building as a leading cultural and creative hub. This project aimed to honor the site's architectural heritage while transforming it into a space that fosters human development, citizenship, and inclusive cultural expression.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The building’s use was predominantly transactional, centered around a client service model that deterred public engagement. Key architectural features like patios, the chapel (auditorium), and the library were either inaccessible or inadequately equipped to support meaningful cultural and educational experiences. Spatial disconnects, and limited accessibility further highlighted the need for a radical transformation aligned with contemporary urban and cultural dynamics.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Task</h2>\n<p>I was part of the core team that supported Comfama and Parque Explora in defining the foundational vision and strategic direction for the Claustro’s transformation. My role spanned design research, synthesis, creative facilitation, and conceptual development, helping to co-create the manifesto, spatial strategy, and cultural positioning of the project. I collaborated closely with internal Comfama leaders, service teams, architects, and educators to shape a shared vision grounded in user needs and institutional purpose.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Action</h2>\n<p><strong>Discovery &amp; Alignment.</strong> We conducted site visits, stakeholder interviews, and participatory workshops with over a dozen Comfama leaders across service, education, infrastructure, and strategy. This groundwork surfaced critical tensions: the mismatch between the building’s potential and its current usage, and the need for a more welcoming, inspiring, and inclusive civic space.</p>\n<p><strong>Strategic Framing &amp; Intention Setting.</strong> Applying Parque Explora’s VEA (Visión de la Experiencia de Aprendizaje) methodology, we co-created a <em>Manifiesto de Intención</em> articulating a shared vision: to convert the Claustro into a creative center for talent development and cultural activation. We defined foundational principles—participation, critical thinking, inspiration, and expression—and mapped their implications for content, experience, and space.</p>\n<p><strong>Conceptual Design &amp; Spatial Strategy.</strong> We proposed a new architectural and programmatic schema that transformed the Claustro from a service-heavy, closed-off building into a layered public environment. The plan introduced flexible learning labs, exhibition zones, cultural stages, and a public rooftop terrace. Space typologies included a transmedia lab, gastronomy studio, ideation workshops, and a reimagined Comfama Interactivo hub.</p>\n<p><strong>Roadmap &amp; Feasibility.</strong> Finally, we detailed a phased transformation plan including architectural programs, intervention stages, budget projections, and operational strategy to enable ongoing learning and adaptation through execution.</p>\n<h3 class=\"c-h3\">Process Highlights</h3>\n<ul><li>Conducted site visits, stakeholder interviews, and co-creation workshops to capture insights and aspirations.</li><li>Applied the VEA (Learning Experience Vision) methodology for systemic and user-centered design.</li><li>Defined a strategic vision and architectural program aligned with Comfama’s mission and community needs.</li><li>Proposed a multifunctional layout including public plazas, creative labs, coworking areas, and reimagined learning spaces.</li><li>Designed flexible environments such as the Transmedia Lab, Gastronomy Lab, and Public Auditorium to support diverse cultural programming.</li><li>Created accessibility improvements and integrated vertical circulation systems to unify the building experience.</li><li>Developed a phased execution plan to allow continuous operation during the renovation.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Result</h2>\n<p>This work established the strategic and experiential foundation for one of Medellín’s most ambitious civic transformations. The Claustro has since evolved into a reference point for cultural life in the city, with over 2.1 million visitors and 6,000+ public events hosted between 2023 and 2025. The project demonstrated how heritage spaces can be reactivated through purpose-driven design, and it shaped my ongoing approach to aligning physical transformation with institutional vision and user meaning.</p>","status":"published","cover":"","es":{"title":"Claustro San Ignacio","sub":"Plan maestro estratégico para la transformación cultural","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación</h2>\n<p>Desde 2003, Comfama, una empresa social colombiana, ha operado el histórico Claustro San Ignacio en Medellín principalmente como centro de servicios y espacio educativo. Al reconocer su subutilización y su inmenso potencial cultural, Comfama se asoció con Parque Explora para reimaginar el edificio como un centro cultural y creativo de referencia. Este proyecto buscaba honrar el patrimonio arquitectónico del sitio y, al mismo tiempo, transformarlo en un espacio que fomente el desarrollo humano, la ciudadanía y la expresión cultural inclusiva.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El uso del edificio era predominantemente transaccional, centrado en un modelo de atención al cliente que desincentivaba la participación del público. Elementos arquitectónicos clave como los patios, la capilla (auditorio) y la biblioteca eran inaccesibles o no estaban adecuadamente equipados para sostener experiencias culturales y educativas significativas. Las desconexiones espaciales y la accesibilidad limitada evidenciaron aún más la necesidad de una transformación radical, alineada con las dinámicas urbanas y culturales contemporáneas.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Tarea</h2>\n<p>Fui parte del equipo central que apoyó a Comfama y a Parque Explora en la definición de la visión fundacional y la dirección estratégica de la transformación del Claustro. Mi rol abarcó la investigación de diseño, la síntesis, la facilitación creativa y el desarrollo conceptual, ayudando a cocrear el manifiesto, la estrategia espacial y el posicionamiento cultural del proyecto. Colaboré de cerca con líderes internos de Comfama, equipos de servicio, arquitectos y educadores para dar forma a una visión compartida, fundamentada en las necesidades de los usuarios y en el propósito institucional.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Acción</h2>\n<p><strong>Descubrimiento y alineación.</strong> Realizamos visitas al sitio, entrevistas con stakeholders y talleres participativos con más de una docena de líderes de Comfama de las áreas de servicio, educación, infraestructura y estrategia. Este trabajo de base sacó a la luz tensiones críticas: el desajuste entre el potencial del edificio y su uso actual, y la necesidad de un espacio cívico más acogedor, inspirador e inclusivo.</p>\n<p><strong>Encuadre estratégico y definición de intenciones.</strong> Aplicando la metodología VEA (Visión de la Experiencia de Aprendizaje) de Parque Explora, cocreamos un <em>Manifiesto de Intención</em> que articula una visión compartida: convertir el Claustro en un centro creativo para el desarrollo del talento y la activación cultural. Definimos principios fundacionales —participación, pensamiento crítico, inspiración y expresión— y mapeamos sus implicaciones para el contenido, la experiencia y el espacio.</p>\n<p><strong>Diseño conceptual y estrategia espacial.</strong> Propusimos un nuevo esquema arquitectónico y programático que transformó el Claustro de un edificio cerrado y con una fuerte carga de servicios en un entorno público por capas. El plan introdujo laboratorios de aprendizaje flexibles, zonas de exhibición, escenarios culturales y una terraza pública en la azotea. Las tipologías de espacios incluyeron un laboratorio transmedia, un estudio de gastronomía, talleres de ideación y un renovado centro Comfama Interactivo.</p>\n<p><strong>Hoja de ruta y factibilidad.</strong> Finalmente, detallamos un plan de transformación por fases que incluía programas arquitectónicos, etapas de intervención, proyecciones presupuestales y una estrategia operativa para permitir un aprendizaje y una adaptación continuos durante la ejecución.</p>\n<h3 class=\"c-h3\">Aspectos destacados del proceso</h3>\n<ul><li>Realizamos visitas al sitio, entrevistas con stakeholders y talleres de cocreación para recoger insights y aspiraciones.</li><li>Aplicamos la metodología VEA (Visión de la Experiencia de Aprendizaje) para un diseño sistémico y centrado en el usuario.</li><li>Definimos una visión estratégica y un programa arquitectónico alineados con la misión de Comfama y las necesidades de la comunidad.</li><li>Propusimos una distribución multifuncional que incluye plazas públicas, laboratorios creativos, áreas de coworking y espacios de aprendizaje reimaginados.</li><li>Diseñamos ambientes flexibles como el Laboratorio Transmedia, el Laboratorio de Gastronomía y el Auditorio Público para sostener una programación cultural diversa.</li><li>Creamos mejoras de accesibilidad e integramos sistemas de circulación vertical para unificar la experiencia del edificio.</li><li>Desarrollamos un plan de ejecución por fases que permitiera la operación continua durante la renovación.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Resultado</h2>\n<p>Este trabajo estableció la base estratégica y experiencial de una de las transformaciones cívicas más ambiciosas de Medellín. Desde entonces, el Claustro se ha convertido en un punto de referencia de la vida cultural de la ciudad, con más de 2,1 millones de visitantes y más de 6.000 eventos públicos realizados entre 2023 y 2025. El proyecto demostró cómo los espacios patrimoniales pueden reactivarse mediante un diseño orientado por el propósito, y dio forma a mi enfoque actual de alinear la transformación física con la visión institucional y el sentido para los usuarios.</p>"}},{"id":"8d230e939d2948c48622b796aec229f1","slug":"molas","title":"Molas","sub":"layers of wisdom","year":2016,"client":["Gold Museum of Bogotá"],"industry":["Culture & Museums","Goverment / Public"],"type":["Temporary exhibition","Interactives","Immersive media"],"role":["Project leader","Exhibition Designer"],"country":[],"highlight":false,"link":"http://www.banrepcultural.org/museo-del-oro/exposiciones-temporales/molas","texture":"halftone","excerpt":"Our team collaborated with anthropologists, curators, and Guna advisors to ensure cultural accuracy and sensitivity. The narrative structure avoided linear storytelling, favoring an open, sensorial rhythm that echoed…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation</h2>\n<p>The temporary exhibition <em>Molas: Layers of Wisdom</em> at the Gold Museum of Bogotá sought to reveal the worldviews and ancestral knowledge of the Guna people from Colombia and Panama. Central to this cultural expression are the <em>molas</em>—multi-layered textiles worn by Guna women, rich in symbolic and protective meaning. The curatorial challenge was to transform these intricate fabrics into an immersive sensory experience that could communicate the spiritual journey of the <em>Neles</em> (Guna leaders and visionaries), honoring their layered cosmogonies and connection to the creative forces of the world.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Task</h2>\n<p>I was responsible for leading the conceptualization and audiovisual design of the immersive piece <em>Los Galus</em>. My task was to translate Guna cosmology into a spatial narrative that could evoke the dreamlike journeys of the Neles through the layered dimensions of the molas. The objective was not to represent their stories literally, but to create a respectful, affective space of contemplation and wonder.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Action</h2>\n<p>We designed <em>Los Galus</em> as an immersive room experience where visitors entered a liminal space of overlapping visuals, textures, and sounds—mirroring the layered textile logic of the molas. Inspired by the idea of crossing thresholds between spiritual realms, the installation used projection mapping, ambient soundscapes, and mirrored surfaces to generate a sense of infinite space and symbolic depth.</p>\n<p>Our team collaborated with anthropologists, curators, and Guna advisors to ensure cultural accuracy and sensitivity. The narrative structure avoided linear storytelling, favoring an open, sensorial rhythm that echoed the dreamlike sequences described by the Neles. The visual language was based on abstract forms drawn from traditional mola iconography, unfolding in cycles to simulate ritual and reverie. We complemented this with <em>La Mujer y la Mola</em>, a second audiovisual experience focused on the wisdom of Guna women and the act of creation.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Result</h2>\n<p>The exhibition offered museum visitors a profound and contemplative experience—one that moved beyond explanation into immersion. <em>Los Galus</em> became a highlight of the show, praised for its poetic interpretation of Guna cosmology. The project reaffirmed how immersive media can honor indigenous narratives by embracing ambiguity, symbolism, and emotional resonance over didactic formats.</p>\n<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/WQmOwhhE5Vk\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>La mujer y la mola</h2>\n<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/sT1iB5tOBgY\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>","status":"published","cover":"","es":{"title":"Molas","sub":"capas de sabiduría","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación</h2>\n<p>La exposición temporal <em>Molas: capas de sabiduría</em> en el Museo del Oro de Bogotá buscaba revelar las cosmovisiones y los saberes ancestrales del pueblo Guna de Colombia y Panamá. Central en esta expresión cultural son las <em>molas</em>: textiles de múltiples capas que visten las mujeres guna, cargados de significado simbólico y protector. El desafío curatorial era transformar estas intrincadas telas en una experiencia sensorial inmersiva capaz de comunicar el viaje espiritual de los <em>Neles</em> (líderes y visionarios guna), honrando sus cosmogonías en capas y su conexión con las fuerzas creadoras del mundo.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Tarea</h2>\n<p>Fui responsable de liderar la conceptualización y el diseño audiovisual de la pieza inmersiva <em>Los Galus</em>. Mi tarea era traducir la cosmología guna en una narrativa espacial que evocara los viajes oníricos de los Neles a través de las dimensiones en capas de las molas. El objetivo no era representar literalmente sus historias, sino crear un espacio respetuoso y afectivo de contemplación y asombro.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acción</h2>\n<p>Diseñamos <em>Los Galus</em> como una sala inmersiva en la que los visitantes entraban a un espacio liminal de visuales, texturas y sonidos superpuestos, que reflejaba la lógica textil en capas de las molas. Inspirada en la idea de cruzar umbrales entre reinos espirituales, la instalación usó video mapping, paisajes sonoros ambientales y superficies espejadas para generar una sensación de espacio infinito y profundidad simbólica.</p>\n<p>Nuestro equipo colaboró con antropólogos, curadores y asesores guna para asegurar la precisión y la sensibilidad cultural. La estructura narrativa evitó el relato lineal y privilegió un ritmo abierto y sensorial que hacía eco de las secuencias oníricas descritas por los Neles. El lenguaje visual se basó en formas abstractas tomadas de la iconografía tradicional de las molas, que se desplegaban en ciclos para simular el ritual y la ensoñación. Lo complementamos con <em>La Mujer y la Mola</em>, una segunda experiencia audiovisual centrada en la sabiduría de las mujeres guna y en el acto de creación.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultado</h2>\n<p>La exposición ofreció a los visitantes del museo una experiencia profunda y contemplativa, que iba más allá de la explicación hacia la inmersión. <em>Los Galus</em> se convirtió en uno de los puntos más destacados de la muestra, elogiada por su interpretación poética de la cosmología guna. El proyecto reafirmó cómo los medios inmersivos pueden honrar las narrativas indígenas al abrazar la ambigüedad, el simbolismo y la resonancia emocional por encima de los formatos didácticos.</p>\n<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/WQmOwhhE5Vk\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>La mujer y la mola</h2>\n<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/sT1iB5tOBgY\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>"}},{"id":"a4fc9ff0761f401bb7325ccece7cd8d5","slug":"national-guide-for-science-centers-in-colombia","title":"National Guide for Science Centers in Colombia","sub":"","year":2015,"client":["Colciencias"],"industry":["Education","Culture & Museums"],"type":["Strategy","Policy making","Education"],"role":["Author"],"country":[],"highlight":false,"link":"https://minciencias.gov.co/centros","texture":"moire","excerpt":"Guide Development and Field Validation. Working in tandem with Parque Explora’s Design and curatorial teams, we structured the guide into thematic routes. My contribution focused on the Interior Design and Learning…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation</h2>\n<p>As Colombia deepened its national strategy for inclusive science, technology, and innovation, there was a growing need to guide the creation and strengthening of Science Centers across the country. Backed by Colciencias and developed in partnership with Parque Explora, this national guide aimed to align new and existing centers with global benchmarks for fourth- and fifth-generation institutions—spaces focused on experiential learning, public engagement, and citizen participation in science and technology. The challenge was to translate these ambitions into practical, scalable guidance.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Task</h2>\n<p>I served as co-author of the guide, leading the <strong>interior design and learning environments</strong> component. My responsibility was to define the spatial and experiential principles that would help Science Centers move beyond exhibition toward becoming participatory, educational ecosystems. I collaborated closely with museologists, architectural and technical design experts, and specialists in public engagement to integrate pedagogical intent into the spatial logic of these centers.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Action</h2>\n<p><strong>Conceptual Design of Spatial Guidelines.</strong> We began by analyzing global models (ASTC, ECSITE, RedPOP) and emerging trends such as <em>public engagement with science and technology</em>. These informed a set of spatial design principles grounded in flexibility, multi-sensory interaction, accessibility, and inclusive design—translating educational values into physical environments.</p>\n<p><strong>Guide Development and Field Validation.</strong> Working in tandem with Parque Explora’s Design and curatorial teams, we structured the guide into thematic routes. My contribution focused on the <strong>Interior Design</strong> and <strong>Learning Environments</strong> sections, aligning physical layouts with informal, participatory learning practices. The design principles were positioned as tools to shape not just space, but behavior and engagement within it.</p>\n<p><strong>Pilot Application: Project Malva.</strong> The guidelines were tested in the <strong>strengthening of two Science Centers in Valle del Cauca</strong>, as part of the Malva project. This served as a live pilot to assess how spatial design influenced the learning experience and community ownership of the centers.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Result</h2>\n<p>The guide established a shared national framework for designing next-generation Science Centers in Colombia. Its adoption has helped elevate the quality and coherence of projects nationwide—bridging physical design with educational mission. A key learning was the value of integrating spatial and pedagogical thinking early in the process to ensure spaces not only function, but transform how people relate to science and each other.</p>\n<p><strong>Scalability and National Adoption.</strong> Since publication, the guide has become a national reference. It was instrumental in shaping the vision and spatial strategies of the <strong>CIBI Science Center in Dosquebradas</strong> and used as a diagnostic and planning tool in the <strong>Science Center of the Technological University of Pereira</strong>. Many more initiatives across the country continue to draw from its framework.</p>","status":"published","cover":"","es":{"title":"Guía nacional para centros de ciencia en Colombia","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación</h2>\n<p>A medida que Colombia profundizaba su estrategia nacional de ciencia, tecnología e innovación inclusivas, crecía la necesidad de orientar la creación y el fortalecimiento de Centros de Ciencia en todo el país. Respaldada por Colciencias y desarrollada en alianza con Parque Explora, esta guía nacional buscaba alinear los centros nuevos y existentes con los referentes globales de instituciones de cuarta y quinta generación: espacios enfocados en el aprendizaje experiencial, la participación pública y la participación ciudadana en la ciencia y la tecnología. El desafío era traducir estas ambiciones en orientaciones prácticas y escalables.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Tarea</h2>\n<p>Formé parte de la autoría de la guía y lideré el componente de <strong>diseño interior y ambientes de aprendizaje</strong>. Mi responsabilidad era definir los principios espaciales y experienciales que ayudarían a los Centros de Ciencia a ir más allá de la exhibición para convertirse en ecosistemas participativos y educativos. Colaboré de cerca con museólogos, expertos en diseño arquitectónico y técnico, y especialistas en participación pública para integrar la intención pedagógica en la lógica espacial de estos centros.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acción</h2>\n<p><strong>Diseño conceptual de los lineamientos espaciales.</strong> Comenzamos analizando modelos globales (ASTC, ECSITE, RedPOP) y tendencias emergentes como la <em>apropiación pública de la ciencia y la tecnología</em> (public engagement). Estos insumos dieron lugar a un conjunto de principios de diseño espacial basados en la flexibilidad, la interacción multisensorial, la accesibilidad y el diseño inclusivo, que traducen los valores educativos en entornos físicos.</p>\n<p><strong>Desarrollo de la guía y validación en campo.</strong> Trabajando en conjunto con los equipos de Diseño y de curaduría de Parque Explora, estructuramos la guía en rutas temáticas. Mi aporte se centró en las secciones de <strong>Diseño Interior</strong> y <strong>Ambientes de Aprendizaje</strong>, alineando las distribuciones físicas con prácticas de aprendizaje informales y participativas. Los principios de diseño se plantearon como herramientas para dar forma no solo al espacio, sino también al comportamiento y a la participación dentro de él.</p>\n<p><strong>Aplicación piloto: Proyecto Malva.</strong> Los lineamientos se probaron en el <strong>fortalecimiento de dos Centros de Ciencia del Valle del Cauca</strong>, como parte del proyecto Malva. Esto sirvió como un piloto real para evaluar cómo el diseño espacial influía en la experiencia de aprendizaje y en la apropiación de los centros por parte de la comunidad.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultado</h2>\n<p>La guía estableció un marco nacional compartido para diseñar Centros de Ciencia de nueva generación en Colombia. Su adopción ha ayudado a elevar la calidad y la coherencia de los proyectos en todo el país, tendiendo un puente entre el diseño físico y la misión educativa. Un aprendizaje clave fue el valor de integrar el pensamiento espacial y pedagógico desde el inicio del proceso para asegurar que los espacios no solo funcionen, sino que transformen la forma en que las personas se relacionan con la ciencia y entre sí.</p>\n<p><strong>Escalabilidad y adopción nacional.</strong> Desde su publicación, la guía se ha convertido en una referencia nacional. Fue determinante para dar forma a la visión y a las estrategias espaciales del <strong>Centro de Ciencia CIBI en Dosquebradas</strong> y se usó como herramienta de diagnóstico y planeación en el <strong>Centro de Ciencia de la Universidad Tecnológica de Pereira</strong>. Muchas otras iniciativas en el país siguen basándose en su marco.</p>"}},{"id":"b7a7a55402464a6a8eea8e7928ab36dd","slug":"mova","title":"MOVA","sub":"Innovation center for public teachers","year":2014,"client":["Alcaldía de Medellín"],"industry":["Goverment / Public","Education"],"type":["Learning environment","Creative space"],"role":["Interior designer"],"country":[],"highlight":false,"link":"","texture":"moire","excerpt":"Learning by doing and teaching by showing is a common methodological commitment that is defined in spatial relationships and ways of inhabiting the project. Criteria such as spatial simultaneity, gaps and…","html":"<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/lDZhGe6-89M\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>\n<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>The Concept</h2>\n<p>MOVA is the innovation center for teachers in Medellín. We conceptualized this novel environment as the intersection of three dimensions: being, knowing, and creating; which makes it possible to develop and nurture personal and professional skills aimed at the generation of educational experiences, with diverse and contextualized pedagogical practices, based on dialogue and the exchange of ideas and experiences.</p>\n<p>Learning by doing and teaching by showing is a common methodological commitment that is defined in spatial relationships and ways of inhabiting the project. Criteria such as spatial simultaneity, gaps and transparencies, and the mix of activities allow the generation of more complex relationships by giving visibility to all the experiences that take place, finding a fertile environment for creation.</p>","status":"published","cover":"","es":{"title":"MOVA","sub":"Centro de innovación para docentes públicos","html":"<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/lDZhGe6-89M\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>\n<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>El concepto</h2>\n<p>MOVA es el centro de innovación para docentes de Medellín. Conceptualizamos este novedoso ambiente como la intersección de tres dimensiones: ser, saber y crear; lo que permite desarrollar y nutrir habilidades personales y profesionales orientadas a la generación de experiencias educativas, con prácticas pedagógicas diversas y contextualizadas, basadas en el diálogo y el intercambio de ideas y experiencias.</p>\n<p>Aprender haciendo y enseñar mostrando es un compromiso metodológico común que se define en las relaciones espaciales y en las formas de habitar el proyecto. Criterios como la simultaneidad espacial, los vacíos y las transparencias, y la mezcla de actividades permiten generar relaciones más complejas al dar visibilidad a todas las experiencias que ocurren, encontrando un entorno fértil para la creación.</p>"}},{"id":"94dc5394c45048c0a3a587cc9ff1ae5a","slug":"mind-science-truck","title":"MIND Science Truck","sub":"","year":2013,"client":[],"industry":["Culture & Museums"],"type":["Traveling exhibition"],"role":["Exhibition Designer"],"country":["Colombia"],"highlight":false,"link":"","texture":"halftone","excerpt":"","html":"<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/9GzNzIdNakc\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>","status":"published","cover":"","es":{"title":"MIND Science Truck","sub":"","html":"<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/9GzNzIdNakc\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>"}},{"id":"6b13ae6d02f549d7864e03a57ed5a09d","slug":"on-stage","title":"On Stage","sub":"stories behind stories","year":2012,"client":["Parque Explora"],"industry":["Culture & Museums"],"type":["Exhibition"],"role":["Exhibition Designer"],"country":[],"highlight":false,"link":"","texture":"halftone","excerpt":"","html":"<blockquote class=\"c-quote\">“An exhibit about old and modern methods of self-expression —a fairly abstract and daring idea. A number of interactive pieces using a variety of technologies to get visitors to express themselves individually and together. Strong sense of interactivity, very fun and engaging, with lots of personalization. Highly engaging with experiential insights into the creative process.” — Muse Awards 2017, Honorable mention</blockquote>\n<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/DPe9s-1SppQ\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>","status":"published","cover":"","es":{"title":"En escena","sub":"historias detrás de las historias","html":"<blockquote class=\"c-quote\">“Una exhibición sobre métodos antiguos y modernos de autoexpresión: una idea bastante abstracta y audaz. Varias piezas interactivas que usan una variedad de tecnologías para lograr que los visitantes se expresen de forma individual y colectiva. Fuerte sentido de interactividad, muy divertida y atractiva, con mucha personalización. Altamente atractiva, con insights experienciales sobre el proceso creativo.” — Muse Awards 2017, mención honorífica</blockquote>\n<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/DPe9s-1SppQ\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>"}},{"id":"c3386c5ccc4648008e4f2c56706c0280","slug":"minor-stories","title":"Minor stories","sub":"interactive experience","year":2012,"client":["Parque Explora"],"industry":["Culture & Museums"],"type":["Interactives","Ux"],"role":["Exhibition Designer"],"country":[],"highlight":false,"link":"","texture":"dither","excerpt":"An aboriginal community on an island is created, where plants, animals, villagers and a shaman who prays to the heavens when facing an intense summer or a harsh winter. The visitors share complete control of the…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Minor stories</h2>\n<p>Minor stories is an interactive exhibit equipped with a tangible interface using a mapping projection technique on a relief table.</p>\n<p>An aboriginal community on an island is created, where plants, animals, villagers and a shaman who prays to the heavens when facing an intense summer or a harsh winter. The visitors share complete control of the situation, moving and rotating tags around the projected surface. Handling said objects, the visitors can create different situations: they may change the day into night, summer into winter, create bird and UFO effects, and even inflict natural disasters on specific regions.</p>\n<ul><li><strong>Sensory Engagement:</strong> The video projection on a relief surface surprises the visitor, who also finds himself with some objects that allow him to interact with the game in a new and tangible manner.</li><li><strong>Creative Engagement:</strong> Each visitor is invited to experiment and create their own short story.</li><li><strong>Social Engagement:</strong> Three people may simultaneously share the experience and observe the results.</li></ul>\n<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/ZcotQQtb2Gg\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>","status":"published","cover":"","es":{"title":"Historias menores","sub":"experiencia interactiva","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Historias menores</h2>\n<p>Historias menores (Minor stories) es una exhibición interactiva equipada con una interfaz tangible que usa una técnica de video mapping sobre una mesa en relieve.</p>\n<p>Se crea una comunidad aborigen en una isla, con plantas, animales, aldeanos y un chamán que le reza al cielo cuando enfrenta un verano intenso o un invierno crudo. Los visitantes comparten el control total de la situación, moviendo y rotando fichas sobre la superficie proyectada. Al manipular dichos objetos, los visitantes pueden crear distintas situaciones: pueden convertir el día en noche, el verano en invierno, generar efectos de aves y ovnis, e incluso provocar desastres naturales en regiones específicas.</p>\n<ul><li><strong>Participación sensorial:</strong> La proyección de video sobre una superficie en relieve sorprende al visitante, que además encuentra algunos objetos que le permiten interactuar con el juego de una manera nueva y tangible.</li><li><strong>Participación creativa:</strong> Cada visitante está invitado a experimentar y crear su propia historia corta.</li><li><strong>Participación social:</strong> Tres personas pueden compartir la experiencia al mismo tiempo y observar los resultados.</li></ul>\n<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/ZcotQQtb2Gg\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>"}},{"id":"4e2749d5b37f4ffea739c3bb630b1c79","slug":"mind","title":"Mind","sub":"the inside world","year":2011,"client":["Parque Explora"],"industry":["Culture & Museums"],"type":["Exhibition"],"role":["Exhibition Designer"],"country":[],"highlight":false,"link":"https://parqueexplora.org/salamente","texture":"halftone","excerpt":"Interaction & Experience Design. We reimagined the gallery not as a static display, but as a “moving medium” for dialogue. Instead of organizing content by brain anatomy, we structured the space around human…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation</h2>\n<p>Parque Explora sought to renew one of its most iconic galleries: <em>Sala Mente</em> (The Mind Gallery). Originally developed in 2011 in collaboration with the Neuroscience Group of the University of Antioquia, the gallery needed to evolve into a more engaging, inclusive, and contemporary experience. The aim was to translate cutting-edge brain research into an interactive and emotional learning environment—one that would stimulate curiosity, imagination, and self-reflection for all audiences.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Task</h2>\n<p>I was responsible for the interactive design of the gallery. My role covered the end-to-end development of visitor experiences: from concept and interaction logic to technical detailing, prototyping, and coordinating production and installation. I worked closely with scientists, exhibit fabricators, and Explora’s internal team to ensure each component was both scientifically accurate and emotionally resonant.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Action</h2>\n<p><strong>Collaborative Research &amp; Concept Framing.</strong> The foundation of the project was a close partnership with neuroscientists from the University of Antioquia. We held regular working sessions to translate complex research into clear, relatable narratives. This collaboration ensured that each exhibit spoke to everyday experiences, while remaining grounded in scientific rigor.</p>\n<p><strong>Interaction &amp; Experience Design.</strong> We reimagined the gallery not as a static display, but as a “moving medium” for dialogue. Instead of organizing content by brain anatomy, we structured the space around <em>human abilities</em>—like dreaming, sensing, imagining, and communicating—making the subject matter more accessible and emotionally resonant.</p>\n<p><strong>Exhibition Architecture &amp; Thematic Zones.</strong> The space was divided using a color-coded system, with each zone inviting exploration of different cognitive functions. Every interaction was designed to be intuitive and open-ended, encouraging visitors to test their memory, perception, or creativity at their own pace. The gallery was built around a free-choice learning model, allowing for nonlinear exploration and playful experimentation.</p>\n<p><strong>Prototyping, Detailing &amp; Installation.</strong> I led the technical detailing and production coordination for the interactive stations—ensuring that each piece could withstand heavy public use while maintaining fidelity to the intended experience. This included mechanical exhibits, digital interfaces, physical triggers, and sensor-based interactions. I also oversaw the final assembly and installation on-site.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Result</h2>\n<p>Sala Mente became one of the most beloved spaces in Parque Explora, praised for its ability to spark wonder and self-inquiry. The gallery successfully bridged the gap between neuroscience and everyday life, turning abstract concepts into tangible, joyful, and sometimes surreal experiences. A key learning: designing for the mind requires engaging both the intellect and the body—offering not just information, but opportunities to feel, imagine, and question.</p>\n<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/a5zf8eEe4wU\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>","status":"published","cover":"","es":{"title":"Mind","sub":"el mundo interior","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación</h2>\n<p>Parque Explora buscaba renovar una de sus salas más emblemáticas: la <em>Sala Mente</em> (The Mind Gallery). Desarrollada originalmente en 2011 en colaboración con el Grupo de Neurociencias de la Universidad de Antioquia, la sala necesitaba evolucionar hacia una experiencia más atractiva, inclusiva y contemporánea. El objetivo era traducir la investigación de vanguardia sobre el cerebro en un entorno de aprendizaje interactivo y emocional, que estimulara la curiosidad, la imaginación y la autorreflexión en todos los públicos.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Tarea</h2>\n<p>Fui responsable del diseño interactivo de la sala. Mi rol cubrió el desarrollo integral de las experiencias del visitante: desde el concepto y la lógica de interacción hasta el detallado técnico, el prototipado y la coordinación de la producción y la instalación. Trabajé de cerca con científicos, fabricantes de exhibiciones y el equipo interno de Explora para asegurar que cada componente fuera a la vez científicamente preciso y emocionalmente resonante.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acción</h2>\n<p><strong>Investigación colaborativa y encuadre del concepto.</strong> La base del proyecto fue una alianza estrecha con neurocientíficos de la Universidad de Antioquia. Realizamos sesiones de trabajo regulares para traducir investigación compleja en narrativas claras y cercanas. Esta colaboración aseguró que cada exhibición hablara de experiencias cotidianas sin dejar de estar fundamentada en el rigor científico.</p>\n<p><strong>Diseño de la interacción y la experiencia.</strong> Reimaginamos la sala no como una exhibición estática, sino como un \"medio en movimiento\" para el diálogo. En lugar de organizar los contenidos por anatomía cerebral, estructuramos el espacio en torno a las <em>habilidades humanas</em> —como soñar, sentir, imaginar y comunicar—, haciendo el tema más accesible y emocionalmente resonante.</p>\n<p><strong>Arquitectura de la exposición y zonas temáticas.</strong> El espacio se dividió con un sistema codificado por colores, en el que cada zona invitaba a explorar distintas funciones cognitivas. Cada interacción se diseñó para ser intuitiva y abierta, animando a los visitantes a poner a prueba su memoria, su percepción o su creatividad a su propio ritmo. La sala se construyó en torno a un modelo de aprendizaje de libre elección, que permite una exploración no lineal y una experimentación lúdica.</p>\n<p><strong>Prototipado, detallado e instalación.</strong> Lideré el detallado técnico y la coordinación de la producción de las estaciones interactivas, asegurando que cada pieza pudiera resistir un uso público intenso sin perder fidelidad a la experiencia prevista. Esto incluyó exhibiciones mecánicas, interfaces digitales, disparadores físicos e interacciones basadas en sensores. También supervisé el ensamblaje final y la instalación en sitio.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultado</h2>\n<p>La Sala Mente se convirtió en uno de los espacios más queridos de Parque Explora, elogiada por su capacidad de despertar asombro y autoindagación. La sala logró tender un puente entre la neurociencia y la vida cotidiana, convirtiendo conceptos abstractos en experiencias tangibles, alegres y, a veces, surrealistas. Un aprendizaje clave: diseñar para la mente exige involucrar tanto al intelecto como al cuerpo, ofreciendo no solo información, sino oportunidades de sentir, imaginar y cuestionar.</p>\n<figure class=\"c-video\"><iframe src=\"https://www.youtube-nocookie.com/embed/a5zf8eEe4wU\" title=\"Video\" loading=\"lazy\" allow=\"accelerometer; encrypted-media; picture-in-picture\" allowfullscreen></iframe></figure>"}}],"es":{"config":{"disciplines":["Diseño estratégico","Prospectiva de diseño","Diseño de transformación","Estrategia de CX"]},"pages":{"home":{"hero":"Ayudo a personas, marcas y organizaciones a","phrases":["ver lo que antes no veían.","cambiar de rumbo.","cuestionar las reglas dadas.","hacer las cosas de otra manera.","convertir los límites en posibilidades.","imaginar otros futuros.","hacer emerger algo nuevo.","descubrir nuevas posibilidades.","cambiar la forma de mirar.","romper con lo predecible.","reimaginar lo que ya existe.","crear desde otro lugar.","cambiar el contexto.","rediseñar las condiciones.","abrir nuevos caminos.","cambiar las preguntas.","desafiar lo que se daba por hecho.","habitar nuevos escenarios.","activar nuevas conversaciones.","expandir lo que parecía posible.","conectar lo que estaba separado.","crear nuevas formas de relacionarse.","dar forma a lo que aún no existe.","convertir la incertidumbre en posibilidad.","ensayar otros futuros.","hacer visible lo invisible."],"bio":"Director de Diseño Estratégico y Transformación de CX con más de 15 años construyendo las condiciones para que las organizaciones naveguen la complejidad, rediseñen cómo operan y creen valor a largo plazo. Lidero en la intersección de la prospectiva, el pensamiento sistémico y el diseño centrado en las personas, traduciendo la ambigüedad estratégica en nuevos modelos operativos, ecosistemas digitales y capacidades organizacionales. Mi trabajo abarca energía, servicios financieros, retail y sector público en América Latina."},"approach":{"lead":"Todo proyecto empieza con una pregunta, no con una solución. Mi práctica se apoya en seis principios que guían cómo trabajo con organizaciones que enfrentan complejidad estratégica — desde replantear el problema correcto hasta diseñar las condiciones para un cambio duradero.","principles":[["Narrativa como estrategia","Destilo ideas complejas en narrativas claras y enfocadas que inspiran acción y transformación. A través de la narración conecto profundamente con las audiencias e impulso el cambio haciendo lo esencial visible y memorable."],["Cocreación a escala","Entiendo el diseño como un proceso compartido: trabajo de cerca con las comunidades para construir soluciones arraigadas en sus realidades. Este enfoque inclusivo produce resultados más significativos, sostenibles y aceptados."],["Pensamiento sistémico","Desde el pensamiento sistémico diseño con conciencia del contexto más amplio, conectando las dinámicas organizacionales, las necesidades de las personas y las fuerzas sociales para lograr un impacto duradero y sistémico."],["Futuros y prospectiva","Ayudo a las organizaciones a mirar más allá del presente, diseñando soluciones preparadas para el futuro que construyen resiliencia y aseguran relevancia en un mundo en constante cambio."],["Experimentar para generar impacto rápido","A través del prototipado rápido y las pruebas iterativas, convierto ideas en soluciones validadas con rapidez, acelerando el aprendizaje, la adaptación y una innovación medible."],["Diseño de marcos a la medida","Diseño estrategias a la medida del reto, no plantillas. Al replantear los problemas e integrar un pensamiento sistémico y centrado en las personas, abro soluciones significativas y ajustadas al contexto."]]},"about":{"intro":"Soy Director de Diseño Estratégico y Transformación, con más de 15 años construyendo las condiciones para que las organizaciones naveguen la complejidad, reimaginen cómo operan y creen valor a largo plazo. Mi práctica se ubica en la intersección de la prospectiva, el pensamiento sistémico, el diseño de servicios y la cocreación centrada en las personas — traduciendo la ambigüedad estratégica en marcos accionables, nuevos modelos operativos y capacidades organizacionales que perduran.","quote":"Creo que la complejidad no es un problema por resolver — es una condición que hay que navegar. Las organizaciones con las que trabajo no necesitan respuestas más simples. Necesitan mejores preguntas, modelos más claros y la capacidad organizacional de actuar con intención en la incertidumbre.","experience":[["En VML","Como líder de Diseño Estratégico y CX y hoy Director de Consultoría en VML Colombia, he liderado proyectos de transformación de principio a fin para organizaciones en puntos de inflexión estratégica. Mi trabajo abarca el diseño de modelos de prospectiva, la estrategia de ecosistemas digitales, el rediseño de modelos operativos y la innovación en experiencia de cliente — siempre en la intersección entre el rigor del diseño y el pragmatismo del negocio. Actualmente lidero el Centro de Excelencia de Consultoría para LATAM, escalando nuestra práctica de diseño estratégico en Colombia, México, Perú, Chile y Puerto Rico."],["Antes de VML","Durante más de 11 años en Parque Explora construí mi práctica desde cero — empecé como diseñador de exposiciones y llegué a ser Jefe de Innovación. Lideré los proyectos de transformación más ambiciosos de la institución: la renovación completa de un centro de ciencia, el diseño de entornos de aprendizaje inmersivos para clientes nacionales e internacionales y el desarrollo de la metodología de innovación de Parque Explora, publicada como <em>Compás de Diseño</em>. El trabajo de esta etapa recibió reconocimiento de la American Alliance of Museums (Muse Awards 2017) y de la Bienal Iberoamericana de Diseño en Madrid."]],"education":["Maestría en Ingeniería (2015–2017) — Universidad EAFIT","Ingeniería en Diseño de Producto (2004–2010) — Universidad EAFIT","Intercambio académico — Universidad Tecnológica de Delft (TU Delft), Países Bajos (2008–2009)"],"certifications":["Diseño sistémico para abordar la complejidad — Service Design College, 2025","Branding y experiencia de cliente — IE University, 2024","Design Futures — CENTRO, 2023","Diseño de servicios — IxDF, 2023","Gestión estratégica e innovación — Copenhagen Business School, 2021"],"disciplines":["Diseño estratégico","Diseño de servicios","Pensamiento sistémico","Prospectiva de diseño","Diseño centrado en las personas","Diseño de modelos operativos","Estrategia de ecosistemas digitales","Sprints de diseño","Diseño de transición"],"teaching":"Más de 11 años de docencia universitaria en diseño de experiencias, diseño de interacción, design thinking e innovación guiada por el diseño en la Universidad EAFIT y la Universidad Pontificia Bolivariana."},"thinking":{"lead":"Una colección de mis artículos, podcasts y escritos, que refleja mi pasión por el diseño, las metodologías y las experiencias. Aquí comparto ideas y reflexiones sobre prácticas de diseño innovadoras y la creación de experiencias de usuario con sentido.","substack":"Hipernova es un espacio para explorar las fronteras de la creatividad, el diseño, la tecnología y una vida con propósito. No es un blog técnico, ni un diario personal, ni una guía de consultoría paso a paso. Es una encrucijada: la práctica del diseño con sentido, la energía de la transformación, <script>
/* =====================================================================

(function(){
"use strict";
const CFG = Object.assign({API_URL: "", DEMO_PASSWORD: "hipernova", CLICKS: 5}, window.HN_CONFIG || {});

const store = (s) => ({
  get(k){ try { return s.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { s.setItem(k, v); } catch(e){} },
  del(k){ try { s.removeItem(k); } catch(e){} }
});
const LS = store(window.localStorage), SS = store(window.sessionStorage);
const clone = o => JSON.parse(JSON.stringify(o));
const TEXTURES = ["halftone","flow","topo","dither","moire","grain","particles"];
const SYMBOLS = ["nucleo","expansion","orbita","campo","transicion","halftone","onda","topografia","particulas","superposicion","vector"];
const LISTS = ["client","industry","type","role","country"];
const q = (s, r = document) => r.querySelector(s);
const qa = (s, r = document) => [...r.querySelectorAll(s)];
const ea = s => String(s ?? "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const et = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

async function api(payload){

}
function normalize(d){

const slugify = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80) || "case";
function uniqueSlug(base, except){
  let s = slugify(base), n = 2; const taken = x => ADM.data.projects.some(p => p !== except && p.slug === x);

  return s;
}
const getPath = (o, path) => path.split(".").reduce((a, k) => a == null ? a : a[k], o);
function setPath(o, path, v){
  const ks = path.split("."), last = ks.pop(); let t = o;
  ks.forEach((k, i) => { const nxt = (ks[i + 1] !== undefined ? ks[i + 1] : last); if (t[k] == null) t[k] = /^\d+$/.test(nxt) ? [] : {}; t = t[k]; });
  t[last] = v;
}

/* generic modal: fields → values (or null when cancelled). onSubmit may throw to show an inline error. */
function ask({title, note, fields, ok = "OK", onSubmit}){
  return new Promise(resolve => {
    const bg = document.createElement("div"); bg.className = "mdl-bg";
    bg.innerHTML = `<form class="mdl" autocomplete="off"><h3>${et(title)}</h3>${note ? `<p class="mdl-note">${note}</p>` : ""}
      ${fields.map(f => `<div class="fld"><label>${et(f.label)}</label><input name="${f.name}" type="${f.type || "text"}" value="${ea(f.value || "")}" placeholder="${ea(f.placeholder || "")}"></div>`).join("")}
      <div class="err"></div><div class="btns"><button class="hn-btn sm accent" type="submit">${et(ok)}</button><button class="hn-btn sm outline" type="button" data-x>Cancel</button></div></form>`;
    document.body.append(bg);
    const form = q("form", bg), err = q(".err", bg);
    const close = v => { bg.remove(); document.removeEventListener("keydown", esc2, true); resolve(v); };
    const esc2 = e => { if (e.key === "Escape"){ e.stopPropagation(); close(null); } };
    document.addEventListener("keydown", esc2, true);
    q("[data-x]", bg).onclick = () => close(null);
    bg.addEventListener("mousedown", e => { if (e.target === bg) close(null); });
    form.onsubmit = async e => {
      e.preventDefault();
      const vals = Object.fromEntries(new FormData(form).entries());
      try { const res = onSubmit ? await onSubmit(vals) : vals; close(res === undefined ? vals : res); }
      catch(x){ err.textContent = x.message || String(x); }
    };
    setTimeout(() => q("input", bg).focus(), 30);
  });
}

function imageUrl(u){
  u = u.trim(); const id = driveId(u);
  if (id) return `https://lh3.googleusercontent.com/d/${id}=w1600`;
  if (/drive\.google\.com\/drive\/(u\/\d+\/)?folders|drive\.google\.com\/(drive|folderview)/i.test(u)) throw new Error("That is a folder link. Open the image in Drive → Share → Copy link.");
  if (/(drive|docs)\.google\.com/i.test(u)) throw new Error("Couldn't find the file id in that link. Use Drive → Share → Copy link on the image itself.");
  if (!/^https?:\/\//i.test(u)) throw new Error("Paste a link that starts with https://");
  return u;
}
function videoUrl(u){
  u = u.trim(); let m;
  if ((m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/|youtube-nocookie\.com\/embed\/)([\w-]{6,})/))) return "https://www.youtube-nocookie.com/embed/" + m[1];
  if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return "https://player.vimeo.com/video/" + m[1];
  const id = driveId(u); if (id) return `https://drive.google.com/file/d/${id}/preview`;
  throw new Error("Use a YouTube, Vimeo or Google Drive video link");
}
const safeHref = h => { h = (h || "").trim(); return /^(https?:|mailto:|#)/i.test(h) ? h : (/^[\w.-]+\.[a-z]{2,}/i.test(h) ? "https://" + h : ""); };

/* ---------------------------------------------------------------- HTML sanitizer / serializer */
function inline(n){
  let o = "";
  n.childNodes.forEach(c => {
    if (c.nodeType === 3){ o += et(c.nodeValue.replace(/ /g, " ")); return; }
    if (c.nodeType !== 1) return;
    const t = c.tagName;
    if (t === "BR") o += "<br>";
    else if (t === "B" || t === "STRONG" || /font-weight:\s*(bold|[6-9]00)/.test(c.getAttribute("style") || "")) o += "<strong>" + inline(c) + "</strong>";
    else if (t === "I" || t === "EM" || /font-style:\s*italic/.test(c.getAttribute("style") || "")) o += "<em>" + inline(c) + "</em>";
    else if (t === "A"){ const h = safeHref(c.getAttribute("href")); o += h ? `<a href="${ea(h)}" target="_blank" rel="noopener">${inline(c)}</a>` : inline(c); }
    else if (c.classList.contains("fig-x") || t === "SCRIPT" || t === "STYLE" || t === "IMG" || t === "IFRAME") { /* skip */ }
    else o += inline(c);
  });
  return o;
}
const clean = s => s.replace(/(<br>)+$/, "").replace(/^(<br>)+/, "").trim();
function blocks(root, numbered, ctx = {n:0}){
  let out = "";
  root.childNodes.forEach(c => {
    if (c.nodeType === 3){ const t = c.nodeValue.trim(); if (t) out += `<p>${et(t)}</p>\n`; return; }
    if (c.nodeType !== 1) return;
    const t = c.tagName;
    if (t === "H1" || t === "H2"){ const x = clean(inline(c)); if (x){ ctx.n++; out += `<h2 class="c-h2">${numbered ? `<span class="idx">${pad(ctx.n)} —</span>` : ""}${x}</h2>\n`; } }
    else if (/^H[3-6]$/.test(t)){ const x = clean(inline(c)); if (x) out += `<h3 class="c-h3">${x}</h3>\n`; }
    else if (t === "BLOCKQUOTE"){ const x = clean(inline(c)); if (x) out += `<blockquote class="c-quote">${x}</blockquote>\n`; }
    else if (t === "UL" || t === "OL"){
      const lis = [...c.children].filter(li => li.tagName === "LI").map(li => clean(inline(li))).filter(Boolean);
      const tag = t.toLowerCase(); if (lis.length) out += `<${tag}>${lis.map(x => `<li>${x}</li>`).join("")}</${tag}>\n`;
    }
    else if (t === "FIGURE"){
      const img = q("img", c), ifr = q("iframe", c);
      if (img && img.getAttribute("src")) out += `<figure class="c-img"><img src="${ea(img.getAttribute("src"))}" alt="${ea(img.getAttribute("alt") || "")}" loading="lazy"></figure>\n`;
      else if (ifr && ifr.getAttribute("src")) out += `<figure class="c-video"><iframe src="${ea(ifr.getAttribute("src"))}" title="Video" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen></iframe></figure>\n`;
    }
    else if ((t === "P" || t === "DIV" || t === "SECTION" || t === "ARTICLE") && c.querySelector("p,h1,h2,h3,h4,ul,ol,blockquote,figure,div")) out += blocks(c, numbered, ctx);
    else if (t === "SCRIPT" || t === "STYLE" || t === "IMG" || t === "IFRAME") { /* skip */ }
    else { const x = clean(inline(c)); if (x) out += `<p>${x}</p>\n`; }
  });
  return out.trim();
}

/* ---------------------------------------------------------------- editor */
const ED = {el:null, range:null, project:null};
function figureEl(kind, src, alt){
  const f = document.createElement("figure"); f.className = kind; f.contentEditable = "false";
  f.innerHTML = kind === "c-img" ? `<img referrerpolicy="no-referrer" src="${ea(src)}" alt="${ea(alt || "")}">` : `<iframe src="${ea(src)}" title="Video" allowfullscreen></iframe>`;
  const x = document.createElement("button"); x.type = "button"; x.className = "fig-x"; x.textContent = "Remove"; x.contentEditable = "false"; f.append(x);
  const im = q("img", f); if (im) im.onerror = () => { if (!q(".fig-bad", f)) f.insertAdjacentHTML("beforeend", `<div class="fig-bad">Image could not load. If it's from Drive, share the file as “Anyone with the link”.</div>`); };
  return f;
}
function loadIntoEditor(html){
  const tmp = document.createElement("div"); tmp.innerHTML = html;
  qa(".idx", tmp).forEach(e => e.remove());
  qa("figure", tmp).forEach(f => {
    const im = q("img", f), fr = q("iframe", f);
    f.replaceWith(im ? figureEl("c-img", im.getAttribute("src"), im.getAttribute("alt")) : fr ? figureEl("c-video", fr.getAttribute("src")) : document.createComment(""));
  });
  ED.el.innerHTML = tmp.innerHTML;
  if (!ED.el.children.length) ED.el.innerHTML = "<p><br></p>";
  fixBlocks(); flagEmpty();
}
function fixBlocks(){
  [...ED.el.children].forEach(c => {
    const t = c.tagName, want = t === "H2" ? "c-h2" : t === "H3" ? "c-h3" : t === "BLOCKQUOTE" ? "c-quote" : null;
    if (t === "FIGURE") return;
    if (want){ if (c.className !== want) c.className = want; } else if (c.className) c.removeAttribute("class");
    if (c.hasAttribute("style")) c.removeAttribute("style");
  });
}
function flagEmpty(){
  const e = ED.el; e.classList.toggle("empty", e.children.length <= 1 && !e.textContent.trim() && !q("figure", e));
}
function edHTML(){
  const c = ED.el.cloneNode(true);
  return blocks(c, true);
}
let saveT;
function changed(){
  ED.touched = true; fixBlocks(); flagEmpty(); positionPlus();
  clearTimeout(saveT); saveT = setTimeout(commitBody, 250);
  markDirty();
}
function commitBody(){
  if (!ED.project || !ED.el) return;
  if (ADM.lang === "es"){ if (ED.touched){ ED.project.es = ED.project.es || {}; ED.project.es.html = edHTML(); } }
  else ED.project.html = edHTML();
}
function currentBlock(){
  const s = getSelection(); if (!s.rangeCount) return null;
  let n = s.anchorNode; if (!n || !ED.el.contains(n)) return null;
  while (n && n.parentNode !== ED.el) n = n.parentNode;
  return n && n.nodeType === 1 ? n : null;
}
function saveRange(){ const s = getSelection(); if (s.rangeCount && ED.el.contains(s.anchorNode)) ED.range = s.getRangeAt(0).cloneRange(); }
function restoreRange(){
  ED.el.focus();
  if (ED.range){ const s = getSelection(); s.removeAllRanges(); s.addRange(ED.range); }
}
function placeCaret(el){ const r = document.createRange(); r.selectNodeContents(el); r.collapse(true); const s = getSelection(); s.removeAllRanges(); s.addRange(r); ED.range = r.cloneRange(); }
function setBlock(tag){
  ED.el.focus(); const b = currentBlock();
  if (b && tag !== "p" && b.tagName.toLowerCase() === tag) tag = "p";
  document.execCommand("formatBlock", false, tag); changed();
}
function insertFigure(fig){
  restoreRange(); const b = currentBlock();
  if (b && b.tagName === "P" && !b.textContent.trim() && !q("img", b)) b.replaceWith(fig);
  else if (b) b.after(fig); else ED.el.append(fig);
  let nx = fig.nextElementSibling;
  if (!nx || nx.tagName !== "P"){ nx = document.createElement("p"); nx.innerHTML = "<br>"; fig.after(nx); }
  placeCaret(nx); changed();
}
async function addImage(){
  saveRange();
  const v = await ask({title:"Add image", note:"Paste a Google Drive share link (file set to “Anyone with the link”) or any image URL.", ok:"Insert",
    fields:[{name:"url", label:"Image link", placeholder:"https://drive.google.com/file/d/…/view"}, {name:"alt", label:"Description (alt text)", placeholder:"What the image shows"}],
    onSubmit: x => ({url:imageUrl(x.url), alt:x.alt})});
  if (v) insertFigure(figureEl("c-img", v.url, v.alt)); else restoreRange();
}
async function addVideo(){
  saveRange();
  const v = await ask({title:"Add video", note:"YouTube, Vimeo or Google Drive video link.", ok:"Insert",
    fields:[{name:"url", label:"Video link", placeholder:"https://www.youtube.com/watch?v=…"}], onSubmit: x => ({url:videoUrl(x.url)})});
  if (v) insertFigure(figureEl("c-video", v.url)); else restoreRange();
}
async function addLink(){
  saveRange(); const sel = getSelection();
  if (!sel.rangeCount || sel.isCollapsed){ toast("Select some text first"); return; }
  const cur = (sel.anchorNode.parentElement.closest("a") || {}).href || "";
  const v = await ask({title:"Link", note:"Leave empty to remove the link.", ok:"Apply", fields:[{name:"url", label:"URL", value:cur, placeholder:"https://…"}], onSubmit: x => ({url:x.url.trim()})});
  restoreRange(); if (!v) return;
  const h = safeHref(v.url);
  if (!h) document.execCommand("unlink"); else document.execCommand("createLink", false, h);
  changed();
}
function runTool(act){
  ED.el.focus();
  switch(act){
    case "h2": return setBlock("h2");
    case "h3": return setBlock("h3");
    case "p": return setBlock("p");
    case "quote": return setBlock("blockquote");
    case "ul": document.execCommand("insertUnorderedList"); return changed();
    case "ol": document.execCommand("insertOrderedList"); return changed();
    case "b": document.execCommand("bold"); return changed();
    case "i": document.execCommand("italic"); return changed();
    case "link": return addLink();
    case "img": return addImage();
    case "video": return addVideo();
    case "undo": document.execCommand("undo"); return changed();
  }
}
/* floating "+" (empty line) and selection bubble */
function positionPlus(){
  const plus = q("#adm-plus"); if (!plus) return;
  const b = currentBlock(), s = getSelection();
  if (b && b.tagName === "P" && !b.textContent.trim() && !q("img", b) && s.isCollapsed){
    const r = b.getBoundingClientRect(), h = ED.el.getBoundingClientRect();
    plus.style.display = "block"; plus.style.top = (r.top - h.top + Math.max(0, (r.height - 28) / 2)) + "px";
  } else { plus.style.display = "none"; q("#adm-plusmenu").classList.remove("open"); }
}
function positionBubble(){
  const bub = q("#adm-bub"); if (!bub) return;
  const s = getSelection();
  if (!ED.el || !s.rangeCount || s.isCollapsed || !ED.el.contains(s.anchorNode) || !ED.el.contains(s.focusNode)) { bub.classList.remove("open"); return; }
  const r = s.getRangeAt(0).getBoundingClientRect(); if (!r.width && !r.height) { bub.classList.remove("open"); return; }
  bub.classList.add("open");
  const w = bub.offsetWidth; bub.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px"; bub.style.top = Math.max(8, r.top - 46) + "px";
}
document.addEventListener("selectionchange", () => { if (ADM.open && ED.el && ED.el.isConnected){ positionBubble(); positionPlus(); } });

function bindEditor(){
  const e = ED.el;
  document.execCommand("defaultParagraphSeparator", false, "p");
  e.addEventListener("input", changed);
  e.addEventListener("keyup", () => { saveRange(); positionPlus(); });
  e.addEventListener("mouseup", () => { saveRange(); });
  e.addEventListener("blur", commitBody);
  e.addEventListener("keydown", ev => {
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k"){ ev.preventDefault(); addLink(); return; }
    if (ev.key === " " && !ev.metaKey && !ev.ctrlKey){
      const b = currentBlock(), s = getSelection();
      if (b && b.tagName === "P" && s.isCollapsed){
        const t = b.textContent, map = {"##":"h2", "###":"h3", ">":"blockquote"};
        if (map[t]){ ev.preventDefault(); b.innerHTML = "<br>"; setBlock(map[t]); return; }
        if (t === "-" || t === "*"){ ev.preventDefault(); b.innerHTML = "<br>"; document.execCommand("insertUnorderedList"); changed(); return; }
        if (t === "1."){ ev.preventDefault(); b.innerHTML = "<br>"; document.execCommand("insertOrderedList"); changed(); return; }
      }
    }
  });
  e.addEventListener("paste", ev => {
    ev.preventDefault();
    const html = ev.clipboardData.getData("text/html"), txt = ev.clipboardData.getData("text/plain");
    let out;
    if (html){ const t = document.createElement("div"); t.innerHTML = html; out = blocks(t, false); }
    if (!out) out = txt.split(/\n+/).filter(Boolean).map(l => `<p>${et(l)}</p>`).join("");
    document.execCommand("insertHTML", false, out); changed();
  });
  e.addEventListener("click", ev => {
    const x = ev.target.closest(".fig-x"); if (x){ x.closest("figure").remove(); if (!e.children.length) e.innerHTML = "<p><br></p>"; changed(); return; }
    qa("figure.sel", e).forEach(f => f.classList.remove("sel"));
    const f = ev.target.closest("figure"); if (f) f.classList.add("sel");
  });
  e.addEventListener("keydown", ev => {
    if ((ev.key === "Backspace" || ev.key === "Delete")){
      const f = q("figure.sel", e); if (f){ ev.preventDefault(); f.remove(); changed(); }
    }
  });
}

/* HIPERNOVA — duotone + halftone for cover photos.
   <img class="duo"> already shows a smooth yellow/black duotone (CSS filter).
   This upgrades it to a canvas render with halftone dots when the image server allows pixel access (CORS);
   otherwise the smooth duotone simply stays.
   HN_CONFIG.COVER_STYLE: "mix" (smooth duotone + dot screen) | "halftone" (yellow paper + black dots) | "smooth" */
(function(){
"use strict";
/* Broken cover → try Drive's other image host once, then fall back to the generative texture. */
document.addEventListener("error", e => {
  const t = e.target; if (!t || t.tagName !== "IMG" || !t.classList.contains("duo") || !t.closest("#app")) return;
  const id = (t.src.match(/[?&]id=([\w-]{15,})/) || [])[1];
  if (id && !t.dataset.alt){ t.dataset.alt = "1"; t.src = `https://lh3.googleusercontent.com/d/${id}=w1600`; return; }
  const cv = document.createElement("canvas");
  if (t.dataset.k === "card"){ cv.className = "ht"; cv.dataset.m = MOTIF[t.dataset.t] || "dots"; cv.dataset.seed = t.dataset.s; t.replaceWith(cv); halftone(cv); }
  else { cv.dataset.hnTexture = t.dataset.t; cv.dataset.tone = "ink"; cv.dataset.seed = t.dataset.s; t.replaceWith(cv); window.HN && HN.refresh(); }
}, true);

const STYLE = (window.HN_CONFIG && HN_CONFIG.COVER_STYLE) || "mix";
if (STYLE === "smooth") return;
const done = new WeakSet(), cache = new Map();
const YEL = [253, 238, 61], INK = [34, 34, 34];

function load(src){
  if (!cache.has(src)) cache.set(src, new Promise((res, rej) => { const im = new Image(); im.crossOrigin = "anonymous"; im.referrerPolicy = "no-referrer"; im.onload = () => res(im); im.onerror = rej; im.src = src; }));
  return cache.get(src);
}
function paint(cv, im){
  const par = cv.parentElement, dpr = Math.min(2, devicePixelRatio || 1);
  const W = Math.round(par.clientWidth * dpr), H = Math.round(par.clientHeight * dpr); if (!W || !H) return;
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d", {willReadFrequently: true}); x.imageSmoothingQuality = "high";
  const s = Math.max(W / im.naturalWidth, H / im.naturalHeight), dw = im.naturalWidth * s, dh = im.naturalHeight * s;
  x.drawImage(im, (W - dw) / 2, (H - dh) / 2, dw, dh);
  const id = x.getImageData(0, 0, W, H), d = id.data;        // throws when the canvas is tainted
  const lum = new Float32Array(W * H), hist = new Uint32Array(256);
  for (let i = 0, j = 0; i < d.length; i += 4, j++){ const l = (.299 * d[i] + .587 * d[i + 1] + .114 * d[i + 2]); lum[j] = l / 255; hist[l | 0]++; }
  let lo = 0, hi = 255, acc = 0; const n = W * H;
  for (let k = 0; k < 256; k++){ acc += hist[k]; if (acc > n * .02){ lo = k; break; } }
  acc = 0; for (let k = 255; k >= 0; k--){ acc += hist[k]; if (acc > n * .02){ hi = k; break; } }
  const span = Math.max(40, hi - lo), norm = l => Math.min(1, Math.max(0, (l * 255 - lo) / span));
  const bg = STYLE === "halftone";
  for (let i = 0, j = 0; i < d.length; i += 4, j++){
    const l = bg ? 1 : norm(lum[j]) * .85 + .1;           // mix: smooth duotone base; halftone: flat yellow paper
    d[i] = INK[0] + (YEL[0] - INK[0]) * l; d[i + 1] = INK[1] + (YEL[1] - INK[1]) * l; d[i + 2] = INK[2] + (YEL[2] - INK[2]) * l;
  }
  x.putImageData(id, 0, 0);
  const cell = Math.max(3 * dpr, Math.round(W / 190)), a = Math.PI * 2;
  x.fillStyle = "#222222";
  for (let cy = 0, row = 0; cy < H + cell; cy += cell * .866, row++){
    for (let cx = (row % 2) * cell / 2; cx < W + cell; cx += cell){
      let sum = 0, c = 0;
      for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++){
        const px = Math.min(W - 1, Math.max(0, (cx + ox * cell / 3) | 0)), py = Math.min(H - 1, Math.max(0, (cy + oy * cell / 3) | 0));
        sum += lum[py * W + px]; c++;
      }
      const dark = 1 - norm(sum / c);                      // 0 = highlight, 1 = deepest shadow
      const r = bg ? cell * .62 * Math.pow(dark, .9) : cell * .4 * Math.pow(Math.max(0, dark - .2) / .8, .9);
      if (r > .6){ x.beginPath(); x.arc(cx, cy, r, 0, a); x.fill(); }
    }
  }
}
function enhance(img){
  if (done.has(img)) return; done.add(img);
  load(img.currentSrc || img.src).then(im => {
    const cv = document.createElement("canvas"); cv.className = "duo duo-ht";
    img.after(cv);
    try { paint(cv, im); } catch(e){ cv.remove(); return; }
    img.style.display = "none";
    let t; new ResizeObserver(() => { clearTimeout(t); t = setTimeout(() => { try { paint(cv, im); } catch(e){} }, 120); }).observe(cv.parentElement);
  }).catch(() => {});
}
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); enhance(e.target); } }), {rootMargin: "300px"});
const scan = root => (root.querySelectorAll ? root.querySelectorAll("#app img.duo, img.duo") : []).forEach(i => { if (i.closest("#app") && !done.has(i)) io.observe(i); });
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1){ if (n.matches && n.matches("img.duo")) { if (n.closest("#app")) io.observe(n); } else scan(n); } }))).observe(document.body, {childList: true, subtree: true});
scan(document);
})();

/* HIPERNOVA — home hero: particle field + rotating phrase with "signal noise" transition.
   Adapted from the HIPERNOVA studio page. Headline and phrases come from the Sheet
   (Pages: home.hero, home.phrases) and fall back to the defaults below. */
(function(){
"use strict";
const DEFAULT_HERO = "I help people, brands and organizations to";
const DEFAULT_PHRASES = ["see what we couldn't see before.", "change course.", "question the rules we were given.", "do things differently.", "turn limits into possibilities.", "imagine other futures.", "let something new emerge.", "discover new possibilities.", "shift the way they look at things.", "break with the predictable.", "reimagine what already exists.", "create from another place.", "change the context.", "redesign the conditions.", "open new paths.", "change the questions.", "challenge what was taken for granted.", "inhabit new scenarios.", "start new conversations.", "expand what seemed possible.", "connect what was separate.", "create new ways of relating.", "give shape to what doesn't exist yet.", "turn uncertainty into possibility.", "try out other futures.", "make the invisible visible."];

function initHero(){
