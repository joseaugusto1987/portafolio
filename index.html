:root{
  /* Core palette */
  --hn-yellow:#FDEE3D;--hn-deep-space:#222222;--hn-cosmic-mist:#F4F4EE;--hn-nebula-gray:#D7D7D7;--hn-white:#FFFFFF;
  --hn-yellow-60:rgba(253,238,61,.6);--hn-yellow-20:rgba(253,238,61,.2);--hn-ink-60:rgba(34,34,34,.6);--hn-ink-12:rgba(34,34,34,.12);
  --hn-yellow-deep:#E8D400; /* only for yellow-on-yellow line work (moiré, interference) */

  /* States */
  --bg-energy:var(--hn-yellow);--fg-on-energy:var(--hn-deep-space);
  --bg-matter:var(--hn-deep-space);--fg-on-matter:var(--hn-cosmic-mist);
  --bg-space:var(--hn-cosmic-mist);--fg-on-space:var(--hn-deep-space);

  /* Semantic */
  --fg-1:var(--hn-deep-space);--fg-2:var(--hn-ink-60);--fg-inverse:var(--hn-cosmic-mist);
  --bg-1:var(--hn-cosmic-mist);--bg-2:var(--hn-nebula-gray);--bg-inverse:var(--hn-deep-space);
  --accent:var(--hn-yellow);--line:var(--hn-deep-space);--line-soft:var(--hn-nebula-gray);
  --grad-density:linear-gradient(90deg,#222 0%,#FDEE3D 55%,#D7D7D7 100%);

  /* Type */
  --font-display:"Space Grotesk",system-ui,sans-serif;--font-body:"Inter",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --fs-mega:clamp(96px,16vw,280px);--fs-h1:96px;--fs-h2:64px;--fs-h3:40px;--fs-h4:24px;--fs-body-lg:20px;--fs-body:16px;--fs-small:14px;--fs-meta:11px;
  --lh-tight:.92;--lh-head:1;--lh-body:1.5;
  --tracking-display:-.03em;--tracking-meta:.14em;
  --fw-regular:400;--fw-medium:500;--fw-semibold:600;--fw-bold:700;

  /* Space & grid */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;--sp-8:64px;--sp-9:96px;--sp-10:160px;
  --margin-page:48px;--cols-h:12;--cols-v:6;--gutter:24px;
  --radius-none:0;--radius-pill:999px;--radius-circle:50%;
  --border-hair:1px solid var(--line);--border-bold:2px solid var(--line);

  /* Motion */
  --ease-field:cubic-bezier(.22,.8,.26,1);--dur-fast:160ms;--dur-base:320ms;--dur-slow:900ms;--dur-pulse:4800ms;
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg-1);color:var(--fg-1);font:var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font-body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:underline;text-underline-offset:3px}
a:hover{background:var(--hn-yellow);color:var(--hn-deep-space);text-decoration:none}
::selection{background:var(--hn-yellow);color:var(--hn-deep-space)}
img{max-width:100%;display:block}

/* Type classes */
.t-mega{font:var(--fw-bold) var(--fs-mega)/var(--lh-tight) var(--font-display);letter-spacing:var(--tracking-display);text-transform:uppercase}
.t-h1{font:var(--fw-bold) var(--fs-h1)/var(--lh-head) var(--font-display);letter-spacing:var(--tracking-display)}
.t-h2{font:var(--fw-bold) var(--fs-h2)/var(--lh-head) var(--font-display);letter-spacing:-.025em}
.t-h3{font:var(--fw-semibold) var(--fs-h3)/1.05 var(--font-display);letter-spacing:-.02em}
.t-h4{font:var(--fw-medium) var(--fs-h4)/1.15 var(--font-display)}
.t-body{font:var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font-body)}
.t-lead{font:var(--fw-regular) var(--fs-body-lg)/1.45 var(--font-body)}
.t-meta{font:var(--fw-regular) var(--fs-meta)/1.4 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase}
.t-data{font:var(--fw-regular) 14px/1.7 var(--font-mono)}

/* States */
.s-energy{background:var(--bg-energy);color:var(--fg-on-energy)}
.s-matter{background:var(--bg-matter);color:var(--fg-on-matter)}
.s-space{background:var(--bg-space);color:var(--fg-on-space)}
.s-matter .hl,.hl-y{color:var(--hn-yellow)}
.mark{background:var(--hn-yellow);color:var(--hn-deep-space);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}

/* Grid */
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gutter)}
.rule{border-top:var(--border-bold)}
.rule-hair{border-top:var(--border-hair)}

/* Components (vanilla mirrors of the React kit) */
.hn-btn{font:500 14px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:14px 24px;border:2px solid var(--hn-deep-space);border-radius:0;background:var(--hn-deep-space);color:var(--hn-cosmic-mist);display:inline-flex;gap:12px;align-items:center;cursor:pointer;text-decoration:none;transition:all var(--dur-fast) var(--ease-field)}
.hn-btn::after{content:"+"}
.hn-btn:hover{background:var(--hn-yellow);color:var(--hn-deep-space);transform:translate(3px,-3px)}
.hn-btn.accent{background:var(--hn-yellow);color:var(--hn-deep-space)}
.hn-btn.accent:hover{background:var(--hn-deep-space);color:var(--hn-yellow)}
.hn-btn.outline{background:transparent;color:inherit;border-color:currentColor}
.hn-btn.outline:hover{background:var(--hn-deep-space);color:var(--hn-cosmic-mist)}
.s-matter .hn-btn{border-color:var(--hn-cosmic-mist)}
.hn-btn.sm{padding:8px 14px;font-size:12px}.hn-btn.lg{padding:20px 36px;font-size:18px}
.hn-btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}

.hn-tag{justify-self:start;align-self:start;width:max-content;font:400 11px/1 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:6px 10px;display:inline-flex;gap:8px;border:1px solid currentColor;background:transparent;color:inherit}
.hn-tag b{font-weight:500}
.hn-tag.yellow{background:var(--hn-yellow);color:var(--hn-deep-space);border-color:var(--hn-deep-space)}
.hn-tag.ink{background:var(--hn-deep-space);color:var(--hn-cosmic-mist);border-color:var(--hn-deep-space)}

.hn-input{display:grid;gap:8px}
.hn-input span{font:400 11px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase}
.hn-input input,.hn-input textarea{font:400 18px var(--font-body);color:inherit;background:transparent;border:0;border-bottom:2px solid currentColor;border-radius:0;padding:10px 0;outline:none}
.hn-input input:focus,.hn-input textarea:focus{border-bottom-color:var(--hn-yellow)}

.hn-label{font:400 11px/1.4 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase}
.hn-index{font:500 11px/1 var(--font-mono);letter-spacing:var(--tracking-meta)}

/* Fixed-size frames (social posts, slides, posters) — build.py screenshots each .hn-frame */
.hn-frame{position:relative;overflow:hidden}
.hn-stage{display:flex;flex-direction:column;gap:40px;align-items:center;padding:40px;background:#9a9a94}
@media (max-width:760px){.hn-stage{padding:16px}}

@keyframes hn-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes hn-orbit{to{transform:rotate(360deg)}}
@keyframes hn-spin{to{transform:rotate(360deg)}}
@keyframes hn-star{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.82) rotate(45deg)}}
@keyframes hn-ring{0%{r:4;opacity:1}100%{r:46;opacity:0}}
@keyframes hn-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<style>
:root{--wrap:1240px}

body{overflow-x:hidden}
a{text-decoration:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--margin-page)}
.skip{position:absolute;left:-999px}.skip:focus{left:16px;top:16px;z-index:99;background:var(--hn-yellow);padding:8px 12px}
:focus-visible{outline:2px solid var(--hn-deep-space);outline-offset:3px}
.s-matter :focus-visible{outline-color:var(--hn-yellow)}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:40;border-bottom:2px solid var(--hn-deep-space)}
.hdr-in{display:flex;justify-content:space-between;align-items:center;gap:24px;height:72px}
.brand{display:flex;align-items:center;gap:16px;color:inherit}
.brand:hover{background:none}
.brand img{height:26px;width:auto}
.brand .t-meta{padding-left:16px;border-left:1px solid var(--hn-deep-space)}
.nav{display:flex;gap:4px}
.nav a{font:500 12px/1 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:10px 12px;color:inherit;transition:background var(--dur-fast) var(--ease-field),color var(--dur-fast) var(--ease-field)}
.nav a:hover{background:var(--hn-deep-space);color:var(--hn-yellow)}
.nav a.on{background:var(--hn-deep-space);color:var(--hn-yellow)}
.nav a .n{opacity:.55;margin-right:6px}
.menu{display:none;font:500 12px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;background:var(--hn-deep-space);color:var(--hn-yellow);border:0;padding:10px 14px;cursor:pointer}

/* ---------- sections ---------- */
.sec{padding:96px 0;border-top:var(--border-bold);display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:var(--gutter)}
.sec:first-child{border-top:0}
.sec-label{position:sticky;top:104px;align-self:start}
.sec h2,.h2{margin:0 0 32px;font:700 clamp(36px,4.6vw,56px)/.98 var(--font-display);letter-spacing:-.03em;text-transform:uppercase}
.s-matter .sec{border-top-color:var(--hn-cosmic-mist)}
.lead-max{max-width:640px}

/* ---------- hero (home) ---------- */
.hero{position:relative;padding:112px 0 128px;overflow:visible}
.hero-text{position:relative;z-index:2;width:60%}
.hero-mega{font:700 clamp(54px,7.4vw,118px)/.9 var(--font-display);letter-spacing:-.045em;text-transform:uppercase;margin:28px 0 32px}
.hero .t-lead{max-width:560px;margin:0;font-size:22px}
.btns{display:flex;gap:16px;flex-wrap:wrap;margin-top:40px}
.hero-field{position:absolute;right:0;top:64px;width:34%;height:calc(100% + 110px);z-index:1}
.hero-field::after{content:"FIELD 01 · PARTICLES · DENSITY 0.82";position:absolute;left:16px;bottom:14px;font:400 11px var(--font-mono);letter-spacing:var(--tracking-meta);color:var(--hn-cosmic-mist);opacity:.75}

/* ---------- signal strip ---------- */
.signal{padding:40px 0;position:relative;z-index:0}
.signal-in{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gutter);font:400 13px/1.8 var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.signal-in>div:nth-child(1){grid-column:1 / span 3}
.signal-in>div:nth-child(2){grid-column:4 / span 5;display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font:700 40px/1 var(--font-display);letter-spacing:-.03em;color:var(--hn-yellow)}
.stat span{opacity:.75}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-soft);border-left:1px solid var(--line-soft)}
.card{display:flex;flex-direction:column;gap:14px;padding:20px 20px 28px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);color:inherit;transition:background var(--dur-base) var(--ease-field)}
.card:hover{background:var(--hn-yellow)}
.card .viz{position:relative;aspect-ratio:4/3;background:var(--hn-deep-space);overflow:hidden}
.card .viz canvas{width:100%;height:100%;display:block}
.card .viz .num{position:absolute;left:12px;top:10px;font:500 11px var(--font-mono);letter-spacing:var(--tracking-meta);color:var(--hn-cosmic-mist)}
.card .viz .tex{position:absolute;right:12px;bottom:10px;font:400 10px var(--font-mono);letter-spacing:var(--tracking-meta);color:var(--hn-cosmic-mist);opacity:.6;text-transform:uppercase}
.card h3{margin:4px 0 0;font:700 21px/1.08 var(--font-display);letter-spacing:-.02em;text-transform:uppercase}
.card p{margin:0;font:400 14px/1.5 var(--font-body);color:var(--fg-2)}
.card:hover p{color:var(--hn-deep-space)}
.card .meta{margin-top:auto;padding-top:8px}

/* ---------- stats / clients ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:var(--border-bold);margin-top:48px}
.stats div{padding:24px 16px 0 0}
.stats b{display:block;font:700 clamp(44px,5.6vw,80px)/1 var(--font-display);letter-spacing:-.04em}
.clients{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-soft)}
.clients span{font:400 13px/1.4 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;padding:14px 12px 14px 0;border-bottom:1px solid var(--line-soft)}
.clients span b{font-weight:500;margin-right:10px;opacity:.5}

/* ---------- principles ---------- */
.princ{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid currentColor;border-left:1px solid currentColor}
.princ article{padding:28px 24px 36px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;display:grid;gap:16px;align-content:start;transition:background var(--dur-base) var(--ease-field),color var(--dur-base) var(--ease-field)}
.princ svg{width:72px;height:72px}
.princ h3{margin:0;font:700 22px/1.05 var(--font-display);letter-spacing:-.02em;text-transform:uppercase}
.princ p{margin:0;font:400 15px/1.55 var(--font-body)}
.s-matter .princ{border-color:rgba(244,244,238,.35)}
.s-matter .princ article{border-color:rgba(244,244,238,.35)}
.s-matter .princ article:hover{background:var(--hn-yellow);color:var(--hn-deep-space)}
.s-space .princ{border-color:var(--line-soft)}.s-space .princ article{border-color:var(--line-soft)}
.s-space .princ article:hover{background:var(--hn-yellow)}

/* ---------- CTA ---------- */
.cta{padding:120px 0 128px;position:relative;overflow:hidden}
.cta h2{font:700 clamp(48px,8vw,128px)/.9 var(--font-display);letter-spacing:-.045em;text-transform:uppercase;margin:24px 0 40px;max-width:11ch}
.cta .sym{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:min(44vw,520px);height:min(44vw,520px);color:var(--hn-deep-space)}

/* ---------- page heads ---------- */
.phead{padding:88px 0 72px}
.phead h1{font:700 clamp(56px,11vw,176px)/.88 var(--font-display);letter-spacing:-.05em;text-transform:uppercase;margin:24px 0 28px}
.phead .t-lead{max-width:640px;margin:0}
.phead.s-energy{position:relative;overflow:hidden}
.phead .corner{position:absolute;right:0;top:0;bottom:0;width:34%}

/* ---------- work controls ---------- */
.ctrl{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:flex-start;padding:24px 0;border-top:var(--border-bold);border-bottom:1px solid var(--line-soft);margin-bottom:32px}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.chip{font:400 11px/1 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:8px 10px;border:1px solid var(--hn-deep-space);background:transparent;color:inherit;cursor:pointer;display:inline-flex;gap:8px;transition:background var(--dur-fast) var(--ease-field)}
.chip b{font-weight:500;opacity:.5}
.chip:hover{background:var(--hn-nebula-gray)}
.chip.on{background:var(--hn-yellow)}
.chip.on b{opacity:1}
.seg{display:inline-flex;border:1px solid var(--hn-deep-space)}
.seg button{font:500 11px/1 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:9px 12px;border:0;background:transparent;color:inherit;cursor:pointer}
.seg button.on{background:var(--hn-deep-space);color:var(--hn-yellow)}
.ctrl-l{display:grid;gap:14px;flex:1;min-width:280px}
.ctrl-r{display:flex;gap:12px;align-items:center}
.count{font:400 11px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase}

/* index list */
.idx-list{border-top:var(--border-bold)}
.row{display:grid;grid-template-columns:64px minmax(0,6fr) minmax(0,3fr) minmax(0,3fr);gap:var(--gutter);padding:20px 8px;border-bottom:1px solid var(--line-soft);color:inherit;align-items:baseline;transition:background var(--dur-fast) var(--ease-field)}
.row:hover{background:var(--hn-yellow)}
.row .y{font:500 13px var(--font-mono)}
.row h3{margin:0;font:700 20px/1.1 var(--font-display);letter-spacing:-.015em;text-transform:uppercase}
.row small{display:block;margin-top:6px;font:400 14px/1.4 var(--font-body);color:var(--fg-2)}
.row .c{font:400 12px/1.5 var(--font-mono);letter-spacing:.06em;text-transform:uppercase}

/* ---------- case ---------- */
.case-head{padding-top:56px;padding-bottom:64px}
.back{display:inline-flex;gap:10px;color:inherit}
.back:hover{background:var(--hn-yellow)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:40px 0 24px}
.case-title{font:700 clamp(38px,5.6vw,84px)/.95 var(--font-display);letter-spacing:-.035em;text-transform:uppercase;margin:0;max-width:18ch}
.case-head .t-lead{max-width:720px;margin:24px 0 0;font-size:22px}
.band{position:relative;height:380px}
.band canvas{position:absolute;inset:0}
.band-box{position:absolute;left:var(--margin-page);bottom:-56px;padding:20px 28px 24px;display:grid;gap:4px;z-index:2;min-width:220px}
.band-box b{font:700 120px/.85 var(--font-display);letter-spacing:-.05em}
.case-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:var(--gutter);padding-top:120px;padding-bottom:96px}
.case-meta{position:sticky;top:104px;align-self:start;display:grid;gap:0;border-top:var(--border-bold)}
.case-meta div{padding:14px 0;border-bottom:1px solid var(--line-soft)}
.case-meta dt{font:400 11px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;opacity:.6;margin-bottom:6px}
.case-meta dd{margin:0;font:500 15px/1.4 var(--font-body)}
.case-meta .hn-btn{margin-top:20px;justify-content:center}
.prose{max-width:720px;font:400 18px/1.68 var(--font-body)}
.prose p{margin:0 0 1.15em}
.prose strong{font-weight:600}
.prose a{text-decoration:underline;text-underline-offset:3px}
.prose .c-h2{display:grid;gap:10px;margin:64px 0 20px;padding-top:24px;border-top:var(--border-bold);font:700 30px/1.02 var(--font-display);letter-spacing:-.025em;text-transform:uppercase}
.prose .c-h2:first-child{margin-top:0}
.prose .c-h2 .idx{font:500 11px var(--font-mono);letter-spacing:var(--tracking-meta)}
.prose .c-h3{margin:36px 0 12px;font:700 20px/1.15 var(--font-display);text-transform:uppercase;letter-spacing:-.01em}
.prose ul,.prose ol{margin:0 0 1.3em;padding:0;list-style:none;counter-reset:li}
.prose li{position:relative;padding:12px 0 12px 44px;border-top:1px solid var(--line-soft)}
.prose li:last-child{border-bottom:1px solid var(--line-soft)}
.prose ul li::before{content:"";position:absolute;left:8px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--hn-deep-space)}
.prose ol li{counter-increment:li}
.prose ol li::before{content:counter(li,decimal-leading-zero);position:absolute;left:0;top:15px;font:500 12px var(--font-mono);letter-spacing:.1em}
.prose .c-quote{margin:40px 0;padding:28px 32px;background:var(--hn-deep-space);color:var(--hn-cosmic-mist);font:600 clamp(22px,2.4vw,28px)/1.25 var(--font-display);letter-spacing:-.015em}
.prose .c-quote:first-child{margin-top:0}
.prose figure{margin:32px 0}
.prose .c-img img{width:100%;height:auto;border:1px solid var(--line-soft)}
.prose .c-video{position:relative;aspect-ratio:16/9;background:var(--hn-deep-space)}
.prose .c-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.next{display:block;padding:56px 0 64px;color:inherit;transition:background var(--dur-base) var(--ease-field),color var(--dur-base) var(--ease-field)}
.next .nx{display:grid;grid-template-columns:1fr auto;align-items:end;gap:16px 40px}
.next:hover{background:var(--hn-deep-space);color:var(--hn-yellow)}
.next .t{font:700 clamp(30px,4.4vw,64px)/.95 var(--font-display);letter-spacing:-.035em;text-transform:uppercase;max-width:20ch}
.next .arr{font:700 clamp(48px,6vw,96px)/1 var(--font-display)}

/* ---------- about ---------- */
.quote-band{padding:96px 0}
.quote-band p{font:700 clamp(30px,4vw,56px)/1.02 var(--font-display);letter-spacing:-.03em;text-transform:uppercase;margin:24px 0 0;max-width:22ch}
.quote-band .rest{font:400 19px/1.55 var(--font-body);text-transform:none;letter-spacing:0;max-width:640px;margin-top:28px;opacity:.85}
.exp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}
.exp h3{margin:0 0 12px;font:700 22px/1.1 var(--font-display);text-transform:uppercase}
.exp p{margin:0;font:400 16px/1.6 var(--font-body)}
.lines{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-soft)}
.lines li{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft);font:400 16px/1.5 var(--font-body)}
.lines li b{font:500 12px/1.9 var(--font-mono);letter-spacing:.1em}
.lines a{text-decoration:underline;text-underline-offset:3px}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- footer ---------- */
.ftr{padding:72px 0 40px;border-top:1px solid rgba(244,244,238,.18)}
.ftr-in{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--gutter);align-items:end}
.ftr .t-h3{font-size:clamp(36px,4.4vw,56px);line-height:.95;text-transform:uppercase;font-weight:700;letter-spacing:-.03em}
.ftr nav{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.ftr nav a{font:500 12px/1 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:10px 12px;color:inherit}
.ftr nav a:hover{background:var(--hn-yellow);color:var(--hn-deep-space)}
.ftr-sig{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-top:56px;padding-top:24px;border-top:1px solid rgba(244,244,238,.25)}
.ftr-sig img{height:56px;width:auto;animation:hn-breathe 5s var(--ease-field) infinite}

/* route transition */
#app{animation:enter .5s var(--ease-field)}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .cards,.princ{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-text{width:100%}
  .hero{padding:72px 0 0}
  .hero-field{position:relative;top:auto;right:auto;width:100%;height:280px;margin-top:56px}
  .clients{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:800px){
  :root{--margin-page:16px}
  .sec{grid-template-columns:1fr;padding:64px 0;gap:16px}
  .sec-label{position:static}
  .cards,.princ,.exp{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .signal-in>div{grid-column:1/-1!important;justify-content:flex-start!important}
  .brand .t-meta{display:none}
  .menu{display:block}
  .nav{display:none;position:absolute;left:0;right:0;top:72px;flex-direction:column;padding:8px 16px 16px;background:var(--hn-yellow);border-bottom:2px solid var(--hn-deep-space)}
  .nav.open{display:flex}
  .nav a{padding:16px 8px;font-size:14px;border-bottom:1px solid rgba(34,34,34,.2)}
  .row{grid-template-columns:52px 1fr;gap:12px}
  .row .c{grid-column:2}
  .case-grid{grid-template-columns:1fr;padding-top:96px;padding-bottom:64px;gap:40px}
  .case-meta{position:static}
  .band{height:240px}
  .band-box b{font-size:84px}
  .prose{font-size:17px}
  .ftr-in{grid-template-columns:1fr}
  .ftr nav{justify-content:flex-start}
  .cta .sym{opacity:.25;right:-120px}
  .phead .corner{display:none}
}
@media print{.hdr,.ctrl,.next,.ftr nav{display:none}}

.adm .hn-btn::after{content:none}
.adm .hn-btn{cursor:pointer}
.adm-bar{position:sticky;top:0;z-index:6;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding:12px var(--margin-page);border-bottom:2px solid var(--hn-yellow)}
.adm-bar .brand-a{font:700 15px var(--font-display);letter-spacing:-.02em;text-transform:uppercase}
.adm-tabs{display:flex;gap:4px}
.adm-tabs button{font:500 12px/1 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:10px 12px;border:0;background:transparent;color:inherit;cursor:pointer}
.adm-tabs button.on{background:var(--hn-yellow);color:var(--hn-deep-space)}
.adm-sp{flex:1}
.adm-status{font:400 11px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;opacity:.8}
.adm-status.dirty{color:var(--hn-yellow);opacity:1}
.adm-demo{background:var(--hn-yellow);color:var(--hn-deep-space);font:500 11px/1.4 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;padding:8px var(--margin-page)}
.adm-body{max-width:1280px;margin:0 auto;padding:40px var(--margin-page) 120px}
.adm h1{font:700 clamp(32px,4vw,52px)/.95 var(--font-display);letter-spacing:-.035em;text-transform:uppercase;margin:0 0 8px}
.adm h2.sh{font:700 22px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:-.02em;margin:56px 0 16px;padding-top:20px;border-top:var(--border-bold)}
.adm .muted{font:400 14px/1.5 var(--font-body);color:var(--fg-2);margin:0 0 24px;max-width:640px}
.adm .row-h{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:24px}

/* case list */
.cl{border-top:var(--border-bold)}
.cl-r{display:grid;grid-template-columns:40px minmax(0,1fr) 64px 160px 100px auto;gap:12px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line-soft)}
.cl-r:hover{background:rgba(253,238,61,.25)}
.cl-r .n{font:500 12px var(--font-mono)}
.cl-r .tt{background:none;border:0;text-align:left;cursor:pointer;font:700 17px/1.15 var(--font-display);text-transform:uppercase;letter-spacing:-.01em;color:inherit;padding:0}
.cl-r .tt:hover{text-decoration:underline}
.cl-r .cc{font:400 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-act{display:flex;gap:2px}
.ib{font:500 12px var(--font-mono);border:1px solid transparent;background:transparent;color:inherit;cursor:pointer;padding:6px 8px;min-width:30px}
.ib:hover{background:var(--hn-deep-space);color:var(--hn-yellow)}
.ib.on{color:#b59f00}
.st{font:500 10px/1 var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;padding:5px 8px;border:1px solid var(--hn-deep-space);justify-self:start;cursor:pointer;background:transparent;color:inherit}
.st.pub{background:var(--hn-yellow)}
.st.draft{opacity:.6;border-style:dashed}

/* forms */
.fld{display:grid;gap:6px;margin:0 0 20px}
.fld>label,.fld>.l{font:400 11px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase}
.fld input,.fld textarea,.fld select,.mdl input{font:400 16px/1.4 var(--font-body);color:inherit;background:transparent;border:0;border-bottom:2px solid var(--hn-deep-space);border-radius:0;padding:8px 0;outline:none;width:100%}
.fld textarea{border:2px solid var(--hn-deep-space);padding:10px;resize:vertical;line-height:1.5}
.fld select{background:var(--hn-cosmic-mist)}
.fld input:focus,.fld textarea:focus,.mdl input:focus{border-color:var(--hn-yellow);box-shadow:0 2px 0 0 var(--hn-yellow)}
.fld textarea:focus{box-shadow:none;outline:2px solid var(--hn-yellow)}
.fld .hint{font:400 12px var(--font-body);color:var(--fg-2)}
.chk{display:flex;gap:10px;align-items:center;font:500 12px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:#222}
.card-box{border:1px solid var(--hn-deep-space);padding:20px;margin-bottom:16px;background:var(--hn-white)}
.card-box .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}

/* tag chips input */
.chipsin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:2px solid var(--hn-deep-space);padding:6px 0}
.chipsin input{border:0!important;box-shadow:none!important;flex:1;min-width:80px;padding:4px 0!important;font-size:14px!important}
.tagchip{display:inline-flex;gap:6px;align-items:center;font:400 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;background:var(--hn-yellow);padding:6px 4px 6px 8px;border:1px solid var(--hn-deep-space)}
.tagchip button{border:0;background:none;cursor:pointer;font-size:14px;line-height:1;padding:0 4px;color:inherit}

/* editor */
.ed-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:48px;align-items:start}
.ed-title,.ed-sub{width:100%;border:0;background:transparent;outline:none;color:inherit;padding:0;resize:none;overflow:hidden;display:block}
.ed-title{font:700 clamp(34px,4.4vw,60px)/.98 var(--font-display);letter-spacing:-.035em;text-transform:uppercase;margin:16px 0 12px}
.ed-sub{font:400 22px/1.4 var(--font-body);color:var(--fg-2);margin-bottom:24px}
.ed-tools{position:sticky;top:calc(var(--bar-h,60px) + 8px);z-index:4;display:flex;flex-wrap:wrap;gap:2px;padding:6px;margin:0 0 28px;background:var(--hn-deep-space);color:var(--hn-cosmic-mist)}
.ed-tools button,.bub button{font:500 12px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;border:0;background:transparent;color:inherit;padding:9px 10px;cursor:pointer}
.ed-tools button:hover,.bub button:hover{background:var(--hn-yellow);color:var(--hn-deep-space)}
.ed-tools .sep{width:1px;background:rgba(244,244,238,.3);margin:4px 6px}
.ed{outline:none;min-height:55vh;max-width:none;counter-reset:h2;padding-left:36px;position:relative}
.ed h2.c-h2{counter-increment:h2}
.ed h2.c-h2::before{content:counter(h2,decimal-leading-zero) " —";font:500 11px var(--font-mono);letter-spacing:var(--tracking-meta)}
.ed.empty::before{content:"Write here. Type ## for a section, ### for a subhead, - for a list, > for a quote. Select text to format it.";position:absolute;left:36px;top:0;color:var(--fg-2);pointer-events:none;max-width:520px}
.ed figure{position:relative;cursor:default}
.ed figure.sel img,.ed figure.sel .c-video{outline:3px solid var(--hn-yellow)}
.ed figure iframe{pointer-events:none}
.ed .fig-x{position:absolute;right:8px;top:8px;background:var(--hn-deep-space);color:var(--hn-yellow);border:0;font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;padding:8px 10px;cursor:pointer;opacity:0;transition:opacity .15s}
.ed figure:hover .fig-x{opacity:1}
.ed .fig-bad{font:400 12px var(--font-mono);color:#b00020;padding:8px 0}
.bub{position:fixed;z-index:120;display:none;background:var(--hn-deep-space);color:var(--hn-cosmic-mist);padding:3px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.bub.open{display:flex}
.plus{position:absolute;z-index:3;left:0;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--hn-deep-space);background:var(--hn-cosmic-mist);font:500 18px/1 var(--font-mono);cursor:pointer;display:none;padding:0}
.plus:hover{background:var(--hn-yellow)}
.plusmenu{position:fixed;z-index:121;background:var(--hn-deep-space);color:var(--hn-cosmic-mist);display:none;padding:4px;min-width:200px}
.plusmenu.open{display:grid}
.plusmenu button{text-align:left;font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;border:0;background:transparent;color:inherit;padding:10px 12px;cursor:pointer}
.plusmenu button:hover{background:var(--hn-yellow);color:var(--hn-deep-space)}
.ed-side{position:sticky;top:calc(var(--bar-h,60px) + 16px);max-height:calc(100vh - var(--bar-h,60px) - 32px);overflow:auto;padding-right:6px}

/* modal */
.mdl-bg{position:fixed;inset:0;z-index:200;background:rgba(34,34,34,.6);display:grid;place-items:center;padding:16px}
.mdl{background:var(--hn-cosmic-mist);color:var(--hn-deep-space);border:2px solid var(--hn-deep-space);padding:28px;width:min(480px,100%);box-shadow:8px 8px 0 var(--hn-yellow)}
.mdl h3{margin:0 0 20px;font:700 24px/1 var(--font-display);text-transform:uppercase;letter-spacing:-.02em}
.mdl .fld{margin-bottom:16px}
.mdl .err{color:#b00020;font:500 12px var(--font-mono);min-height:18px;margin:4px 0 12px}
.mdl .btns{margin-top:8px}
.mdl-note{font:400 12px/1.5 var(--font-body);color:var(--fg-2);margin:-8px 0 14px}

.adm-pill{position:fixed;right:16px;bottom:16px;z-index:90;font:500 12px var(--font-mono);letter-spacing:var(--tracking-meta);text-transform:uppercase;background:var(--hn-deep-space);color:var(--hn-yellow);border:2px solid var(--hn-yellow);padding:12px 16px;cursor:pointer;display:none}
.adm-pill.show{display:block}
.adm-pill.dirty::before{content:"● ";}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;background:var(--hn-deep-space);color:var(--hn-yellow);font:500 12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;padding:14px 20px}
.toast.err{background:#b00020;color:#fff}

@media (max-width:980px){
  .ed-wrap{grid-template-columns:1fr}
  .ed-side{position:static;max-height:none}
  .cl-r{grid-template-columns:32px minmax(0,1fr) auto}
  .cl-r .yr,.cl-r .cc,.cl-r .stc{display:none}
  .g2{grid-template-columns:1fr}
  .adm-body{padding-left:16px;padding-right:16px}
  .adm-bar{padding-left:16px;padding-right:16px}
}

.cover-prev{display:grid;gap:8px;justify-items:start}
.cover-prev .duo{width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid var(--hn-deep-space)}
.cover-none{font:400 12px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);border:1px dashed var(--hn-deep-space);padding:16px;width:100%}

.adm .lang{border-color:#F4F4EE;margin:0 4px}
.adm .lang button{color:#F4F4EE}
.adm .lang button.on{background:var(--hn-yellow);color:#222}
.adm .lang button:not(.on):hover{background:rgba(244,244,238,.18)}

/* ---------- home hero (dark, particle field) ---------- */
.hero-d{position:relative;min-height:calc(100vh - 72px);display:flex;overflow:hidden}
.hero-d canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-in{position:relative;z-index:1;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;gap:40px;padding-top:clamp(28px,5vw,64px);padding-bottom:clamp(32px,5vw,56px);width:100%}
.hero-in .btns{pointer-events:auto;margin:0}
.hero-top{margin:0;color:#D7D7D7}
.hero-h1{align-self:center;margin:0;max-width:19ch;font:700 clamp(36px,5.4vw,92px)/1.02 var(--font-display);letter-spacing:-.035em;color:#F4F4EE}
.hero-l{display:block;text-wrap:balance}
.hero-ph{display:grid;position:relative;color:var(--hn-yellow);margin-top:.06em}
.hero-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.hero-tag{font:500 clamp(12px,1.1vw,14px)/1 var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:#D7D7D7}
.hero-d .hn-btn.accent:hover{background:#F4F4EE;color:#222}
.hero-d .hn-btn.outline{border-color:#F4F4EE;color:#F4F4EE}
.hero-d .hn-btn.outline:hover{background:#F4F4EE;color:#222}
.signal{border-top:1px solid rgba(244,244,238,.18)}
/* Spanish words are longer: keep big page titles clear of the corner texture */
html[lang="es"] .phead h1{font-size:clamp(40px,7.2vw,140px);overflow-wrap:break-word}
html[lang="es"] .phead:has(.corner) h1{max-width:64%}
.lang{display:flex;border:1px solid var(--hn-deep-space);flex:none}
.lang button{font:500 11px/1 var(--font-mono);letter-spacing:var(--tracking-meta);padding:9px 10px;border:0;background:transparent;color:inherit;cursor:pointer}
.lang button.on{background:var(--hn-deep-space);color:var(--hn-yellow)}
.lang button:not(.on):hover{background:rgba(34,34,34,.12)}
.no-es{font:400 14px/1.5 var(--font-mono);opacity:.7;border-left:3px solid var(--hn-yellow);padding-left:12px}
.posts{margin-top:56px}.posts-n{margin:0 0 16px}
.signal-in>div:nth-child(1){grid-column:1/-1;display:flex;gap:28px 48px;flex-wrap:wrap}
/* ---------- approach › method ---------- */
.method-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:clamp(56px,7vw,112px);align-items:center;padding-top:clamp(80px,11vw,160px);padding-bottom:clamp(80px,11vw,160px)}
.method-l{display:grid;gap:32px;align-content:start}
.method-k{color:#D7D7D7}
.method-h{margin:0;font:700 clamp(40px,5.4vw,88px)/.95 var(--font-display);letter-spacing:-.035em}
.method-card{border-top:1px solid rgba(244,244,238,.3);padding-top:24px;display:grid;gap:12px;min-height:180px}
.method-name{margin:0;font:700 clamp(36px,4vw,64px)/1 var(--font-display);letter-spacing:-.035em;color:var(--hn-yellow)}
.method-desc{margin:0;font:400 clamp(18px,1.6vw,22px)/1.4 var(--font-body);max-width:34ch}
.method-r{position:relative;width:min(540px,100%);aspect-ratio:1;justify-self:center;margin:24px 0}
.method-r canvas{position:absolute;inset:-6%;width:112%;height:112%;display:block;-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent 100%);mask-image:radial-gradient(closest-side,#000 62%,transparent 100%)}
.method-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;display:grid;gap:6px}
.method-core span:first-child{font:400 10px/1 var(--font-mono);letter-spacing:.14em;color:#D7D7D7}
.method-core span:last-child{font:500 11px/1 var(--font-mono);letter-spacing:.14em;color:var(--hn-yellow)}
.method-node{position:absolute;transform:translate(-50%,-50%);background:#222;color:#F4F4EE;border:1px solid #F4F4EE;border-radius:0;padding:12px 14px;cursor:pointer;display:grid;gap:4px;text-align:left;min-height:44px;transition:background .4s var(--ease-field),color .4s var(--ease-field)}
.method-node span{font:400 10px/1 var(--font-mono);letter-spacing:.14em}
.method-node b{font:700 clamp(13px,1.3vw,16px)/1 var(--font-display);letter-spacing:.02em}
.method-node.on{background:var(--hn-yellow);color:#222}
.method-node:hover:not(.on){background:#F4F4EE;color:#222}
</style>

const SEED = {"config":{"name":"Jose Augusto Ocampo","role":"Strategic Design & Transformation Director","disciplines":["Strategic Design","Design Futures","Transformation Design","CX Strategy"],"substack":"","linkedin":"","email":"","date":"08.10.2026"},"pages":{"home":{"lead":"I help organizations turn complexity into strategic clarity, and vision into action.","bio":"Strategic Design & CX Transformation Director with 15+ years building the conditions for organizations to navigate complexity, redesign how they operate, and create long-term value. I lead at the intersection of foresight, systems thinking, and human-centered design, translating strategic ambiguity into new operating models, digital ecosystems, and organizational capabilities. My work spans energy, financial services, retail, and public sector across Latin America.","hero":"I help people, brands and organizations to","phrases":["see what we couldn't see before.","change course.","question the rules we were given.","do things differently.","turn limits into possibilities.","imagine other futures.","let something new emerge.","discover new possibilities.","shift the way they look at things.","break with the predictable.","reimagine what already exists.","create from another place.","change the context.","redesign the conditions.","open new paths.","change the questions.","challenge what was taken for granted.","inhabit new scenarios.","start new conversations.","expand what seemed possible.","connect what was separate.","create new ways of relating.","give shape to what doesn't exist yet.","turn uncertainty into possibility.","try out other futures.","make the invisible visible."]},"approach":{"lead":"Every engagement starts with a question, not a solution. My practice is built on six principles that guide how I work with organizations facing strategic complexity — from reframing the right problem to designing the conditions for lasting change.","principles":[["Narrative as Strategy","I distill complex ideas into clear, focused narratives that inspire action and transformation. Through storytelling, I connect deeply with audiences and drive change by making the essential visible and memorable.","onda"],["Co-creation at Scale","I treat design as a shared process, working closely with communities to build solutions rooted in their realities. This inclusive approach leads to more meaningful, sustainable, and accepted outcomes.","superposicion"],["Systems Thinking","By embracing systems thinking, I design with awareness of the broader context—linking organizational dynamics, user needs, and societal forces to enable lasting, systemic impact.","orbita"],["Futures & Foresight","I help organizations look beyond the present, designing future-ready solutions that build resilience and ensure relevance in an ever-changing world.","campo"],["Experimenting for Rapid Impact","Through fast prototyping and iterative testing, I turn ideas into validated solutions quickly—accelerating learning, adaptation, and measurable innovation.","vector"],["Bespoke Framework Design","I design custom strategies that fit the challenge—not templates. By reframing problems and integrating systemic, human-centered thinking, I unlock meaningful and context-driven solutions.","nucleo"]]},"about":{"intro":"I'm a Strategic Design & Transformation Director with 15+ years building the conditions for organizations to navigate complexity, reimagine how they operate, and create long-term value. My practice sits at the intersection of foresight, systems thinking, service design, and human-centered co-creation — translating strategic ambiguity into actionable frameworks, new operating models, and organizational capabilities that endure.","quote":"I believe complexity is not a problem to be solved — it's a condition to be navigated. The organizations I work with don't need simpler answers. They need better questions, clearer models, and the organizational capability to act with intention under uncertainty.","experience":[["At VML","As Strategic Design &amp; CX Lead and now Consulting Director at VML Colombia, I've led end-to-end transformation engagements for organizations navigating strategic inflection points. My work spans foresight model design, digital ecosystem strategy, operating model redesign, and customer experience innovation — always at the intersection of design rigor and business pragmatism. I currently lead the LATAM Consulting Center of Excellence, scaling our strategic design practice across Colombia, Mexico, Peru, Chile, and Puerto Rico."],["Before VML","Over 11 years at Parque Explora, I built my practice from the ground up — starting as an exhibition designer and growing into Head of Innovation. I led the institution's most ambitious transformation projects: a full Science Center renovation, the design of immersive learning environments for national and international clients, and the development of Parque Explora's innovation methodology, published as <em>Compás de Diseño</em>. Work from this period earned recognition at the American Alliance of Museums (Muse Awards 2017) and the Ibero-American Design Biennial in Madrid."]],"education":["Master’s in Engineering (2015–2017) — EAFIT University","Product Design Engineering (2004–2010) — EAFIT University","Academic Exchange — Delft University of Technology (TU Delft), Netherlands (2008–2009)"],"certifications":["Systemic Design for Tackling Complexity — Service Design College, 2025","Branding and Customer Experience — IE University, 2024","Design Futures — CENTRO, 2023","Service Design — IxDF, 2023","Strategic Management and Innovation — Copenhagen Business School, 2021"],"disciplines":["Strategic Design","Service Design","Systems Thinking","Design Foresight","Human-Centered Design","Operating Model Design","Digital Ecosystem Strategy","Design Sprints","Transition Design"],"teaching":"11+ years of university teaching in experience design, interaction design, design thinking, and design-driven innovation at EAFIT University and Universidad Pontificia Bolivariana."},"thinking":{"lead":"A collection of my articles, podcasts, and writings, reflecting my passion for design, methodologies, and experiences. Here, I share insights and reflections on innovative design practices and the creation of meaningful user experiences.","substack":"Hipernova is a space to explore the frontiers of creativity, design, technology, and purposeful living. It's not a technical blog, nor a personal diary, nor a step-by-step consultancy guide. It's a crossroads: the practice of meaningful design, the energy of transformation, the wisdom of books, and the human experiences that show us new ways of relating to the world.","medium":"Writing for IxDF (Interaction Design Foundation) South America.","publications":["Ocampo-Agudelo J., Maya J. (2021) <strong>Core Concepts Linking Exhibit Design and the Visitor Experience in Science Centers: An Early Framework.</strong> In: Rauterberg M. (eds) Culture and Computing. HCII 2021. Lecture Notes in Computer Science, vol 12795. Springer, Cham. <a href=\"https://doi.org/10.1007/978-3-030-77431-8_7\" target=\"_blank\" rel=\"noopener\">doi.org/10.1007/978-3-030-77431-8_7</a>","Ministerio de Educación Nacional (2020). <strong>Visión STEM+A: Educación Expandida para la vida.</strong> Documento de trabajo del MEN.","Ocampo-Agudelo, Jose y Muñoz, Carolina (2019). <strong>Compás de diseño, guía para la creación de experiencias memorables de aprendizaje.</strong> Corporación Parque Explora. Medellín, Colombia.","Ocampo-Agudelo, Jose y equipo Explora (2017). <strong>Guion general de los espacios creativos.</strong> Secretaría Distrital de Cultura, Recreación y Deporte — Dirección de Lectura y Bibliotecas. <a href=\"http://www.coleccionbogota.biblored.gov.co/items/show/186\" target=\"_blank\" rel=\"noopener\">coleccionbogota.biblored.gov.co</a>","Ocampo-Agudelo, Jose; Maya, Jorge; Roldán, Andrés (2017). <strong>A Tool for the Design of Experience-Centered Exhibits in Science Centers.</strong> Poster, Science Centre World Summit. Tokyo, Japan.","Ocampo-Agudelo, J., &amp; Maya, J. (2017). <strong>Experiential qualities of science museum exhibits: a thematic analysis.</strong> ICED 17, Vol 8: Human Behaviour in Design, Vancouver, Canada (pp. 439–448). <a href=\"https://www.researchgate.net/publication/319402257_Experiential_qualities_of_science_museum_exhibits_a_thematic_analysis\" target=\"_blank\" rel=\"noopener\">researchgate.net</a>","Ocampo A., Jose Augusto (2016). <strong>Experiencias Memorables de Aprendizaje.</strong> Revista Explora tomo II (pp. 51–52). Parque Explora, Medellín. <a href=\"https://issuu.com/parqueexploramed/docs/revista_explora-2016\" target=\"_blank\" rel=\"noopener\">issuu.com</a>","Ocampo A., Jose Augusto (2016). <strong>Ambientes de Aprendizaje, Principios de Diseño.</strong> Revista Explora tomo II (pp. 132–133). Parque Explora, Medellín. <a href=\"https://issuu.com/parqueexploramed/docs/revista_explora-2016\" target=\"_blank\" rel=\"noopener\">issuu.com</a>","Corporación Parque Explora (2015). <strong>Guía para la formulación de Centros de Ciencia en Colombia.</strong> Colciencias.","Ocampo A., Jose Augusto (2014). <strong>El Diseño y El nuevo Museo: Apropiación desde la cuarta Dimensión.</strong> Periódico La Patria // Papel Salmón. Edición 1.120, pp. 4, 6.","Ocampo A., Jose Augusto (2014). <strong>Design of Interactions for Social Appropriation of Knowledge.</strong> Proceedings of the 9th International Conference on Design &amp; Emotion. Bogotá. Ediciones Uniandes. <a href=\"https://www.researchgate.net/publication/286048784_Design_of_interactions_for_social_appropriation_of_knowledge\" target=\"_blank\" rel=\"noopener\">researchgate.net</a>"]}},"projects":[{"id":"3d59a9f0000e80b78ae4eb569bafd73f","slug":"opex-rates-design-sprint","title":"OPEX Rates Design Sprint","sub":"From fragmented calculations to a more reliable decision-making system","year":2026,"client":["Ecopetrol"],"industry":["Energy"],"type":["CX Strategy"],"role":["Strategy Consulting Director"],"country":[],"highlight":false,"link":"","texture":"topo","excerpt":"Design Sprint & Problem Framing. I facilitated a three-day Design Sprint in Bogotá with more than 20 Ecopetrol participants. On the first day, we aligned the group around the challenge, defined the long-term goal and…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation — The Challenge</h2>\n<p>Ecopetrol’s OPEX rate calculation process relied heavily on manual work, fragmented data sources, individual spreadsheets, and different calculation criteria across teams. This made the process harder to trace, standardize, and scale, while limiting the time analysts could dedicate to higher-value analysis. The challenge was to rethink a critical part of the process and explore how a single, more reliable tool could connect data, standardize calculations, strengthen traceability, and better support Portfolio, Reserves, and FMV processes.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Task — My Role</h2>\n<p>I led the engagement end to end, directing the multidisciplinary team responsible for research, synthesis, facilitation, prototyping, and strategic definition. I designed and facilitated the three-day Design Sprint with Ecopetrol, guiding a group of more than 20 participants through problem framing, prioritization, ideation, concept development, and validation. I also led the integration of user needs, process requirements, governance considerations, and technical feasibility into a coherent solution and implementation roadmap.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Action — The Process</h2>\n<p><strong>Immersion &amp; Process Mapping.</strong> I led the team through an initial planning phase that included 13 interviews with stakeholders across Ecopetrol, a detailed mapping of the OPEX rate calculation process, and a review of the main tools involved, including SAP, VALNAV, Spotfire, and Planning Space. This allowed us to identify the main barriers around manual work, data access, traceability, methodological consistency, scalability, and the absence of a single source of truth.</p>\n<p><strong>Design Sprint &amp; Problem Framing.</strong> I facilitated a three-day Design Sprint in Bogotá with more than 20 Ecopetrol participants. On the first day, we aligned the group around the challenge, defined the long-term goal and Sprint focus, explored relevant references, and generated initial concepts. This resulted in five prioritized solution modules: pre-comparison, normalization, escalation, rate visualization, and reporting.</p>\n<p><strong>Co-Design &amp; Prototyping.</strong> I guided the team through the detailed development of the five modules, defining flows, interaction logic, and key design decisions. In parallel, we worked with the technology team on feasibility and architecture considerations, while another workstream explored process governance, roles, knowledge continuity, and data management. These inputs were consolidated into a high-fidelity prototype that represented a more integrated and traceable end-to-end experience.</p>\n<p><strong>Validation with Stakeholders.</strong> On the final day, we tested the prototype with key stakeholders from different areas of Ecopetrol and used their feedback to refine the solution. The validation reinforced the value of reducing operational effort so that analysts could spend more time challenging assumptions, working closer to operations, and strengthening process assurance rather than managing manual consolidation.</p>\n<p><strong>From Prototype to Implementation.</strong> After the Sprint, I led the consolidation of the final prototype, backlog, and implementation roadmap. The solution was structured into three waves: an MVP focused on the core calculation workflow, a functional expansion including visualization and reporting, and a complementary phase introducing AI-assisted capabilities and further automation.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Result</h2>\n<p>The Sprint transformed a complex operational challenge into a validated product concept, a prioritized backlog, and a clear path toward implementation. The team aligned around a shared vision for a more standardized, traceable, and scalable process, with five core modules and more than 20 key functionalities defined during the engagement. Most importantly, the work reframed automation not simply as a way to reduce manual effort, but as a means to free analysts to focus on judgment, operational insight, and stronger decision-making.</p>","status":"published","cover":"","es":{"title":"Sprint de diseño de tarifas OPEX","sub":"De cálculos fragmentados a un sistema de decisión más confiable","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación — El desafío</h2>\n<p>El proceso de cálculo de tarifas OPEX de Ecopetrol dependía en gran medida del trabajo manual, de fuentes de datos fragmentadas, de hojas de cálculo individuales y de criterios de cálculo distintos entre equipos. Esto hacía que el proceso fuera más difícil de trazar, estandarizar y escalar, y limitaba el tiempo que los analistas podían dedicar a análisis de mayor valor. El desafío era repensar una parte crítica del proceso y explorar cómo una única herramienta, más confiable, podía conectar datos, estandarizar cálculos, fortalecer la trazabilidad y apoyar mejor los procesos de Portafolio, Reservas y FMV.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Tarea — Mi rol</h2>\n<p>Lideré el proyecto de principio a fin, dirigiendo al equipo multidisciplinario responsable de la investigación, la síntesis, la facilitación, el prototipado y la definición estratégica. Diseñé y facilité el Design Sprint de tres días con Ecopetrol, guiando a un grupo de más de 20 participantes a través del encuadre del problema, la priorización, la ideación, el desarrollo de conceptos y la validación. También lideré la integración de las necesidades de los usuarios, los requerimientos del proceso, las consideraciones de gobernanza y la factibilidad técnica en una solución coherente y una hoja de ruta de implementación.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acción — El proceso</h2>\n<p><strong>Inmersión y mapeo del proceso.</strong> Lideré al equipo en una fase inicial de planeación que incluyó 13 entrevistas con stakeholders de Ecopetrol, un mapeo detallado del proceso de cálculo de tarifas OPEX y una revisión de las principales herramientas involucradas, entre ellas SAP, VALNAV, Spotfire y Planning Space. Esto nos permitió identificar las principales barreras en torno al trabajo manual, el acceso a los datos, la trazabilidad, la consistencia metodológica, la escalabilidad y la ausencia de una única fuente de verdad.</p>\n<p><strong>Design Sprint y encuadre del problema.</strong> Facilité un Design Sprint de tres días en Bogotá con más de 20 participantes de Ecopetrol. El primer día alineamos al grupo en torno al desafío, definimos la meta de largo plazo y el foco del Sprint, exploramos referentes relevantes y generamos los primeros conceptos. Esto dio como resultado cinco módulos de solución priorizados: precomparación, normalización, escalamiento, visualización de tarifas y reportería.</p>\n<p><strong>Co-diseño y prototipado.</strong> Guié al equipo en el desarrollo detallado de los cinco módulos, definiendo flujos, lógica de interacción y decisiones clave de diseño. En paralelo, trabajamos con el equipo de tecnología en consideraciones de factibilidad y arquitectura, mientras otra línea de trabajo exploraba la gobernanza del proceso, los roles, la continuidad del conocimiento y la gestión de datos. Estos insumos se consolidaron en un prototipo de alta fidelidad que representaba una experiencia de punta a punta más integrada y trazable.</p>\n<p><strong>Validación con stakeholders.</strong> El último día probamos el prototipo con stakeholders clave de distintas áreas de Ecopetrol y usamos sus comentarios para refinar la solución. La validación reforzó el valor de reducir el esfuerzo operativo para que los analistas pudieran dedicar más tiempo a cuestionar supuestos, trabajar más cerca de la operación y fortalecer el aseguramiento del proceso, en lugar de gestionar consolidaciones manuales.</p>\n<p><strong>Del prototipo a la implementación.</strong> Después del Sprint, lideré la consolidación del prototipo final, el backlog y la hoja de ruta de implementación. La solución se estructuró en tres olas: un MVP centrado en el flujo central de cálculo, una expansión funcional que incluía visualización y reportería, y una fase complementaria que introducía capacidades asistidas por IA y mayor automatización.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultado</h2>\n<p>El Sprint transformó un desafío operativo complejo en un concepto de producto validado, un backlog priorizado y un camino claro hacia la implementación. El equipo se alineó en torno a una visión compartida de un proceso más estandarizado, trazable y escalable, con cinco módulos centrales y más de 20 funcionalidades clave definidas durante el proyecto. Lo más importante es que el trabajo replanteó la automatización no solo como una forma de reducir el esfuerzo manual, sino como un medio para liberar a los analistas y que se concentren en el criterio, la comprensión operativa y una toma de decisiones más sólida.</p>"}},{"id":"3d59a9f0000e80f2875fe7640d53d5b0","slug":"connected-compass","title":"Connected Compass","sub":"Turning operational expertise into a strategic growth system","year":2026,"client":["MTS"],"industry":["Retail"],"type":["Transformation"],"role":["Strategy Consulting Director"],"country":[],"highlight":false,"link":"","texture":"flow","excerpt":"Leadership Co-Creation. We brought the LATAM leadership team together for a full-day co-creation workshop, followed by focused working sessions with commercial, operations, talent, marketing, and other business…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation — The Challenge</h2>\n<p>MTS LATAM had built a strong position managing real estate assets across five Latin American markets, supported by decades of operational experience, a broad institutional client base, and millions of square meters under management. Yet much of that expertise remained invisible: clients primarily recognized MTS for its execution capabilities, while its strategic knowledge, proprietary operational data, and broader portfolio of services were less visible. The challenge was to clarify where the company had a defensible right to win and translate its existing strengths into a focused path for long-term growth.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Task — My Role</h2>\n<p>I contributed to a five-week strategic immersion designed to help MTS leadership make clearer choices about where to play, how to win, and what capabilities would be required to sustain its next stage of growth. My work connected research, leadership perspectives, business strategy, brand positioning, and organizational implications into a coherent strategic framework. I also helped translate those choices into a system that could guide prioritization across markets, capabilities, and marketing activation.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Action</h2>\n<p><strong>Discovery &amp; Strategic Diagnosis.</strong> We began by reviewing internal commercial and marketing plans, competitive benchmarks, and existing strategic materials. This was complemented by in-depth interviews with leaders across executive management, commercial, operations, talent, and asset management, allowing us to surface recurring tensions around positioning, growth, organizational habits, technology, and client relationships.</p>\n<p><strong>Leadership Co-Creation.</strong> We brought the LATAM leadership team together for a full-day co-creation workshop, followed by focused working sessions with commercial, operations, talent, marketing, and other business functions. Rather than treating the engagement as an external diagnosis, the process used the organization’s own experience to turn tensions into explicit strategic choices and create shared ownership of the direction.</p>\n<p><strong>Strategic Choices &amp; Positioning.</strong> The work clarified priority client profiles and markets, areas the company should deliberately avoid, and a differentiated competitive position: not a traditional operator and not a detached advisory firm, but a <strong>strategic operator</strong> combining execution with decision-making intelligence. We also connected this position to MTS’s operational data and technology platform, reframing them from supporting infrastructure into evidence of a harder-to-replicate competitive advantage.</p>\n<p><strong>Designing the Growth System.</strong> We synthesized the strategy into a five-part <strong>Property Intelligence Flywheel</strong>: protect the operational base, transform data into intelligence, use that intelligence to guide decisions, capture the value created, and expand the company’s reach. Four parallel accelerators—deeper data, increasing switching costs, accumulated reputation, and institutionalized relational capital—showed how the system could strengthen over time rather than operate as a linear strategic plan.</p>\n<p><strong>From Strategy to Activation.</strong> Finally, we translated the model into three horizons: strengthening the established core, expanding validated markets, and treating new-market opportunities as disciplined experiments. We also reviewed the existing marketing plan against the new strategy, identifying gaps in geographic priorities, audience segmentation, narrative architecture, technology activation, measurement, and governance. This created a clearer bridge between strategic intent and execution.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Result — The Impact</h2>\n<p>The Connected Compass gave MTS a shared strategic language for connecting operations, proprietary knowledge, brand, market priorities, and organizational capabilities. Instead of pursuing growth as a collection of disconnected initiatives, leadership gained a coherent system for deciding what to strengthen now, what to expand next, and what to explore with greater discipline.</p>\n<p>The work also reframed one of the company’s most important assets: its operational footprint was not simply evidence of scale, but the foundation of an intelligence advantage that could inform both client decisions and future differentiation.</p>","status":"published","cover":"","es":{"title":"Connected Compass","sub":"Convertir la experiencia operativa en un sistema estratégico de crecimiento","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación — El desafío</h2>\n<p>MTS LATAM había construido una posición sólida administrando activos inmobiliarios en cinco mercados latinoamericanos, respaldada por décadas de experiencia operativa, una amplia base de clientes institucionales y millones de metros cuadrados bajo administración. Sin embargo, buena parte de esa experiencia permanecía invisible: los clientes reconocían a MTS principalmente por su capacidad de ejecución, mientras que su conocimiento estratégico, sus datos operativos propios y su portafolio más amplio de servicios eran menos visibles. El desafío era aclarar dónde tenía la compañía un derecho a ganar defendible y traducir sus fortalezas existentes en un camino enfocado de crecimiento a largo plazo.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Tarea — Mi rol</h2>\n<p>Participé en una inmersión estratégica de cinco semanas diseñada para ayudar al liderazgo de MTS a tomar decisiones más claras sobre dónde jugar, cómo ganar y qué capacidades se requerirían para sostener su siguiente etapa de crecimiento. Mi trabajo conectó la investigación, las perspectivas del liderazgo, la estrategia de negocio, el posicionamiento de marca y las implicaciones organizacionales en un marco estratégico coherente. También ayudé a traducir esas decisiones en un sistema que pudiera guiar la priorización entre mercados, capacidades y activación de marketing.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acción</h2>\n<p><strong>Descubrimiento y diagnóstico estratégico.</strong> Empezamos revisando los planes comerciales y de marketing internos, los benchmarks de la competencia y los materiales estratégicos existentes. Esto se complementó con entrevistas a profundidad con líderes de la gerencia ejecutiva y de las áreas comercial, de operaciones, de talento y de administración de activos, lo que nos permitió sacar a la luz tensiones recurrentes en torno al posicionamiento, el crecimiento, los hábitos organizacionales, la tecnología y las relaciones con los clientes.</p>\n<p><strong>Cocreación con el liderazgo.</strong> Reunimos al equipo de liderazgo de LATAM en un taller de cocreación de un día completo, seguido de sesiones de trabajo enfocadas con las áreas comercial, de operaciones, de talento, de marketing y otras funciones del negocio. En lugar de tratar el proyecto como un diagnóstico externo, el proceso usó la propia experiencia de la organización para convertir las tensiones en decisiones estratégicas explícitas y generar una apropiación compartida de la dirección.</p>\n<p><strong>Decisiones estratégicas y posicionamiento.</strong> El trabajo aclaró los perfiles de clientes y los mercados prioritarios, las áreas que la compañía debía evitar deliberadamente y una posición competitiva diferenciada: ni un operador tradicional ni una firma de asesoría distante, sino un <strong>operador estratégico</strong> que combina la ejecución con inteligencia para la toma de decisiones. También conectamos esta posición con los datos operativos y la plataforma tecnológica de MTS, replanteándolos: de infraestructura de apoyo a evidencia de una ventaja competitiva más difícil de replicar.</p>\n<p><strong>Diseño del sistema de crecimiento.</strong> Sintetizamos la estrategia en un <strong>Property Intelligence Flywheel</strong> de cinco partes: proteger la base operativa, transformar los datos en inteligencia, usar esa inteligencia para guiar las decisiones, capturar el valor creado y ampliar el alcance de la compañía. Cuatro aceleradores en paralelo —datos más profundos, costos de cambio crecientes, reputación acumulada y capital relacional institucionalizado— mostraron cómo el sistema podía fortalecerse con el tiempo en lugar de operar como un plan estratégico lineal.</p>\n<p><strong>De la estrategia a la activación.</strong> Finalmente, tradujimos el modelo en tres horizontes: fortalecer el núcleo establecido, expandirse en mercados validados y tratar las oportunidades de nuevos mercados como experimentos disciplinados. También revisamos el plan de marketing existente frente a la nueva estrategia e identificamos brechas en las prioridades geográficas, la segmentación de audiencias, la arquitectura narrativa, la activación tecnológica, la medición y la gobernanza. Esto creó un puente más claro entre la intención estratégica y la ejecución.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultado — El impacto</h2>\n<p>La Connected Compass le dio a MTS un lenguaje estratégico compartido para conectar las operaciones, el conocimiento propio, la marca, las prioridades de mercado y las capacidades organizacionales. En lugar de perseguir el crecimiento como un conjunto de iniciativas desconectadas, el liderazgo ganó un sistema coherente para decidir qué fortalecer ahora, qué expandir después y qué explorar con mayor disciplina.</p>\n<p>El trabajo también replanteó uno de los activos más importantes de la compañía: su huella operativa no era simplemente evidencia de escala, sino la base de una ventaja de inteligencia capaz de informar tanto las decisiones de los clientes como la diferenciación futura.</p>"}},{"id":"1d49a9f0000e80b08ad2ca6095a361d9","slug":"transforming-vti-into-a-strategic-enabler","title":"Transforming VTI into a Strategic Enabler","sub":"Aligning Innovation and Technology with Ecopetrol’s 2040 Vision","year":2025,"client":["Ecopetrol"],"industry":["Energy"],"type":["Purpose-driven strategy"],"role":["Strategic Design Consultant"],"country":[],"highlight":false,"link":"","texture":"particles","excerpt":"Participants then developed actionable solutions and detailed lines of action to address these opportunities. The final phase involved documenting results, including a roadmap for implementation and insights to guide…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>In March 2025, Ecopetrol partnered with The Cocktail to host a two-day management workshop in Bucaramanga for the leaders of the Vice Presidency of Technology and Innovation (VTI). The workshop aimed to strengthen team cohesion and define strategic priorities aligned with Ecopetrol's 2040 Strategy. Given the challenges of energy transition and declining sector returns, strengthening VTI's position as a key driver of digital and technological transformation became essential.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The primary challenge was to align VTI's priorities with Ecopetrol Group's strategic objectives while addressing low profitability, internal distrust, and disconnection between business units and technology. VTI needed to establish itself as a strategic partner—one capable of anticipating challenges, delivering tangible value, and setting benchmarks in science, technology, and innovation.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Process</h2>\n<p>The workshop followed a three-phase methodology: planning, execution, and reporting. During the planning phase, interviews with key stakeholders informed the design of interactive activities tailored to address VTI’s needs. Over two days, participants engaged in exercises to align on VTI’s purpose, identify cross-cutting challenges, and co-create solutions.</p>\n<ul><li>Day one focused on understanding Ecopetrol’s strategic context, defining VTI’s vision, and mapping barriers across five strategic focus areas.</li><li>On day two, these barriers were grouped into four \"territories of opportunity,\" such as improving trust in VTI and enhancing synergies between business and technology.</li></ul>\n<p>Participants then developed actionable solutions and detailed lines of action to address these opportunities. The final phase involved documenting results, including a roadmap for implementation and insights to guide future actions.</p>\n<ul><li>Conducted interviews with key Ecopetrol stakeholders to refine the workshop methodology.</li><li>Designed and prepared tailored workshop materials.</li><li>Facilitated two days of in-person collaborative sessions with 17+ managers and leaders.</li><li>Identified organizational gaps and mapped 17 opportunity areas.</li><li>Consolidated 4 cross-cutting strategic opportunity territories.</li><li>Co-created solutions and initiatives for each opportunity area.</li><li>Defined 12 action lines with detailed planning cards to guide VTI efforts for 2025.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>The Impact</h2>\n<p>The workshop resulted in a clear articulation of VTI’s purpose: leveraging science, technology, and innovation to address Ecopetrol’s most critical challenges while driving efficiency, competitiveness, and sustainability.</p>\n<p>Four strategic territories of opportunity were identified, along with corresponding lines of action, such as <strong>improving governance, fostering collaboration, and optimizing talent management.</strong> These outcomes laid the groundwork for VTI to become a more credible, integrated, and strategically aligned partner within Ecopetrol. Additionally, the initiative highlighted the importance of closing gaps between business and technology, ensuring that VTI evolves from a service provider to a strategic enabler in Ecopetrol’s energy transition journey.</p>","status":"published","cover":"","es":{"title":"Transformar la VTI en un habilitador estratégico","sub":"Alinear innovación y tecnología con la visión 2040 de Ecopetrol","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>En marzo de 2025, Ecopetrol se asoció con The Cocktail para realizar un taller de gerencia de dos días en Bucaramanga para los líderes de la Vicepresidencia de Tecnología e Innovación (VTI). El taller buscaba fortalecer la cohesión del equipo y definir prioridades estratégicas alineadas con la Estrategia 2040 de Ecopetrol. Dados los desafíos de la transición energética y la caída de los retornos del sector, fortalecer la posición de la VTI como motor clave de la transformación digital y tecnológica se volvió esencial.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El principal desafío era alinear las prioridades de la VTI con los objetivos estratégicos del Grupo Ecopetrol, abordando al mismo tiempo la baja rentabilidad, la desconfianza interna y la desconexión entre las unidades de negocio y tecnología. La VTI necesitaba posicionarse como un socio estratégico: uno capaz de anticipar desafíos, entregar valor tangible y marcar referentes en ciencia, tecnología e innovación.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El proceso</h2>\n<p>El taller siguió una metodología de tres fases: planeación, ejecución y reporte. Durante la planeación, las entrevistas con stakeholders clave sirvieron de base para diseñar actividades interactivas a la medida de las necesidades de la VTI. A lo largo de dos días, los participantes realizaron ejercicios para alinearse en el propósito de la VTI, identificar desafíos transversales y cocrear soluciones.</p>\n<ul><li>El primer día se centró en comprender el contexto estratégico de Ecopetrol, definir la visión de la VTI y mapear las barreras en cinco áreas de enfoque estratégico.</li><li>El segundo día, estas barreras se agruparon en cuatro \"territorios de oportunidad\", como mejorar la confianza en la VTI y potenciar las sinergias entre negocio y tecnología.</li></ul>\n<p>Luego, los participantes desarrollaron soluciones accionables y líneas de acción detalladas para abordar estas oportunidades. La fase final consistió en documentar los resultados, incluida una hoja de ruta de implementación y aprendizajes para orientar acciones futuras.</p>\n<ul><li>Realizamos entrevistas con stakeholders clave de Ecopetrol para afinar la metodología del taller.</li><li>Diseñamos y preparamos materiales del taller a la medida.</li><li>Facilitamos dos días de sesiones colaborativas presenciales con más de 17 gerentes y líderes.</li><li>Identificamos brechas organizacionales y mapeamos 17 áreas de oportunidad.</li><li>Consolidamos 4 territorios estratégicos de oportunidad de carácter transversal.</li><li>Cocreamos soluciones e iniciativas para cada área de oportunidad.</li><li>Definimos 12 líneas de acción con fichas de planeación detalladas para guiar los esfuerzos de la VTI en 2025.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>El impacto</h2>\n<p>El taller dio como resultado una articulación clara del propósito de la VTI: aprovechar la ciencia, la tecnología y la innovación para abordar los desafíos más críticos de Ecopetrol, impulsando al mismo tiempo la eficiencia, la competitividad y la sostenibilidad.</p>\n<p>Se identificaron cuatro territorios estratégicos de oportunidad, junto con sus líneas de acción correspondientes, como <strong>mejorar la gobernanza, fomentar la colaboración y optimizar la gestión del talento.</strong> Estos resultados sentaron las bases para que la VTI se convierta en un socio más creíble, integrado y alineado estratégicamente dentro de Ecopetrol. Además, la iniciativa resaltó la importancia de cerrar las brechas entre negocio y tecnología, asegurando que la VTI evolucione de proveedor de servicios a habilitador estratégico en el camino de transición energética de Ecopetrol.</p>"}},{"id":"1d49a9f0000e80b5bacec3792f5467ee","slug":"redefining-core-capabilities","title":"Redefining Core Capabilities","sub":"Strategic Priorities for Innovation and Portfolio Management at Ecopetrol","year":2025,"client":["Ecopetrol"],"industry":["Energy"],"type":["Transformation"],"role":["Strategic Design Consultant"],"country":[],"highlight":false,"link":"","texture":"flow","excerpt":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>The Context</h2>\n<p>In February 2025, Ecopetrol, in collaboration with The Cocktail, held a participatory workshop to support the Innovation and Portfolio Management Office (GIP) in aligning its strategic planning with Ecopetrol's 2040 vision. The initiative brought together the three core departments—Planning &amp; Portfolio, Technological Architecture, and Innovation—to collectively define critical capabilities, reflect on their roles, and propose a roadmap to activate these capacities to enhance Ecopetrol's technological transformation and energy transition.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>GIP faced several strategic challenges: aligning its initiatives with Ecopetrol’s broader 2040 Strategy, breaking down silos between departments, identifying and enhancing critical capabilities, and fostering a shared sense of purpose. Internal fragmentation, bureaucratic barriers, and resistance to change were limiting the effectiveness and agility needed to drive innovation across the organization.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Process</h2>\n<p>The workshop followed a structured three-phase methodology: planning, execution, and reporting. During the planning phase, interviews with stakeholders and a review of existing processes informed the design of the workshop agenda and materials. The one-day session began with an introduction to the roles of each department, followed by collaborative exercises to define GIP’s purpose and co-create its core capabilities. Participants identified eight critical capabilities, such as future visioning, technological exploration, and ecosystem connection, and analyzed their enablers and barriers. The final phase involved documenting the results, including the defined purpose, capabilities, and initial priorities, and preparing recommendations for next steps.</p>\n<ul><li>Conducted alignment and expectation-setting sessions with stakeholders.</li><li>Reviewed current processes and opportunities for improvement.</li><li>Facilitated a co-creation workshop with 50+ participants from GIP’s three departments.</li><li>Defined a unified purpose and five key strategic capabilities for GIP.</li><li>Mapped enablers and barriers to capability development.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>The Impact</h2>\n<p>The workshop resulted in a clear articulation of GIP’s purpose: to orchestrate and drive innovation and technological transformation across Ecopetrol, contributing to a more sustainable, competitive, and prosperous energy future. Eight critical capabilities were identified, providing a foundation for GIP’s strategic framework. The session also highlighted key barriers, such as siloed operations and resistance to change, and emphasized the need for cultural shifts to foster innovation. Moving forward, the outcomes will guide the development of strategic priorities, roadmaps, and activation models to ensure GIP’s alignment with Ecopetrol’s 2040 goals while maximizing value for stakeholders.</p>","status":"published","cover":"","es":{"title":"Redefinir las capacidades clave","sub":"Prioridades estratégicas para la innovación y la gestión de portafolio en Ecopetrol","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>El contexto</h2>\n<p>En febrero de 2025, Ecopetrol, en colaboración con The Cocktail, realizó un taller participativo para apoyar a la Gerencia de Innovación y Portafolio (GIP) en la alineación de su planeación estratégi
