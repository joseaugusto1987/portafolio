ca con la visión 2040 de Ecopetrol. La iniciativa reunió a los tres departamentos centrales —Planeación y Portafolio, Arquitectura Tecnológica e Innovación— para definir colectivamente las capacidades críticas, reflexionar sobre sus roles y proponer una hoja de ruta para activar esas capacidades y potenciar la transformación tecnológica y la transición energética de Ecopetrol.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>La GIP enfrentaba varios desafíos estratégicos: alinear sus iniciativas con la Estrategia 2040 de Ecopetrol, derribar los silos entre departamentos, identificar y fortalecer las capacidades críticas, y fomentar un propósito compartido. La fragmentación interna, las barreras burocráticas y la resistencia al cambio limitaban la efectividad y la agilidad necesarias para impulsar la innovación en toda la organización.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El proceso</h2>\n<p>El taller siguió una metodología estructurada de tres fases: planeación, ejecución y reporte. Durante la planeación, las entrevistas con stakeholders y una revisión de los procesos existentes sirvieron de base para diseñar la agenda y los materiales del taller. La sesión de un día comenzó con una introducción a los roles de cada departamento, seguida de ejercicios colaborativos para definir el propósito de la GIP y cocrear sus capacidades centrales. Los participantes identificaron ocho capacidades críticas, como la visión de futuro, la exploración tecnológica y la conexión con el ecosistema, y analizaron sus habilitadores y barreras. La fase final consistió en documentar los resultados, incluidos el propósito definido, las capacidades y las prioridades iniciales, y en preparar recomendaciones para los próximos pasos.</p>\n<ul><li>Realizamos sesiones de alineación y de definición de expectativas con los stakeholders.</li><li>Revisamos los procesos actuales y las oportunidades de mejora.</li><li>Facilitamos un taller de cocreación con más de 50 participantes de los tres departamentos de la GIP.</li><li>Definimos un propósito unificado y cinco capacidades estratégicas clave para la GIP.</li><li>Mapeamos los habilitadores y las barreras para el desarrollo de las capacidades.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>El impacto</h2>\n<p>El taller dio como resultado una articulación clara del propósito de la GIP: orquestar e impulsar la innovación y la transformación tecnológica en todo Ecopetrol, contribuyendo a un futuro energético más sostenible, competitivo y próspero. Se identificaron ocho capacidades críticas, que ofrecen una base para el marco estratégico de la GIP. La sesión también puso de relieve barreras clave, como la operación en silos y la resistencia al cambio, y subrayó la necesidad de cambios culturales para fomentar la innovación. De cara al futuro, los resultados guiarán el desarrollo de prioridades estratégicas, hojas de ruta y modelos de activación para asegurar la alineación de la GIP con las metas 2040 de Ecopetrol, maximizando el valor para los stakeholders.</p>"}},{"id":"1f69a9f0000e8030a279f0a8ea43a6d9","slug":"strategic-cx-transformation-for-itau-colombia","title":"Strategic CX Transformation for Itaú Colombia","sub":"","year":2025,"client":["Itaú Bank"],"industry":["Financial Services"],"type":["CX Strategy"],"role":["Strategic Design & CX Lead"],"country":[],"highlight":false,"link":"","texture":"topo","excerpt":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>The Context</h2>\n<p>Itaú Colombia is undergoing a strategic shift to become a “future-ready” bank, where digitalization, personalization, and competitiveness are central to growth. To support this vision, the organization engaged in a comprehensive diagnostic process to assess its current customer experience (CX) and define a roadmap for its transformation. I participated in this journey as a CX Lead, supporting the strategic design and coordination of this transformation effort.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>Despite its strong positioning in the region, Itaú lagged behind local and international competitors in terms of digital experience—particularly in retail banking. Mobile app instability, UX issues, and missing key functionalities impacted customer satisfaction. The core challenge was to build a transformation model that integrated business needs, customer expectations, and competitive insights to drive a differentiated CX strategy.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Process</h2>\n<ul><li>Conducted a strategic diagnosis of Itaú’s digital products and current experience ecosystem (AS-IS).</li><li>Benchmarked more than 30 financial players (traditional banks, fintechs, and neobanks).</li><li>Defined experience drivers across segments (retail and corporate) to identify opportunities.</li><li>Mapped gaps in CX performance and contrasted them with best practices and user needs.</li><li>Created a CX transformation model integrating personalization, multiexperience, agility, and innovation.</li><li>Designed a future-oriented roadmap based on strategic opportunities and business priorities.</li><li>Provided evidence-based recommendations for experience evolution across channels and touchpoints.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>My Role</h2>\n<p>As the CX Lead, my role was to accompany and guide the team throughout the strategic definition of Itaú’s new customer experience. I provided coaching to the internal designer to enhance their leadership and strategic thinking, while also offering experience frameworks, inspirational cases, and competitive benchmarks to enrich the design process. I supported the identification of experience drivers and the construction of a transformation model that considered the business, the customer, and the competitive landscape. My involvement was also key in aligning cross-functional teams—business, UX, tech—around a shared vision, and in shaping a clear narrative that connected the current challenges with the desired future state for Itaú’s experience.</p>","status":"published","cover":"","es":{"title":"Transformación estratégica de CX para Itaú Colombia","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>El contexto</h2>\n<p>Itaú Colombia atraviesa un giro estratégico para convertirse en un banco \"future-ready\", donde la digitalización, la personalización y la competitividad son centrales para el crecimiento. Para respaldar esta visión, la organización emprendió un proceso de diagnóstico integral para evaluar su experiencia de cliente (CX) actual y definir una hoja de ruta para su transformación. Participé en este recorrido como CX Lead, apoyando el diseño estratégico y la coordinación de este esfuerzo de transformación.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>A pesar de su sólido posicionamiento en la región, Itaú iba rezagado frente a competidores locales e internacionales en experiencia digital, particularmente en banca de personas. La inestabilidad de la app móvil, los problemas de UX y la falta de funcionalidades clave afectaban la satisfacción de los clientes. El desafío central era construir un modelo de transformación que integrara las necesidades del negocio, las expectativas de los clientes y los aprendizajes de la competencia para impulsar una estrategia de CX diferenciada.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El proceso</h2>\n<ul><li>Realizamos un diagnóstico estratégico de los productos digitales de Itaú y de su ecosistema de experiencia actual (AS-IS).</li><li>Hicimos un benchmark de más de 30 actores financieros (bancos tradicionales, fintechs y neobancos).</li><li>Definimos drivers de experiencia por segmento (personas y corporativo) para identificar oportunidades.</li><li>Mapeamos las brechas en el desempeño de CX y las contrastamos con las mejores prácticas y las necesidades de los usuarios.</li><li>Creamos un modelo de transformación de CX que integra personalización, multiexperiencia, agilidad e innovación.</li><li>Diseñamos una hoja de ruta orientada al futuro, basada en oportunidades estratégicas y prioridades del negocio.</li><li>Entregamos recomendaciones basadas en evidencia para la evolución de la experiencia en todos los canales y puntos de contacto.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Mi rol</h2>\n<p>Como CX Lead, mi rol fue acompañar y guiar al equipo durante la definición estratégica de la nueva experiencia de cliente de Itaú. Brindé coaching al diseñador interno para fortalecer su liderazgo y su pensamiento estratégico, y aporté marcos de experiencia, casos inspiradores y benchmarks de la competencia para enriquecer el proceso de diseño. Apoyé la identificación de los drivers de experiencia y la construcción de un modelo de transformación que considerara el negocio, al cliente y el panorama competitivo. Mi participación también fue clave para alinear a los equipos multifuncionales —negocio, UX, tecnología— en torno a una visión compartida, y para dar forma a una narrativa clara que conectara los desafíos actuales con el estado futuro deseado para la experiencia de Itaú.</p>"}},{"id":"2349a9f0000e80349051daaf464a87ce","slug":"faro-ct-i","title":"FARO CT+I","sub":"Strategic Technology Foresight Model for Ecopetrol","year":2025,"client":["Ecopetrol"],"industry":["Energy"],"type":["Transformation"],"role":["Strategic Design Consultant"],"country":[],"highlight":true,"link":"","texture":"flow","excerpt":"VTI (Vice Presidency of Technology and Innovation) held a strategic role for the company's future but needed to strengthen its foresight and technology surveillance capabilities to better connect emerging trends with…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation</h2>\n<p>Ecopetrol faced unprecedented transformation challenges in the global energy sector, requiring strategic diversification toward low-emission electrons and molecules businesses. The company's recent strategic definitions aimed at becoming a business group focused on rentability, efficiency, growth, and sustainability, demanding increasingly robust approaches to anticipate technological and market changes.</p>\n<p>VTI (Vice Presidency of Technology and Innovation) held a strategic role for the company's future but needed to strengthen its foresight and technology surveillance capabilities to better connect emerging trends with long-term strategic decisions.</p>\n<p>The diagnostic revealed VTI's \"vulnerable\" position—operating in high environmental volatility but with insufficient future preparedness—characterized by fragmented governance, reactive short-term mindsets, and disconnected strategic planning between corporate strategy, technology roadmaps, and portfolio management.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Task</h2>\n<p>I led the design and development of an actionable CT+I (Science, Technology, and Innovation) foresight model that would transform VTI into a key enabler of Ecopetrol's Science &amp; Technology strategy. My role encompassed strategic facilitation across three phases: immersion and diagnosis, collaborative intention definition, and detailed model specification with implementation roadmap.</p>\n<p>Working alongside cross-functional teams from VTI, ICPET, and business units, I orchestrated a collaborative transformation process that engaged 60+ stakeholders through surveys, interviews, and intensive co-creative workshops to institutionalize systematic technology anticipation capabilities and establish a shared transformative purpose.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Action</h2>\n<p>First, we conducted a comprehensive analysis of existing foresight practices through a multi-method diagnostic approach that combined stakeholder interviews, document analysis, and organizational survey.</p>\n<p>The 16+ in-depth interviews spanned key roles across VTI's leadership including planning and portfolio management, digital architecture, innovation teams, and business partners, alongside strategic voices from ICPET and corporate strategy. These conversations revealed fragmented approaches to technology anticipation, with each area operating different methodologies and timelines without systematic coordination.</p>\n<p>The analysis of 15+ strategic documents encompassed corporate strategy frameworks, existing technology roadmaps, innovation portfolios, quinquennial plans, and previous foresight exercises, uncovering significant gaps between strategic intent and operational execution. We supplemented this with a comprehensive survey of 44 participants across the organization to quantify perceptions of current foresight capabilities and identify priority improvement areas.</p>\n<p>This diagnostic synthesis revealed five critical opportunity territories requiring intervention: strategic connection (linking corporate strategy with technology execution), integrated governance (overcoming organizational silos), actionable intelligence (transforming dispersed data into strategic insights), prospective methods (institutionalizing systematic foresight practices), and anticipatory mindsets (fostering future-oriented culture).</p>\n<p>In parallel, we conducted a systematic benchmarking of 14 industry leaders across energy (Repsol, BP, Shell, Petrobras, TotalEnergies, Chevron), renewables (Iberdrola, Moeve, Oklo), and other sectors (NVIDIA, BASF, Enel, Bosch, Siemens), evaluating six core foresight capabilities: leadership &amp; governance, environmental intelligence, future prospecting, vision &amp; strategic direction, action &amp; experimentation, and prospective culture. This analysis revealed that leading companies institutionalize foresight through CEO-level mandates, systematic environmental scanning, collaborative scenario development, and formal experimentation mechanisms—highlighting VTI's current \"vulnerable\" position requiring structured intervention across five opportunity territories.</p>\n<p>We created and facilitated an intensive one-day co-creation workshop in Bogotá, bringing together 12 participants from VTI, business units, and strategic areas. The session began with inspirational framing on organizational purpose as \"acts of hope that open future realities.\" Through structured collaborative dynamics, we co-created FARO's transformative purpose:</p>\n<blockquote class=\"c-quote\">\"We are the CT+I Lighthouse of prospective intelligence that connects the present with the technological future, enabling the Business Group to anticipate, interpret and act in high uncertainty environments.\"</blockquote>\n<p>We guided participants through systematic exploration of five strategic territories, generating 21 actionable initiatives across the opportunity dimensions. Applied the \"Transition by Design\" methodology to create an evolutionary three-version roadmap (V1-V3) starting from VTI's core influence areas and expanding progressively. Facilitated collaborative prioritization sessions using impact and stakeholder voting to identify highest-value initiatives for immediate implementation.</p>\n<p>Then, we designed a comprehensive operating model structured around five integrated phases: Frame, Explore, Project, Define, and Transform. Developed detailed specifications for 10 priority initiatives across strategic territories, each with implementation requirements, responsible teams, dependencies, and success metrics. Created governance structure integrating Business Partners, ICPET, and business units with clear roles and decision-making processes.</p>\n<p>Additionally, we developed a comprehensive FARO CT+I Foresight Toolkit—a practical guide that translates the theoretical model into actionable methodologies. This 50+ page playbook structures 20 specific tools across the five model phases, from stakeholder mapping and horizon scanning to scenario creation and design sprints, each with step-by-step instructions, templates, and downloadable resources. The toolkit serves as VTI's internal capability-building resource, enabling teams to apply foresight methodologies systematically while reducing dependence on external consultants.</p>\n<p>Finally, we established a prioritized roadmap focusing on highest-impact initiatives: integrated strategy-technology model for synchronizing corporate strategy with technology execution, Executive Radar for continuous intelligence synthesis, and Intelligence Center for democratizing access to specialized information sources. Designed measurement system (FARO Impact Measurement) to demonstrate strategic value and guide continuous improvement.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Result</h2>\n<p>Delivered a comprehensive foresight operating model that positions VTI as Ecopetrol's strategic technology anticipation hub, with demonstrated stakeholder alignment and clear implementation pathway. The FARO model provides systematic methodology for connecting long-term strategic vision with technology execution, featuring structured governance, continuous intelligence generation, and institutionalized prospective capabilities.</p>\n<p>The collaborative process generated 10 actionable initiatives organized across five strategic territories, with clear prioritization and evolutionary roadmap spanning minimum viable model focused on digital technologies, expanded model incorporating emerging technologies, and consolidated model covering all critical Group technologies. Established governance structure with defined roles across planning, architecture, and innovation teams, supported by measurement systems and cultural transformation initiatives.</p>\n<p>The co-creation approach ensured organizational buy-in through collaborative definition of purpose, priorities, and implementation approach. Six major reflections emerged:</p>\n<ul><li>Need for stronger technology-strategy connection</li><li>Evolution from reactive to continuous intelligence</li><li>Establishment of clear mandate overcoming fragmentation</li><li>Collaborative learning spaces</li><li>Tangible early results enabling escalation</li><li>Strengthened internal capabilities through common frameworks</li></ul>\n<p><strong>Key learning:</strong> Successful technology foresight transformation requires simultaneous intervention across strategy alignment, governance structure, intelligence systems, methodological frameworks, and cultural change—achieved through collaborative co-creation that builds shared ownership and clear evolutionary pathway from core competencies toward comprehensive anticipation capabilities.</p>","status":"published","cover":"","es":{"title":"FARO CT+I","sub":"Modelo de prospectiva tecnológica estratégica para Ecopetrol","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación</h2>\n<p>Ecopetrol enfrentaba desafíos de transformación sin precedentes en el sector energético global, que exigían una diversificación estratégica hacia negocios de electrones y moléculas de bajas emisiones. Las definiciones estratégicas recientes de la compañía buscaban convertirla en un grupo empresarial enfocado en la rentabilidad, la eficiencia, el crecimiento y la sostenibilidad, lo que demanda enfoques cada vez más robustos para anticipar los cambios tecnológicos y de mercado.</p>\n<p>La VTI (Vicepresidencia de Tecnología e Innovación) tenía un rol estratégico para el futuro de la compañía, pero necesitaba fortalecer sus capacidades de prospectiva y vigilancia tecnológica para conectar mejor las tendencias emergentes con las decisiones estratégicas de largo plazo.</p>\n<p>El diagnóstico reveló una posición \"vulnerable\" de la VTI —operando en un entorno de alta volatilidad pero con una preparación insuficiente para el futuro—, caracterizada por una gobernanza fragmentada, mentalidades reactivas de corto plazo y una planeación estratégica desconectada entre la estrategia corporativa, las hojas de ruta tecnológicas y la gestión del portafolio.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Tarea</h2>\n<p>Lideré el diseño y desarrollo de un modelo de prospectiva de CT+I (Ciencia, Tecnología e Innovación) accionable, que transformaría a la VTI en un habilitador clave de la estrategia de Ciencia y Tecnología de Ecopetrol. Mi rol abarcó la facilitación estratégica a lo largo de tres fases: inmersión y diagnóstico, definición colaborativa de la intención, y especificación detallada del modelo con su hoja de ruta de implementación.</p>\n<p>Trabajando junto a equipos multifuncionales de la VTI, el ICPET y las unidades de negocio, orquesté un proceso colaborativo de transformación que involucró a más de 60 stakeholders mediante encuestas, entrevistas y talleres intensivos de cocreación, con el fin de institucionalizar capacidades sistemáticas de anticipación tecnológica y establecer un propósito transformador compartido.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acción</h2>\n<p>Primero, realizamos un análisis integral de las prácticas de prospectiva existentes mediante un diagnóstico multimétodo que combinó entrevistas con stakeholders, análisis documental y una encuesta organizacional.</p>\n<p>Las más de 16 entrevistas a profundidad abarcaron roles clave del liderazgo de la VTI, entre ellos planeación y gestión de portafolio, arquitectura digital, equipos de innovación y socios de negocio, además de voces estratégicas del ICPET y de la estrategia corporativa. Estas conversaciones revelaron enfoques fragmentados de anticipación tecnológica, con cada área operando metodologías y tiempos distintos, sin una coordinación sistemática.</p>\n<p>El análisis de más de 15 documentos estratégicos abarcó marcos de estrategia corporativa, hojas de ruta tecnológicas existentes, portafolios de innovación, planes quinquenales y ejercicios de prospectiva previos, y dejó al descubierto brechas significativas entre la intención estratégica y la ejecución operativa. Lo complementamos con una encuesta integral a 44 participantes de toda la organización para cuantificar las percepciones sobre las capacidades actuales de prospectiva e identificar las áreas prioritarias de mejora.</p>\n<p>Esta síntesis diagnóstica reveló cinco territorios de oportunidad críticos que requerían intervención: conexión estratégica (vincular la estrategia corporativa con la ejecución tecnológica), gobernanza integrada (superar los silos organizacionales), inteligencia accionable (transformar datos dispersos en insights estratégicos), métodos prospectivos (institucionalizar prácticas sistemáticas de prospectiva) y mentalidades anticipatorias (fomentar una cultura orientada al futuro).</p>\n<p>En paralelo, hicimos un benchmarking sistemático de 14 líderes de la industria en energía (Repsol, BP, Shell, Petrobras, TotalEnergies, Chevron), energías renovables (Iberdrola, Moeve, Oklo) y otros sectores (NVIDIA, BASF, Enel, Bosch, Siemens), evaluando seis capacidades centrales de prospectiva: liderazgo y gobernanza, inteligencia del entorno, exploración del futuro, visión y dirección estratégica, acción y experimentación, y cultura prospectiva. Este análisis mostró que las compañías líderes institucionalizan la prospectiva mediante mandatos al nivel del CEO, escaneo sistemático del entorno, desarrollo colaborativo de escenarios y mecanismos formales de experimentación, lo que pone de relieve la actual posición \"vulnerable\" de la VTI, que requiere una intervención estructurada en cinco territorios de oportunidad.</p>\n<p>Creamos y facilitamos un taller intensivo de cocreación de un día en Bogotá, que reunió a 12 participantes de la VTI, las unidades de negocio y las áreas estratégicas. La sesión comenzó con un encuadre inspirador sobre el propósito organizacional como \"actos de esperanza que abren realidades futuras\". Mediante dinámicas colaborativas estructuradas, cocreamos el propósito transformador de FARO:</p>\n<blockquote class=\"c-quote\">\"Somos el Faro CT+I de inteligencia prospectiva que conecta el presente con el futuro tecnológico, habilitando al Grupo Empresarial para anticipar, interpretar y actuar en entornos de alta incertidumbre.\"</blockquote>\n<p>Guiamos a los participantes en una exploración sistemática de cinco territorios estratégicos, generando 21 iniciativas accionables a lo largo de las dimensiones de oportunidad. Aplicamos la metodología \"Transition by Design\" para crear una hoja de ruta evolutiva de tres versiones (V1-V3), que parte de las áreas de influencia centrales de la VTI y se expande progresivamente. Facilitamos sesiones colaborativas de priorización, con votación por impacto y por stakeholders, para identificar las iniciativas de mayor valor para implementar de inmediato.</p>\n<p>Luego, diseñamos un modelo operativo integral estructurado en cinco fases integradas: Enmarcar, Explorar, Proyectar, Definir y Transformar. Desarrollamos especificaciones detalladas para 10 iniciativas prioritarias en los distintos territorios estratégicos, cada una con sus requerimientos de implementación, equipos responsables, dependencias y métricas de éxito. Creamos una estructura de gobernanza que integra a los Business Partners, el ICPET y las unidades de negocio, con roles y procesos de toma de decisiones claros.</p>\n<p>Adicionalmente, desarrollamos un completo Toolkit de Prospectiva FARO CT+I: una guía práctica que traduce el modelo teórico en metodologías accionables. Este playbook de más de 50 páginas estructura 20 herramientas específicas a lo largo de las cinco fases del modelo, desde el mapeo de stakeholders y el horizon scanning hasta la creación de escenarios y los design sprints, cada una con instrucciones paso a paso, plantillas y recursos descargables. El toolkit sirve como recurso interno de la VTI para el desarrollo de capacidades, y permite que los equipos apliquen las metodologías de prospectiva de manera sistemática y reduzcan su dependencia de consultores externos.</p>\n<p>Finalmente, establecimos una hoja de ruta priorizada que se enfoca en las iniciativas de mayor impacto: un modelo integrado de estrategia-tecnología para sincronizar la estrategia corporativa con la ejecución tecnológica, un Radar Ejecutivo para la síntesis continua de inteligencia y un Centro de Inteligencia para democratizar el acceso a fuentes de información especializadas. Diseñamos un sistema de medición (FARO Impact Measurement) para demostrar el valor estratégico y guiar la mejora continua.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultado</h2>\n<p>Entregamos un modelo operativo integral de prospectiva que posiciona a la VTI como el centro de anticipación tecnológica estratégica de Ecopetrol, con un alineamiento demostrado de los stakeholders y una ruta clara de implementación. El modelo FARO ofrece una metodología sistemática para conectar la visión estratégica de largo plazo con la ejecución tecnológica, con una gobernanza estructurada, una generación continua de inteligencia y capacidades prospectivas institucionalizadas.</p>\n<p>El proceso colaborativo generó 10 iniciativas accionables organizadas en cinco territorios estratégicos, con una priorización clara y una hoja de ruta evolutiva que abarca un modelo mínimo viable centrado en tecnologías digitales, un modelo ampliado que incorpora tecnologías emergentes y un modelo consolidado que cubre todas las tecnologías críticas del Grupo. Se estableció una estructura de gobernanza con roles definidos entre los equipos de planeación, arquitectura e innovación, respaldada por sistemas de medición e iniciativas de transformación cultural.</p>\n<p>El enfoque de cocreación aseguró la apropiación de la organización mediante la definición colaborativa del propósito, las prioridades y el enfoque de implementación. Surgieron seis grandes reflexiones:</p>\n<ul><li>Necesidad de una conexión más fuerte entre tecnología y estrategia</li><li>Evolución de una inteligencia reactiva a una continua</li><li>Establecimiento de un mandato claro que supere la fragmentación</li><li>Espacios de aprendizaje colaborativo</li><li>Resultados tempranos tangibles que permiten escalar</li><li>Capacidades internas fortalecidas mediante marcos comunes</li></ul>\n<p><strong>Aprendizaje clave:</strong> Una transformación exitosa en prospectiva tecnológica requiere intervenir simultáneamente en la alineación estratégica, la estructura de gobernanza, los sistemas de inteligencia, los marcos metodológicos y el cambio cultural, lo cual se logra mediante una cocreación colaborativa que construye apropiación compartida y una ruta evolutiva clara desde las competencias centrales hacia capacidades integrales de anticipación.</p>"}},{"id":"2d59a9f0000e8055b902c5026c56d1ee","slug":"transforming-ccbs-digital-ecosystem","title":"Transforming CCB’s Digital Ecosystem","sub":"From Fragmented Portals to a Unified Experience","year":2025,"client":["The Bogotá Chamber of Commerce (CCB)"],"industry":["Goverment / Public"],"type":["CX Strategy"],"role":["Strategic Design & CX Lead"],"country":[],"highlight":false,"link":"","texture":"topo","excerpt":"Experience Principles & Strategic Alignment. To guide future decisions, we defined six core experience principles—including Zero Friction, One CCB, and Make It Easy. These served as a north star for prioritizing…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation</h2>\n<p>The Bogotá Chamber of Commerce (CCB) is one of Colombia’s most influential business institutions, serving over 400,000 entrepreneurs and companies in the Bogotá region. It plays a central role in business formalization, economic development, and public-private collaboration. Over time, the CCB had developed more than 15 digital properties—including platforms, websites, and microsites—each managed independently by different departments or vendors. This resulted in a fragmented user experience, duplicated efforts, and limited ability to evolve strategically. In the context of broader institutional transformation, CCB set out to unify its digital ecosystem around a user-centered vision—improving access, strengthening brand coherence, and increasing operational efficiency.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Task</h2>\n<p>I oversaw the project end to end, from crafting the commercial proposal and pitch to securing executive buy-in. Under my leadership, a multidisciplinary team led the research, experience strategy, and platform structuring. I took a hands-on role in critical phases—personally consolidating the governance model, designing key workflows and definitions, and presenting to CCB’s executive committee and president to achieve validation and approval. My goal was to ensure the institutional vision translated into a coherent, actionable, and future-ready framework.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Action</h2>\n<p><strong>Discovery &amp; Ecosystem Diagnosis.</strong> We began with an in-depth diagnosis of CCB’s digital ecosystem through interviews, audits, platform analysis, and benchmarking. The team identified core issues: siloed decision-making, inconsistent user experiences, redundant services, and lack of shared standards. We mapped more than 15 active digital properties, 8 domains, and 21 distinct technology solutions—making the need for integration clear.</p>\n<p><strong>Experience Principles &amp; Strategic Alignment.</strong> To guide future decisions, we defined six core experience principles—including <em>Zero Friction</em>, <em>One CCB</em>, and <em>Make It Easy</em>. These served as a north star for prioritizing content, structuring navigation, and reorganizing services. We developed user archetypes, journeys, decision trees, and service role models to align the future ecosystem with actual user needs.</p>\n<p><strong>Unified Structure for the Digital Ecosystem.</strong> We proposed a centralized, modular architecture that reorganized CCB’s digital presence into five main entry points: individual needs, business needs, procedures, highlighted services, and the business lifecycle. This future structure was validated through collaborative workshops and benchmark analysis. We delivered wireframes, information architecture, and a unified taxonomy to support implementation.</p>\n<p><strong>Governance Model Design.</strong> Building on the strategic vision, I consolidated and formalized a three-tier governance model—<strong>strategic, tactical, and operational</strong>—to clarify roles, streamline decisions, and sustain quality over time. I defined key governance processes, including intake workflows, “definition of ready,” and RACI matrices. I also led executive presentations to the organization’s leadership and secured endorsement from the president. The model provided CCB with a sustainable way to manage digital growth while maintaining consistency and accountability.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Result</h2>\n<p>The project laid the foundation to transform a fragmented digital landscape into a <strong>coherent, user-centered, and governable ecosystem</strong>. The experience strategy enabled prioritization of key services and a structure rooted in real user needs. The governance model introduced clear ownership, cross-functional coordination, and mechanisms for sustained evolution. A key learning was that digital transformation isn’t just about platforms—it requires alignment between vision, operations, and organizational culture.</p>","status":"published","cover":"","es":{"title":"Transformar el ecosistema digital de la CCB","sub":"De portales fragmentados a una experiencia unificada","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación</h2>\n<p>La Cámara de Comercio de Bogotá (CCB) es una de las instituciones empresariales más influyentes de Colombia y atiende a más de 400.000 empresarios y compañías de la región de Bogotá. Desempeña un papel central en la formalización empresarial, el desarrollo económico y la colaboración público-privada. Con el tiempo, la CCB había desarrollado más de 15 activos digitales —entre plataformas, sitios web y micrositios—, cada uno gestionado de forma independiente por distintos departamentos o proveedores. Esto resultó en una experiencia de usuario fragmentada, esfuerzos duplicados y una capacidad limitada para evolucionar estratégicamente. En el contexto de una transformación institucional más amplia, la CCB se propuso unificar su ecosistema digital en torno a una visión centrada en el usuario: mejorando el acceso, fortaleciendo la coherencia de marca y aumentando la eficiencia operativa.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Tarea</h2>\n<p>Supervisé el proyecto de principio a fin, desde la elaboración de la propuesta comercial y el pitch hasta el logro de la aprobación de la alta dirección. Bajo mi liderazgo, un equipo multidisciplinario lideró la investigación, la estrategia de experiencia y la estructuración de la plataforma. Asumí un rol práctico en las fases críticas: consolidé personalmente el modelo de gobernanza, diseñé flujos de trabajo y definiciones clave, y presenté ante el comité ejecutivo y el presidente de la CCB para lograr su validación y aprobación. Mi objetivo fue asegurar que la visión institucional se tradujera en un marco coherente, accionable y preparado para el futuro.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acción</h2>\n<p><strong>Descubrimiento y diagnóstico del ecosistema.</strong> Comenzamos con un diagnóstico a profundidad del ecosistema digital de la CCB mediante entrevistas, auditorías, análisis de plataformas y benchmarking. El equipo identificó los problemas centrales: toma de decisiones en silos, experiencias de usuario inconsistentes, servicios redundantes y falta de estándares compartidos. Mapeamos más de 15 activos digitales activos, 8 dominios y 21 soluciones tecnológicas distintas, lo que hizo evidente la necesidad de integración.</p>\n<p><strong>Principios de experiencia y alineación estratégica.</strong> Para guiar las decisiones futuras, definimos seis principios centrales de experiencia, entre ellos <em>Zero Friction</em>, <em>One CCB</em> y <em>Make It Easy</em>. Estos sirvieron como norte para priorizar contenidos, estructurar la navegación y reorganizar los servicios. Desarrollamos arquetipos de usuario, journeys, árboles de decisión y modelos de roles de servicio para alinear el ecosistema futuro con las necesidades reales de los usuarios.</p>\n<p><strong>Estructura unificada para el ecosistema digital.</strong> Propusimos una arquitectura centralizada y modular que reorganizó la presencia digital de la CCB en cinco puntos de entrada principales: necesidades de las personas, necesidades de las empresas, trámites, servicios destacados y el ciclo de vida empresarial. Esta estructura futura se validó mediante talleres colaborativos y análisis de benchmarks. Entregamos wireframes, arquitectura de información y una taxonomía unificada para apoyar la implementación.</p>\n<p><strong>Diseño del modelo de gobernanza.</strong> A partir de la visión estratégica, consolidé y formalicé un modelo de gobernanza de tres niveles —<strong>estratégico, táctico y operativo</strong>— para clarificar roles, agilizar las decisiones y sostener la calidad en el tiempo. Definí procesos clave de gobernanza, entre ellos flujos de ingreso de solicitudes, la \"definición de listo\" y matrices RACI. También lideré presentaciones ejecutivas ante la alta dirección de la organización y obtuve el respaldo del presidente. El modelo le dio a la CCB una forma sostenible de gestionar el crecimiento digital manteniendo la consistencia y la rendición de cuentas.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultado</h2>\n<p>El proyecto sentó las bases para transformar un panorama digital fragmentado en un <strong>ecosistema coherente, centrado en el usuario y gobernable</strong>. La estrategia de experiencia permitió priorizar los servicios clave y una estructura arraigada en las necesidades reales de los usuarios. El modelo de gobernanza introdujo una responsabilidad clara, coordinación multifuncional y mecanismos para una evolución sostenida. Un aprendizaje clave fue que la transformación digital no se trata solo de plataformas: requiere alineación entre la visión, las operaciones y la cultura organizacional.</p>"}},{"id":"2e59a9f0000e80888cf4d8364105c3ed","slug":"meraki","title":"MERAKI","sub":"Inclusive Sensory Environments for Early Childhood (volunteer program)","year":2025,"client":["FAIN"],"industry":["Education","Third Sector / NGOs"],"type":["Learning environment"],"role":["Project leader","Volunteer"],"country":[],"highlight":false,"link":"","texture":"moire","excerpt":"The goal: equip this site with inclusive, sensory-informed environments—participatory classrooms, a structured multisensory room, and adaptive spaces that support regulation, communication, play, and caregiver…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situation</h2>\n<p>MERAKI is a volunteer-driven initiative born from a leadership-in-transformation program. It brings together professionals in education, therapy, design, marketing, and fundraising to translate neuroscience and compassion into practical tools for early childhood development. Its anchor partner, <em>Fundación Antioquia Infantil (FAIN)</em>, is launching a new campus in Caldas, Antioquia, to serve children and families in high-vulnerability contexts.</p>\n<p>The goal: equip this site with inclusive, sensory-informed environments—participatory classrooms, a structured multisensory room, and adaptive spaces that support regulation, communication, play, and caregiver involvement. The broader ambition is to create a replicable model that integrates evidence-based design, early intervention, and community engagement for children aged 0–6, including those with developmental delays, autism spectrum conditions, or sensory processing challenges.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Task</h2>\n<p>I initiated and led the conceptualization of MERAKI as a movement: a living system of sensory classrooms, practices, and communities rooted in neuroscience, compassion, and equity. I then assembled and mobilized a multidisciplinary team of volunteers—designers, therapists, educators, operational leads, and fundraisers—to bring it to life. As Project Lead, I drive the vision and strategy, structure the workstreams, and connect stakeholders across FAIN, vendors, donors, and the MERAKI team. I also ensure alignment to early childhood principles, lead resource mobilization, and define the playbooks and indicators that will guide future replications.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Action</h2>\n<p><strong>Conceptualization &amp; Movement Framing.</strong> MERAKI began as a personal vision to bridge neuroscience and equity through design. I framed it not as a one-off intervention but as the seed of a larger system—a network of sensory classrooms adaptable to different territories and realities. This led to the creation of a modular model combining physical spaces, training protocols, and community activation. The conceptual backbone positioned MERAKI as a movement for sensory justice in early childhood.</p>\n<p><strong>Governance &amp; Roadmap Integration.</strong> To operationalize the vision, we created a project structure with four synchronized streams—Infrastructure &amp; Equipment, Educational Protocols, Communications &amp; Fundraising, and Administration—coordinated through shared milestones and a weekly integration ritual. I established a phased roadmap, decision matrices, and a lightweight dashboard to monitor progress, risks, and impact.</p>\n<p><strong>Infrastructure &amp; Equipment.</strong> In collaboration with FAIN therapists and educators, we designed spatial programs aligned to sensory goals—zoning, lighting, acoustics, and flow. Equipment was selected to support vestibular, tactile, proprioceptive, and auditory stimulation.</p>\n<p><strong>Educational Component &amp; Training.</strong> We kicked off with a neuroeducation-led workshop for FAIN staff, grounding sensory integration in everyday practice. From there, we co-designed training modules on observing child responses, pacing sensory input, and designing adaptive routines.</p>\n<p><strong>Communications &amp; Fundraising.</strong> To mobilize support, we created a social-driven fundraising strategy blending digital storytelling, small individual pledges, and corporate in-kind support. Two flagship events—a neuroeducation training and a music fundraiser in Medellín—helped expand reach and generate visibility. A funnel-based dashboard tracks outreach, engagement, and donation fulfillment, driving weekly optimizations.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Result</h2>\n<p>In early 2026, FAIN’s Caldas campus will open with a fully equipped sensory learning ecosystem projected to benefit 200+ children per year, plus their caregivers. The space translates neuroscience into daily interactions—supporting attention, communication, emotional regulation, and motor coordination through inclusive design.</p>\n<p>Educators and families gain simple, repeatable strategies that extend from the classroom into the home. The Caldas pilot establishes the first node in a larger vision: a MERAKI network of sensory spaces, rooted in equity, science, and care—positioned to scale across new communities in the years ahead.</p>","status":"published","cover":"","es":{"title":"MERAKI","sub":"Entornos sensoriales inclusivos para la primera infancia (programa de voluntariado)","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Situación</h2>\n<p>MERAKI es una iniciativa de voluntariado que nació de un programa de liderazgo en transformación. Reúne a profesionales de la educación, la terapia, el diseño, el marketing y la recaudación de fondos para traducir la neurociencia y la compasión en herramientas prácticas para el desarrollo de la primera infancia. Su aliado ancla, la <em>Fundación Antioquia Infantil (FAIN)</em>, está inaugurando una nueva sede en Caldas, Antioquia, para atender a niños y familias en contextos de alta vulnerabilidad.</p>\n<p>El objetivo: dotar este sitio de ambientes inclusivos y con enfoque sensorial —aulas participativas, una sala multisensorial estructurada y espacios adaptativos que apoyen la regulación, la comunicación, el juego y la participación de los cuidadores—. La ambición más amplia es crear un modelo replicable que integre el diseño basado en evidencia, la intervención temprana y la participación comunitaria para niños de 0 a 6 años, incluidos aquellos con retrasos en el desarrollo, condiciones del espectro autista o desafíos de procesamiento sensorial.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Tarea</h2>\n<p>Inicié y lideré la conceptualización de MERAKI como un movimiento: un sistema vivo de aulas sensoriales, prácticas y comunidades arraigado en la neurociencia, la compasión y la equidad. Luego conformé y movilicé a un equipo multidisciplinario de voluntarios —diseñadores, terapeutas, educadores, líderes operativos y recaudadores de fondos— para darle vida. Como líder del proyecto, impulso la visión y la estrategia, estructuro las líneas de trabajo y conecto a los stakeholders de FAIN, los proveedores, los donantes y el equipo de MERAKI. También me aseguro de la alineación con los principios de la primera infancia, lidero la movilización de recursos y defino los playbooks e indicadores que guiarán las futuras replicaciones.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acción</h2>\n<p><strong>Conceptualización y encuadre del movimiento.</strong> MERAKI empezó como una visión personal para tender un puente entre la neurociencia y la equidad a través del diseño. La encuadré no como una intervención aislada, sino como la semilla de un sistema más grande: una red de aulas sensoriales adaptables a distintos territorios y realidades. Esto llevó a la creación de un modelo modular que combina espacios físicos, protocolos de formación y activación comunitaria. La columna vertebral conceptual posicionó a MERAKI como un movimiento por la justicia sensorial en la primera infancia.</p>\n<p><strong>Gobernanza e integración de la hoja de ruta.</strong> Para operacionalizar la visión, creamos una estructura de proyecto con cuatro frentes sincronizados —Infraestructura y Dotación, Protocolos Educativos, Comunicaciones y Recaudación, y Administración—, coordinados mediante hitos compartidos y un ritual semanal de integración. Establecí una hoja de ruta por fases, matrices de decisión y un tablero liviano para monitorear el avance, los riesgos y el impacto.</p>\n<p><strong>Infraestructura y dotación.</strong> En colaboración con los terapeutas y educadores de FAIN, diseñamos programas espaciales alineados con los objetivos sensoriales: zonificación, iluminación, acústica y circulación. Se seleccionó un equipamiento que apoyara la estimulación vestibular, táctil, propioceptiva y auditiva.</p>\n<p><strong>Componente educativo y formación.</strong> Arrancamos con un taller de neuroeducación para el personal de FAIN, que fundamentó la integración sensorial en la práctica cotidiana. A partir de ahí, codiseñamos módulos de formación sobre cómo observar las respuestas del niño, dosificar los estímulos sensoriales y diseñar rutinas adaptativas.</p>\n<p><strong>Comunicaciones y recaudación de fondos.</strong> Para movilizar apoyos, creamos una estrategia de recaudación impulsada por lo social que combina narrativas digitales, pequeños aportes individuales y apoyo corporativo en especie. Dos eventos insignia —una formación en neuroeducación y un evento musical de recaudación en Medellín— ayudaron a ampliar el alcance y a generar visibilidad. Un tablero basado en el embudo hace seguimiento al alcance, el engagement y el cumplimiento de las donaciones, y orienta optimizaciones semanales.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultado</h2>\n<p>A comienzos de 2026, la sede de FAIN en Caldas abrirá con un ecosistema de aprendizaje sensorial totalmente dotado, que se proyecta beneficiará a más de 200 niños al año, además de a sus cuidadores. El espacio traduce la neurociencia en interacciones cotidianas, apoyando la atención, la comunicación, la regulación emocional y la coordinación motriz mediante un diseño inclusivo.</p>\n<p>Los educadores y las familias obtienen estrategias simples y repetibles que se extienden del aula al hogar. El piloto de Caldas establece el primer nodo de una visión más grande: una red MERAKI de espacios sensoriales, arraigada en la equidad, la ciencia y el cuidado, posicionada para escalar a nuevas comunidades en los próximos años.</p>"}},{"id":"0837587f086d4619814b635a52c06305","slug":"empowering-ecopetrols-financial-strategy-with-a-360-cash-flow-digital-so","title":"Empowering Ecopetrol’s Financial Strategy with a 360° Cash Flow digital solution","sub":"","year":2024,"client":["Ecopetrol"],"industry":["Energy"],"type":["Product Design and Strategy","Digital experience"],"role":["Strategic Design Consultant"],"country":["Colombia"],"highlight":false,"link":"","texture":"dither","excerpt":"With this foundation, we moved into the exploration and alignment phase. Together, we constructed a shared knowledge base, allowing participants to map out the challenge and clarify the long-term objectives. This…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>Ecopetrol, a prominent energy company in Latin America, sought to optimize its cash flow management amidst the volatile global energy market and the transition to sustainable practices. Effective cash flow management is crucial for Ecopetrol to navigate price fluctuations, demand changes, and support growth and sustainability. The Vice Presidency of Finance and the Hub at EBA aimed to enhance financial processes and outcomes through the 360° Cash Flow initiative, leveraging advanced analytics and technology.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Challenge</h2>\n<p>The main challenge was to shift from traditional, production-focused cash flow analysis to a proactive, value-oriented model. Ecopetrol needed a robust system that could provide real-time insights, streamline data capture, and improve the accuracy of financial projections. This transformation required overcoming existing operational inefficiencies and integrating innovative technological solutions.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Process</h2>\n<p>The project began with a focused planning phase where we defined the strategic goals and assembled a multidisciplinary team. Key stakeholders were interviewed to capture pain points and aspirations, laying the groundwork for a collaborative and informed design process.</p>\n<p>With this foundation, we moved into the exploration and alignment phase. Together, we constructed a shared knowledge base, allowing participants to map out the challenge and clarify the long-term objectives. This created the conditions for collective understanding and a unified vision.</p>\n<p>From there, we entered a highly creative ideation stage. Using structured co-creation sessions, the team generated a broad array of ideas, exploring diverse ways to enhance cash flow management. These ideas were progressively refined through sketches and discussions until a cohesive concept emerged.</p>\n<p>Decision-making followed, where we prioritized the most viable ideas and began to shape the user experience. A high-level prototype flow was created, supported by detailed screen designs that illustrated how the platform would function.</p>\n<p>Next came the prototyping stage. We developed a realistic, interactive prototype and designed a storytelling script to demonstrate the solution’s potential. This prototype showcased key features like liquidity position tracking, projection tools, and simulation capabilities.</p>\n<p>Finally, the prototype was tested with financial experts and stakeholders. Their feedback was instrumental in identifying opportunities for improvement and ensuring that the solution addressed real-world needs effectively.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Results</h2>\n<p>The <em>360° Cash Flow</em> prototype introduced a new way of managing finances at Ecopetrol. It offered intuitive tools for scenario simulation, cash flow visualization, and strategic planning—empowering teams to move from reactive analysis to proactive insight. The Design Sprint led to several key advancements:</p>\n<ol><li><strong>Prototype Development:</strong> Created a functional prototype for a 360° Cash Flow platform, featuring intuitive tools for exploring, filtering, and analyzing financial data. Key features included liquidity position, cash projection, cash flow simulation, performance tracking, and optimization.</li><li><strong>User-Centered Solutions:</strong> Validated the prototype with stakeholders, ensuring it met user needs and addressed key pain points. The tools facilitated a more efficient, data-driven decision-making process, reducing manual tasks and improving data clarity.</li><li><strong>Strategic Alignment:</strong> Aligned the new tools with Ecopetrol’s strategic goals, supporting a more structured and systematic approach to cash flow analysis and macroeconomic forecasting. This alignment enabled better integration of expert knowledge, analytical models, and external data sources.</li><li><strong>Enhanced Collaboration:</strong> Fostered a collaborative culture among team members, combining diverse perspectives to innovate and solve complex problems. Stakeholder involvement was crucial for achieving buy-in and support for the new initiatives.</li></ol>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Impact</h2>\n<p>This initiative transformed cash flow management at Ecopetrol. The platform enabled real-time insights, reduced manual data handling, and improved forecast accuracy. It also supported strategic decision-making with simulation and optimization tools. Beyond the technical benefits, the project fostered a cultural shift toward agility, user-centered thinking, and innovation—laying the groundwork for a smarter, more resilient financial future.</p>","status":"published","cover":"","es":{"title":"Fortalecer la estrategia financiera de Ecopetrol con una solución digital de flujo de caja 360°","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>Ecopetrol, una destacada compañía de energía de América Latina, buscaba optimizar la gestión de su flujo de caja en medio de un mercado energético global volátil y de la transición hacia prácticas sostenibles. Una gestión eficaz del flujo de caja es crucial para que Ecopetrol navegue las fluctuaciones de precios y los cambios en la demanda, y respalde su crecimiento y sostenibilidad. La Vicepresidencia de Finanzas y el Hub de EBA se propusieron mejorar los procesos y resultados financieros mediante la iniciativa 360° Cash Flow, aprovechando analítica avanzada y tecnología.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Desafío</h2>\n<p>El principal desafío era pasar de un análisis de flujo de caja tradicional, centrado en la producción, a un modelo proactivo orientado al valor. Ecopetrol necesitaba un sistema robusto que ofreciera insights en tiempo real, agilizara la captura de datos y mejorara la precisión de las proyecciones financieras. Esta transformación exigía superar las ineficiencias operativas existentes e integrar soluciones tecnológicas innovadoras.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El proceso</h2>\n<p>El proyecto comenzó con una fase de planeación enfocada en la que definimos los objetivos estratégicos y conformamos un equipo multidisciplinario. Se entrevistó a los stakeholders clave para capturar puntos de dolor y aspiraciones, sentando las bases para un proceso de diseño colaborativo e informado.</p>\n<p>Con esta base, pasamos a la fase de exploración y alineación. Juntos, construimos una base de conocimiento compartida que permitió a los participantes mapear el desafío y aclarar los objetivos de largo plazo. Esto creó las condiciones para un entendimiento colectivo y una visión unificada.</p>\n<p>A partir de ahí, entramos en una etapa de ideación altamente creativa. Mediante sesiones estructuradas de cocreación, el equipo generó una amplia variedad de ideas y exploró diversas formas de mejorar la gestión del flujo de caja. Estas ideas se fueron refinando progresivamente con bocetos y discusiones hasta que surgió un concepto cohesivo.</p>\n<p>Siguió la toma de decisiones, en la que priorizamos las ideas más viables y empezamos a dar forma a la experiencia de usuario. Se creó un flujo de prototipo de alto nivel, apoyado en diseños detallados de pantallas que ilustraban cómo funcionaría la plataforma.</p>\n<p>Luego llegó la etapa de prototipado. Desarrollamos un prototipo realista e interactivo y diseñamos un guion narrativo para demostrar el potencial de la solución. Este prototipo mostró funcionalidades clave como el seguimiento de la posición de liquidez, herramientas de proyección y capacidades de simulación.</p>\n<p>Finalmente, el prototipo se probó con expertos financieros y stakeholders. Sus comentarios fueron fundamentales para identificar oportunidades de mejora y asegurar que la solución respondiera de manera efectiva a necesidades reales.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultados</h2>\n<p>El prototipo de <em>360° Cash Flow</em> introdujo una nueva forma de gestionar las finanzas en Ecopetrol. Ofreció herramientas intuitivas para la simulación de escenarios, la visualización del flujo de caja y la planeación estratégica, lo que permite a los equipos pasar del análisis reactivo a un insight proactivo. El Design Sprint dio lugar a varios avances clave:</p>\n<ol><li><strong>Desarrollo del prototipo:</strong> Creamos un prototipo funcional de una plataforma 360° Cash Flow, con herramientas intuitivas para explorar, filtrar y analizar datos financieros. Entre las funcionalidades clave estaban la posición de liquidez, la proyección de caja, la simulación del flujo de caja, el seguimiento del desempeño y la optimización.</li><li><strong>Soluciones centradas en el usuario:</strong> Validamos el prototipo con stakeholders, asegurando que respondiera a las necesidades de los usuarios y a los principales puntos de dolor. Las herramientas facilitaron una toma de decisiones más eficiente y basada en datos, reduciendo las tareas manuales y mejorando la claridad de los datos.</li><li><strong>Alineación estratégica:</strong> Alineamos las nuevas herramientas con los objetivos estratégicos de Ecopetrol, apoyando un enfoque más estructurado y sistemático del análisis de flujo de caja y del pronóstico macroeconómico. Esta alineación permitió una mejor integración del conocimiento experto, los modelos analíticos y las fuentes de datos externas.</li><li><strong>Colaboración fortalecida:</strong> Fomentamos una cultura colaborativa entre los miembros del equipo, combinando diversas perspectivas para innovar y resolver problemas complejos. La participación de los stakeholders fue crucial para lograr la aceptación y el respaldo de las nuevas iniciativas.</li></ol>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Impacto</h2>\n<p>Esta iniciativa transformó la gestión del flujo de caja en Ecopetrol. La plataforma permitió obtener insights en tiempo real, redujo el manejo manual de datos y mejoró la precisión de los pronósticos. También respaldó la toma de decisiones estratégicas con herramientas de simulación y optimización. Más allá de los beneficios técnicos, el proyecto impulsó un cambio cultural hacia la agilidad, el pensamiento centrado en el usuario y la innovación, sentando las bases de un futuro financiero más inteligente y resiliente.</p>"}},{"id":"1269a9f0000e80ac912edd500979236a","slug":"exploring-opportunities-for-the-reuse-of-ecopetrol-s-byproducts-in-susta","title":"Exploring Opportunities for the Reuse of Ecopetrol's Byproducts in Sustainable Construction with a Circular Approach","sub":"","year":2024,"client":["Ecopetrol"],"industry":["Energy"],"type":["Sustainable Futures","Transformation"],"role":["Strategic Design Consultant"],"country":[],"highlight":false,"link":"","texture":"flow","excerpt":"At Ecopetrol's refineries, water from the Magdalena River must be clarified before entering the production cycle, leaving behind solid matter that was previously treated as waste. At Neture Impact (part of VML), we…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Starting Point</h2>\n<p>In October 2024, Ecopetrol, in partnership with <strong>The Cocktail</strong>, CCCS, and XM, held a <strong>co-creation workshop</strong> in Bogotá. The objective was to explore opportunities to reuse byproducts from the oil and gas industry in sustainable construction, following the principles of <strong>Circular Economy</strong>. Ecopetrol faced challenges related to making these materials (e.g., spent catalysts, clarification solids, and construction and demolition waste) commercially viable and sustainable for the construction and infrastructure sectors.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The challenge was to create a <strong>sustainable and circular business model</strong> that would allow the certification and commercialization of byproducts generated in Ecopetrol's operations. The difficulty lay in bringing together different actors in the ecosystem—regulatory bodies, construction companies, and strategic allies—while ensuring technical feasibility, market acceptance, and regulatory compliance.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>What We Did</h2>\n<ul><li>Facilitated a <strong>co-creation workshop</strong> using agile methodologies at The Cocktail Bogotá.</li><li>Engaged teams from <strong>CCCS and XM</strong>, along with science, technology, and innovation experts from Ecopetrol.</li><li>Identified and prioritized key byproducts for circular exploration: <strong>clarification solids, spent FCC catalysts, construction waste, and modified asphalt</strong>.</li><li>Developed <strong>business model prototypes</strong> focusing on the reuse of these byproducts.</li><li>Explored <strong>application areas</strong>, including public infrastructure, social housing, and commercial construction projects.</li><li>Established <strong>synergies and alliances</strong> to enable pilot projects.</li><li>Documented the results and outlined next steps for <strong>scaling</strong> the model.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>The Impact</h2>\n<ul><li><strong>Identified 5 key application areas</strong> for byproducts in infrastructure and construction.</li><li>Developed <strong>business model prototypes</strong> focused on reusing clarification solids and FCC catalysts.</li><li>Explored <strong>strategic alliances</strong> across sectors to support certification and commercialization of byproducts.</li><li><strong>Inspiration and alignment</strong> among participants, fostering future collaborations for sustainable operations.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>After this project</h2>\n<p>At VML, we developed a venture-building project with Ecopetrol to launch a new business unit focused on finding circular solutions for byproducts of their production processes.</p>\n<p>At Ecopetrol's refineries, water from the Magdalena River must be clarified before entering the production cycle, leaving behind solid matter that was previously treated as waste. At Neture Impact (part of VML), we helped Ecopetrol transform this byproduct into sustainable bricks, turning what once was discarded material into a valuable commercial solution for the construction industry.</p>","status":"published","cover":"","es":{"title":"Explorar oportunidades de reutilización de subproductos de Ecopetrol en construcción sostenible con enfoque circular","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Punto de partida</h2>\n<p>En octubre de 2024, Ecopetrol, en alianza con <strong>The Cocktail</strong>, CCCS y XM, realizó un <strong>taller de cocreación</strong> en Bogotá. El objetivo era explorar oportunidades para reutilizar subproductos de la industria de petróleo y gas en la construcción sostenible, siguiendo los principios de la <strong>Economía Circular</strong>. Ecopetrol enfrentaba desafíos para que estos materiales (por ejemplo, catalizadores gastados, sólidos de clarificación y residuos de construcción y demolición) fueran comercialmente viables y sostenibles para los sectores de la construcción y la infraestructura.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El desafío era crear un <strong>modelo de negocio sostenible y circular</strong> que permitiera la certificación y comercialización de los subproductos generados en las operaciones de Ecopetrol. La dificultad radicaba en reunir a distintos actores del ecosistema —entes reguladores, constructoras y aliados estratégicos— asegurando al mismo tiempo la factibilidad técnica, la aceptación del mercado y el cumplimiento normativo.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Qué hicimos</h2>\n<ul><li>Facilitamos un <strong>taller de cocreación</strong> con metodologías ágiles en The Cocktail Bogotá.</li><li>Involucramos a equipos de <strong>CCCS y XM</strong>, junto con expertos en ciencia, tecnología e innovación de Ecopetrol.</li><li>Identificamos y priorizamos subproductos clave para la exploración circular: <strong>sólidos de clarificación, catalizadores FCC gastados, residuos de construcción y asfalto modificado</strong>.</li><li>Desarrollamos <strong>prototipos de modelos de negocio</strong> centrados en la reutilización de estos subproductos.</li><li>Exploramos <strong>áreas de aplicación</strong>, entre ellas infraestructura pública, vivienda social y proyectos de construcción comercial.</li><li>Establecimos <strong>sinergias y alianzas</strong> para habilitar proyectos piloto.</li><li>Documentamos los resultados y delineamos los próximos pasos para <strong>escalar</strong> el modelo.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>El impacto</h2>\n<ul><li><strong>Identificamos 5 áreas clave de aplicación</strong> de los subproductos en infraestructura y construcción.</li><li>Desarrollamos <strong>prototipos de modelos de negocio</strong> enfocados en reutilizar sólidos de clarificación y catalizadores FCC.</li><li>Exploramos <strong>alianzas estratégicas</strong> entre sectores para apoyar la certificación y comercialización de los subproductos.</li><li><strong>Inspiración y alineación</strong> entre los participantes, que fomentan futuras colaboraciones para operaciones sostenibles.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Después de este proyecto</h2>\n<p>En VML desarrollamos un proyecto de venture building con Ecopetrol para lanzar una nueva unidad de negocio enfocada en encontrar soluciones circulares para los subproductos de sus procesos productivos.</p>\n<p>En las refinerías de Ecopetrol, el agua del río Magdalena debe clarificarse antes de entrar al ciclo productivo, lo que deja un material sólido que antes se trataba como desecho. En Neture Impact (parte de VML), ayudamos a Ecopetrol a transformar este subproducto en ladrillos sostenibles, convirtiendo lo que antes era un material desechado en una solución comercial valiosa para la industria de la construcción.</p>"}},{"id":"13e9a9f0000e804db308d4ab0d2ae1a9","slug":"a-systems-approach-to-ecopetrol-s-challenge-led-science-and-technology-s","title":"A Systems Approach to Ecopetrol's Challenge-Led Science and Technology Strategy","sub":"","year":2024,"client":["Ecopetrol"],"industry":["Energy"],"type":["Sustainable Futures"],"role":["Strategic Design Consultant"],"country":[],"highlight":false,"link":"","texture":"grain","excerpt":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>This project involved designing a methodology for characterizing Ecopetrol's 11 challenges in Science, Technology, and Innovation (CT+i) towards 2040. We collaborated with Ecopetrol's CT+i Strategy Management team and technical experts from ICPET (Research Center). Initially, there was no standardized process for analyzing these complex, multi-dimensional challenges, hindering strategic decision-making and resource allocation. The project aimed to create a structured, participatory approach to understand these challenges, identify key technological levers, and enable informed strategic planning aligned with Ecopetrol's 2040 vision.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Challenge</h2>\n<p>The primary challenge was the lack of a clear, consistent methodology for analyzing the mega-challenges. This absence hindered effective problem-solving, resource prioritization, and alignment of efforts across different areas and subsidiaries within Ecopetrol. Existing approaches offered limited, siloed perspectives, failing to capture the interconnected nature of the challenges and the dynamic environment in which they exist. This lack of a shared understanding and framework made it difficult to identify effective solutions and measure progress towards the 2040 strategic goals.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Actions taken</h2>\n<ul><li><strong>Initial Planning and Alignment:</strong> The-Cocktail team held meetings with Ecopetrol's CT+i Strategy Management to understand their vision, gather information, and align expectations for the project.</li><li><strong>Collaborative Workshop Design:</strong> A virtual co-creation workshop was designed with interactive exercises and collaborative dynamics to facilitate a shared understanding of the challenge and desired outcomes.</li><li><strong>Virtual Co-creation Workshop:</strong> A four-hour virtual workshop was conducted with Ecopetrol staff and ICPET technical experts. Participants engaged in activities to define the purpose, scope, and desired outcomes of the characterization process.</li><li><strong>Methodology Development:</strong> Based on workshop outputs, a five-stage methodology was developed, incorporating principles of systems thinking and participatory design.</li><li><strong>Illustrative Examples and Tools:</strong> Illustrative examples, methods, and tools were developed to guide the application of the methodology.</li><li><strong>Documentation and Reporting:</strong> A comprehensive report was produced, documenting the workshop process, the resulting methodology, and recommendations for future steps.</li><li><strong>Pilot Project Recommendation:</strong> A pilot project was recommended to test and refine the methodology using one of the mega-challenges.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Impact</h2>\n<ul><li><strong>Structured Methodology:</strong> A clear, five-stage methodology for characterizing the mega-challenges was created, providing a structured approach for analysis and decision-making.</li><li><strong>Shared Understanding:</strong> The workshop and subsequent report fostered a shared understanding of the challenges and the importance of a multidisciplinary approach.</li><li><strong>Enhanced Collaboration:</strong> The participatory process encouraged collaboration and knowledge sharing between different areas and subsidiaries within Ecopetrol.</li><li><strong>Strategic Alignment:</strong> The methodology ensured alignment with Ecopetrol's 2040 vision and strategic objectives.</li><li><strong>Actionable Framework:</strong> The defined methodology and pilot project recommendation provided an actionable framework for moving forward with the characterization process.</li><li><strong>Capacity Building:</strong> The workshop and supporting materials contributed to capacity building within Ecopetrol on systems thinking and participatory methods.</li><li><strong>Increased Efficiency:</strong> The structured approach is expected to increase efficiency in resource allocation and project prioritization.</li></ul>","status":"published","cover":"","es":{"title":"Un enfoque sistémico para la estrategia de ciencia y tecnología de Ecopetrol basada en retos","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>Este proyecto consistió en diseñar una metodología para caracterizar los 11 retos de Ecopetrol en Ciencia, Tecnología e Innovación (CT+i) hacia 2040. Colaboramos con el equipo de la Gerencia de Estrategia CT+i de Ecopetrol y con expertos técnicos del ICPET (Centro de Investigación). Inicialmente, no existía un proceso estandarizado para analizar estos retos complejos y multidimensionales, lo que dificultaba la toma de decisiones estratégicas y la asignación de recursos. El proyecto buscaba crear un enfoque estructurado y participativo para comprender estos retos, identificar las palancas tecnológicas clave y habilitar una planeación estratégica informada, alineada con la visión 2040 de Ecopetrol.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Desafío</h2>\n<p>El principal desafío era la falta de una metodología clara y consistente para analizar los megaretos. Esta ausencia dificultaba la resolución eficaz de problemas, la priorización de recursos y la alineación de esfuerzos entre las distintas áreas y filiales de Ecopetrol. Los enfoques existentes ofrecían perspectivas limitadas y aisladas, que no lograban capturar la naturaleza interconectada de los retos ni el entorno dinámico en el que existen. Esta falta de un entendimiento y un marco compartidos dificultaba identificar soluciones efectivas y medir el avance hacia las metas estratégicas 2040.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acciones realizadas</h2>\n<ul><li><strong>Planeación inicial y alineación:</strong> El equipo de The-Cocktail sostuvo reuniones con la Gerencia de Estrategia CT+i de Ecopetrol para comprender su visión, recopilar información y alinear las expectativas del proyecto.</li><li><strong>Diseño colaborativo del taller:</strong> Se diseñó un taller virtual de cocreación con ejercicios interactivos y dinámicas colaborativas para facilitar un entendimiento compartido del reto y de los resultados deseados.</li><li><strong>Taller virtual de cocreación:</strong> Se realizó un taller virtual de cuatro horas con personal de Ecopetrol y expertos técnicos del ICPET. Los participantes realizaron actividades para definir el propósito, el alcance y los resultados deseados del proceso de caracterización.</li><li><strong>Desarrollo de la metodología:</strong> Con base en los resultados del taller, se desarrolló una metodología de cinco etapas que incorpora principios de pensamiento sistémico y diseño participativo.</li><li><strong>Ejemplos ilustrativos y herramientas:</strong> Se desarrollaron ejemplos ilustrativos, métodos y herramientas para guiar la aplicación de la metodología.</li><li><strong>Documentación y reporte:</strong> Se elaboró un informe integral que documenta el proceso del taller, la metodología resultante y las recomendaciones para los siguientes pasos.</li><li><strong>Recomendación de un proyecto piloto:</strong> Se recomendó un proyecto piloto para probar y refinar la metodología con uno de los megaretos.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Impacto</h2>\n<ul><li><strong>Metodología estructurada:</strong> Se creó una metodología clara de cinco etapas para caracterizar los megaretos, que ofrece un enfoque estructurado para el análisis y la toma de decisiones.</li><li><strong>Entendimiento compartido:</strong> El taller y el informe posterior fomentaron un entendimiento compartido de los retos y de la importancia de un enfoque multidisciplinario.</li><li><strong>Colaboración fortalecida:</strong> El proceso participativo impulsó la colaboración y el intercambio de conocimiento entre las distintas áreas y filiales de Ecopetrol.</li><li><strong>Alineación estratégica:</strong> La metodología aseguró la alineación con la visión y los objetivos estratégicos 2040 de Ecopetrol.</li><li><strong>Marco accionable:</strong> La metodología definida y la recomendación del proyecto piloto ofrecieron un marco accionable para avanzar en el proceso de caracterización.</li><li><strong>Desarrollo de capacidades:</strong> El taller y los materiales de apoyo contribuyeron al desarrollo de capacidades en Ecopetrol en pensamiento sistémico y métodos participativos.</li><li><strong>Mayor eficiencia:</strong> Se espera que el enfoque estructurado aumente la eficiencia en la asignación de recursos y la priorización de proyectos.</li></ul>"}},{"id":"2c21f4e9dfac44a88fc1623bbfd3b9a0","slug":"empowering-price-analysis-at-ecopetrol","title":"Empowering Price Analysis at Ecopetrol","sub":"","year":2024,"client":["Ecopetrol"],"industry":["Energy"],"type":["Product Design and Strategy","Digital experience"],"role":["Strategic Design Consultant"],"country":[],"highlight":false,"link":"","texture":"dither","excerpt":"Understanding and Defining. Created a shared knowledge base among participants through structured discussions. Mapped out the challenge and defined long-term goals and key questions to address.","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>Ecopetrol, a major energy company in Latin America, faced challenges in efficiently analyzing and visualizing price forecasts and macroeconomic variables. The Economic Analysis and Industry department relied heavily on a comprehensive spreadsheet known as the \"Price Sheet,\" which was widely used across various management and operational areas. However, the need for a more robust, interactive, and scalable technological solution became evident to better support strategic and operational decisions.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Challenge</h2>\n<p>The primary challenge was to enhance the methodologies for analyzing prices and macroeconomic variables and to improve the deployment and visualization of this critical information. The existing tools were not interactive or user-friendly enough, leading to inefficiencies and difficulties in data interpretation and decision-making. To address this, a Design Sprint was initiated to develop agile and collaborative solutions that would transform the current practices.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>What We Did</h2>\n<p><strong>Planning and Preparation.</strong> Defined the challenge and objectives for the sprint. Selected a multidisciplinary core team and planned the activities for the sprint. Gathered relevant information and conducted stakeholder interviews to understand the context.</p>\n<p><strong>Understanding and Defining.</strong> Created a shared knowledge base among participants through structured discussions. Mapped out the challenge and defined long-term goals and key questions to address.</p>\n<p><strong>Ideation and Sketching.</strong> Conducted exercises to generate and refine a wide range of ideas. Developed detailed sketches of potential solutions.</p>\n<p><strong>Decision Making.</strong> Evaluated and selected the most promising ideas through team consensus. Created a high-level prototype flow and detailed screen designs.</p>\n<p><strong>Prototyping.</strong> Developed a realistic prototype of the chosen solution. Designed and defined a script for presenting the concept and functionalities.</p>\n<p><strong>Validation.</strong> Tested the prototype with key stakeholders. Collected feedback to identify strengths and opportunities for improvement.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Results</h2>\n<p>The Design Sprint yielded significant advancements in Ecopetrol's price analysis processes:</p>\n<ol><li><strong>Prototype Development:</strong> Created a function
