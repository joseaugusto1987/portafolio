al prototype for a price analysis portal, which provided intuitive tools for exploring, consuming, filtering, and analyzing relevant information. The portal included features like variable search, visualizations in graph or table format, scenario saving, and comparison between different price sets.</li><li><strong>User-Centered Solutions:</strong> The prototype was validated with stakeholders, ensuring that it met user needs and addressed key pain points. The new tools facilitated a more efficient and data-driven decision-making process, reducing reliance on manual methods and improving the clarity of information.</li><li><strong>Strategic Alignment:</strong> The new tools were aligned with Ecopetrol's long-term strategic goals, supporting a more structured and systematic approach to price analysis and macroeconomic forecasting. This alignment enabled better integration of expert knowledge, analytical models, and external data sources.</li><li><strong>Enhanced Collaboration:</strong> The sprint fostered a collaborative culture among team members, combining diverse perspectives to innovate and solve complex problems. The active participation of stakeholders in the sprint process helped in achieving buy-in and support for the new initiatives.</li></ol>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Impact</h2>\n<p>The Design Sprint not only transformed Ecopetrol's approach to price analysis but also set a precedent for future innovation projects. The initiative highlighted the value of agile methodologies and user-centered design in driving organizational change and improving efficiency. The successful implementation of the new tools and methodologies is expected to significantly enhance Ecopetrol's ability to make informed, strategic decisions based on accurate and timely data.</p>\n<p>By addressing the technological and methodological gaps, the Design Sprint initiative has paved the way for more robust and scalable solutions, ultimately contributing to Ecopetrol's mission of generating sustainable value for its stakeholders.</p>","status":"published","cover":"","es":{"title":"Potenciar el análisis de precios en Ecopetrol","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>Ecopetrol, una de las principales compañías de energía de América Latina, enfrentaba desafíos para analizar y visualizar de manera eficiente los pronósticos de precios y las variables macroeconómicas. El departamento de Análisis Económico e Industria dependía en gran medida de una hoja de cálculo integral conocida como la \"Hoja de Precios\", ampliamente utilizada en diversas áreas gerenciales y operativas. Sin embargo, se hizo evidente la necesidad de una solución tecnológica más robusta, interactiva y escalable para respaldar mejor las decisiones estratégicas y operativas.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Desafío</h2>\n<p>El principal desafío era mejorar las metodologías de análisis de precios y variables macroeconómicas, y perfeccionar el despliegue y la visualización de esta información crítica. Las herramientas existentes no eran lo suficientemente interactivas ni amigables, lo que generaba ineficiencias y dificultades en la interpretación de los datos y en la toma de decisiones. Para abordarlo, se inició un Design Sprint con el fin de desarrollar soluciones ágiles y colaborativas que transformaran las prácticas actuales.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Qué hicimos</h2>\n<p><strong>Planeación y preparación.</strong> Definimos el desafío y los objetivos del sprint. Seleccionamos un equipo central multidisciplinario y planeamos las actividades del sprint. Recopilamos información relevante y realizamos entrevistas con stakeholders para comprender el contexto.</p>\n<p><strong>Comprensión y definición.</strong> Creamos una base de conocimiento compartida entre los participantes mediante conversaciones estructuradas. Mapeamos el desafío y definimos metas de largo plazo y preguntas clave por resolver.</p>\n<p><strong>Ideación y bocetos.</strong> Realizamos ejercicios para generar y refinar una amplia variedad de ideas. Desarrollamos bocetos detallados de posibles soluciones.</p>\n<p><strong>Toma de decisiones.</strong> Evaluamos y seleccionamos las ideas más prometedoras por consenso del equipo. Creamos un flujo de prototipo de alto nivel y diseños detallados de pantallas.</p>\n<p><strong>Prototipado.</strong> Desarrollamos un prototipo realista de la solución elegida. Diseñamos y definimos un guion para presentar el concepto y las funcionalidades.</p>\n<p><strong>Validación.</strong> Probamos el prototipo con stakeholders clave. Recopilamos comentarios para identificar fortalezas y oportunidades de mejora.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Resultados</h2>\n<p>El Design Sprint produjo avances significativos en los procesos de análisis de precios de Ecopetrol:</p>\n<ol><li><strong>Desarrollo del prototipo:</strong> Creamos un prototipo funcional de un portal de análisis de precios, con herramientas intuitivas para explorar, consumir, filtrar y analizar la información relevante. El portal incluía funcionalidades como la búsqueda de variables, visualizaciones en formato de gráfico o tabla, el guardado de escenarios y la comparación entre distintos conjuntos de precios.</li><li><strong>Soluciones centradas en el usuario:</strong> El prototipo se validó con stakeholders, asegurando que respondiera a las necesidades de los usuarios y a los principales puntos de dolor. Las nuevas herramientas facilitaron una toma de decisiones más eficiente y basada en datos, reduciendo la dependencia de métodos manuales y mejorando la claridad de la información.</li><li><strong>Alineación estratégica:</strong> Las nuevas herramientas se alinearon con los objetivos estratégicos de largo plazo de Ecopetrol, apoyando un enfoque más estructurado y sistemático del análisis de precios y del pronóstico macroeconómico. Esta alineación permitió una mejor integración del conocimiento experto, los modelos analíticos y las fuentes de datos externas.</li><li><strong>Colaboración fortalecida:</strong> El sprint fomentó una cultura colaborativa entre los miembros del equipo, combinando diversas perspectivas para innovar y resolver problemas complejos. La participación activa de los stakeholders en el proceso del sprint ayudó a lograr la aceptación y el respaldo de las nuevas iniciativas.</li></ol>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Impacto</h2>\n<p>El Design Sprint no solo transformó el enfoque de Ecopetrol frente al análisis de precios, sino que también sentó un precedente para futuros proyectos de innovación. La iniciativa puso de relieve el valor de las metodologías ágiles y del diseño centrado en el usuario para impulsar el cambio organizacional y mejorar la eficiencia. Se espera que la implementación exitosa de las nuevas herramientas y metodologías fortalezca de manera significativa la capacidad de Ecopetrol para tomar decisiones estratégicas informadas con base en datos precisos y oportunos.</p>\n<p>Al abordar las brechas tecnológicas y metodológicas, la iniciativa del Design Sprint abrió el camino hacia soluciones más robustas y escalables, contribuyendo en última instancia a la misión de Ecopetrol de generar valor sostenible para sus grupos de interés.</p>"}},{"id":"57322848e4824654bc9bbedefa45d588","slug":"design-and-implementation-of-an-agile-design-bootcamp-at-ecopetrol","title":"Design and Implementation of an Agile Design Bootcamp at Ecopetrol","sub":"","year":2024,"client":["Ecopetrol"],"industry":["Energy"],"type":["Workshop / Bootcamp","Transformation"],"role":["Strategic Design Consultant"],"country":["Colombia"],"highlight":false,"link":"","texture":"flow","excerpt":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>In July 2024, Ecopetrol, in collaboration with The-Cocktail, conducted an Agile Design Bootcamp to strengthen its innovation processes and conceptualization of initiatives. This intensive program was aimed at the team of the Ecopetrol Analytics Hub, a group with the mission of maximizing the value of the business group through analytics, identifying opportunities, and developing solutions that improve decision-making and optimize company operations.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The main challenge faced by the Ecopetrol Analytics Hub was to demonstrate its value through the tangible impact of its initiatives. Adopting agile design methodologies was essential to accelerate the identification and solution of problems, promote cross-disciplinary collaboration, and enable rapid iteration of ideas. This approach sought to enhance the team's ability to respond swiftly to market needs, boost their innovation culture, and generate sustainable value for the company.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>What We Did</h2>\n<ul><li>Conducted a one-day intensive bootcamp where the agile design framework and its relevance in business contexts were introduced.</li><li>Defined long-term expectations and goals for the Analytics Hub team.</li><li>Identified key problems using the Challenge Map and HMW questions.</li><li>Generated creative solutions using techniques like Crazy 8.</li><li>Built rapid prototypes of the best-selected ideas.</li><li>Tested the prototypes with real users to gather feedback.</li><li>Summarized findings and planned the next steps to implement the developed solutions.</li></ul>","status":"published","cover":"","es":{"title":"Diseño e implementación de un bootcamp de diseño ágil en Ecopetrol","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>En julio de 2024, Ecopetrol, en colaboración con The-Cocktail, realizó un Bootcamp de Diseño Ágil para fortalecer sus procesos de innovación y la conceptualización de iniciativas. Este programa intensivo estuvo dirigido al equipo del Analytics Hub de Ecopetrol, un grupo cuya misión es maximizar el valor del grupo empresarial mediante la analítica, identificando oportunidades y desarrollando soluciones que mejoren la toma de decisiones y optimicen las operaciones de la compañía.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El principal desafío del Analytics Hub de Ecopetrol era demostrar su valor a través del impacto tangible de sus iniciativas. Adoptar metodologías de diseño ágil era esencial para acelerar la identificación y solución de problemas, promover la colaboración interdisciplinaria y permitir una iteración rápida de las ideas. Este enfoque buscaba mejorar la capacidad del equipo para responder con rapidez a las necesidades del mercado, impulsar su cultura de innovación y generar valor sostenible para la compañía.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Qué hicimos</h2>\n<ul><li>Realizamos un bootcamp intensivo de un día en el que se presentó el marco de diseño ágil y su relevancia en contextos empresariales.</li><li>Definimos las expectativas y metas de largo plazo del equipo del Analytics Hub.</li><li>Identificamos los problemas clave con el Mapa de Desafíos y preguntas HMW.</li><li>Generamos soluciones creativas con técnicas como Crazy 8.</li><li>Construimos prototipos rápidos de las mejores ideas seleccionadas.</li><li>Probamos los prototipos con usuarios reales para recopilar comentarios.</li><li>Resumimos los hallazgos y planeamos los siguientes pasos para implementar las soluciones desarrolladas.</li></ul>"}},{"id":"a90df5a2892b431c8ba1864bae62d78c","slug":"transforming-petroleum-trading","title":"Transforming Petroleum Trading","sub":"Ecopetrol's Leap into Advanced Analytics","year":2024,"client":["Ecopetrol"],"industry":["Energy"],"type":["Digital experience"],"role":["Strategic Design Consultant"],"country":["Colombia"],"highlight":false,"link":"","texture":"dither","excerpt":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>In July 2024, Ecopetrol, in collaboration with The-Cocktail, conducted a Design Sprint aimed at enhancing their crude oil trading processes through advanced analytics. This intensive three-day sprint sought to identify and address critical challenges faced by the trading team, such as optimizing decision-making, improving operational efficiency, and maximizing commercial margins. Various areas within the company were involved to ensure the seamless integration of new strategies into daily workflows.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Challenge</h2>\n<p>Ecopetrol's crude oil trading team was encountering multiple challenges in a highly volatile and competitive market. The need to access and manage dispersed critical information, efficiently evaluate and mitigate risks, and optimize manual processes limited their ability to maximize commercial margins. Additionally, the lack of interdepartmental coordination and the complexity of maintaining strong customer relationships hindered informed decision-making. The overarching challenge was to transform the trading process by developing innovative solutions that align all involved areas and leverage advanced analytics for more agile and effective management.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Actions Taken</h2>\n<ul><li>Conducted a three-day Design Sprint using agile and creative methodologies focused on optimizing crude oil trading through advanced analytics.</li><li>Engaged over 18 participants from Ecopetrol to ensure diverse perspectives and comprehensive solutions.</li><li>Developed 13 solution concepts and identified 22 key functionalities for the backlog.</li><li>Created a validated prototype for trading in the Asian market.</li><li>Mapped the trading process and facilitated interdepartmental coordination.</li><li>Conducted exercises to prioritize high-value initiatives and detailed the concepts for a high-fidelity prototype.</li><li>Validated the prototype with key stakeholders and incorporated their feedback into the final solution.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Intended Impact</h2>\n<ul><li>Enhanced decision-making processes, enabling quicker and more informed responses to market fluctuations.</li><li>Improved operational efficiency through optimized manual processes and better interdepartmental coordination.</li><li>Increased commercial margins by aligning trading strategies with advanced analytics insights.</li><li>Boosted customer satisfaction by providing greater transparency, personalization, and faster transaction times.</li><li>Facilitated the adoption of new trading methodologies and tools among Ecopetrol's staff, ensuring a smooth transition to more advanced trading practices.</li></ul>","status":"published","cover":"","es":{"title":"Transformar el trading de petróleo","sub":"El salto de Ecopetrol hacia la analítica avanzada","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>En julio de 2024, Ecopetrol, en colaboración con The-Cocktail, realizó un Design Sprint para mejorar sus procesos de comercialización de crudo mediante analítica avanzada. Este sprint intensivo de tres días buscaba identificar y abordar los desafíos críticos del equipo de trading, como optimizar la toma de decisiones, mejorar la eficiencia operativa y maximizar los márgenes comerciales. Participaron diversas áreas de la compañía para asegurar la integración fluida de las nuevas estrategias en los flujos de trabajo diarios.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Desafío</h2>\n<p>El equipo de comercialización de crudo de Ecopetrol enfrentaba múltiples desafíos en un mercado altamente volátil y competitivo. La necesidad de acceder a información crítica dispersa y gestionarla, evaluar y mitigar riesgos de manera eficiente y optimizar procesos manuales limitaba su capacidad de maximizar los márgenes comerciales. Además, la falta de coordinación entre departamentos y la complejidad de mantener relaciones sólidas con los clientes dificultaban la toma de decisiones informadas. El desafío general era transformar el proceso de comercialización desarrollando soluciones innovadoras que alinearan a todas las áreas involucradas y aprovecharan la analítica avanzada para una gestión más ágil y efectiva.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Acciones realizadas</h2>\n<ul><li>Realizamos un Design Sprint de tres días con metodologías ágiles y creativas, enfocado en optimizar la comercialización de crudo mediante analítica avanzada.</li><li>Involucramos a más de 18 participantes de Ecopetrol para asegurar perspectivas diversas y soluciones integrales.</li><li>Desarrollamos 13 conceptos de solución e identificamos 22 funcionalidades clave para el backlog.</li><li>Creamos un prototipo validado para la comercialización en el mercado asiático.</li><li>Mapeamos el proceso de comercialización y facilitamos la coordinación entre departamentos.</li><li>Realizamos ejercicios para priorizar las iniciativas de mayor valor y detallamos los conceptos para un prototipo de alta fidelidad.</li><li>Validamos el prototipo con stakeholders clave e incorporamos sus comentarios en la solución final.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Impacto esperado</h2>\n<ul><li>Procesos de toma de decisiones fortalecidos, que permiten respuestas más rápidas e informadas ante las fluctuaciones del mercado.</li><li>Mayor eficiencia operativa gracias a procesos manuales optimizados y a una mejor coordinación entre departamentos.</li><li>Mayores márgenes comerciales al alinear las estrategias de comercialización con los insights de la analítica avanzada.</li><li>Mayor satisfacción de los clientes gracias a más transparencia, personalización y tiempos de transacción más rápidos.</li><li>Adopción facilitada de nuevas metodologías y herramientas de comercialización entre el personal de Ecopetrol, asegurando una transición fluida hacia prácticas de trading más avanzadas.</li></ul>"}},{"id":"d64fad13864e42efa5d78000ca7dcd03","slug":"tangible-futures","title":"Tangible Futures","sub":"A Purpose-driven Strategy for a Science Center","year":2024,"client":["Parque Explora"],"industry":["Third Sector / NGOs"],"type":["Strategy","Sustainable Futures","Purpose-driven strategy"],"role":["Strategic Design Consultant"],"country":["Colombia"],"highlight":true,"link":"","texture":"grain","excerpt":"Through collaborative workshops, we surfaced core tensions and aspirations. We identified four global forces shaping the future—planetary health, technological acceleration, social justice, and globalization—which…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>Parque Explora, a renowned science museum in Medellín, Colombia, embarked on a strategic transformation journey to enhance its impact on the community and ensure long-term sustainability. The organization aimed to integrate its diverse offerings, including interactive exhibitions, educational programs, and conservation efforts, into a cohesive strategic framework. This initiative was driven by the need to align internal processes, foster a unified organizational culture, and leverage technological advancements for greater operational efficiency.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>Parque Explora had reached an inflection point: rapid growth and diversification created strong momentum, while also revealing an opportunity to <strong>clarify strategic direction</strong> and strengthen <strong>shared organizational practices</strong>. Over time, operations had become more complex and fragmented, leading to misaligned priorities, process inefficiencies, and moments where focus on the museum’s core mission became diluted. In parallel, advancing a <strong>sustainable financial model</strong> and deepening <strong>stakeholder engagement</strong> became critical to securing long-term viability.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>My Role</h2>\n<p>I led the end-to-end development of the commercial proposal, from shaping a winning value proposition to delivering client presentations and negotiating project scope. Once the engagement was initiated, I guided the consulting team by providing strategic direction, contextual insights about Parque Explora, and depth of analysis. I also shaped the impact narrative aligned with global future trends and refined the operational model to ensure coherence between vision and execution.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>The Process</h2>\n<p>We began with a comprehensive diagnostic to understand the current state of the organization. This included over 50 internal documents, 20 interviews with leadership, and two focus groups with frontline teams and community members. A physical site visit provided insight into the spatial and operational realities of the museum. This phase revealed deep misalignment between teams, disconnected initiatives, and a lack of shared strategic language.</p>\n<p>Through collaborative workshops, we surfaced core tensions and aspirations. We identified four global forces shaping the future—planetary health, technological acceleration, social justice, and globalization—which became the foundation for strategic sensemaking. We facilitated the alignment of leadership around a bold but grounded purpose: to catalyze social and environmental transformation through knowledge, curiosity, and participation.</p>\n<p>We co-created a new strategic architecture with leadership: a shared purpose, one organizational objective, and four impact pillars—Augmented Curiosity, Active Citizenship, Relevant Schools, and Conscious Conservation. These pillars connected Explora’s diverse programs to global futures and local realities. We also articulated a dual-operating model—museum and project development hub—and introduced the metaphor of a “cultural ecotone” to describe the synergy between both worlds.</p>\n<p>We translated the strategy into a transformation roadmap built around four strategic fronts: Strategic Deployment, Cultural Harmony, Operational Symphony, and Path to the Future. Each front included a set of high-leverage initiatives—such as cultural transformation, interoperability architecture, and a new sustainability model—each designed to bridge the gap between vision and execution.</p>\n<p>These strategic definitions provide a comprehensive framework for Parque Explora to navigate future challenges, ensuring the alignment of its operations with its mission and goals, while fostering a culture of learning, collaboration, and sustainability.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Result</h2>\n<p>The project delivered Parque Explora’s first formal corporate strategy, fully co-created and approved by its leadership team. It established a strategic operating system that aligns its dual identities—museum and innovation partner—and positions it as a catalyst for collective learning and transformation. Personally, the project deepened my practice in strategic foresight, cultural systems design, and public innovation—reinforcing design as a driver of systemic change.</p>","status":"published","cover":"","es":{"title":"Futuros tangibles","sub":"Una estrategia con propósito para un centro de ciencia","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>Parque Explora, un reconocido museo de ciencias de Medellín, Colombia, emprendió un camino de transformación estratégica para aumentar su impacto en la comunidad y asegurar su sostenibilidad a largo plazo. La organización buscaba integrar sus diversas ofertas, entre ellas exposiciones interactivas, programas educativos y esfuerzos de conservación, en un marco estratégico cohesivo. Esta iniciativa respondía a la necesidad de alinear los procesos internos, fomentar una cultura organizacional unificada y aprovechar los avances tecnológicos para lograr una mayor eficiencia operativa.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>Parque Explora había llegado a un punto de inflexión: el crecimiento rápido y la diversificación generaron un fuerte impulso, pero también revelaron la oportunidad de <strong>clarificar la dirección estratégica</strong> y fortalecer las <strong>prácticas organizacionales compartidas</strong>. Con el tiempo, las operaciones se habían vuelto más complejas y fragmentadas, lo que llevó a prioridades desalineadas, ineficiencias en los procesos y momentos en que el foco en la misión central del museo se diluía. En paralelo, avanzar hacia un <strong>modelo financiero sostenible</strong> y profundizar la <strong>relación con los grupos de interés</strong> se volvió crítico para asegurar la viabilidad a largo plazo.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Mi rol</h2>\n<p>Lideré el desarrollo integral de la propuesta comercial, desde la construcción de una propuesta de valor ganadora hasta las presentaciones al cliente y la negociación del alcance del proyecto. Una vez iniciado el proyecto, guié al equipo consultor aportando dirección estratégica, insights de contexto sobre Parque Explora y profundidad de análisis. También le di forma a la narrativa de impacto alineada con las tendencias globales de futuro y refiné el modelo operativo para asegurar la coherencia entre la visión y la ejecución.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>El proceso</h2>\n<p>Comenzamos con un diagnóstico integral para comprender el estado actual de la organización. Este incluyó más de 50 documentos internos, 20 entrevistas con el liderazgo y dos grupos focales con equipos de primera línea y miembros de la comunidad. Una visita física al sitio nos dio una idea de las realidades espaciales y operativas del museo. Esta fase reveló una profunda desalineación entre los equipos, iniciativas desconectadas y la falta de un lenguaje estratégico compartido.</p>\n<p>A través de talleres colaborativos, sacamos a la luz las tensiones y aspiraciones centrales. Identificamos cuatro fuerzas globales que están dando forma al futuro —la salud planetaria, la aceleración tecnológica, la justicia social y la globalización—, que se convirtieron en la base del sensemaking estratégico. Facilitamos la alineación del liderazgo en torno a un propósito audaz pero aterrizado: catalizar la transformación social y ambiental a través del conocimiento, la curiosidad y la participación.</p>\n<p>Cocreamos con el liderazgo una nueva arquitectura estratégica: un propósito compartido, un objetivo organizacional y cuatro pilares de impacto —Curiosidad Aumentada, Ciudadanía Activa, Escuelas Relevantes y Conservación Consciente—. Estos pilares conectaron los diversos programas de Explora con los futuros globales y las realidades locales. También articulamos un modelo de operación dual —museo y centro de desarrollo de proyectos— e introdujimos la metáfora de un \"ecotono cultural\" para describir la sinergia entre ambos mundos.</p>\n<p>Tradujimos la estrategia en una hoja de ruta de transformación construida en torno a cuatro frentes estratégicos: Despliegue Estratégico, Armonía Cultural, Sinfonía Operativa y Camino al Futuro. Cada frente incluyó un conjunto de iniciativas de alto apalancamiento —como la transformación cultural, la arquitectura de interoperabilidad y un nuevo modelo de sostenibilidad—, diseñadas para cerrar la brecha entre la visión y la ejecución.</p>\n<p>Estas definiciones estratégicas ofrecen a Parque Explora un marco integral para afrontar los desafíos futuros, asegurando la alineación de sus operaciones con su misión y sus metas, al tiempo que fomentan una cultura de aprendizaje, colaboración y sostenibilidad.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Resultado</h2>\n<p>El proyecto entregó la primera estrategia corporativa formal de Parque Explora, totalmente cocreada y aprobada por su equipo directivo. Estableció un sistema operativo estratégico que alinea sus dos identidades —museo y aliado de innovación— y lo posiciona como catalizador del aprendizaje colectivo y la transformación. En lo personal, el proyecto profundizó mi práctica en prospectiva estratégica, diseño de sistemas culturales e innovación pública, reafirmando el diseño como motor del cambio sistémico.</p>"}},{"id":"334640ce568e4a119945efb641c6dd92","slug":"enhancing-the-customer-experience-at-coppel-stores","title":"Enhancing the Customer Experience at Coppel Stores","sub":"","year":2023,"client":["Coppel - Retail"],"industry":["Retail"],"type":["Customer Experience and Innovation"],"role":["Strategic Design Consultant"],"country":["México"],"highlight":false,"link":"","texture":"topo","excerpt":"Strategic Definition and Opportunity Identification. Defined clear strategic intentions to improve the in-store experience. Identified three key opportunity areas: personalization, accessibility, and conviviality.","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>Coppel, a major retail chain in Mexico, embarked on a strategic initiative to enhance the customer experience in its stores. The initiative, facilitated by The Cocktail, aimed to address systemic challenges, explore opportunities, and establish a clear roadmap for improving the in-store experience, aligning with Coppel’s commitment to customer satisfaction and operational excellence.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Challenge</h2>\n<p>Coppel faced several significant challenges:</p>\n<ul><li><strong>Customer Experience:</strong> Ensuring a seamless, satisfying, and personalized shopping experience for every customer.</li><li><strong>Accessibility:</strong> Enhancing store accessibility for all customers, including those with disabilities.</li><li><strong>Operational Efficiency:</strong> Streamlining store operations to improve customer service and satisfaction.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Methodology</h2>\n<p><strong>Understanding and Contextualizing the Challenge.</strong> Conducted an in-depth analysis of the current in-store experience through observations and customer feedback. Identified key strengths and weaknesses in the existing customer journey.</p>\n<p><strong>Strategic Definition and Opportunity Identification.</strong> Defined clear strategic intentions to improve the in-store experience. Identified three key opportunity areas: personalization, accessibility, and conviviality.</p>\n<p><strong>Ideation and Solution Development.</strong> Held collaborative workshops to brainstorm and prioritize potential solutions. Developed detailed proposals for initiatives with the most potential impact.</p>","status":"published","cover":"","es":{"title":"Mejorar la experiencia de cliente en las tiendas Coppel","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>Coppel, una importante cadena minorista de México, emprendió una iniciativa estratégica para mejorar la experiencia del cliente en sus tiendas. La iniciativa, facilitada por The Cocktail, buscaba abordar desafíos sistémicos, explorar oportunidades y establecer una hoja de ruta clara para mejorar la experiencia en tienda, en línea con el compromiso de Coppel con la satisfacción del cliente y la excelencia operativa.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Desafío</h2>\n<p>Coppel enfrentaba varios desafíos significativos:</p>\n<ul><li><strong>Experiencia del cliente:</strong> Garantizar una experiencia de compra fluida, satisfactoria y personalizada para cada cliente.</li><li><strong>Accesibilidad:</strong> Mejorar la accesibilidad de las tiendas para todos los clientes, incluidos aquellos con discapacidad.</li><li><strong>Eficiencia operativa:</strong> Optimizar las operaciones de las tiendas para mejorar el servicio y la satisfacción del cliente.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Metodología</h2>\n<p><strong>Comprensión y contextualización del desafío.</strong> Realizamos un análisis a profundidad de la experiencia actual en tienda mediante observaciones y comentarios de los clientes. Identificamos las principales fortalezas y debilidades del recorrido actual del cliente.</p>\n<p><strong>Definición estratégica e identificación de oportunidades.</strong> Definimos intenciones estratégicas claras para mejorar la experiencia en tienda. Identificamos tres áreas clave de oportunidad: personalización, accesibilidad y convivialidad.</p>\n<p><strong>Ideación y desarrollo de soluciones.</strong> Realizamos talleres colaborativos para generar y priorizar posibles soluciones. Desarrollamos propuestas detalladas para las iniciativas con mayor potencial de impacto.</p>"}},{"id":"499c034611614423ad86bb69bfcbc6c9","slug":"creating-the-strategic-priorities-of-coca-cola-en-tu-hogar","title":"Creating the Strategic Priorities of “Coca-Cola En Tu Hogar”","sub":"D2C Channel","year":2023,"client":["Coca-Cola Company","Coca-Cola FEMSA"],"industry":["CPG"],"type":["CX Strategy"],"role":["Strategic Design Consultant"],"country":["México"],"highlight":true,"link":"","texture":"topo","excerpt":"Coca-Cola En tu Hogar holds a cherished place in Mexican culture, evoking nostalgia and shared family moments. Its broad product range, affordability, and accessibility have solidified its iconic status across…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>En Tu Hogar is a strategic initiative led by KOF - TCCC to establish a renewed vision and strategic roadmap for Coca-Cola’s D2C (Direct-to-Consumer) channel in Mexico. The project aims to consolidate a strategic plan that provides focus and direction for future actions, leveraging the largest areas of opportunity and addressing key challenges to become a reference for the digital channel D2C. The initial goal is to transform the way Coca-Cola interacts with its customers through a robust and scalable digital ecosystem.</p>\n<p>Coca-Cola En tu Hogar holds a cherished place in Mexican culture, evoking nostalgia and shared family moments. Its broad product range, affordability, and accessibility have solidified its iconic status across generations.</p>\n<p>However, in a crowded market dominated by fast-delivery and pure-digital players, this legacy alone is insufficient. The channel faces low awareness and lacks a distinct value proposition, hindering its ability to compete effectively and retain customers.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>Coca-Cola FEMSA and The Coca-Cola Company set out to redefine the strategic direction of their direct-to-consumer (D2C) channel in Mexico, known as Coca-Cola en Tu Hogar (CCETH). Despite a 19% year-over-year revenue increase and a growing digital customer base, the channel faced major challenges: a fragmented value proposition, limited differentiation, and internal gaps that hindered scalability. The goal was to align both organizations around a bold, actionable vision and build the strategic foundations for CCETH to become a $1.5B business by 2028.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Process</h2>\n<p><strong>Immersion: Understanding the ecosystem and identifying blind spots.</strong> We began with a rapid yet thorough immersion phase, analyzing over 24 internal documents from KOF and KO, reviewing past initiatives, and conducting steering sessions with executive stakeholders. This allowed us to map the ecosystem holistically and surface inconsistencies between the formal strategy and the lived experience of users and teams. Through this “reality check,” we uncovered critical gaps in customer segmentation, service consistency, and digital readiness.</p>\n<p><strong>Exploration: Stakeholder dialogue and user research.</strong> The exploration phase combined over 25 stakeholder interviews with 1:1 user interviews and co-creation activities. We engaged decision-makers across marketing, tech, and operations to understand their strategic ambitions, and brought in direct voices from customers to validate value perceptions. We then facilitated a strategic thinking workshop in Mexico City with leaders from KO and KOF, where we used visual frameworks to connect business intent with user expectations.</p>\n<p><strong>Diagnosis: Six strategic dimensions.</strong> We synthesized our findings across six dimensions—customer, competition, financials, platform, organizational structure, and corporate alignment—to form a diagnosis of the current state. This analysis revealed a D2C model struggling to deliver consistency and emotional connection in its digital experience. We mapped proto-personas (e.g., single moms, digital planners, modern families) and tied them to unmet needs across the experience journey—from delivery to loyalty to product variety.</p>\n<p><strong>Defining capabilities and competitive advantage.</strong> Next, we framed six growth enablers to make the value proposition tangible: Home Attraction, Customer Experience, Portfolio Development, Data Strategy, Route-to-Market, and Organizational Transformation. We mapped capability gaps and surfaced where KOF and KO were aligned—and where they weren’t. This insight helped us design a two-phase transformation model: \"Fix the Basics\" to stabilize operations and \"Value to Home\" to scale and differentiate.</p>\n<p><strong>Strategic framing and prioritization.</strong> In the final definition stage, we translated the vision into a clear, phased roadmap. Each capability was broken down into strategic initiatives that addressed the most urgent business needs—improving delivery reliability, expanding the product portfolio, and designing a loyalty model rooted in emotional and financial value. We developed an executive narrative and visual model to communicate how CCETH could evolve from a transactional service into a distinctive, scalable relationship platform.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Task</h2>\n<p>As Strategic Design Lead, I guided the exploration from a customer-centric and systems-thinking perspective. I facilitated key stakeholder engagements, synthesized insights from multiple data streams, and translated findings into strategic frameworks and opportunity areas. I also led the articulation of the strategic narrative that shaped our final definition of capabilities, growth drivers, and roadmap priorities.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Result</h2>\n<p>The project delivered a shared strategic vision, a prioritized roadmap, and a set of actionable growth drivers that both KOF and KO adopted as the foundation for the next evolution of the D2C channel. These definitions have informed subsequent investment decisions and served as the north star for digital, portfolio, and organizational transformation. For me, this project sharpened my ability to design in complexity—balancing user insight, business logic, and systemic change—while facilitating alignment across diverse executive audiences.</p>","status":"published","cover":"","es":{"title":"Definir las prioridades estratégicas de “Coca-Cola En Tu Hogar”","sub":"Canal D2C","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>En Tu Hogar es una iniciativa estratégica liderada por KOF - TCCC para establecer una visión renovada y una hoja de ruta estratégica para el canal D2C (Direct-to-Consumer) de Coca-Cola en México. El proyecto busca consolidar un plan estratégico que dé foco y dirección a las acciones futuras, aprovechando las mayores áreas de oportunidad y abordando los desafíos clave para convertirse en un referente del canal digital D2C. El objetivo inicial es transformar la forma en que Coca-Cola interactúa con sus clientes mediante un ecosistema digital robusto y escalable.</p>\n<p>Coca-Cola En tu Hogar ocupa un lugar muy querido en la cultura mexicana, que evoca nostalgia y momentos familiares compartidos. Su amplio rango de productos, su asequibilidad y su accesibilidad han consolidado su estatus icónico a lo largo de generaciones.</p>\n<p>Sin embargo, en un mercado saturado y dominado por jugadores de entrega rápida y puramente digitales, este legado por sí solo no es suficiente. El canal enfrenta un bajo nivel de recordación y carece de una propuesta de valor distintiva, lo que limita su capacidad de competir eficazmente y retener clientes.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>Coca-Cola FEMSA y The Coca-Cola Company se propusieron redefinir la dirección estratégica de su canal direct-to-consumer (D2C) en México, conocido como Coca-Cola en Tu Hogar (CCETH). A pesar de un aumento de 19 % en los ingresos frente al año anterior y de una base creciente de clientes digitales, el canal enfrentaba desafíos importantes: una propuesta de valor fragmentada, poca diferenciación y brechas internas que limitaban la escalabilidad. El objetivo era alinear a ambas organizaciones en torno a una visión audaz y accionable, y construir las bases estratégicas para que CCETH se convirtiera en un negocio de USD 1.500 millones para 2028.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El proceso</h2>\n<p><strong>Inmersión: comprender el ecosistema e identificar puntos ciegos.</strong> Comenzamos con una fase de inmersión rápida pero rigurosa, en la que analizamos más de 24 documentos internos de KOF y KO, revisamos iniciativas pasadas y realizamos sesiones de seguimiento con stakeholders ejecutivos. Esto nos permitió mapear el ecosistema de manera integral y sacar a la luz inconsistencias entre la estrategia formal y la experiencia real de los usuarios y los equipos. A través de este \"chequeo de realidad\", descubrimos brechas críticas en la segmentación de clientes, la consistencia del servicio y la preparación digital.</p>\n<p><strong>Exploración: diálogo con stakeholders e investigación de usuarios.</strong> La fase de exploración combinó más de 25 entrevistas con stakeholders con entrevistas individuales a usuarios y actividades de cocreación. Involucramos a quienes toman decisiones en marketing, tecnología y operaciones para entender sus ambiciones estratégicas, e incorporamos la voz directa de los clientes para validar las percepciones de valor. Luego facilitamos un taller de pensamiento estratégico en Ciudad de México con líderes de KO y KOF, en el que usamos marcos visuales para conectar la intención del negocio con las expectativas de los usuarios.</p>\n<p><strong>Diagnóstico: seis dimensiones estratégicas.</strong> Sintetizamos nuestros hallazgos en seis dimensiones —cliente, competencia, finanzas, plataforma, estructura organizacional y alineación corporativa— para formar un diagnóstico del estado actual. Este análisis reveló un modelo D2C que luchaba por ofrecer consistencia y conexión emocional en su experiencia digital. Mapeamos protopersonas (por ejemplo, madres solteras, planificadores digitales, familias modernas) y las vinculamos con necesidades insatisfechas a lo largo del recorrido de la experiencia: desde la entrega hasta la lealtad y la variedad de productos.</p>\n<p><strong>Definición de capacidades y ventaja competitiva.</strong> Luego, enmarcamos seis habilitadores de crecimiento para hacer tangible la propuesta de valor: Atracción del Hogar, Experiencia del Cliente, Desarrollo de Portafolio, Estrategia de Datos, Route-to-Market y Transformación Organizacional. Mapeamos las brechas de capacidades y sacamos a la luz dónde estaban alineados KOF y KO, y dónde no. Este insight nos ayudó a diseñar un modelo de transformación en dos fases: \"Fix the Basics\" para estabilizar la operación y \"Value to Home\" para escalar y diferenciarse.</p>\n<p><strong>Encuadre estratégico y priorización.</strong> En la etapa final de definición, tradujimos la visión en una hoja de ruta clara y por fases. Cada capacidad se desglosó en iniciativas estratégicas que atendían las necesidades más urgentes del negocio —mejorar la confiabilidad de la entrega, ampliar el portafolio de productos y diseñar un modelo de lealtad basado en valor emocional y financiero—. Desarrollamos una narrativa ejecutiva y un modelo visual para comunicar cómo CCETH podía evolucionar de un servicio transaccional a una plataforma de relación distintiva y escalable.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Tarea</h2>\n<p>Como Strategic Design Lead, guié la exploración desde una perspectiva centrada en el cliente y de pensamiento sistémico. Facilité los espacios clave con stakeholders, sinteticé insights de múltiples fuentes de datos y traduje los hallazgos en marcos estratégicos y áreas de oportunidad. También lideré la articulación de la narrativa estratégica que dio forma a nuestra definición final de capacidades, motores de crecimiento y prioridades de la hoja de ruta.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>Resultado</h2>\n<p>El proyecto entregó una visión estratégica compartida, una hoja de ruta priorizada y un conjunto de motores de crecimiento accionables que tanto KOF como KO adoptaron como base para la siguiente evolución del canal D2C. Estas definiciones han orientado decisiones de inversión posteriores y sirvieron como norte para la transformación digital, de portafolio y organizacional. Para mí, este proyecto afinó mi capacidad de diseñar en la complejidad —equilibrando el insight del usuario, la lógica de negocio y el cambio sistémico— mientras facilitaba la alineación entre audiencias ejecutivas diversas.</p>"}},{"id":"58a2ab1e8a994a2d89e61e3e7143bfd2","slug":"the-future-of-mexico-city","title":"The Future of Mexico City","sub":"Building Resilience through the Climate Resilience Center (Concept)","year":2023,"client":[],"industry":["Goverment / Public"],"type":["Sustainable Futures"],"role":[],"country":["México"],"highlight":false,"link":"","texture":"grain","excerpt":"In this imagined future, certain areas of CDMX have evolved into \"oasis\" zones characterized by highly adaptable and resilient infrastructure. These zones have benefitted from significant public and private investments,…","html":"<blockquote class=\"c-quote\">This project was an academic exercise from the course \"Introduction to Futures Design\" at CENTRO.</blockquote>\n<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>Mexico City (CDMX) faces a growing threat from climate change, manifested in droughts, floods, and extreme temperatures. Socioeconomic inequality and lack of access to basic services exacerbate the situation. In this context, a foresight workshop was conducted to design possible and resilient futures for CDMX in 2050, aiming to anticipate and mitigate the adverse effects of climate change and climate gentrification.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The main challenge was to address the multiple problems that CDMX faces due to climate change and growing inequality. These include water scarcity, climate migration, air pollution, and social exclusion caused by climate gentrification. It was crucial to find inclusive and sustainable solutions that would allow the city to adapt to an uncertain and adverse future.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Method</h2>\n<p>The project utilized a comprehensive foresight methodology involving horizon scanning to identify emerging trends and signals of change, trend mapping to understand key influences on the city's future, and the application of Dator's Futures Archetypes to explore diverse scenarios such as continuation, collapse, discipline, and transformation. Detailed scenarios were created, including the \"Walled Oasis,\" to visualize potential outcomes. The desired future state was defined with a focus on resilience, inclusivity, and sustainability.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>\"Walled Oasis\" Scenario</h2>\n<p>The \"Walled Oasis\" scenario presents a thought-provoking and dystopian vision of Mexico City (CDMX) in 2050, highlighting the complex interplay between climate resilience and social inequality. This scenario serves as a powerful narrative to explore the potential consequences of unchecked climate change and the socio-economic dynamics it could exacerbate.</p>\n<p>In this imagined future, certain areas of CDMX have evolved into \"oasis\" zones characterized by highly adaptable and resilient infrastructure. These zones have benefitted from significant public and private investments, transforming them into urban havens capable of withstanding extreme climate events. However, this prosperity comes with a high cost: <strong>the intensification of social exclusion through climate gentrification.</strong> Here are some implications:</p>\n<ul><li><strong>Social Exclusion:</strong> The scenario starkly illustrates how efforts to adapt to climate change can inadvertently lead to greater social exclusion if not managed inclusively. The fortified oases become enclaves of privilege, leaving the less affluent to struggle with worsening environmental conditions.</li><li><strong>Urban Fragmentation:</strong> The physical and social barriers created by the wall reinforce segregation, leading to a fragmented urban landscape where opportunities and resources are unevenly distributed.</li><li><strong>Tensions and Conflicts:</strong> The scenario hints at the potential for increased social tensions and conflicts as disparities grow more pronounced, with the fortified zones symbolizing a failure to achieve equitable resilience.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>The Concept: Center for Climate Resilience</h2>\n<p>The Climate Resilience Center (CRC) represents a forward-thinking and inclusive approach to tackling the multifaceted challenges posed by climate change in Mexico City (CDMX). Conceived as a beacon of hope and a hub for innovation, the CRC aims to foster a more resilient and equitable urban environment by promoting collaboration, research, and action against climate change and its socio-economic impacts.</p>\n<h3 class=\"c-h3\">Vision and Mission</h3>\n<p>The CRC aspires to a future where CDMX thrives in a context of participatory climate resilience. It envisions a society where academia, public institutions, private sectors, and communities work together to forge equitable solutions to climate challenges. The center's mission emphasizes accessibility, inclusiveness, and the democratization of climate knowledge, striving to ensure that all citizens benefit from its initiatives.</p>\n<h3 class=\"c-h3\">Key Features</h3>\n<ol><li><strong>Collaborative Research:</strong> The CRC facilitates cutting-edge research in climate science, focusing on practical solutions that can be implemented in urban settings. It encourages collaboration between scientists, policymakers, and community leaders to address local climate issues effectively.</li><li><strong>Education and Training:</strong> The center offers extensive training programs and workshops aimed at building capacity among residents, professionals, and policymakers. These initiatives focus on climate literacy, sustainable practices, and innovative adaptation strategies.</li><li><strong>Policy Advocacy:</strong> By engaging in political advocacy, the CRC seeks to influence public policies and promote regulations that support climate resilience and social equity. It acts as a voice for vulnerable communities, ensuring their needs and perspectives are considered in decision-making processes.</li><li><strong>Public Awareness and Outreach:</strong> The CRC is dedicated to raising public awareness about the impacts of climate change and the importance of resilience. Through campaigns, seminars, and community events, it aims to foster a culture of proactive adaptation and environmental stewardship.</li><li><strong>Innovation Hub:</strong> The center serves as an incubator for climate-related innovations and entrepreneurial initiatives. It supports startups and projects that offer sustainable solutions to urban challenges, providing resources and mentorship to turn ideas into impactful actions.</li><li><strong>Temporary Refuge for Climate Migrants:</strong> Recognizing the growing issue of climate-induced migration, the CRC provides temporary shelter and support services for climate migrants. This initiative ensures that migrants have access to essential resources and integration programs.</li></ol>","status":"published","cover":"","es":{"title":"El futuro de la Ciudad de México","sub":"Construir resiliencia a través del Centro de Resiliencia Climática (concepto)","html":"<blockquote class=\"c-quote\">Este proyecto fue un ejercicio académico del curso \"Introduction to Futures Design\" en CENTRO.</blockquote>\n<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>Ciudad de México (CDMX) enfrenta una amenaza creciente por el cambio climático, que se manifiesta en sequías, inundaciones y temperaturas extremas. La desigualdad socioeconómica y la falta de acceso a servicios básicos agravan la situación. En este contexto, se realizó un taller de prospectiva para diseñar futuros posibles y resilientes para la CDMX en 2050, con el fin de anticipar y mitigar los efectos adversos del cambio climático y de la gentrificación climática.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El principal desafío era abordar los múltiples problemas que enfrenta la CDMX debido al cambio climático y a la creciente desigualdad. Entre ellos están la escasez de agua, la migración climática, la contaminación del aire y la exclusión social causada por la gentrificación climática. Era crucial encontrar soluciones inclusivas y sostenibles que le permitieran a la ciudad adaptarse a un futuro incierto y adverso.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El método</h2>\n<p>El proyecto utilizó una metodología de prospectiva integral que incluyó horizon scanning para identificar tendencias emergentes y señales de cambio, mapeo de tendencias para comprender las influencias clave sobre el futuro de la ciudad, y la aplicación de los Arquetipos de Futuros de Dator para explorar escenarios diversos como continuación, colapso, disciplina y transformación. Se crearon escenarios detallados, entre ellos el del \"Oasis Amurallado\", para visualizar posibles resultados. El estado futuro deseado se definió con un enfoque en la resiliencia, la inclusión y la sostenibilidad.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Escenario \"Oasis Amurallado\"</h2>\n<p>El escenario del \"Oasis Amurallado\" presenta una visión provocadora y distópica de la Ciudad de México (CDMX) en 2050, que destaca la compleja interacción entre la resiliencia climática y la desigualdad social. Este escenario sirve como una narrativa poderosa para explorar las posibles consecuencias de un cambio climático sin control y de las dinámicas socioeconómicas que podría agravar.</p>\n<p>En este futuro imaginado, ciertas zonas de la CDMX han evolucionado hasta convertirse en zonas \"oasis\", caracterizadas por una infraestructura altamente adaptable y resiliente. Estas zonas se han beneficiado de inversiones públicas y privadas significativas que las transformaron en refugios urbanos capaces de resistir eventos climáticos extremos. Sin embargo, esta prosperidad tiene un alto costo: <strong>la intensificación de la exclusión social a través de la gentrificación climática.</strong> Estas son algunas implicaciones:</p>\n<ul><li><strong>Exclusión social:</strong> El escenario ilustra con crudeza cómo los esfuerzos de adaptación al cambio climático pueden llevar, sin quererlo, a una mayor exclusión social si no se gestionan de manera inclusiva. Los oasis fortificados se convierten en enclaves de privilegio, y dejan a los menos favorecidos lidiando con condiciones ambientales cada vez peores.</li><li><strong>Fragmentación urbana:</strong> Las barreras físicas y sociales creadas por el muro refuerzan la segregación, lo que da lugar a un paisaje urbano fragmentado en el que las oportunidades y los recursos están distribuidos de forma desigual.</li><li><strong>Tensiones y conflictos:</strong> El escenario sugiere el potencial de mayores tensiones y conflictos sociales a medida que las disparidades se hacen más marcadas, con las zonas fortificadas como símbolo del fracaso en lograr una resiliencia equitativa.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">05 —</span>El concepto: Centro de Resiliencia Climática</h2>\n<p>El Centro de Resiliencia Climática (CRC) representa un enfoque visionario e incluyente para enfrentar los múltiples desafíos que plantea el cambio climático en la Ciudad de México (CDMX). Concebido como un faro de esperanza y un centro de innovación, el CRC busca fomentar un entorno urbano más resiliente y equitativo promoviendo la colaboración, la investigación y la acción frente al cambio climático y sus impactos socioeconómicos.</p>\n<h3 class=\"c-h3\">Visión y misión</h3>\n<p>El CRC aspira a un futuro en el que la CDMX prospere en un contexto de resiliencia climática participativa. Imagina una sociedad en la que la academia, las instituciones públicas, el sector privado y las comunidades trabajen juntos para forjar soluciones equitativas a los desafíos climáticos. La misión del centro hace énfasis en la accesibilidad, la inclusión y la democratización del conocimiento climático, procurando que todos los ciudadanos se beneficien de sus iniciativas.</p>\n<h3 class=\"c-h3\">Características clave</h3>\n<ol><li><strong>Investigación colaborativa:</strong> El CRC facilita investigación de punta en ciencia climática, con foco en soluciones prácticas que puedan implementarse en entornos urbanos. Fomenta la colaboración entre científicos, formuladores de política y líderes comunitarios para abordar eficazmente los problemas climáticos locales.</li><li><strong>Educación y formación:</strong> El centro ofrece amplios programas de formación y talleres orientados a desarrollar capacidades entre residentes, profesionales y formuladores de política. Estas iniciativas se enfocan en la alfabetización climática, las prácticas sostenibles y las estrategias innovadoras de adaptación.</li><li><strong>Incidencia en políticas públicas:</strong> Mediante la incidencia política, el CRC busca influir en las políticas públicas y promover regulaciones que apoyen la resiliencia climática y la equidad social. Actúa como voz de las comunidades vulnerables, asegurando que sus necesidades y perspectivas se tengan en cuenta en los procesos de toma de decisiones.</li><li><strong>Sensibilización pública y divulgación:</strong> El CRC se dedica a generar conciencia pública sobre los impactos del cambio climático y la importancia de la resiliencia. A través de campañas, seminarios y eventos comunitarios, busca fomentar una cultura de adaptación proactiva y de cuidado del medio ambiente.</li><li><strong>Centro de innovación:</strong> El centro funciona como incubadora de innovaciones relacionadas con el clima e iniciativas emprendedoras. Apoya startups y proyectos que ofrecen soluciones sostenibles a los desafíos urbanos, brindando recursos y mentoría para convertir las ideas en acciones de impacto.</li><li><strong>Refugio temporal para migrantes climáticos:</strong> Reconociendo el problema creciente de la migración inducida por el clima, el CRC ofrece alojamiento temporal y servicios de apoyo para migrantes climáticos. Esta iniciativa garantiza que los migrantes tengan acceso a recursos esenciales y programas de integración.</li></ol>"}},{"id":"89ef80c6936440398cd762dcef962d25","slug":"creating-the-future-of-the-barranquilla-botanical-and-zoological-foundat","title":"Creating the Future of the Barranquilla Botanical and Zoological Foundation (FBZB)","sub":"","year":2023,"client":["Zoológico de Barranquilla"],"industry":["Third Sector / NGOs"],"type":["Strategy","Sustainable Futures","Purpose-driven strategy"],"role":["Strategic Design Consultant"],"country":["Colombia"],"highlight":false,"link":"","texture":"grain","excerpt":"Through participatory methods, we surfaced six systemic challenges (e.g., infrastructural uncertainty, loss of public relevance, and fragmented digital experience) and developed corresponding transformation priorities.","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>The Context</h2>\n<p>The Fundación Botánica y Zoológica de Barranquilla (ZooBaq), a longstanding science and conservation institution in Colombia's Caribbean region, faced urgent challenges of public relevance, infrastructure decay, and digital obsolescence. Amid shifting global expectations around animal welfare, conservation, and visitor engagement, ZooBaq sought to define a compelling vision for its future. The goal: to craft a strategic roadmap that would enable the organization to thrive as a regional science center and biodiversity hub.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Task</h2>\n<p>As Strategic Design Lead at The Cocktail LATAM, I led the design and facilitation of a WorkShot (strategy workshop) focused on aligning leadership around a shared vision and defining key priorities for organizational transformation. My role involved orchestrating systemic analysis, synthesizing collective aspirations, and translating complexity into actionable design directions and strategic opportunities.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Process</h2>\n<p>We convened a two-day strategic WorkShot with ZooBaq’s executive team to co-create their future trajectory. Using The Cocktail’s proprietary frameworks, we mapped the organization's current strategic dimensions—purpose, value proposition, communities, capabilities, and resources—and contrasted them with its future aspirations.</p>\n<p>Through participatory methods, we surfaced six systemic challenges (e.g., infrastructural uncertainty, loss of public relevance, and fragmented digital experience) and developed corresponding transformation priorities.</p>\n<p>The output included a roadmap with five strategic fronts: public positioning, infrastructure renovation, financial sustainability through service activation, digital transformation, and operational clarity. Each stream was detailed with objectives, enablers, barriers, and key initiatives, enabling the institution to align action with mission.</p>\n<p>A core component of the process was a foresight exercise where participants envisioned ZooBaq’s long-term role in the conservation of the Caribbean region. This included co-defining a “North Star” vision and exploring plausible future scenarios around infrastructure, community engagement, and sustainability. These scenario explorations helped identify strategic tensions and informed the creation of a phased roadmap responsive to both current constraints and future possibilities.</p>","status":"published","cover":"","es":{"title":"Crear el futuro de la Fundación Botánica y Zoológica de Barranquilla (FBZB)","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>El contexto</h2>\n<p>La Fundación Botánica y Zoológica de Barranquilla (ZooBaq), una institución de ciencia y conservación de larga trayectoria en la región Caribe de Colombia, enfrentaba desafíos urgentes de relevancia pública, deterioro de la infraestructura y obsolescencia digital. En medio de las cambiantes expectativas globales en torno al bienestar animal, la conservación y la experiencia de los visitantes, ZooBaq buscaba definir una visión convincente de su futuro. El objetivo: trazar una hoja de ruta estratégica que le permitiera a la organización prosperar como centro regional de ciencia y epicentro de la biodiversidad.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>La tarea</h2>\n<p>Como Strategic Design Lead en The Cocktail LATAM, lideré el diseño y la facilitación de un WorkShot (taller de estrategia) enfocado en alinear al liderazgo en torno a una visión compartida y en definir las prioridades clave para la transformación organizacional. Mi rol consistió en orquestar el análisis sistémico, sintetizar las aspiraciones colectivas y traducir la complejidad en direcciones de diseño accionables y oportunidades estratégicas.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El proceso</h2>\n<p>Reunimos al equipo ejecutivo de ZooBaq en un WorkShot estratégico de dos días para cocrear su trayectoria futura. Usando los marcos propios de The Cocktail, mapeamos las dimensiones estratégicas actuales de la organización —propósito, propuesta de valor, comunidades, capacidades y recursos— y las contrastamos con sus aspiraciones futuras.</p>\n<p>A través de métodos participativos, sacamos a la luz seis desafíos sistémicos (por ejemplo, incertidumbre en la infraestructura, pérdida de relevancia pública y una experiencia digital fragmentada) y desarrollamos las prioridades de transformación correspondientes.</p>\n<p>El resultado incluyó una hoja de ruta con cinco frentes estratégicos: posicionamiento público, renovación de la infraestructura, sostenibilidad financiera mediante la activación de servicios, transformación digital y claridad operativa. Cada línea se detalló con objetivos, habilitadores, barreras e iniciativas clave, lo que le permitió a la institución alinear la acción con su misión.</p>\n<p>Un componente central del proceso fue un ejercicio de prospectiva en el que los participantes imaginaron el rol de largo plazo de ZooBaq en la conservación de la región Caribe. Esto incluyó la codefinición de una visión \"Estrella del Norte\" y la exploración de escenarios futuros plausibles en torno a la infraestructura, la participación de la comunidad y la sostenibilidad. Estas exploraciones de escenarios ayudaron a identificar tensiones estratégicas y a crear una hoja de ruta por fases, receptiva tanto a las restricciones actuales como a las posibilidades futuras.</p>"}},{"id":"a39c5b77318645d3aa5bb92b8763f5eb","slug":"enhancing-pension-accessibility-for-afore-coppel-members","title":"Enhancing Pension Accessibility for AFORE Coppel Members","sub":"","year":2023,"client":["Afore Coppel"],"industry":["Financial Services"],"type":["Product Design and Strategy","Customer Experience and Innovation"],"role":["Strategic Design Consultant"],"country":["México"],"highlight":false,"link":"","texture":"topo","excerpt":"Strategic Definition and Opportunity Identification. Defined clear intentions to support affiliates from their first contribution through to their final pension payment with transparency, information, and education.…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Context</h2>\n<p>AFORE Coppel, a prominent pension fund administrator in Mexico, plays a critical role in managing retirement resources for millions of workers. Despite progress in the pension system, many affiliates face challenges in securing sufficient funds for a complete pension upon retirement. This strategic initiative aimed to identify opportunities to increase member engagement and contributions, ultimately improving pension outcomes.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Challenge</h2>\n<p>AFORE Coppel faced significant challenges:</p>\n<ul><li><strong>Demographics and Contribution Patterns:</strong> Nearly 50% of affiliates are under 35, earning between 1 and 3 minimum wages, with sporadic contributions due to unstable or informal employment.</li><li><strong>Inactive Members:</strong> Approximately 70% of affiliates are inactive, not making regular contributions, putting them at risk of not securing a complete pension.</li><li><strong>Financial Literacy:</strong> A lack of financial education and awareness among members limits their engagement and understanding of the benefits of consistent contributions.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Methodology</h2>\n<p><strong>Systemic Immersion.</strong> Conducted an in-depth analysis of the entire lifecycle of an AFORE Coppel affiliate, from initial awareness to receiving their pension. Identified key enablers and inhibitors affecting member engagement and contribution behaviors.</p>\n<p><strong>Strategic Definition and Opportunity Identification.</strong> Defined clear intentions to support affiliates from their first contribution through to their final pension payment with transparency, information, and education. Identified eight key opportunity areas for intervention, including activation, training, internal structure, customer learning, leveraging Coppel's ecosystem, loyalty programs, present-day improvements, and communication.</p>\n<p><strong>Ideation and Solution Development.</strong> Brainstormed and prioritized a range of initiatives to address identified challenges, focusing on both internal processes and external member engagement. Developed detailed proposals for initiatives with the most potential impact.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Core Impact Areas</h2>\n<ol><li><strong>Increased Member Engagement:</strong> Boost regular contributions by improving awareness of the benefits of formal employment and consistent savings.</li><li><strong>Enhanced Financial Literacy:</strong> Provide comprehensive financial education to empower members with better saving habits and informed decision-making.</li><li><strong>Operational Efficiency:</strong> Streamline processes and integrate data to improve internal workflows and customer service efficiency.</li><li><strong>Sustainable Saving Practices:</strong> Promote voluntary savings and reward good financial behaviors through innovative programs and incentives.</li><li><strong>Social Inclusion and Formal Employment:</strong> Support inactive and informal workers in transitioning to formal employment, increasing their chances of securing a full pension.</li><li><strong>Improved Customer Experience:</strong> Enhance the overall member experience with personalized support, clear information, and responsive service throughout their savings journey.</li><li><strong>Strengthened Community Trust:</strong> Foster a sense of belonging and trust among affiliates towards AFORE Coppel, enhancing loyalty and long-term engagement.</li></ol>","status":"published","cover":"","es":{"title":"Mejorar el acceso a la pensión para los afiliados de AFORE Coppel","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>Contexto</h2>\n<p>AFORE Coppel, una destacada administradora de fondos de pensiones de México, desempeña un papel crítico en la gestión de los recursos de retiro de millones de trabajadores. A pesar de los avances del sistema pensional, muchos afiliados enfrentan dificultades para reunir fondos suficientes para una pensión completa al momento del retiro. Esta iniciativa estratégica buscaba identificar oportunidades para aumentar la participación y las aportaciones de los afiliados y, en última instancia, mejorar los resultados pensionales.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>Desafío</h2>\n<p>AFORE Coppel enfrentaba desafíos significativos:</p>\n<ul><li><strong>Demografía y patrones de aportación:</strong> Casi el 50 % de los afiliados tiene menos de 35 años y gana entre 1 y 3 salarios mínimos, con aportaciones esporádicas debido a empleos inestables o informales.</li><li><strong>Afiliados inactivos:</strong> Aproximadamente el 70 % de los afiliados está inactivo y no hace aportaciones regulares, lo que los pone en riesgo de no asegurar una pensión completa.</li><li><strong>Educación financiera:</strong> La falta de educación y conciencia financiera entre los afiliados limita su participación y su comprensión de los beneficios de aportar de manera constante.</li></ul>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>Metodología</h2>\n<p><strong>Inmersión sistémica.</strong> Realizamos un análisis a profundidad de todo el ciclo de vida de un afiliado de AFORE Coppel, desde la conciencia inicial hasta la recepción de su pensión. Identificamos los principales habilitadores e inhibidores que afectan la participación de los afiliados y sus comportamientos de aportación.</p>\n<p><strong>Definición estratégica e identificación de oportunidades.</strong> Definimos intenciones claras para acompañar a los afiliados desde su primera aportación hasta su último pago de pensión, con transparencia, información y educación. Identificamos ocho áreas clave de oportunidad para intervenir, entre ellas activación, formación, estructura interna, aprendizaje del cliente, aprovechamiento del ecosistema de Coppel, programas de lealtad, mejoras en el presente y comunicación.</p>\n<p><strong>Ideación y desarrollo de soluciones.</strong> Generamos y priorizamos una variedad de iniciativas para abordar los desafíos identificados, con foco tanto en los procesos internos como en la participación externa de los afiliados. Desarrollamos propuestas detalladas para las iniciativas con mayor potencial de impacto.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Áreas centrales de impacto</h2>\n<ol><li><strong>Mayor participación de los afiliados:</strong> Impulsar las aportaciones regulares mejorando el conocimiento de los beneficios del empleo formal y del ahorro constante.</li><li><strong>Educación financiera fortalecida:</strong> Ofrecer una educación financiera integral que empodere a los afiliados con mejores hábitos de ahorro y una toma de decisiones informada.</li><li><strong>Eficiencia operativa:</strong> Optimizar procesos e integrar datos para mejorar los flujos de trabajo internos y la eficiencia del servicio al cliente.</li><li><strong>Prácticas de ahorro sostenibles:</strong> Promover el ahorro voluntario y premiar los buenos comportamientos financieros mediante programas e incentivos innovadores.</li><li><strong>Inclusión social y empleo formal:</strong> Apoyar a los trabajadores inactivos e informales en su tránsito hacia el empleo formal, aumentando sus posibilidades de asegurar una pensión completa.</li><li><strong>Mejor experiencia del cliente:</strong> Mejorar la experiencia general del afiliado con acompañamiento personalizado, información clara y un servicio receptivo a lo largo de su recorrido de ahorro.</li><li><strong>Mayor confianza de la comunidad:</strong> Fomentar un sentido de pertenencia y confianza de los afiliados hacia AFORE Coppel, fortaleciendo la lealtad y la participación a largo plazo.</li></ol>"}},{"id":"bb841f9765204ae0986b6b4ac55be622","slug":"transforming-financial-asset-management-at-ecopetrol-through-strategic-d","title":"Transforming Financial Asset Management at Ecopetrol Through Strategic Design","sub":"","year":2023,"client":["Ecopetrol"],"industry":["Energy"],"type":["Digital product","Ux","Data visualization","Digital experience"],"role":["Strategic Design Consultant"],"country":[],"highlight":false,"link":"","texture":"dither","excerpt":"This Design Sprint not only transformed the financial asset management processes at Ecopetrol but also set a precedent for future innovation projects, highlighting the value of agile methodologies and user-centered…","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>The Context</h2>\n<p>Ecopetrol, a leading energy company in Latin America, embarked on a strategic initiative to enhance its financial asset management processes. The company's long-term strategy, \"Energy that Transforms,\" aims to address environmental, social, and governance challenges, creating sustainable value for its stakeholders. The Vice Presidency of Finance and the Hub at EBA sought to develop analytical models supported by technological solutions to improve asset planning and management, aligning with the company's strategic objectives.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>The Challenge</h2>\n<p>The primary challenge faced by Ecopetrol was the transformation of its financial asset management conversations. Traditionally focused on past performance and accountability, the goal was to shift towards maximizing future value and a 360-degree perspective. This required overcoming entrenched practices and assumptions, and adopting new, agile methodologies that could foster innovation and user-centered solutions.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>The Process</h2>\n<ol><li><strong>Planning and Preparation:</strong> Defined the challenge and objectives for the sprint. Selected a multidisciplinary core team and planned activities for the sprint week. Gathered relevant information and conducted stakeholder interviews to understand the context.</li><li><strong>Understanding and Defining:</strong> Conducted structured discussions to create a shared knowledge base among participants. Mapped out the challenge and defined the long-term goals and key questions to address.</li><li><strong>Ideation and Sketching:</strong> Facilitated exercises to generate and refine a wide range of ideas. Developed detailed sketches of potential solutions.</li><li><strong>Decision Making:</strong> Evaluated and selected the most promising ideas through team consensus. Created a high-level prototype flow and detailed screen designs.</li><li><strong>Prototyping:</strong> Developed a realistic prototype of the chosen solution. Designed and defined a script for presenting the concept and functionalities.</li><li><strong>Validation:</strong> Tested the prototype with five key stakeholders. Collected feedback to identify strengths and opportunities for improvement.</li></ol>\n<h2 class=\"c-h2\"><span class=\"idx\">04 —</span>Impact</h2>\n<p>The Design Sprint led to significant advancements in Ecopetrol's asset management approach:</p>\n<ul><li><strong>Prototype Development:</strong> Created a functional prototype that facilitated real-time visualization of financial data, allowing managers to make informed decisions based on current and projected performance metrics.</li><li><strong>User-Centered Solutions:</strong> Validated the prototype with stakeholders, ensuring the solution met user needs and addressed key pain points, such as reducing manual processes and enhancing data-driven decision-making.</li><li><strong>Strategic Alignment:</strong> Aligned the new tool with Ecopetrol's long-term strategy, enabling a more proactive and predictive approach to asset management.</li><li><strong>Enhanced Collaboration:</strong> Fostered a collaborative culture among team members, combining diverse perspectives to innovate and solve complex problems.</li></ul>\n<p>This Design Sprint not only transformed the financial asset management processes at Ecopetrol but also set a precedent for future innovation projects, highlighting the value of agile methodologies and user-centered design in driving organizational change.</p>","status":"published","cover":"","es":{"title":"Transformar la gestión de activos financieros en Ecopetrol a través del diseño estratégico","sub":"","html":"<h2 class=\"c-h2\"><span class=\"idx\">01 —</span>El contexto</h2>\n<p>Ecopetrol, una compañía líder de energía en América Latina, emprendió una iniciativa estratégica para mejorar sus procesos de gestión de activos financieros. La estrategia de largo plazo de la compañía, \"Energía que Transforma\", busca abordar desafíos ambientales, sociales y de gobernanza, creando valor sostenible para sus grupos de interés. La Vicepresidencia de Finanzas y el Hub de EBA buscaron desarrollar modelos analíticos apoyados en soluciones tecnológicas para mejorar la planeación y gestión de activos, en línea con los objetivos estratégicos de la compañía.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">02 —</span>El desafío</h2>\n<p>El principal desafío de Ecopetrol era transformar sus conversaciones sobre la gestión de activos financieros. Tradicionalmente centradas en el desempeño pasado y la rendición de cuentas, la meta era pasar a maximizar el valor futuro y a una perspectiva de 360 grados. Esto exigía superar prácticas y supuestos arraigados, y adoptar nuevas metodologías ágiles que pudieran fomentar la innovación y las soluciones centradas en el usuario.</p>\n<h2 class=\"c-h2\"><span class=\"idx\">03 —</span>El proceso</h2>\n<ol><l
